# IARU Region 3 Band Plan (Asia-Pacific; LF to UHF)
# Provenance: transcribed 2026-10-29 from the primary source
#   https://www.iaru-r3.org/wp-content/uploads/2025/01/R3-004-Band-Plans-IARU-Region-3.pdf
#   (IARU Region 3 Document R3-004, Rev. 2, November 2024,
#   adopted by the 19th IARU Region 3 Conference, Bangkok, 04-08 Nov 2024.)
# Scope: Part 1 of the document (LF-UHF) only. Part 2 (SHF-EHF, 13cm and
# above, all >= 2300 MHz) is NOT transcribed: the loader clamps frequencies
# to 2 GHz (_sanitize_freq in src/rigplane/web/band_plan.py), so those rows
# cannot be represented without a loader change (integrator decision).
# National repeater arrangements are deliberately absent: the regional plan
# defines no regional repeater splits, and its Basic Principles leave
# repeater planning to member societies (national, not regional data).

[meta]
name = "IARU Region 3"
region = "IARU-R3"
source = "https://www.iaru-r3.org/wp-content/uploads/2025/01/R3-004-Band-Plans-IARU-Region-3.pdf"
layer = "ham"
priority = 10
version = "2024.2"
updated = "2026-10-29"

