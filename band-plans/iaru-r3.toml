# IARU Region 3 Band Plan (Asia-Pacific; HF + VHF/UHF)
# Source: https://www.iaru-r3.org/documents/band-plans/
# HF sections are broad IARU-style sub-bands (no license classes);
# VHF/UHF sections cover 6 m, 2 m, 70 cm and 23 cm with widely
# documented sub-bands only. Region 3 calling frequencies and repeater
# details need owner review (MOR-3631, Deferred).

[meta]
name = "IARU Region 3"
region = "IARU-R3"
source = "https://www.iaru-r3.org/documents/band-plans/"
layer = "ham"
priority = 10
version = "2025.1"
updated = "2026-10-27"

