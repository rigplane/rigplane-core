name: 3.0 radio report
description: Tell us how RigPlane 3.0 works with your radio
title: "[Report] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying RigPlane 3.0 and telling us how it went.

  - type: input
    id: radio-model
    attributes:
      label: Radio model
      description: Which radio you tested, for example IC-7300 or FTX-1.
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      description: "How you connect to the radio: USB, or over the network (LAN or Wi-Fi)."
      options:
        - USB
        - Network (LAN or Wi-Fi)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS and version
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: The Python version RigPlane ran under, 3.11 or newer.
    validations:
      required: true

  - type: input
    id: install-command
    attributes:
      label: Install command used
      description: "The exact command you ran to install RigPlane, for example pip install rigplane."
    validations:
      required: true

  - type: checkboxes
    id: what-worked
    attributes:
      label: What worked
      options:
        - label: Connect
        - label: Frequency and mode
        - label: Meters
        - label: "Scope (on the FTX-1: the audio panadapter)"
        - label: RX audio
        - label: TX
        - label: WSJT-X through rigctld
    validations:
      required: false

  - type: textarea
    id: what-broke
    attributes:
      label: What broke
      description: Describe anything that failed, looked wrong or behaved unexpectedly.
    validations:
      required: false

  - type: textarea
    id: diagnostic-report
    attributes:
      label: Diagnostic report
      description: "Run `rigplane diagnose` and attach the ZIP it creates. Look through it before you attach it. See https://rigplane.dev/3.0/guide/diagnostic-reports/."
    validations:
      required: false

  - type: textarea
    id: what-stopped-you
    attributes:
      label: What stopped you?
      description: If you could not finish setting up or testing, tell us what got in the way.
    validations:
      required: false
