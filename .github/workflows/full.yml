name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-tx-admission-api-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission-api-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ptt-admission-red-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: f87406668d7947c28628d4880691ce9a51c50809
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f87406668d7947c28628d4880691ce9a51c50809
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-red.XXXXXX")
          pycache_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install mock-test dependencies and package metadata
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Runtime API RED and structural JUnit oracle
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONPYCACHEPREFIX", "PYTHONDONTWRITEBYTECODE",
              "UV_CACHE_DIR", "UV_PROJECT_ENVIRONMENT",
          )}
          metadata["python"] = sys.version
          metadata["scope"] = (
              "Runtime admission/fence API RED only, with existing public-API controls; "
              "not behavioral mutation, consumer terminal mapping, integration, or RF proof"
          )
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          authority = "test_managed_tx_ingress_admission"
          fence = "test_managed_tx_fence"
          no_submit = "AttributeError: 'ManagedTxAuthority' object has no attribute 'submit_ptt'"
          no_scope = "TypeError: TxAbortFence.register() got an unexpected keyword argument 'scope'"
          submit_statement = "return track(rig, await rig.managed.submit_ptt(on, owner, ready=ready))"
          authority_failures = [
              ("test_prestart_on_cancel_removes_registration_without_dispatch", [None]),
              ("test_scoped_up_revokes_old_down_before_contended_lock_not_new_down", [None]),
              ("test_off_cancel_before_execute_entry_drains_despite_repeated_cancel", [None]),
              ("test_on_cancel_does_not_cancel_readiness_predecessor", [None]),
              ("test_failed_predecessor_prevents_on_and_removes_registration", ["cancel", "error"]),
              ("test_pending_only_disconnect_revokes_owner_while_rx_clean", [None]),
              ("test_provider_replacement_while_rx_clean_prevents_old_pending_on", [None]),
              ("test_original_on_uncertainty_not_replaced_by_accepted_compensation", ["uncertain", "provider_error"]),
              ("test_scoped_up_membership_blocks_on_when_cancel_handle_does_nothing", [None]),
              ("test_cancel_after_on_admission_settles_without_implicit_up", [None]),
              ("test_idempotent_admission_returns_no_fabricated_settlement", [None]),
          ]
          fence_failures = [
              ("test_cancel_scope_revokes_equal_scope_before_cleanup_and_keeps_others", 183,
               'fence.register(selected, lambda: calls.append("selected"), scope=owner)'),
              ("test_cancel_scope_cleanup_does_not_rescan_new_same_scope_registration", 206,
               'fence.register(old, lambda: calls.append("old"), scope="operator")'),
              ("test_cancel_scope_rejects_non_builtin_str_without_equality_probe", 227,
               "fence.register(unscoped, lambda: None, scope=None)"),
              ("test_cancel_scope_reports_cancellation_and_callback_failures", 250,
               'fence.register(cancellation_error, raise_cancellation_error, scope="operator")'),
              ("test_force_off_invalidates_scoped_and_unscoped_callbacks_before_cleanup", 271,
               'fence.register(scoped, lambda: calls.append("scoped"), scope="operator")'),
          ]
          controls = {
              authority: [
                  "test_public_owner_idempotency_and_tot_are_unchanged",
                  "test_public_owner_up_settles_release",
              ],
              fence: [
                  "test_token_is_current_only_for_its_fence_epoch",
                  "test_force_off_advances_before_every_registered_cancellation",
                  "test_force_off_collects_sync_and_async_failures_and_continues",
                  "test_registration_and_removal_are_token_specific_and_deterministic",
                  "test_fenced_work_is_cancelled_once_and_repeated_force_off_is_local_noop",
                  "test_late_old_token_completion_cannot_become_current",
                  "test_another_fence_cannot_accept_this_fences_token",
                  "test_force_off_invalidates_at_call_and_keeps_each_batch_epoch",
                  "test_held_cleanup_does_not_starve_other_cancellations",
              ],
          }
          expected = {}

          def add_case(module, name, message=None, line=None, statement=None):
              key = (f"tests.{module}", name)
              assert key not in expected, key
              test_file = f"tests/{module}.py"
              if message is not None:
                  assert Path(test_file).read_text().splitlines()[line - 1].strip() == statement
              expected[key] = {
                  "failure_message": message,
                  "call_failure_file": test_file if message else None,
                  "call_failure_line": line,
                  "call_failure_statement": statement,
              }

          for function, suffixes in authority_failures:
              for suffix in suffixes:
                  name = function if suffix is None else f"{function}[{suffix}]"
                  add_case(authority, name, no_submit, 72, submit_statement)
          for function, line, statement in fence_failures:
              add_case(fence, function, no_scope, line, statement)
          for module, functions in controls.items():
              for function in functions:
                  add_case(module, function)
          assert len(expected) == 29
          assert sum(row["failure_message"] == no_submit for row in expected.values()) == 13
          assert sum(row["failure_message"] == no_scope for row in expected.values()) == 5
          assert sum(row["failure_message"] is None for row in expected.values()) == 11
          selected = [f"tests/{module}.py" for module in (authority, fence)]
          (artifacts / "expected-cases.json").write_text(json.dumps([
              {"classname": key[0], "name": key[1], **row}
              for key, row in expected.items()
          ], indent=2))
          (artifacts / "selected-files.txt").write_text("\n".join(selected) + "\n")

          command = [
              sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
              "-o", f"cache_dir={artifacts / 'pytest-cache'}",
              "--tb=long", "--color=no", "--timeout=20", "--timeout-method=thread",
              f"--junitxml={artifacts / 'junit.xml'}", *selected,
          ]
          (artifacts / "command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(
                      command, stdout=log, stderr=subprocess.STDOUT, timeout=180
                  )
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          finally:
              print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 1, f"Expected pytest CALL failures, got exit {result.returncode}"

          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          assert len(actual) == len(set(actual)) == 29, actual
          assert set(actual) == set(expected), {
              "missing": sorted(set(expected) - set(actual)),
              "unexpected": sorted(set(actual) - set(expected)),
          }
          assert not report.findall(".//error"), "JUnit setup/teardown errors are not expected RED"
          assert not report.findall(".//skipped"), "Skipped cases are not evidence"
          failures = 0
          for case in cases:
              key = (case.get("classname"), case.get("name"))
              row = expected[key]
              message = row["failure_message"]
              entries = case.findall("failure")
              if message is None:
                  assert not entries, (key, "passing control failed")
                  continue
              assert len(entries) == 1, (key, "expected exactly one CALL failure")
              failure = entries[0]
              assert failure.get("message", "") == message, (key, failure.attrib)
              trace = failure.text or ""
              assert re.search(
                  r"(?m)^>\s+" + re.escape(row["call_failure_statement"]) + r"[ \t]*$", trace
              ), (key, "wrong failing statement", trace)
              exception = message.split(":", 1)[0]
              frame = f'{row["call_failure_file"]}:{row["call_failure_line"]}: {exception}'
              assert re.search(r"(?m)^" + re.escape(frame) + r"[ \t]*$", trace), (
                  key, "missing intended failure frame", trace
              )
              assert re.search(r"(?m)^E\s+" + re.escape(message) + r"[ \t]*$", trace), (
                  key, "missing intended terminal exception", trace
              )
              failures += 1
          assert failures == 18 and len(cases) - failures == 11
          (artifacts / "oracle.txt").write_text(
              "PASS: exact 13 submit_ptt AttributeErrors, 5 register(scope=) TypeErrors, and 11 controls; zero errors/skips.\n"
              "Runtime API RED only; not behavioral mutation, consumer terminal mapping, integration, or RF proof.\n"
          )
          print((artifacts / "oracle.txt").read_text(), end="")
          PY

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: managed-tx-admission-api-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
