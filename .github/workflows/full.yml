name: Tests (full matrix)

on:
  workflow_dispatch:

concurrency:
  group: tests-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Focused managed-ingress GREEN
        run: >-
          uv run pytest
          tests/test_rigctld_ingress_scheduling.py
          tests/test_rigctld_managed_ingress_scheduling.py
          --tb=short --timeout=30 --timeout-method=thread

      - name: Receipt-separation mutation must fail
        shell: bash
        run: |
          perl -0pi -e 's/                schedule_response\(cmd\)\n/                schedule_response(cmd)\n                await previous_execution\n/' src/rigplane/rigctld/server.py
          grep -q 'await previous_execution' src/rigplane/rigctld/server.py
          set +e
          uv run pytest             tests/test_rigctld_ingress_scheduling.py::test_pipelined_unmanaged_off_is_read_without_overtaking_frequency             --tb=short --timeout=10 --timeout-method=thread
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Mutation unexpectedly survived the focused oracle"
            exit 1
          fi
          echo "Mutation rejected as expected (pytest rc=$rc)"
