name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-actuator-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/managed-tx-provider-actuators'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: e28f0a552c7a2f7ae4662a702b228e2ffb99c8a5
      SOURCE_TREE_PIN: 614e747136a8a073ed74063ca3dd5c0dc914aa01
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out carrier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: carrier

      - name: Check out immutable source
        uses: actions/checkout@v6
        with:
          ref: e28f0a552c7a2f7ae4662a702b228e2ffb99c8a5
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/provider-actuator-red.XXXXXX")
          pycache_dir=$(mktemp -d "$RUNNER_TEMP/provider-actuator-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "$RUNNER_TEMP/provider-actuator-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "$RUNNER_TEMP/provider-actuator-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PHASE_REPORT=$artifact_dir/phase-report.json" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE_PIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' \
            "SOURCE_PIN=$SOURCE_PIN" \
            "SOURCE_TREE_PIN=$SOURCE_TREE_PIN" \
            "CARRIER_SHA=$GITHUB_SHA" \
            "RUN_ID=$GITHUB_RUN_ID" \
            "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            > "$artifact_dir/run-metadata.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install frozen dependencies
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev
          uv pip freeze > "$ARTIFACT_DIR/frozen-environment.txt"

      - name: Write phase recorder
        run: |
          cat > "$ARTIFACT_DIR/phase_plugin.py" <<'PY'
          import json
          import os
          from pathlib import Path

          collected = []
          phases = []


          def pytest_collection_finish(session):
              collected.extend(item.nodeid for item in session.items)


          def pytest_runtest_logreport(report):
              phases.append(
                  {
                      "nodeid": report.nodeid,
                      "phase": report.when,
                      "outcome": report.outcome,
                      "longrepr": str(report.longrepr) if report.failed else None,
                  }
              )


          def pytest_sessionfinish(session, exitstatus):
              Path(os.environ["PHASE_REPORT"]).write_text(
                  json.dumps(
                      {
                          "collected": collected,
                          "exitstatus": exitstatus,
                          "phases": phases,
                      },
                      indent=2,
                  )
              )
          PY

      - name: Changed-test Ruff
        run: |
          uv run --no-sync ruff check \
            tests/test_yaesu_cat_transport.py \
            tests/test_icom_managed_tx_actuator.py \
            tests/test_yaesu_managed_tx_actuator.py \
            | tee "$ARTIFACT_DIR/ruff-check.txt"
          uv run --no-sync ruff format --check \
            tests/test_yaesu_cat_transport.py \
            tests/test_icom_managed_tx_actuator.py \
            tests/test_yaesu_managed_tx_actuator.py \
            | tee "$ARTIFACT_DIR/ruff-format.txt"

      - name: One focused RED invocation
        id: focused
        continue-on-error: true
        run: |
          PYTHONPATH="$ARTIFACT_DIR:$PYTHONPATH" \
          uv run --no-sync pytest -q --tb=short -p no:cacheprovider \
            -p phase_plugin \
            --junitxml="$ARTIFACT_DIR/junit.xml" \
            tests/test_yaesu_cat_transport.py::TestYaesuCatTransport::test_urgent_write_waits_for_active_frame_then_overtakes_ordinary_fifo \
            tests/test_yaesu_cat_transport.py::TestYaesuCatTransport::test_cancelled_urgent_waiter_releases_ordinary_exchange \
            tests/test_yaesu_cat_transport.py::TestYaesuCatTransport::test_final_currency_check_suppresses_stale_write \
            tests/test_rigctld_client_backend.py::test_urgent_exchange_preserves_active_frame_and_each_fifo \
            tests/test_rigctld_client_backend.py::test_cancelled_admission_releases_only_its_reservation \
            tests/test_rigctld_client_backend.py::test_write_currency_is_checked_after_stale_drain \
            tests/test_icom_managed_tx_actuator.py \
            tests/test_commander.py::test_priority_ordering \
            tests/test_radio.py::TestPtt::test_set_ptt_uses_immediate_priority \
            'tests/test_radio.py::TestCapturedExecuteLifetime::test_generation_retirement_retrieves_detached_blocking_exception[pacing]' \
            tests/test_yaesu_managed_tx_actuator.py \
            tests/test_ftx1_radio.py::test_set_ptt_on \
            tests/test_ftx1_radio.py::test_set_ptt_off \
            tests/test_ftx1_radio.py::test_send_cw_text_empty_sends_ky_clear \
            tests/test_ftx1_radio.py::test_stop_cw_text_sends_ky_clear \
            tests/test_ftx1_radio.py::test_set_tuner_status_delegates_to_set_tuner

      - name: Preserve immutable-source evidence
        if: always()
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/source-status-after.txt"
          git rev-parse HEAD > "$ARTIFACT_DIR/source-head-after.txt"
          git rev-parse 'HEAD^{tree}' > "$ARTIFACT_DIR/source-tree-after.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE_PIN"
          test -z "$(cat "$ARTIFACT_DIR/source-status-after.txt")"

      - name: Upload raw focused evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-actuator-red-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Require RED
        if: always()
        run: test '${{ steps.focused.outcome }}' = 'failure'
