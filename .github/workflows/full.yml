name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigctld-actuator-mutations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rigctld-actuator-mutation-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 20
    env:
      SOURCE_PIN: 01c521ed85a193f54f09ccc4271710a32d27d864
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 01c521ed85a193f54f09ccc4271710a32d27d864
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-mutations.XXXXXX")
          pycache_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install mock-test dependencies and package metadata
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Preflight, isolated mutations, equivalent control, and restoration
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          pin = os.environ["SOURCE_PIN"]
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == pin
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONDONTWRITEBYTECODE",
          )}
          metadata["python"] = sys.version
          metadata["claim"] = "Selected mock mutation proof; not production cutover or physical-radio proof"
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          authority = "tests/test_managed_tx_authority.py"
          lane = "tests/test_managed_tx_effect_lane.py"
          backend = "tests/test_rigctld_client_backend.py"
          rows = [
              (authority, "test_effect_currency_tracks_pending_owner_release",
               ["ptt_up", "offline_ptt_up", "force_off", "replace"]),
              (authority, "test_abort_currency_ends_when_current_force_receive_settles", [None]),
              (authority, "test_shutdown_currency_observes_termination_synchronously", [None]),
              (lane, "test_live_claim_currency_blocks_resistant_write", ["caller", "cancel", "deadline"]),
              (lane, "test_removed_claim_has_no_currency_during_isolation", [None]),
              (backend, "test_urgent_exchange_preserves_active_frame_and_each_fifo", ["query", "command"]),
              (backend, "test_cancelled_admission_releases_only_its_reservation",
               ["normal-queued", "normal-granted", "urgent-queued", "urgent-granted"]),
              (backend, "test_write_currency_is_checked_after_stale_drain", ["false", "raises"]),
              (backend, "test_managed_actuator_forwards_live_currency_to_final_write", [None]),
              (backend, "test_tokened_queue_cannot_retarget_or_drain_replacement", [None]),
              (backend, "test_tokened_write_cannot_cross_replacement_during_drain", [None]),
              (backend, "test_managed_actuator_uses_canonical_rigctld_outcomes",
               ["accepted-ptt_on", "accepted-transmit_on", "accepted-force_receive",
                "rprt_error-ptt_on", "rprt_error-transmit_on", "rprt_error-force_receive",
                "malformed-ptt_on", "malformed-transmit_on", "malformed-force_receive"]),
              (backend, "test_controlled_authority_replacement_keeps_debt_after_late_on_rprt", [None]),
              (backend, "test_rigctld_unsupported_abort_does_not_emit_a_command", ["stop_cw", "stop_tune"]),
              (backend, "test_authority_canonical_rigctld_release_precedes_unrelated_cleanup", [None]),
              (backend, "test_transport_connect_query_and_close", [None]),
              (backend, "test_transport_serializes_requests", [None]),
              (backend, "test_cancelled_lock_waiter_keeps_active_exchange", [None]),
              (backend, "test_old_exchange_interruption_does_not_retire_replacement",
               ["cancel", "eof", "oserror", "timeout"]),
              (backend, "test_cancelled_lifecycle_preserves_real_stream_close_future", ["close", "connect"]),
              (backend, "test_delayed_cancelled_rprt_cannot_complete_next_command", [None]),
              (lane, "test_preserves_explicit_normalized_result", ["accepted", "rejected", "uncertain"]),
              (authority, "test_late_physical_on_retains_debt_until_a_fresh_off", ["False", "True"]),
              (authority, "test_real_fence_releases_before_cleanup_and_shutdown_waits_for_cleanup",
               ["force_off", "shutdown", "offline_shutdown"]),
          ]
          all_cases, selected = {}, []
          for file, function, suffixes in rows:
              node = f"{file}::{function}"
              assert node not in selected, node
              selected.append(node)
              for suffix in suffixes:
                  case = node if suffix is None else f"{node}[{suffix}]"
                  assert case not in all_cases, case
                  all_cases[case] = None
          assert len(selected) == 24 and len(all_cases) == 52
          controls = [
              f"{backend}::test_managed_actuator_uses_canonical_rigctld_outcomes[accepted-ptt_on]",
              f"{backend}::test_managed_actuator_uses_canonical_rigctld_outcomes[accepted-force_receive]",
              f"{backend}::test_old_exchange_interruption_does_not_retire_replacement[cancel]",
              f"{backend}::test_cancelled_lock_waiter_keeps_active_exchange",
          ]
          assert len(set(controls)) == 4 and set(controls) <= set(all_cases)
          authority_source = "src/rigplane/runtime/managed_tx_authority.py"
          lane_source = "src/rigplane/runtime/managed_tx_effect_lane.py"
          radio_source = "src/rigplane/backends/rigctld_client/radio.py"
          transport_source = "src/rigplane/backends/rigctld_client/transport.py"
          # Escaped line anchors: no indentation-sensitive multiline templates.
          currency_context = (
              "    def is_effect_current(\n"
              "        self, token: EffectToken, operation: ActuationOperation | AbortOperation\n"
              "    ) -> bool:\n"
              '        """Check write currency synchronously against the live pending attempt."""\n'
              "        pending = self._state.pending_effect\n"
              "        if isinstance(operation, AbortOperation):\n"
              "            operation = ActuationOperation.FORCE_RECEIVE\n"
              "        return bool(\n"
              "            not (self._closing or self._closed or self._terminated)\n"
              "            and not (\n"
              "                self._shutdown_termination is not None\n"
          )
          mutants = [
              ("M1-pending", authority_source,
               "            and pending.token == token\n            and pending.operation is operation\n",
               "            and pending.token.effect_epoch == token.effect_epoch\n",
               f"{authority}::test_effect_currency_tracks_pending_owner_release[ptt_up]",
               "old ON stayed writable after its pending effect changed"),
              ("M2-termination", authority_source,
               currency_context + "                and self._shutdown_termination.is_set()\n",
               currency_context + "                and False\n",
               f"{authority}::test_shutdown_currency_observes_termination_synchronously",
               "termination must fence writes without another loop turn"),
              ("M3-membership", lane_source,
               "            self._claims.get((claim.token, claim.operation)) is claim\n",
               "            True\n",
               f"{lane}::test_removed_claim_has_no_currency_during_isolation",
               "unfinished result does not prove claim ownership"),
              ("M4-forwarding", radio_source,
               "        await self._set_ptt(on, is_current=is_current, urgent=not on)\n",
               "        await self._set_ptt(on, urgent=not on)\n",
               f"{backend}::test_managed_actuator_forwards_live_currency_to_final_write",
               "managed actuator wrote after currency invalidation"),
              ("M5-final-identity", transport_source,
               "            await self._write_line(command, reader, writer, is_current=guard)\n",
               "            await self._write_line(command, reader, writer, is_current=is_current)\n",
               f"{backend}::test_tokened_write_cannot_cross_replacement_during_drain",
               "managed write escaped the replaced connection boundary"),
              ("M6-urgent-order", transport_source,
               "        for queue in (self._urgent_waiters, self._ordinary_waiters):\n",
               "        for queue in (self._ordinary_waiters, self._urgent_waiters):\n",
               f"{backend}::test_urgent_exchange_preserves_active_frame_and_each_fifo[query]",
               "urgent release lost the next exchange boundary"),
              ("M7-granted-cancel", transport_source,
               "                # Already granted, but no connection has been captured yet.\n                self._release_exchange()\n",
               "                # Already granted, but no connection has been captured yet.\n                self._retire_connection(self._reader, self._writer)\n                self._release_exchange()\n",
               f"{backend}::test_cancelled_admission_releases_only_its_reservation[normal-granted]",
               "admission cancellation retired a healthy connection"),
          ]
          equivalent = (
              radio_source,
              '            f"T {1 if on else 0}", is_current=is_current, urgent=urgent\n',
              '            ("T 1" if on else "T 0"), is_current=is_current, urgent=urgent\n',
          )
          originals = {
              file: subprocess.check_output(["git", "show", f"{pin}:{file}"])
              for file in (authority_source, lane_source, radio_source, transport_source)
          }
          for file, data in originals.items():
              assert Path(file).read_bytes() == data, (file, "not exact pinned source")
          patches = [(name, file, old, new) for name, file, old, new, _, _ in mutants]
          patches.append(("equivalent", *equivalent))
          for name, file, old, new in patches:
              assert old != new and originals[file].decode().count(old) == 1, name
          for name, _, _, _, target, message in mutants:
              assert target in all_cases and target not in controls, name
              assert message, name
          (artifacts / "preflight.json").write_text(json.dumps({
              "patches": patches,
              "source_sha256": {file: hashlib.sha256(data).hexdigest() for file, data in originals.items()},
              "planned_invocations": 10,
              "planned_case_executions": 191,
          }, indent=2))

          def status():
              return subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True)

          def restore():
              for file, data in originals.items():
                  Path(file).write_bytes(data)
              assert not status(), "source restoration left a dirty checkout"

          def junit_key(node):
              file, name = node.split("::", 1)
              return (file.removesuffix(".py").replace("/", "."), name)

          records = []

          def run_cases(label, patch, nodes, expectations):
              restore()
              evidence = artifacts / label
              evidence.mkdir()
              env = os.environ.copy()
              env["PYTHONPYCACHEPREFIX"] = tempfile.mkdtemp(
                  prefix=f"rigctld-{label}-pycache-", dir=env["RUNNER_TEMP"]
              )
              env["PYTHONDONTWRITEBYTECODE"] = "1"
              expected = {junit_key(node): message for node, message in expectations.items()}
              assert len(expected) == len(expectations)
              failures_expected = sum(message is not None for message in expected.values())
              assert (len(expected), failures_expected) in {(52, 0), (5, 1)}
              (evidence / "expected-cases.json").write_text(json.dumps([
                  {"classname": key[0], "name": key[1], "failure_message_prefix": message}
                  for key, message in sorted(expected.items())
              ], indent=2))
              (evidence / "pycache.txt").write_text(env["PYTHONPYCACHEPREFIX"] + "\n")
              try:
                  if patch is not None:
                      file, old, new = patch
                      Path(file).write_text(originals[file].decode().replace(old, new, 1))
                  changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
                  assert changed == ([] if patch is None else [patch[0]]), changed
                  (evidence / "source.diff").write_bytes(subprocess.check_output(["git", "diff"]))
                  command = [sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
                             "--tb=long", "--timeout=20", "--timeout-method=thread",
                             f"--junitxml={evidence / 'junit.xml'}", *nodes]
                  (evidence / "command.json").write_text(json.dumps(command, indent=2))
                  with (evidence / "pytest.log").open("w") as log:
                      result = subprocess.run(command, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=180)
                  print((evidence / "pytest.log").read_text(), end="")
                  (evidence / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
                  assert result.returncode == (1 if failures_expected else 0), (label, result.returncode)
                  report = ET.parse(evidence / "junit.xml").getroot()
                  cases = report.findall(".//testcase")
                  actual = [(case.get("classname"), case.get("name")) for case in cases]
                  assert len(actual) == len(set(actual)) == len(expected), (label, actual)
                  assert set(actual) == set(expected), {
                      "missing": sorted(set(expected) - set(actual)),
                      "unexpected": sorted(set(actual) - set(expected)),
                  }
                  assert not report.findall(".//error"), (label, "setup/teardown error")
                  assert not report.findall(".//skipped"), (label, "skipped case")
                  for case in cases:
                      key = (case.get("classname"), case.get("name"))
                      message = expected[key]
                      failures = case.findall("failure")
                      if message is None:
                          assert not failures, (label, key, "control/positive failed")
                      else:
                          assert len(failures) == 1, (label, key, "expected one CALL failure")
                          actual_message = failures[0].get("message", "")
                          assert actual_message.startswith("AssertionError: " + message), (label, key, actual_message)
                  record = {"invocation": label, "cases": len(cases), "expected_failures": failures_expected}
                  records.append(record)
                  (evidence / "verdict.json").write_text(json.dumps({"status": "PASS", **record}, indent=2))
              except BaseException as error:
                  (evidence / "verdict.json").write_text(json.dumps({
                      "status": "FAIL", "error": type(error).__name__, "detail": str(error)
                  }, indent=2))
                  raise
              finally:
                  restore()
                  (evidence / "status-restored.txt").write_text(status())

          try:
              run_cases("baseline", None, selected, all_cases)
              for name, file, old, new, target, message in mutants:
                  expectations = {node: None for node in controls}
                  expectations[target] = message
                  run_cases(name, (file, old, new), [target, *controls], expectations)
              run_cases("equivalent", equivalent, selected, all_cases)
              run_cases("restored", None, selected, all_cases)
              assert len(records) == 10 and sum(item["cases"] for item in records) == 191
              (artifacts / "oracle.txt").write_text(
                  "PASS: baseline52, seven isolated1FAIL+4PASS, equivalent52, restored52; zero errors/skips.\n"
                  "Seven expected CALL assertions are mutation evidence, not product test failures.\n"
              )
          finally:
              restore()
              (artifacts / "completed-invocations.json").write_text(json.dumps(records, indent=2))
          PY

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: rigctld-actuator-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
