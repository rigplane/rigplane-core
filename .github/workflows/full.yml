name: Canonical levels formatter diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: eb2890bba30354d4c86861c317f9f6de3dca5bcc

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Capture formatter diff
        run: |
          checked_head=$(git rev-parse HEAD)
          echo "checked_head=$checked_head"
          if [ "$checked_head" != "eb2890bba30354d4c86861c317f9f6de3dca5bcc" ]; then
            echo "unexpected checkout: $checked_head" >&2
            exit 1
          fi
          uv run ruff --version
          set +e
          uv run ruff format --diff \
            src/rigplane/core/command_dispatch.py \
            src/rigplane/core/command_service.py \
            src/rigplane/runtime/_poller_types.py \
            src/rigplane/web/handlers/control.py \
            src/rigplane/web/radio_poller.py \
            src/rigplane/backends/yaesu_cat/poller.py \
            src/rigplane/backends/rigctld_client/radio.py > formatter.patch
          rc=$?
          set -e
          echo "ruff_exit=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "unexpected Ruff exit: $rc" >&2
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ] && [ ! -s formatter.patch ]; then
            echo "Ruff reported a diff but formatter.patch is empty" >&2
            exit 1
          fi
          if [ "$rc" -eq 0 ] && [ -s formatter.patch ]; then
            echo "Ruff reported no diff but formatter.patch is nonempty" >&2
            exit 1
          fi
          git diff --exit-code
          status=$(git status --porcelain)
          if [ "$status" != "?? formatter.patch" ]; then
            echo "unexpected checkout status: $status" >&2
            exit 1
          fi

      - name: Upload formatter patch
        uses: actions/upload-artifact@v7
        with:
          name: canonical-levels-format-eb2890bb
          path: formatter.patch
