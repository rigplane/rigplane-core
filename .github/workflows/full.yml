name: Tests (full matrix)

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: command-queue-web-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  command-queue-web-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/command-queue-web-red'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: 8480816eb41579615e7164cca6d327fa8e518e2d
      BASE_PIN: 9618ef4f9db202b5885e10e7503b9c86367ff19c
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8480816eb41579615e7164cca6d327fa8e518e2d
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and require pinned source
        id: prepare
        run: |
          task_dir=$(mktemp -d "$RUNNER_TEMP/command-queue-web-red.XXXXXX")
          artifact_dir="$task_dir/evidence"
          mkdir "$artifact_dir"
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "UV_CACHE_DIR=$task_dir/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$task_dir/venv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$task_dir/python" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$task_dir/ruff-cache" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE=$SOURCE_PIN" "BASE=$BASE_PIN" "DIAG=$GITHUB_SHA" "REF=$GITHUB_REF" "RUN=$GITHUB_RUN_ID" "ATTEMPT=$GITHUB_RUN_ATTEMPT" > "$artifact_dir/metadata.txt"
          [[ "$SOURCE_PIN" =~ ^[0-9a-f]{40}$ && "$BASE_PIN" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git status --porcelain=v1 --untracked-files=all --ignored > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head-before.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"
          git show "$GITHUB_SHA:.github/workflows/full.yml" > "$artifact_dir/workflow.yml"
          git diff --name-only "$SOURCE_PIN" "$GITHUB_SHA" > "$artifact_dir/diag-paths.txt"
          test "$(cat "$artifact_dir/diag-paths.txt")" = '.github/workflows/full.yml'
          git diff --name-only "$BASE_PIN" "$SOURCE_PIN" > "$artifact_dir/source-paths.txt"
          git archive --format=tar "$SOURCE_PIN" -- tests/test_command_queue_execution.py tests/test_radio_poller_coverage.py tests/test_web_command_batch_http.py tests/test_radio_poller_tx_interlock.py src/rigplane/runtime/_poller_types.py src/rigplane/core/command_dispatch.py src/rigplane/web/radio_poller.py src/rigplane/web/server.py > "$artifact_dir/source-files.tar"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install focused test dependencies
        id: install
        run: |
          printf '%s\n' 'uv python install 3.11' 'HATCH_BUILD_NO_HOOKS=1 uv sync --frozen --all-extras' > "$ARTIFACT_DIR/dependency-commands.txt"
          uv python install 3.11
          HATCH_BUILD_NO_HOOKS=1 uv sync --frozen --all-extras

      - name: Exact focused CALL-failure oracle
        run: |
          cat > "$ARTIFACT_DIR/oracle.py" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          (artifacts / "oracle.txt").write_text("NOT CONFIRMED: oracle has not completed.\n")
          (artifacts / "python.txt").write_text(sys.version + "\n")
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          status = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all", "--ignored"])
          (artifacts / "status-prepytest.txt").write_bytes(status)
          assert not status, "Dependency installation changed source"
          queue = "tests/test_command_queue_execution.py"
          web = "tests/test_radio_poller_coverage.py"
          http = "tests/test_web_command_batch_http.py"
          interlock = "tests/test_radio_poller_tx_interlock.py"
          assert (artifacts / "source-paths.txt").read_text().splitlines() == [queue, web, http]
          expected = [
              (queue, "test_ordered_handle_is_frozen_stored_identity", 40),
              (queue, "test_single_claim_preserves_segments_ptt_priority_and_replacement", 57),
              (queue, "test_remove_pending_uses_identity_and_cancel_callback_claim_boundary", 78),
              (queue, "test_non_cancelled_terminal_reply_does_not_remove_pending_entry[result]", None),
              (queue, "test_non_cancelled_terminal_reply_does_not_remove_pending_entry[error]", None),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[pending-result]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[pending-error]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[pending-cancel]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[none-result]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[none-error]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[none-cancel]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[result-result]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[result-error]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[result-cancel]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[error-result]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[error-error]", 115),
              (queue, "test_kernel_terminal_identity_and_hooks_before_reply[error-cancel]", 115),
              (queue, "test_kernel_checks_cancelled_reply_before_leaf[outer]", 157),
              (queue, "test_kernel_checks_cancelled_reply_before_leaf[child]", 157),
              (queue, "test_kernel_drainer_cancel_before_child_handoff_terminalizes_reply", 180),
              (queue, "test_kernel_caller_cancel_does_not_end_active_leaf[reply]", 217),
              (queue, "test_kernel_caller_cancel_does_not_end_active_leaf[coalesced]", 217),
              (queue, "test_kernel_repeated_drainer_cancel_joins_terminal_cleanup[reply-cancel]", 252),
              (queue, "test_kernel_repeated_drainer_cancel_joins_terminal_cleanup[reply-return]", 252),
              (queue, "test_kernel_repeated_drainer_cancel_joins_terminal_cleanup[reply-error]", 252),
              (queue, "test_kernel_repeated_drainer_cancel_joins_terminal_cleanup[coalesced-cancel]", 252),
              (queue, "test_kernel_repeated_drainer_cancel_joins_terminal_cleanup[coalesced-return]", 252),
              (queue, "test_kernel_repeated_drainer_cancel_joins_terminal_cleanup[coalesced-error]", 252),
              (queue, "test_cancelled_ordered_reply_keeps_only_legacy_unkey[ordinary]", 417),
              (queue, "test_cancelled_ordered_reply_keeps_only_legacy_unkey[ptt-on]", 417),
              (queue, "test_cancelled_ordered_reply_keeps_only_legacy_unkey[ptt-off]", None),
              (web, "test_web_loop_claims_live_pending_finite_turn[cancel]", 354),
              (web, "test_web_loop_claims_live_pending_finite_turn[replace]", 354),
              (web, "test_web_loop_claims_live_pending_finite_turn[error]", 354),
              (web, "test_web_loop_releases_held_entry_after_finite_current_turn", None),
              (web, "test_shutdown_drain_executes_cancelled_unkey_after_callback_turn", None),
              (web, "test_command_queue_wait_and_drain_behavior", None),
              (web, "test_command_queue_ordered_lane_preserves_repeated_commands", None),
              (web, "test_command_queue_entries_preserve_command_correlation_metadata", None),
              (web, "test_command_queue_ordered_lane_preserves_segment_order", None),
              (web, "test_drain_between_ticks_gates_tx_only_on_the_fact_as_of_the_drain", None),
              (web, "test_queued_command_failure_emits_failed_lifecycle_and_expires_overlay", None),
              (web, "test_shutdown_drain_never_executes_a_pending_key", None),
              (http, "test_http_command_batch_timeout_cancels_unconsumed_step", 1458),
              (interlock, "test_teardown_drain_unkey_stays_outside_the_execute_seat", None),
          ]
          checkpoints = {
              40: (queue, ("assert isinstance(entry, CommandQueueEntry)",), "AssertionError", "assert False"),
              57: (queue, ("assert queue.pending_count == 5",), "AttributeError", "AttributeError: 'CommandQueue' object has no attribute 'pending_count'"),
              78: (queue, ("assert first is not equal and first == equal",), "AssertionError", "assert (None is not None)"),
              354: (queue, ('assert queue.has_commands, "second entry must stay pending during first leaf"',), "AssertionError", "AssertionError: second entry must stay pending during first leaf"),
              417: (queue, ("assert [entry.command for entry in entries] == expected, (", '"cancel callback must remove ordinary and ON entries but retain legacy PttOff"', ")"), "AssertionError", "AssertionError: cancel callback must remove ordinary and ON entries but retain legacy PttOff"),
              1458: (http, ("assert srv.command_queue.drain_entries() == [], (", '"timed-out ordinary step must no longer be pending"', ")"), "AssertionError", "AssertionError: timed-out ordinary step must no longer be pending"),
          }
          for line in (115, 157, 180, 217, 252):
              checkpoints[line] = (queue, ("execute = queue_types.execute_command_queue_entry",), "AttributeError", "AttributeError: module 'rigplane.runtime._poller_types' has no attribute 'execute_command_queue_entry'")
          for line, (file, statements, kind, message) in checkpoints.items():
              actual = Path(file).read_text().splitlines()[line - 1:line - 1 + len(statements)]
              assert tuple(value.strip() for value in actual) == statements, (file, line, actual)
          manifest = [dict(nodeid=f"{file}::{name}", classname=file[:-3].replace("/", "."), name=name,
                           checkpoint=line, evidence=checkpoints.get(line)) for file, name, line in expected]
          (artifacts / "expected-cases.json").write_text(json.dumps(manifest, indent=2))
          nodeids = [case["nodeid"] for case in manifest]
          assert len(nodeids) == len(set(nodeids)) == 45
          assert sum(case["checkpoint"] is not None for case in manifest) == 32
          (artifacts / "expected-nodeids.txt").write_text("\n".join(nodeids) + "\n")
          command = [sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
                     "-o", f"cache_dir={artifacts / 'pytest-cache'}", "--tb=long", "--color=no",
                     "--timeout=30", "--timeout-method=thread", f"--junitxml={artifacts / 'junit.xml'}", *nodeids]
          (artifacts / "pytest-command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=300)
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 1, f"Expected pytest exit 1, got {result.returncode}"
          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          indexed = {(case["classname"], case["name"]): case for case in manifest}
          assert len(actual) == len(set(actual)) == 45 and set(actual) == set(indexed), actual
          assert not report.findall(".//error"), "Setup/teardown/collection errors are not expected RED"
          assert not report.findall(".//skipped"), "Skipped or xfailed cases are not evidence"
          assert len(report.findall(".//failure")) == 32
          for case in cases:
              identity = (case.get("classname"), case.get("name"))
              expected_case = indexed[identity]
              failures = case.findall("failure")
              line = expected_case["checkpoint"]
              if line is None:
                  assert not failures, (identity, "PASS control failed")
                  continue
              assert len(failures) == 1, (identity, "Expected one CALL failure")
              failure = failures[0]
              file, statements, kind, message = expected_case["evidence"]
              assert failure.get("message", "").splitlines()[0] == message, (identity, failure.attrib)
              trace = failure.text or ""
              pattern = r"(?m)^>[ \t]+" + re.escape(statements[0]) + r"[ \t]*$"
              for statement in statements[1:]:
                  pattern += r"\n[ \t]+" + re.escape(statement) + r"[ \t]*$"
              assert re.search(pattern, trace), (identity, "Wrong failing statement", trace)
              assert re.search(r"(?m)^" + re.escape(f"{file}:{line}: {kind}") + r"$", trace), (identity, "Wrong frame/type", trace)
              assert re.search(r"(?m)^E[ \t]+" + re.escape(message) + r"[ \t]*$", trace), (identity, "Wrong terminal error", trace)
          (artifacts / "oracle.txt").write_text("ORACLE PASS: exact 32 intended CALL failures and 13 PASS; no errors/skips/duplicates. Not product GREEN or managed OFF proof. Ruff and clean-source gates are separate.\n")
          PY
          set +e
          uv run --no-sync python "$ARTIFACT_DIR/oracle.py" > "$ARTIFACT_DIR/oracle.log" 2>&1
          oracle_rc=$?
          printf '%s\n' "$oracle_rc" > "$ARTIFACT_DIR/oracle-exit.txt"
          cat "$ARTIFACT_DIR/oracle.log" "$ARTIFACT_DIR/oracle.txt"
          exit "$oracle_rc"

      - name: Capture and require Ruff without mutation
        if: always() && steps.install.outcome == 'success'
        run: |
          files=(tests/test_command_queue_execution.py tests/test_radio_poller_coverage.py tests/test_web_command_batch_http.py)
          set +e
          for mode in check format-check format-diff; do
            case "$mode" in check) args=(check);; format-check) args=(format --check);; format-diff) args=(format --diff);; esac
            printf '%s\n' "uv run --no-sync ruff ${args[*]} ${files[*]}" > "$ARTIFACT_DIR/ruff-$mode-command.txt"
            uv run --no-sync ruff "${args[@]}" "${files[@]}" > "$ARTIFACT_DIR/ruff-$mode.log" 2>&1
            printf '%s\n' "$?" > "$ARTIFACT_DIR/ruff-$mode-exit.txt"
            cat "$ARTIFACT_DIR/ruff-$mode.log"
          done
          set -e
          test "$(cat "$ARTIFACT_DIR/ruff-check-exit.txt")" = 0
          test "$(cat "$ARTIFACT_DIR/ruff-format-check-exit.txt")" = 0
          test "$(cat "$ARTIFACT_DIR/ruff-format-diff-exit.txt")" = 0

      - name: Record and require unchanged source
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        run: |
          git status --porcelain=v1 --untracked-files=all --ignored > "$ARTIFACT_DIR/status-after.txt"
          git rev-parse HEAD > "$ARTIFACT_DIR/source-head-after.txt"
          git diff --binary HEAD > "$ARTIFACT_DIR/source-diff.patch"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: command-queue-web-red-8480816e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
