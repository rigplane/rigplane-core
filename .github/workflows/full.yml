name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigctld-actuator-interface-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interface-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rigctld-actuator-red-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: 4f76aca2f96929964b392405283ae235d9fb8546
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4f76aca2f96929964b392405283ae235d9fb8546
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-red.XXXXXX")
          pycache_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-actuator-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install mock-test dependencies and package metadata
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Selected interface RED and structural JUnit oracle
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONPYCACHEPREFIX", "PYTHONDONTWRITEBYTECODE",
          )}
          metadata["python"] = sys.version
          metadata["claim"] = "Interface/assertion RED only; not behavioral mutation or hardware proof"
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          authority = "test_managed_tx_authority"
          lane = "test_managed_tx_effect_lane"
          backend = "test_rigctld_client_backend"
          no_actuate = "AttributeError: 'RigctldClientRadio' object has no attribute 'actuate'"
          no_guard = "AssertionError: lane did not supply a live claim predicate"
          no_urgent = "TypeError: RigctldTransport.command() got an unexpected keyword argument 'urgent'"
          no_current = "TypeError: RigctldTransport.command() got an unexpected keyword argument 'is_current'"
          # Each row declares exact case suffixes and its expected CALL failure message.
          # None means a passing control. The map is source-derived, not collected.
          rows = [
              (authority, "test_effect_currency_tracks_pending_owner_release",
               ["ptt_up", "offline_ptt_up", "force_off", "replace"],
               "AssertionError: authority did not supply per-attempt currency"),
              (authority, "test_abort_currency_ends_when_current_force_receive_settles",
               [None], "AssertionError: abort attempt has no runtime currency"),
              (authority, "test_shutdown_currency_observes_termination_synchronously",
               [None], "AssertionError: shutdown OFF has no runtime currency"),
              (lane, "test_live_claim_currency_blocks_resistant_write", ["caller"],
               "TypeError: ManagedTxEffectLane.settle() got an unexpected keyword argument 'is_current'"),
              (lane, "test_live_claim_currency_blocks_resistant_write", ["cancel", "deadline"], no_guard),
              (lane, "test_removed_claim_has_no_currency_during_isolation", [None], no_guard),
              (backend, "test_urgent_exchange_preserves_active_frame_and_each_fifo",
               ["query", "command"], no_actuate),
              (backend, "test_cancelled_admission_releases_only_its_reservation",
               ["normal-queued", "normal-granted", "urgent-queued", "urgent-granted"], no_urgent),
              (backend, "test_write_currency_is_checked_after_stale_drain", ["false", "raises"], no_current),
              (backend, "test_managed_actuator_forwards_live_currency_to_final_write", [None], no_actuate),
              (backend, "test_tokened_queue_cannot_retarget_or_drain_replacement", [None], no_current),
              (backend, "test_managed_actuator_uses_canonical_rigctld_outcomes",
               ["accepted-ptt_on", "accepted-transmit_on", "accepted-force_receive",
                "rprt_error-ptt_on", "rprt_error-transmit_on", "rprt_error-force_receive",
                "malformed-ptt_on", "malformed-transmit_on", "malformed-force_receive"], no_actuate),
              (backend, "test_controlled_authority_replacement_keeps_debt_after_late_on_rprt", [None], no_actuate),
              (backend, "test_rigctld_unsupported_abort_does_not_emit_a_command", ["stop_cw", "stop_tune"], no_actuate),
              (backend, "test_authority_canonical_rigctld_release_precedes_unrelated_cleanup", [None], no_actuate),
              (backend, "test_transport_connect_query_and_close", [None], None),
              (backend, "test_transport_serializes_requests", [None], None),
              (backend, "test_cancelled_lock_waiter_keeps_active_exchange", [None], None),
              (backend, "test_old_exchange_interruption_does_not_retire_replacement",
               ["cancel", "eof", "oserror", "timeout"], None),
              (backend, "test_cancelled_lifecycle_preserves_real_stream_close_future", ["close", "connect"], None),
              (backend, "test_delayed_cancelled_rprt_cannot_complete_next_command", [None], None),
              (lane, "test_preserves_explicit_normalized_result", ["accepted", "rejected", "uncertain"], None),
              (authority, "test_late_physical_on_retains_debt_until_a_fresh_off", ["False", "True"], None),
              (authority, "test_real_fence_releases_before_cleanup_and_shutdown_waits_for_cleanup",
               ["force_off", "shutdown", "offline_shutdown"], None),
          ]
          expected, selected = {}, []
          for module, function, suffixes, message in rows:
              node = f"tests/{module}.py::{function}"
              if node not in selected:
                  selected.append(node)
              for suffix in suffixes:
                  name = function if suffix is None else f"{function}[{suffix}]"
                  key = (f"tests.{module}", name)
                  assert key not in expected, key
                  expected[key] = message
          assert len(selected) == 23 and len(expected) == 51
          assert sum(message is not None for message in expected.values()) == 33
          (artifacts / "expected-cases.json").write_text(json.dumps([
              {"classname": key[0], "name": key[1], "failure_message_prefix": value}
              for key, value in expected.items()
          ], indent=2))
          (artifacts / "selected-nodeids.txt").write_text("\n".join(selected) + "\n")
          command = [sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
                     "--tb=long", "--timeout=20", "--timeout-method=thread",
                     f"--junitxml={artifacts / 'junit.xml'}", *selected]
          (artifacts / "command.json").write_text(json.dumps(command, indent=2))
          with (artifacts / "pytest.log").open("w") as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=180)
          print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 1, f"Expected pytest CALL failures, got exit {result.returncode}"

          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          assert len(actual) == len(set(actual)) == 51, actual
          assert set(actual) == set(expected), {
              "missing": sorted(set(expected) - set(actual)),
              "unexpected": sorted(set(actual) - set(expected)),
          }
          assert not report.findall(".//error"), "JUnit setup/teardown errors are not expected RED"
          assert not report.findall(".//skipped"), "Skipped cases are not evidence"
          failures = 0
          for case in cases:
              key = (case.get("classname"), case.get("name"))
              prefix = expected[key]
              entries = case.findall("failure")
              if prefix is None:
                  assert not entries, (key, "passing control failed")
              else:
                  assert len(entries) == 1, (key, "expected exactly one CALL failure")
                  message = entries[0].get("message", "")
                  assert message.startswith(prefix), (key, message, prefix)
                  failures += 1
          assert failures == 33 and len(cases) - failures == 18
          (artifacts / "oracle.txt").write_text(
              "PASS: exact 33 expected interface/assertion failures and 18 controls; zero errors/skips.\n"
              "This is not behavioral mutation proof or production/hardware acceptance.\n"
          )
          print((artifacts / "oracle.txt").read_text(), end="")
          PY

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: rigctld-actuator-interface-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
