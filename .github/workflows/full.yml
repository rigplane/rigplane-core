name: Tests (full matrix)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-tx-admission-mutation-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutation-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ptt-admission-mutation-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: 0999c0142f10d3279796bc263bb2cb8b3eaab9ea
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0999c0142f10d3279796bc263bb2cb8b3eaab9ea
          fetch-depth: 0
          persist-credentials: false
          path: source
      - id: prepare
        name: Prepare isolated evidence and caches
        run: |
          a=$(mktemp -d "$RUNNER_TEMP/managed-tx-mutation-proof.XXXXXX")
          p=$(mktemp -d "$RUNNER_TEMP/managed-tx-mutation-pycache.XXXXXX")
          c=$(mktemp -d "$RUNNER_TEMP/managed-tx-mutation-cache.XXXXXX")
          v=$(mktemp -d "$RUNNER_TEMP/managed-tx-mutation-venv.XXXXXX")
          s=$(mktemp -d "$RUNNER_TEMP/managed-tx-mutation-scratch.XXXXXX")
          echo "ARTIFACT_DIR=$a" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$p" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$c" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$v" >> "$GITHUB_ENV"
          echo "SCRATCH_DIR=$s" >> "$GITHUB_ENV"
          echo "artifacts_dir=$a" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$a/source-status-before.txt"
          git rev-parse HEAD > "$a/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN" && test ! -s "$a/source-status-before.txt"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev
      - name: Archived-source mutation proof
        run: |
          uv run --no-sync python - <<'PY'
          import difflib, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          src, art, scratch = Path.cwd(), Path(os.environ['ARTIFACT_DIR']), Path(os.environ['SCRATCH_DIR'])
          pin=os.environ['SOURCE_PIN']; assert sys.version_info[:2] == (3,11)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==pin
          subprocess.run(['bash','-c','git archive --format=tar "$1" | tar -x -C "$2"','--',pin,str(scratch)],cwd=src,check=True)
          assert not (scratch/'.git').exists()
          (art/'metadata.json').write_text(json.dumps({k:os.environ.get(k) for k in ('SOURCE_PIN','GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','SCRATCH_DIR')},indent=2))
          rel='src/rigplane/runtime/managed_tx_authority.py'; authority=scratch/rel
          original=authority.read_bytes(); digest=hashlib.sha256(original).hexdigest(); (art/'authority-original.sha256').write_text(digest+'\n')
          tf='tests/test_managed_tx_ingress_admission.py'; mod='tests.test_managed_tx_ingress_admission'; tt=(src/tf).read_text()
          env=dict(os.environ,PYTHONPATH=f'{scratch}/src:{scratch}/tests')
          def line(fn,statement):
              a=tt.index(f'async def {fn}('); b=tt.find('\nasync def ',a+1); b=len(tt) if b<0 else b
              found=[i+1 for i,x in enumerate(tt[:b].splitlines()) if i+1>tt[:a].count('\n') and statement in x]
              assert len(found)==1,(fn,statement,found); return found[0]
          def f(fn,s,t='AssertionError'): return (s,line(fn,s),t)
          def run(label,nodes,expect,rc,baseline=False):
              d=art/label; d.mkdir(parents=True); cmd=[sys.executable,'-m','pytest','-q','-o','addopts=','-o',f'cache_dir={d/"pytest-cache"}','--tb=long','--color=no','--timeout=20','--timeout-method=thread',f'--junitxml={d/"junit.xml"}',*nodes]
              (d/'command.json').write_text(json.dumps(cmd,indent=2)); (d/'expected.json').write_text(json.dumps(sorted(map(list,expect)),indent=2))
              try:
                  with (d/'pytest.log').open('w') as log: p=subprocess.run(cmd,cwd=scratch,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=300)
              except subprocess.TimeoutExpired: raise AssertionError(f'process timeout is not proof: {label}') from None
              (d/'pytest-exit.txt').write_text(str(p.returncode)+'\n'); assert p.returncode==rc,(label,p.returncode)
              cases=ET.parse(d/'junit.xml').getroot().findall('.//testcase'); actual={(x.get('classname'),x.get('name')) for x in cases}
              assert len(actual)==len(cases) and not ET.parse(d/'junit.xml').getroot().findall('.//error') and not ET.parse(d/'junit.xml').getroot().findall('.//skipped')
              if baseline:
                  assert len(actual)==117 and not ET.parse(d/'junit.xml').getroot().findall('.//failure'); return {x:None for x in actual}
              assert actual==set(expect),(label,actual,set(expect))
              for c in cases:
                  e=expect[(c.get('classname'),c.get('name'))]; fs=c.findall('failure')
                  if e is None: assert not fs; continue
                  assert len(fs)==1 and fs[0].get('type')==e[0]; msg=fs[0].get('message',''); trace=fs[0].text or ''
                  if len(e)>2: assert msg==e[2]
                  for s,n,t in e[1]:
                      assert re.search(r'(?m)^>\\s+'+re.escape(s)+r'[ \\t]*$',trace); assert re.search(r'(?m)^'+re.escape(f'{tf}:{n}: {t}')+r'[ \\t]*$',trace)
              (d/'oracle.txt').write_text(f'PASS {label}: exact identities; zero errors/skips.\n')
          full=['tests/test_managed_tx_ingress_admission.py','tests/test_managed_tx_fence.py','tests/test_managed_tx_authority.py','tests/test_managed_tx_effect_lane.py']
          base=run('00-baseline-117',full,{},0,True); control=(mod,'test_public_owner_up_settles_release')
          specs=[
           ('M1',[('and self._abort_fence.remove(token)','and (self._abort_fence.remove(token) or True)')],{'test_scoped_up_membership_blocks_on_when_cancel_handle_does_nothing':('AssertionError',[f('test_scoped_up_membership_blocks_on_when_cancel_handle_does_nothing','await prevented(worker)'),f('prevented','assert transition.outcome is ManagedTxOutcome.REJECTED')])}),
           ('M2',[('        if not on:\n            self._cancel_pending_ptt(owner)\n\n',''),('                async with self._lock:\n                    self._require_ingress_open_locked()','                async with self._lock:\n                    if not on:\n                        self._cancel_pending_ptt(owner)\n                    self._require_ingress_open_locked()')],{'test_scoped_up_revokes_old_down_before_contended_lock_not_new_down':('AssertionError',[f('test_scoped_up_revokes_old_down_before_contended_lock_not_new_down','assert old_token not in rig.fence._cancellations')])}),
           ('M3',[('await asyncio.wait((ready,))','await ready')],{'test_on_cancel_does_not_cancel_readiness_predecessor':('AssertionError',[f('test_on_cancel_does_not_cancel_readiness_predecessor','assert not ready.done() and not rig.fence._cancellations')])}),
           ('M4',[('return transition, await asyncio.shield(execution)','return transition, await execution')],{'test_off_cancel_before_execute_entry_drains_despite_repeated_cancel':('TimeoutError',[f('test_off_cancel_before_execute_entry_drains_despite_repeated_cancel','await asyncio.wait_for(provider_started.wait(), 1)','TimeoutError')])}),
           ('M5',[('            except asyncio.CancelledError:\n                continue\n            except Exception:','            except asyncio.CancelledError:\n                return\n            except Exception:')],{'test_off_cancel_before_execute_entry_drains_despite_repeated_cancel':('AssertionError',[f('test_off_cancel_before_execute_entry_drains_despite_repeated_cancel','assert not worker.done() and not provider_cancelled.is_set()')])}),
           ('M6',[('                    if any(\n                        settled.token == requested.token\n                        and settled.operation is requested.operation\n                        for requested in original_effects\n                    ):\n                        original_settlement = settled','                    original_settlement = settled')],{'test_original_on_uncertainty_not_replaced_by_accepted_compensation[uncertain]':('AssertionError',[f('test_original_on_uncertainty_not_replaced_by_accepted_compensation','assert settled.token == transition.effects[0].token')]),'test_original_on_uncertainty_not_replaced_by_accepted_compensation[provider_error]':('AssertionError',[f('test_original_on_uncertainty_not_replaced_by_accepted_compensation','assert settled.token == transition.effects[0].token')])}),
           ('M7',[('                        self._provider_generation == generation\n                        and self._abort_fence.is_current(token)','                        self._abort_fence.is_current(token)')],{'test_provider_replacement_while_rx_clean_prevents_old_pending_on':('AssertionError',[f('test_provider_replacement_while_rx_clean_prevents_old_pending_on','await prevented(worker)'),f('prevented','assert transition.outcome is ManagedTxOutcome.REJECTED')])}),
           ('M8',[('            if token is not None:\n                self._abort_fence.remove(token)\n            error = None if task.cancelled() else task.exception()','            error = None if task.cancelled() else task.exception()')],{'test_prestart_on_cancel_removes_registration_without_dispatch':('AssertionError',[f('test_prestart_on_cancel_removes_registration_without_dispatch','assert not rig.fence._cancellations')])}),
           ('M9',[('if type(on) is not bool or type(owner) is not str:','if type(on) is not bool or not isinstance(owner, str):')],{'test_non_builtin_owner_is_rejected_without_equality_or_registration':('AssertionError',[f('test_non_builtin_owner_is_rejected_without_equality_or_registration','assert rig.fence._next_number == 0 and not rig.fence._cancellations')])}),
           ('M10',[('await asyncio.wait((ready,))','await asyncio.shield(ready)')],{'test_failed_predecessor_completion_allows_independent_on[cancel]':('AssertionError',[f('test_failed_predecessor_completion_allows_independent_on','assert not worker.cancelled()')], 'AssertionError: assert not True'),'test_failed_predecessor_completion_allows_independent_on[error]':('AssertionError',[f('test_failed_predecessor_completion_allows_independent_on','assert worker.exception() is None)], "AssertionError: assert RuntimeError('predecessor failed') is None")}),]
          for ident,changes,red in specs:
              authority.write_bytes(original); text=authority.read_text()
              for old,new in changes: assert text.count(old)==1,(ident,old); text=text.replace(old,new,1)
              authority.write_text(text); d=art/ident; d.mkdir(); (d/'authority-before.sha256').write_text(digest+'\n'); (d/'authority-after.sha256').write_text(hashlib.sha256(authority.read_bytes()).hexdigest()+'\n'); (d/'authority.diff').write_text(''.join(difflib.unified_diff(original.decode().splitlines(True),text.splitlines(True),fromfile='original/'+rel,tofile='mutant/'+rel)))
              expected={control:None}|{(mod,k):v for k,v in red.items()}; nodes=[f'{tf}::{n}' for _,n in expected]
              try: run(f'{ident}/red',nodes,expected,1)
              finally: authority.write_bytes(original)
              assert hashlib.sha256(authority.read_bytes()).hexdigest()==digest; run(f'{ident}/restored-green',nodes,{k:None for k in expected},0)
          positive=['tests/test_managed_tx_ingress_admission.py','tests/test_managed_tx_fence.py']; run('90-positive-30',positive,{k:None for k in [x for x in base if x[0] in {mod,'tests.test_managed_tx_fence'}]},0)
          run('99-restored-117',full,base,0); assert hashlib.sha256(authority.read_bytes()).hexdigest()==digest
          PY
      - name: Record and require unchanged source checkout
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/source-status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN" && test ! -s "$ARTIFACT_DIR/source-status-after.txt"
      - name: Upload mutation-proof evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: managed-tx-admission-mutation-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
