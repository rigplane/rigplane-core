name: Tests (full matrix)
on:
  workflow_dispatch:
jobs:
  observed-ptt-green:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7df00f5a1fd6a31bc88d043ba6bc659a34a8d2a5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Prepare isolated evidence and exact source
        run: |
          test "$(git rev-parse HEAD)" = 7df00f5a1fd6a31bc88d043ba6bc659a34a8d2a5
          test "$(git rev-parse HEAD^{tree})" = b0decf16e8583b278524ddc1fdf8f176530163ca
          test -z "$(git status --porcelain)"
          proof_dir=$(mktemp -d "$RUNNER_TEMP/yaesu-observed-ptt.XXXXXX")
          echo "YAESU_PROOF=$proof_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$proof_dir/venv" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$proof_dir/pycache" >> "$GITHUB_ENV"
      - name: Dependencies
        run: uv sync --frozen --all-extras
      - name: Prepare exact GREEN collector and bounded supervisor
        run: |
          cat > "$YAESU_PROOF/yaesu_green_probe.py" <<'PY'
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          import pytest

          SOURCE = "7df00f5a1fd6a31bc88d043ba6bc659a34a8d2a5"
          TREE = "b0decf16e8583b278524ddc1fdf8f176530163ca"
          BASE = "b28bd8a41d36b05a71e3ef77169345cdc8f5740b"
          ROOT = Path.cwd().resolve()
          EVIDENCE = Path(os.environ["YAESU_PROOF"])
          SELECTED = ("tests/test_yaesu_cat_observation_adapter.py", "tests/test_yaesu_cat_poller.py")
          PROJECT_MODULES = {
              "test_yaesu_cat_observation_adapter": SELECTED[0],
              "test_yaesu_cat_poller": SELECTED[1],
              "rigplane.backends.yaesu_cat.radio": "src/rigplane/backends/yaesu_cat/radio.py",
              "rigplane.backends.yaesu_cat.poller": "src/rigplane/backends/yaesu_cat/poller.py",
              "rigplane.backends.yaesu_cat.observations": "src/rigplane/backends/yaesu_cat/observations.py",
              "rigplane.core.tx_observation": "src/rigplane/core/tx_observation.py",
              "rigplane.core.state_store": "src/rigplane/core/state_store.py",
              "rigplane.core.observation_adapter": "src/rigplane/core/observation_adapter.py",
              "rigplane.core.command_service": "src/rigplane/core/command_service.py",
          }

          def save(name, value):
              (EVIDENCE / name).write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")

          def append(name, value):
              with (EVIDENCE / name).open("a") as stream:
                  stream.write(json.dumps(value, sort_keys=True) + "\n")

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def inventory():
              head, tree, status = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}"), git("status", "--porcelain")
              assert (head, tree, status) == (SOURCE, TREE, ""), (head, tree, status)
              carrier = os.environ["GITHUB_SHA"]
              assert git("merge-base", carrier, SOURCE) == BASE
              assert git("diff", "--name-only", BASE, carrier) == ".github/workflows/full.yml"
              tracked = git("ls-files", "-z").split("\0")
              hashes = {name: hashlib.sha256((ROOT / name).read_bytes()).hexdigest()
                        for name in tracked if name.endswith(".py") or name in ("pyproject.toml", "uv.lock", "rigs/ftx1.toml")}
              return dict(source=head, source_tree=tree, status=status, carrier=carrier,
                          carrier_tree=git("rev-parse", carrier + "^{tree}"), common_base=BASE,
                          workflow_sha256=hashlib.sha256(subprocess.check_output(
                              ["git", "show", carrier + ":.github/workflows/full.yml"])).hexdigest(), hashes=hashes)

          def imports():
              before = json.loads((EVIDENCE / "before.json").read_text())["hashes"]
              records = {}
              for name, expected_path in PROJECT_MODULES.items():
                  module = sys.modules.get(name)
                  assert module is not None and getattr(module, "__file__", None), name
                  path = Path(module.__file__).resolve()
                  assert path == ROOT / expected_path, (name, str(path), expected_path)
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == before[expected_path], name
                  records[name] = expected_path
              for name, module in sorted(sys.modules.items()):
                  if not (name == "rigplane" or name.startswith("rigplane.")):
                      continue
                  path_name = getattr(module, "__file__", None)
                  if not path_name:
                      continue
                  path = Path(path_name).resolve()
                  if path.is_relative_to(ROOT):
                      relative = str(path.relative_to(ROOT))
                      assert relative in before and hashlib.sha256(path.read_bytes()).hexdigest() == before[relative], (name, relative)
                      records.setdefault(name, relative)
              return records

          def pytest_sessionstart(session):
              assert pytest.__version__ == "9.0.2" and sys.version_info[:2] == (3, 11)
              assert sys.implementation.name == "cpython"
              save("before.json", inventory())
              save("runtime.json", dict(python=sys.version, executable=sys.executable, pytest=pytest.__version__, root=str(ROOT), argv=sys.argv, run_id=os.environ.get("GITHUB_RUN_ID"), run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"), instrument_sha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest(), selection=SELECTED, contract="complete selected modules; all collected nodes PASS"))

          def pytest_collectreport(report):
              append("collection.jsonl", dict(node=report.nodeid, outcome=report.outcome, longrepr=str(report.longrepr) if report.failed else None))

          def pytest_collection_finish(session):
              collected = [item.nodeid for item in session.items]
              prefixes = tuple(path + "::" for path in SELECTED)
              assert collected and all(node.startswith(prefixes) for node in collected), collected
              assert all(any(node.startswith(path + "::") for node in collected) for path in SELECTED), collected
              save("manifest.json", dict(source=SOURCE, tree=TREE, selection=SELECTED, nodes=collected))
              save("imports-before.json", imports())

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_makereport(item, call):
              report = (yield).get_result()
              append("phases.jsonl", dict(node=item.nodeid, phase=report.when, outcome=report.outcome, xfail=getattr(report, "wasxfail", None), longrepr=str(report.longrepr) if report.failed else None))

          def pytest_warning_recorded(warning_message, when, nodeid, location):
              append("warnings.jsonl", dict(category=warning_message.category.__name__, message=str(warning_message.message), when=when, node=nodeid, location=location))

          def pytest_sessionfinish(session, exitstatus):
              save("imports-after.json", imports())
              save("session.json", dict(exitstatus=int(exitstatus)))

          def execute():
              command = ["uv", "run", "--frozen", "pytest", "-p", "yaesu_green_probe", "-q", "-o", "addopts=", "-o", f"cache_dir={EVIDENCE / 'pytest-cache'}", "--basetemp", str(EVIDENCE / "basetemp"), "--tb=short", "--color=no", "--timeout=30", "--timeout-method=thread", *SELECTED, f"--junitxml={EVIDENCE / 'green.xml'}"]
              environment = dict(os.environ, PYTEST_ADDOPTS="", PYTHONPATH=str(EVIDENCE) + os.pathsep + os.environ.get("PYTHONPATH", ""))
              started = time.monotonic()
              process = subprocess.Popen(command, env=environment, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, start_new_session=True)
              deadline_hit, signal_sent = False, None
              try:
                  output, _ = process.communicate(timeout=600)
              except subprocess.TimeoutExpired:
                  deadline_hit, signal_sent = True, "SIGKILL"
                  os.killpg(process.pid, signal.SIGKILL)
                  output, _ = process.communicate()
              try:
                  os.killpg(process.pid, 0)
              except ProcessLookupError:
                  group_absent = True
              else:
                  group_absent = False
              (EVIDENCE / "green.txt").write_text(output)
              save("supervisor.json", dict(command=command, pid=process.pid, returncode=process.returncode, elapsed_seconds=time.monotonic() - started, deadline_seconds=600, deadline_hit=deadline_hit, signal_sent=signal_sent, reaped=True, process_group_absent=group_absent, deadline_signal_boundary="unexercised" if not deadline_hit else "exercised"))
              return process.returncode

          def validate():
              before, after = json.loads((EVIDENCE / "before.json").read_text()), inventory()
              save("after.json", after)
              assert after == before, "source/carrier changed"
              assert (EVIDENCE / "exit-code.txt").read_text().strip() == "0"
              assert json.loads((EVIDENCE / "session.json").read_text()) == {"exitstatus": 0}
              assert json.loads((EVIDENCE / "imports-before.json").read_text())
              assert json.loads((EVIDENCE / "imports-after.json").read_text())
              manifest = json.loads((EVIDENCE / "manifest.json").read_text())
              nodes = manifest["nodes"]
              assert manifest["selection"] == list(SELECTED) and nodes
              collection = [json.loads(line) for line in (EVIDENCE / "collection.jsonl").read_text().splitlines()]
              assert collection and all(row["outcome"] == "passed" for row in collection), collection
              phases = [json.loads(line) for line in (EVIDENCE / "phases.jsonl").read_text().splitlines()]
              expected = collections.Counter((node, phase) for node in nodes for phase in ("setup", "call", "teardown"))
              actual = collections.Counter((row["node"], row["phase"]) for row in phases)
              assert actual == expected, (actual, expected)
              assert all(row["outcome"] == "passed" and row["xfail"] is None and row["longrepr"] is None for row in phases), phases
              warnings = [json.loads(line) for line in (EVIDENCE / "warnings.jsonl").read_text().splitlines()] if (EVIDENCE / "warnings.jsonl").exists() else []
              assert not warnings, warnings
              xml = ET.parse(EVIDENCE / "green.xml").getroot()
              suite = xml.find("testsuite") or xml
              assert int(suite.get("tests", "-1")) == len(nodes)
              assert all(not xml.findall(".//" + tag) for tag in ("failure", "error", "skipped"))
              supervisor = json.loads((EVIDENCE / "supervisor.json").read_text())
              assert supervisor["returncode"] == 0 and supervisor["reaped"] and supervisor["process_group_absent"]
              assert not supervisor["deadline_hit"] and supervisor["signal_sent"] is None

          if __name__ == "__main__":
              try:
                  code = execute()
                  (EVIDENCE / "exit-code.txt").write_text(str(code) + "\n")
                  validate()
              except BaseException as error:
                  save("verdict.json", dict(status="INVALID", reason=repr(error)))
                  raise
              save("verdict.json", dict(status="GREEN", source=SOURCE, tree=TREE, selection=SELECTED, contract="all collected nodes passed without warnings, skips, xfails, or phase errors"))
              print("GREEN: complete selected-module collection passed; inspect manifest.json for actual node census")
          PY
      - name: Exact source and complete GREEN selection
        run: |
          uv run --frozen python "$YAESU_PROOF/yaesu_green_probe.py"
          cat "$YAESU_PROOF/green.txt"
      - name: Formatting diagnostic
        if: always() && env.YAESU_PROOF != ''
        run: |
          uv run --frozen ruff check tests/test_yaesu_cat_observation_adapter.py tests/test_yaesu_cat_poller.py
          uv run --frozen ruff format --diff tests/test_yaesu_cat_observation_adapter.py tests/test_yaesu_cat_poller.py > "$YAESU_PROOF/format.diff"
          cat "$YAESU_PROOF/format.diff"
      - uses: actions/upload-artifact@v4
        if: always() && env.YAESU_PROOF != ''
        with:
          name: yaesu-observed-ptt-green
          path: |
            ${{ env.YAESU_PROOF }}/*.json
            ${{ env.YAESU_PROOF }}/*.jsonl
            ${{ env.YAESU_PROOF }}/*.txt
            ${{ env.YAESU_PROOF }}/*.xml
            ${{ env.YAESU_PROOF }}/*.diff
            ${{ env.YAESU_PROOF }}/yaesu_green_probe.py
          retention-days: 14
