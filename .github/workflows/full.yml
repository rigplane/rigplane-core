name: Tests (full matrix)
on:
  workflow_dispatch:
jobs:
  observed-ptt-red:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 068cede34280bbba1bd2b588a9ca8dd496cbaa21
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Dependencies
        run: uv sync --all-extras
      - name: Exact source and targeted RED
        run: |
          test "$(git rev-parse HEAD)" = 068cede34280bbba1bd2b588a9ca8dd496cbaa21
          git status --short
          git rev-parse HEAD
          export PYTHONPYCACHEPREFIX="$(mktemp -d)"
          set +e
          uv run pytest -q --tb=short --timeout=30 --timeout-method=thread \
            tests/test_tx_observation.py \
            tests/test_yaesu_cat_poller.py::test_canonical_ptt_real_read_reaches_store_with_legacy_and_shared_ttl \
            tests/test_yaesu_cat_poller.py::test_canonical_ptt_rejects_malformed_or_conflicting_typed_reading \
            tests/test_yaesu_cat_poller.py::test_canonical_ptt_read_error_reaches_store_even_if_later_field_fails \
            tests/test_yaesu_cat_poller.py::test_canonical_ptt_transport_failure_preserves_reconnect_path \
            tests/test_yaesu_cat_poller.py::test_canonical_ptt_cancelled_read_does_not_emit_success \
            tests/test_yaesu_cat_poller.py::test_canonical_ptt_reconnect_discards_late_old_read \
            tests/test_ftx1_radio.py::test_get_ptt_unexpected_value_reads_as_transmitting \
            tests/test_ftx1_radio.py::test_read_ptt_falls_back_to_the_legacy_predicate_when_unmeasured \
            --junitxml=red.xml > red.txt 2>&1
          result=$?
          cat red.txt
          test "$result" = 1
      - name: Classify structural JUnit
        run: |
          uv run python - <<'PY'
          import collections
          import xml.etree.ElementTree as ET
          expected = {
              "test_attribution_qualified_ptt_requires_consistent_strict_evidence": 14,
              "test_canonical_ptt_real_read_reaches_store_with_legacy_and_shared_ttl": 8,
              "test_canonical_ptt_rejects_malformed_or_conflicting_typed_reading": 2,
              "test_canonical_ptt_read_error_reaches_store_even_if_later_field_fails": 6,
              "test_canonical_ptt_transport_failure_preserves_reconnect_path": 2,
              "test_canonical_ptt_reconnect_discards_late_old_read": 2,
          }
          failures = collections.Counter()
          passed = 0
          for case in ET.parse("red.xml").iter("testcase"):
              assert case.find("error") is None, ET.tostring(case, encoding="unicode")
              assert case.find("skipped") is None, case.attrib
              name = case.attrib["name"].split("[", 1)[0]
              failure = case.find("failure")
              if failure is None:
                  assert name not in expected, ("unexpected green", case.attrib)
                  passed += 1
                  continue
              assert name in expected, ("control failed", case.attrib)
              detail = (failure.text or "") + failure.attrib.get("message", "")
              if name.startswith("test_attribution_qualified"):
                  assert "TypeError" in detail and "attributed" in detail, detail
              else:
                  assert "observed_ptt" in detail or "ObservedPtt.UNKNOWN" in detail, detail
              failures[name] += 1
          assert dict(failures) == expected, failures
          assert passed >= 25, passed
          print(f"EXPECTED RED: {sum(failures.values())}; PASS controls: {passed}; errors/skips: 0")
          for name, count in failures.items():
              print(f"{name}: {count}")
          PY
      - name: Formatting diagnostic
        if: always()
        run: |
          uv run ruff check tests/test_tx_observation.py tests/test_yaesu_cat_poller.py
          uv run ruff format --diff tests/test_tx_observation.py tests/test_yaesu_cat_poller.py > format.diff || true
          cat format.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaesu-observed-ptt-red
          path: |
            red.xml
            red.txt
            format.diff
          retention-days: 14
