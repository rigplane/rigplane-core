          assert len(FROZEN) == len(set(FROZEN)) == 46
          assert len(SUPPLEMENTAL) == len(set(SUPPLEMENTAL)) == 12 and len(ALL) == 58
          assert len(variants) == 26 and len(legitimate) == 4 and len(PLAN) == 32
          assert sys.version_info[:3] == (3, 11, 16)
          uv_version = subprocess.check_output(['uv', '--version'], text=True).strip()
          assert uv_version.split()[1] == '0.12.9', uv_version
          assert sys.platform == 'linux' and ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) == 0
          def interrupted(signum, _frame):
              raise KeyboardInterrupt(f'diagnostic interrupted by signal {signum}')
          for signum in (signal.SIGTERM, signal.SIGINT):
              signal.signal(signum, interrupted)
          assert git(seed, 'rev-parse', 'HEAD').decode().strip() == SOURCE and not status(seed)
          names = git(seed, 'ls-files', '-z').decode().split('\0')[:-1]
          originals = {name: tracked_bytes(seed / name) for name in names}
          hashes = {name: sha(value) for name, value in originals.items()}
          assert all(git(seed, 'show', f'{SOURCE}:{name}') == originals[name] for name in (QSRC, WSRC, *TESTS, 'pyproject.toml', 'uv.lock', '.github/workflows/full.yml'))
          assert git(seed, 'diff', '--name-only', SOURCE, FINAL).decode().splitlines() == ['.claude/audits/2026-09-03-mechanism-audit-command-queue-web.md', '.claude/audits/README.md']
          diagnostic = seed.parent / 'diagnostic'
          assert git(diagnostic, 'rev-parse', 'HEAD').decode().strip() == os.environ['GITHUB_SHA'] and not status(diagnostic)
          git(diagnostic, 'merge-base', '--is-ancestor', BASE, 'HEAD')
          assert git(diagnostic, 'diff', '--name-only', BASE, 'HEAD').decode().splitlines() == ['.github/workflows/full.yml']
          probe_bytes = (artifacts / 'test_q1_diagnostic_probes.py').read_bytes()
          assert PROBE not in originals
          save(artifacts / 'provenance.json', {
              'source': SOURCE, 'source_tree': git(seed, 'rev-parse', 'HEAD^{tree}').decode().strip(),
              'diagnostic_base': BASE, 'diagnostic_tree': git(diagnostic, 'rev-parse', 'HEAD^{tree}').decode().strip(),
              'source_hashes': hashes, 'probe_sha256': sha(probe_bytes), 'python': sys.version,
              'dependencies': sorted((distribution.metadata['Name'], distribution.version) for distribution in importlib.metadata.distributions()),
              'uv': uv_version,
              'workflow_sha256': sha((diagnostic / '.github/workflows/full.yml').read_bytes()),
              **{key: os.environ.get(key) for key in ('GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_NAME')},
          })
          save(artifacts / 'frozen-nodeids.json', FROZEN)
          save(artifacts / 'supplemental-nodeids.json', SUPPLEMENTAL)
          prepared = []
          # Resolve all literal anchors and exact failure sites before any pytest
          # process starts. Results never choose or widen an expected failure.
          for plan in PLAN:
              contents = {QSRC: originals[QSRC].decode(), WSRC: originals[WSRC].decode()}
              for change in plan['edits']:
                  file, old, new, count = (change[key] for key in ('file', 'old', 'new', 'count'))
                  assert file in contents and old != new
                  assert contents[file].count(old) == count, (plan['label'], change)
                  contents[file] = contents[file].replace(old, new)
              for file, value in contents.items():
                  compile(value, file, 'exec')
              expected = {}
              for node, raw in plan['expected'].items():
                  assert node in ALL, node
                  if raw is None:
                      expected[node] = None
                      continue
                  data = probe_bytes.decode() if raw['file'] == PROBE else contents.get(raw['file'], originals[raw['file']].decode())
                  lines = data.splitlines()
                  line = raw.get('line')
                  if line is None:
                      matches = [index + 1 for index, value in enumerate(lines) if value.strip() == raw['statement']]
                      assert len(matches) == 1, (plan['label'], raw, matches)
                      line = matches[0]
                  assert lines[line - 1].strip() == raw['statement'], (plan['label'], raw)
                  expected[node] = {**raw, 'line': line}
              variant_hashes = {**hashes, **{file: sha(value.encode()) for file, value in contents.items()}, PROBE: sha(probe_bytes)}
              assert all(variant_hashes[file] == hashes[file] for file in TESTS)
              prepared.append({**plan, 'expected': expected, 'hashes': variant_hashes, 'contents': contents})
          save(artifacts / 'registry.json', [{key: value for key, value in item.items() if key != 'contents'} for item in prepared])
          assert any(item['hashes'][QSRC] != hashes[QSRC] for item in prepared), 'no real inequality contrast'
          calibrate_supervision(artifacts)
          records = []
          try:
              for item in prepared:
                  evidence = artifacts / item['label']
                  evidence.mkdir()
                  save(evidence / 'verdict.json', {'status': 'INVALID', 'reason': 'variant has not completed'})
                  root = Path(tempfile.mkdtemp(prefix=item['label'] + '-', dir=proof)) / 'source'
                  git(proof, 'clone', '--shared', '--no-checkout', str(seed), str(root))
                  git(root, '-c', 'core.hooksPath=/dev/null', 'checkout', '--detach', SOURCE)
                  assert git(root, 'rev-parse', 'HEAD').decode().strip() == SOURCE and snapshot(root, names) == hashes and not status(root)
                  process_state = {'safe_to_restore': True}
                  try:
                      for file, value in item['contents'].items():
                          (root / file).write_text(value)
                      (root / PROBE).write_bytes(probe_bytes)
                      assert snapshot(root, [*names, PROBE]) == item['hashes']
                      before = snapshot(root, names)
                      assert (before == hashes) is (not bool(item['edits'])), 'comparison failed to distinguish mutation'
                      save(evidence / 'comparison-before.json', {'hashes': before, 'equals_original': before == hashes})
                      (evidence / 'applied.diff').write_bytes(git(root, 'diff', '--binary', 'HEAD'))
                      expected_status = status(root)
                      (evidence / 'applied.status').write_bytes(expected_status)
                      expected_files = {change['file'] for change in item['edits']}
                      assert set(expected_status.decode().splitlines()) == {*(f' M {file}' for file in expected_files), f'?? {PROBE}'}, expected_status
                      save(evidence / 'expected.json', {key: value for key, value in item.items() if key != 'contents'})
                      env = {**os.environ, 'PYTHONPATH': os.pathsep.join((str(root / 'src'), str(root / 'tests'))), 'PYTEST_ADDOPTS': '', 'PYTEST_PLUGINS': '', 'PYTHONDONTWRITEBYTECODE': '1'}
                      args = ['uv', 'run', '--no-sync', 'python', str(Path(__file__).resolve()), str(evidence)]
                      save(evidence / 'invocation.json', {'args': args, 'cwd': str(root), 'pythonpath': env['PYTHONPATH'], 'bytecode_disabled': True})
                      (evidence / 'exit.txt').write_text('INVALID: process not returned\n')
                      result = supervised(args, root, env, evidence, process_state)
                      (evidence / 'exit.txt').write_text(str(result) + '\n')
                      assert snapshot(root, [*names, PROBE]) == item['hashes'] and status(root) == expected_status, 'tests changed source'
                      validate(evidence, item['expected'], result, root)
                  except BaseException as error:
                      save(evidence / 'verdict.json', {'status': 'INVALID', 'error': repr(error)})
                      raise
                  finally:
                      if not process_state['safe_to_restore']:
                          save(evidence / 'restoration-skipped.json', {'status': 'INVALID', 'reason': 'process group death unconfirmed'})
                          raise RuntimeError('INVALID: source preserved beneath possibly live processes')
                      try:
                          save(evidence / 'before-restore.json', snapshot(root, names))
                          (evidence / 'before-restore.status').write_bytes(status(root))
                          (evidence / 'before-restore.diff').write_bytes(git(root, 'diff', '--binary', 'HEAD'))
                      finally:
                          for file in (QSRC, WSRC):
                              (root / file).write_bytes(originals[file])
                          (root / PROBE).unlink(missing_ok=True)
                          save(evidence / 'restored-hashes.json', snapshot(root, names))
                          (evidence / 'restored.status').write_bytes(status(root))
                          (evidence / 'restored.diff').write_bytes(git(root, 'diff', '--binary', 'HEAD'))
                          assert snapshot(root, names) == hashes and not status(root), 'restoration failed'
                  record = {'label': item['label'], 'cases': len(item['expected']), 'expected_call_failures': sum(site is not None for site in item['expected'].values())}
                  records.append(record)
                  save(evidence / 'verdict.json', {'status': 'PASS', **record})
                  print(json.dumps(record), flush=True)
              assert len(records) == len(prepared) == 32
          finally:
              save(artifacts / 'completed.json', records)
              save(artifacts / 'seed-final-hashes.json', snapshot(seed, names))
              (artifacts / 'seed-final.status').write_bytes(status(seed))
              assert snapshot(seed, names) == hashes and not status(seed), 'pristine source changed'
          save(artifacts / 'verdict.json', {'status': 'PASS', 'records': records, 'scope': 'bounded Q1 queue/Web diagnostic only'})
          PY
          set +e
          uv run --no-sync python "$PROOF_ROOT/evidence/proof.py" > "$PROOF_ROOT/evidence/driver.stdout" 2> "$PROOF_ROOT/evidence/driver.stderr"
          proof_rc=$?
          printf '%s\n' "$proof_rc" > "$PROOF_ROOT/evidence/driver-exit.txt"
          cat "$PROOF_ROOT/evidence/driver.stdout" "$PROOF_ROOT/evidence/driver.stderr"
          exit "$proof_rc"
      - name: Upload raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-queue-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 14
