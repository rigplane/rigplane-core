name: Tests (full matrix)

on:
  schedule:
    # Mon/Wed/Fri 03:00 UTC (06:00 MSK)
    - cron: "0 3 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: Normal matrix or isolated Q1 diagnostic proof
        type: choice
        default: normal
        options: [normal, q1-proof]
  push:
    branches: [main]

concurrency:
  group: tests-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # On push: only when commit message contains [full-ci].
    # Preserve normal runs; the exact manual diagnostic mode has its own job.
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.mode == 'q1-proof' &&
      github.ref == 'refs/heads/codex/command-queue-proof') &&
      (github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[full-ci]'))
    # Self-hosted Mac mini build-tier runner. Python 3.11/3.12/3.13, uv,
    # Node 24, Rust, and the Tauri/audio system libs are pre-baked in the
    # image, so the matrix avoids ubuntu-latest pickup + apt install passes.
    # Operator doc: rigplane-tower/docs/development/mac-mini-self-hosted-runners.md.
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Pin uv to the matrix interpreter. Without this, `uv run` satisfies
      # requires-python=">=3.11" with the newest interpreter on the runner
      # (3.13), so every matrix job silently tested 3.13 (MOR-590).
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Architecture debt guards compare HEAD with the reachable PR base.
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras (not --extra dev --extra bridge, MOR-1978): `dev`
        # already installed its packages (pytest, ruff, mypy, pydantic,
        # jsonschema, ...) and `bridge` is `[]` (pyproject.toml, a no-op
        # alias) — but neither flag named `scope` (Pillow), `dsp` (scipy), or
        # `webrtc` (aiortc), the extras that gate 62 tests in tests/. Those
        # tests ran skipped in CI while still showing green. `uv sync
        # --all-extras` installs every extra declared in pyproject.toml's
        # [project.optional-dependencies], so those tests run instead of
        # skipping.
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: i18n catalog lint
        run: |
          cd frontend
          npm run i18n:check

      - name: Frontend type-check
        run: |
          cd frontend
          npm run check

      - name: Frontend tests
        run: |
          cd frontend
          npx vitest run

      - name: Build frontend
        run: |
          cd frontend
          npm run build
          rm -f ../src/rigplane/web/static
          mkdir -p ../src/rigplane/web/static
          cp -r dist/* ../src/rigplane/web/static/

      - name: Lint web boundary
        run: uv run ruff check src/rigplane/web

      - name: Type-check web boundary
        run: uv run mypy --strict src/rigplane/web

      - name: Lint architecture (import-linter)
        run: uv run lint-imports

      - name: Run tests
        id: tests
        run: |
          # Without pipefail the pipe's exit status is tee's (always 0), so
          # pytest failures were swallowed and the step reported success.
          # Capture pytest's exit code via PIPESTATUS, extract the summary
          # (still needed for the badge, including on failure), then exit
          # with pytest's code so failing tests fail the step.
          uv run pytest tests/ -n auto --tb=short --timeout=300 --timeout-method=thread \
            | tee pytest-output.txt
          rc=${PIPESTATUS[0]}
          SUMMARY=$(tail -1 pytest-output.txt)
          PASSED=$(echo "$SUMMARY" | grep -oP '\d+ passed' | grep -oP '\d+' || echo "0")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Extract version
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(uv run python -c "from importlib.metadata import version; print(version('rigplane'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update tests badge
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-tests.json
          label: tests
          message: "${{ steps.tests.outputs.passed }} passed"
          color: ${{ steps.tests.outcome == 'success' && 'brightgreen' || 'red' }}

      - name: Update version badge
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-version.json
          label: version
          message: "v${{ steps.version.outputs.version }}"
          color: blue

      - name: Update mypy badge
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-mypy.json
          label: mypy
          message: "0 errors"
          color: blue

  capture-harness:
    # MOR-1382 — wires the MOR-1070/1085/1087/1088 browser fixture-harness
    # capture (`frontend/fixtures/capture.mjs`) into CI. It ran in NO
    # workflow before this. Deliberately a single dedicated job, NOT a
    # matrix leg — the capture matrix is Python-version-independent (it
    # only exercises the built frontend in a real browser), so multiplying
    # it by matrix.python-version (3.11/3.12/3.13) would triple runner
    # minutes for zero additional coverage.
    #
    # BLOCKING since MOR-1386 (v3 gate promotion, session-9): this job used
    # to run `continue-on-error: true` for one cycle (MOR-1382); that cycle
    # is closed — quick-leg green on PR #2286 run 31127603844, full-leg
    # green on dispatched run 31137987620 (capture-harness green alongside
    # the 3.11/3.12/3.13 matrix) — so the owner flipped it to blocking here.
    # The browser/deps install step below fails loud on its own (no
    # `|| true` masking) so a chromium provisioning failure reads as
    # "Install deps + Playwright chromium" red, never as a fixtures
    # regression in the `Run fixture-harness capture` step.
    #
    # Same push guard as the `test` job above: on `push`, only runs when
    # the commit message contains `[full-ci]`; on `schedule`/
    # `workflow_dispatch`, runs except for the exact Q1 diagnostic mode/ref.
    # This keeps the job off every
    # ordinary push to `main`.
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.mode == 'q1-proof' &&
      github.ref == 'refs/heads/codex/command-queue-proof') &&
      (github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: [self-hosted, linux, build]
    # Budget: ~45s once the Playwright browser cache is warm (npm ci +
    # cached chromium + the capture matrix itself). 10 minutes is a
    # generous ceiling for a cold cache / first run on a new runner image,
    # not the expected steady-state duration.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Read the LOCKFILE-RESOLVED exact version, not package.json's range.
      # `devDependencies['@playwright/test']` is the string "^1.55.0", which
      # resolves to 1.58.2 today: keying the cache on the range would let a
      # lockfile-only Playwright bump hit the SAME key, restore the old
      # browser, re-download the new one, and then skip the save (an exact
      # key hit never re-saves) — permanently poisoning the cache it exists
      # to populate.
      - name: Resolve Playwright version
        id: pw
        run: |
          cd frontend
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # Playwright's own browser cache, keyed on the lockfile-resolved
      # @playwright/test version (frontend/package-lock.json) — this is what
      # "playwright install dominates" is about: a cache hit skips the
      # ~100-200MB chromium download entirely and turns this job's dominant
      # cost into the capture matrix run itself.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # Fails loud on its own: no `|| true` masking. A chromium download or
      # `npm ci` failure red-flags THIS step — reads as provisioning — and
      # never reaches the capture step below.
      - name: Install deps + Playwright chromium
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Install Playwright Chromium system dependencies
        working-directory: frontend
        run: sudo -E env "PATH=$PATH" npx playwright install-deps chromium

      # Blocking since MOR-1386 gate promotion — see the job header comment.
      # The browser and system-dependency steps above fail loud on their own,
      # so a red here means a fixture regression only.
      - name: Run fixture-harness capture
        id: capture
        run: node frontend/fixtures/capture.mjs

      # Always uploaded (not just on failure) — this is the MOR-1091
      # "links to CI artifacts" deliverable: the manifest + PNGs need to be
      # linkable from a passing run too, not only a failing one.
      - name: Upload capture output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-harness-capture
          path: frontend/fixtures-baselines/
          retention-days: 14

      - name: Annotate result
        if: always()
        run: '[ "${{ steps.capture.outcome }}" = "failure" ] && echo "::error::Fixture-harness capture FAILED — blocking since MOR-1386 gate promotion. See the fixture-harness-capture artifact." || true'

  command-queue-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'q1-proof' && github.ref == 'refs/heads/codex/command-queue-proof'
    permissions:
      contents: read
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.11.16'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          path: diagnostic
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: source
          ref: 75926544cb9ca0ffd25e5f6504306d5f9afdf1b3
          fetch-depth: 0
          persist-credentials: false
      - name: Establish isolated evidence and dependency paths
        run: |
          proof_temp=$(mktemp -d "$RUNNER_TEMP/command-queue-proof.XXXXXX")
          mkdir "$proof_temp/evidence"
          echo "PROOF_ROOT=$proof_temp" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$proof_temp/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$proof_temp/venv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$proof_temp/python" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          # Exact Mini environment observed in source full run 33750206379.
          version: '0.12.9'
      - name: Install immutable source dependencies without build hooks
        run: |
          printf '%s\n' 'uv python install 3.11.16' 'HATCH_BUILD_NO_HOOKS=1 uv sync --frozen --all-extras' > "$PROOF_ROOT/evidence/dependency-commands.txt"
          uv python install 3.11.16 2>&1 | tee "$PROOF_ROOT/evidence/python-setup.log"
          HATCH_BUILD_NO_HOOKS=1 uv sync --frozen --all-extras 2>&1 | tee "$PROOF_ROOT/evidence/dependencies.log"
      - name: Freeze supplemental probes
        run: |
          cat > "$PROOF_ROOT/evidence/test_q1_diagnostic_probes.py" <<'PY'
          import asyncio
          import gc
          import pytest
          from rigplane.runtime._poller_types import CommandQueue, CommandQueueEntry, PttOff, SetFreq, SetMode, SetSplit, execute_command_queue_entry
          from test_command_queue_execution import wait_for_event_or_exit
          from test_radio_poller_coverage import _web_queue_turn_poller, _seed_fresh_rx
          from test_radio_poller_tx_interlock import _observe_ptt

          async def callback_barrier():
              loop = asyncio.get_running_loop()
              settled = loop.create_future()
              loop.call_soon(lambda: loop.call_soon(settled.set_result, None))
              await settled

          def recording_factory(loop, previous, children):
              def factory(event_loop, coroutine, **kwargs):
                  child = previous(event_loop, coroutine, **kwargs) if previous else asyncio.Task(coroutine, loop=event_loop, **kwargs)
                  children.append(child)
                  return child
              loop.set_task_factory(factory)

          @pytest.mark.asyncio
          async def test_outer_no_child():
              loop = asyncio.get_running_loop()
              reply = loop.create_future()
              reply.cancel()
              children, calls = [], []
              previous = loop.get_task_factory()
              async def leaf(entry):
                  calls.append(entry)
              recording_factory(loop, previous, children)
              try:
                  await execute_command_queue_entry(CommandQueueEntry(SetFreq(1), reply), leaf)
                  assert not children and not calls, "outer check must create no child"
              finally:
                  loop.set_task_factory(previous)
                  await asyncio.gather(*children, return_exceptions=True)

          @pytest.mark.asyncio
          async def test_caller_cancel_closed_release():
              loop = asyncio.get_running_loop()
              reply = loop.create_future()
              entry = CommandQueueEntry(SetFreq(1), reply)
              started, release, terminal = asyncio.Event(), asyncio.Event(), asyncio.Event()
              children, received, cancelled = [], [], []
              previous = loop.get_task_factory()
              async def leaf(actual):
                  received.append(actual)
                  try:
                      started.set()
                      await release.wait()
                  except asyncio.CancelledError:
                      cancelled.append(True)
                      raise
                  finally:
                      terminal.set()
              owner = asyncio.create_task(execute_command_queue_entry(entry, leaf))
              recording_factory(loop, previous, children)
              try:
                  await wait_for_event_or_exit(started, owner)
                  loop.set_task_factory(previous)
                  actual = [child for child in children if child.get_coro().__qualname__.endswith('.invoke')]
                  assert len(actual) == 1 and received == [entry] and received[0] is entry
                  reply.cancel()
                  await callback_barrier()
                  assert actual[0].cancelling() == 0 and not cancelled and not terminal.is_set() and not owner.done(), "caller cancellation must leave the closed-gate operation alive"
                  release.set()
                  await owner
              finally:
                  loop.set_task_factory(previous)
                  release.set()
                  await asyncio.gather(owner, *children, return_exceptions=True)

          @pytest.mark.asyncio
          @pytest.mark.parametrize('kind', ['ordered', 'ptt-off', 'coalesced'])
          @pytest.mark.parametrize('operation', ['take', 'remove'])
          async def test_pending_operations(kind, operation):
              queue = CommandQueue()
              reply = asyncio.get_running_loop().create_future()
              if kind == 'coalesced':
                  queue.put(SetFreq(1))
                  queue.put(SetMode('USB'))
                  queue.put(SetFreq(2))
                  entry = queue._segments[0].dedup[SetFreq]
                  assert queue.pending_count == 2
              else:
                  entry = queue.put_ordered(PttOff() if kind == 'ptt-off' else SetFreq(2), future=reply)
                  assert queue._segments[0].ordered[0] is entry and queue.pending_count == 1
              assert queue._notify.is_set()
              try:
                  if operation == 'take':
                      assert queue.take_entry() is entry, "claim must preserve FIFO key order and identity"
                  else:
                      assert queue.remove_pending(entry)
                      assert not reply.done(), "explicit removal must not complete reply"
                  assert not queue.remove_pending(entry), "claimed or removed identity must be absent"
                  if kind == 'coalesced':
                      assert queue.pending_count == 1
                      assert queue.take_entry().command == SetMode('USB')
                  assert queue.pending_count == 0 and not queue.has_commands
                  assert not queue._notify.is_set(), "empty storage must clear notification"
              finally:
                  reply.cancel()

          @pytest.mark.asyncio
          async def test_prior_owner_cancel():
              async def owner():
                  current = asyncio.current_task()
                  current.cancel('prior cancellation')
                  try:
                      await asyncio.sleep(0)
                  except asyncio.CancelledError:
                      pass
                  assert current.cancelling() > 0
                  reply = asyncio.get_running_loop().create_future()
                  async def leaf(entry):
                      raise asyncio.CancelledError('independent child')
                  escaped = False
                  try:
                      await execute_command_queue_entry(CommandQueueEntry(SetFreq(1), reply), leaf)
                  except asyncio.CancelledError:
                      escaped = True
                  assert not escaped, "independent child cancellation did not escape"
                  assert reply.cancelled()
                  return 'subsequent owner work'
              assert await asyncio.create_task(owner()) == 'subsequent owner work'

          @pytest.mark.asyncio
          async def test_cleanup_error_observed():
              loop = asyncio.get_running_loop()
              previous = loop.get_exception_handler()
              records = []
              loop.set_exception_handler(lambda _loop, context: records.append((context.get('message'), str(context.get('exception')))))
              started, cleanup, release, terminal = (asyncio.Event() for _ in range(4))
              reply = loop.create_future()
              async def leaf(entry):
                  try:
                      started.set()
                      await asyncio.Event().wait()
                  finally:
                      cleanup.set()
                      await release.wait()
                      terminal.set()
                      raise ValueError('cleanup failure')
              task = None
              try:
                  sentinel = loop.create_future()
                  sentinel.set_exception(RuntimeError('Q1 sink calibration'))
                  del sentinel
                  gc.collect()
                  await callback_barrier()
                  assert records == [('Future exception was never retrieved', 'Q1 sink calibration')], "INVALID: exception sink calibration failed"
                  records.clear()
                  task = asyncio.create_task(execute_command_queue_entry(CommandQueueEntry(SetFreq(1), reply), leaf))
                  await wait_for_event_or_exit(started, task)
                  task.cancel('original owner')
                  await wait_for_event_or_exit(cleanup, task)
                  assert not task.done(), "cleanup must finish before owner returns"
                  release.set()
                  with pytest.raises(asyncio.CancelledError) as caught:
                      await task
                  assert caught.value.args == ('original owner',) and terminal.is_set() and reply.cancelled()
                  del caught
                  task = None
                  gc.collect()
                  await callback_barrier()
                  assert not records, "cleanup exception must be observed"
              finally:
                  release.set()
                  if task is not None:
                      task.cancel()
                      await asyncio.gather(task, return_exceptions=True)
                  loop.set_exception_handler(previous)
                  reply.cancel()

          @pytest.mark.asyncio
          @pytest.mark.parametrize('kind', ['cancelled', 'defer'])
          async def test_nonexecuted_claim_quota(kind, monkeypatch):
              queue = CommandQueue()
              poller, boundary = _web_queue_turn_poller(monkeypatch, queue)
              reply = asyncio.get_running_loop().create_future()
              if kind == 'defer':
                  store = poller._state_store
                  _observe_ptt(store, True, observed_at=store.snapshot().generated_at_monotonic)
                  queue.put_ordered(SetSplit(True), future=reply)
              else:
                  _seed_fresh_rx(poller)
                  queue.put_ordered(PttOff(), future=reply)
                  reply.cancel()
                  await callback_barrier()
              started, release = asyncio.Event(), asyncio.Event()
              seen = []
              async def leaf(command, **kwargs):
                  seen.append(command)
                  if command == SetFreq(1):
                      started.set()
                      await release.wait()
              monkeypatch.setattr(poller, '_execute', leaf)
              queue.put_ordered(SetFreq(1))
              assert queue.pending_count == 2
              task = asyncio.create_task(poller._run())
              try:
                  await wait_for_event_or_exit(started, task)
                  queue.put_ordered(SetFreq(2))
                  queue.put_ordered(SetFreq(3))
                  release.set()
                  await wait_for_event_or_exit(boundary, task)
                  assert seen == [SetFreq(1)], "nonexecuted claim must spend finite quota"
                  assert [entry.command for entry in queue.drain_entries()] == [SetFreq(2), SetFreq(3)], "arrivals must remain pending at query boundary"
              finally:
                  release.set()
                  task.cancel()
                  await asyncio.gather(task, return_exceptions=True)
                  reply.cancel()
          PY
      - name: Run frozen source fault and converse matrix
        run: |
          cat > "$PROOF_ROOT/evidence/proof.py" <<'PY'
          import hashlib
          import ctypes
          import importlib
          import importlib.metadata
          import json
          import os
          import signal
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import time
          from collections import Counter
          import xml.etree.ElementTree as ET
          import pytest

          SOURCE = '75926544cb9ca0ffd25e5f6504306d5f9afdf1b3'
          BASE = 'e2ef93420cf4359f08781754db65ca08bd2288d3'
          FINAL = '1e5a5fc0566caf0dc963ef17042ef5976869d25c'
          QSRC = 'src/rigplane/runtime/_poller_types.py'
          WSRC = 'src/rigplane/web/radio_poller.py'
          QFILE = 'tests/test_command_queue_execution.py'
          WFILE = 'tests/test_radio_poller_coverage.py'
          HFILE = 'tests/test_web_command_batch_http.py'
          IFILE = 'tests/test_radio_poller_tx_interlock.py'
          SFILE = 'tests/test_web_server_coverage.py'
          PROBE = 'tests/test_q1_diagnostic_probes.py'
          TESTS = (QFILE, WFILE, HFILE, IFILE, SFILE)
          Q, W, P = QFILE + '::', WFILE + '::', PROBE + '::'
          FROZEN = [Q + name for name in '''
          test_ordered_handle_is_frozen_stored_identity
          test_single_claim_preserves_segments_ptt_priority_and_replacement
          test_remove_pending_uses_identity_and_cancel_callback_claim_boundary
          test_kernel_drainer_cancel_before_child_handoff_terminalizes_reply
          '''.split()]
          FROZEN += [Q + f'test_non_cancelled_terminal_reply_does_not_remove_pending_entry[{outcome}]' for outcome in ('result', 'error')]
          TERMINAL = 'test_kernel_terminal_identity_and_hooks_before_reply'
          FROZEN += [Q + f'{TERMINAL}[{reply}-{outcome}]' for reply in ('pending', 'none', 'result', 'error') for outcome in ('result', 'error', 'cancel')]
          FROZEN += [Q + f'test_kernel_checks_cancelled_reply_before_leaf[{when}]' for when in ('outer', 'child')]
          FROZEN += [Q + f'test_kernel_caller_cancel_does_not_end_active_leaf[{reply}]' for reply in ('reply', 'coalesced')]
          REPEATED = 'test_kernel_repeated_drainer_cancel_joins_terminal_cleanup'
          FROZEN += [Q + f'{REPEATED}[{reply}-{outcome}]' for reply in ('reply', 'coalesced') for outcome in ('cancel', 'return', 'error')]
          UNKEY = 'test_cancelled_ordered_reply_keeps_only_legacy_unkey'
          FROZEN += [Q + f'{UNKEY}[{kind}]' for kind in ('ordinary', 'ptt-on', 'ptt-off')]
          LIVE = 'test_web_loop_claims_live_pending_finite_turn'
          FROZEN += [W + f'{LIVE}[{mode}]' for mode in ('cancel', 'replace', 'error')]
          FROZEN += [W + name for name in '''
          test_web_loop_releases_held_entry_after_finite_current_turn
          test_shutdown_drain_executes_cancelled_unkey_after_callback_turn
          test_command_queue_wait_and_drain_behavior
          test_command_queue_ordered_lane_preserves_repeated_commands
