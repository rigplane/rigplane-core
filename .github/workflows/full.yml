name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-tx-predecessor-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predecessor-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ptt-predecessor-red-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: 99794da97322f345cbef956e60a128945332019e
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 99794da97322f345cbef956e60a128945332019e
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-predecessor-red.XXXXXX")
          pycache_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-predecessor-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-predecessor-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-predecessor-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install mock-test dependencies and package metadata
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Predecessor completion RED and structural JUnit oracle
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONPYCACHEPREFIX", "PYTHONDONTWRITEBYTECODE",
              "UV_CACHE_DIR", "UV_PROJECT_ENVIRONMENT",
          )}
          metadata["python"] = sys.version
          metadata["scope"] = "Failed/cancelled readiness predecessor RED; no consumer, provider, or RF proof."
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          module = "test_managed_tx_ingress_admission"
          test_file = f"tests/{module}.py"
          expected = {
              (f"tests.{module}", "test_failed_predecessor_completion_allows_independent_on[cancel]"): {
                  "line": 214,
                  "statement": "assert not worker.cancelled()",
                  "message_prefix": "assert not True",
              },
              (f"tests.{module}", "test_failed_predecessor_completion_allows_independent_on[error]"): {
                  "line": 215,
                  "statement": "assert worker.exception() is None",
                  "message_prefix": "assert RuntimeError",
              },
              (f"tests.{module}", "test_on_cancel_does_not_cancel_readiness_predecessor"): None,
              (f"tests.{module}", "test_scoped_up_membership_blocks_on_when_cancel_handle_does_nothing"): None,
          }
          assert len(expected) == 4
          source_lines = Path(test_file).read_text().splitlines()
          for row in expected.values():
              if row is not None:
                  assert source_lines[row["line"] - 1].strip() == row["statement"]
          selected = [f"{test_file}::{name}" for _classname, name in expected]
          (artifacts / "expected-cases.json").write_text(json.dumps([
              {"classname": key[0], "name": key[1], **({} if row is None else row)}
              for key, row in expected.items()
          ], indent=2))
          (artifacts / "selected-nodeids.txt").write_text("\n".join(selected) + "\n")
          command = [
              sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
              "-o", f"cache_dir={artifacts / 'pytest-cache'}",
              "--tb=long", "--color=no", "--timeout=20", "--timeout-method=thread",
              f"--junitxml={artifacts / 'junit.xml'}", *selected,
          ]
          (artifacts / "command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=180)
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          finally:
              print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 1, f"Expected pytest CALL failures, got exit {result.returncode}"

          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          assert len(actual) == len(set(actual)) == 4, actual
          assert set(actual) == set(expected), {"missing": sorted(set(expected) - set(actual)), "unexpected": sorted(set(actual) - set(expected))}
          assert not report.findall(".//error"), "JUnit setup/teardown errors are not expected RED"
          assert not report.findall(".//skipped"), "Skipped cases are not evidence"
          failures = 0
          for case in cases:
              key = (case.get("classname"), case.get("name"))
              row = expected[key]
              entries = case.findall("failure")
              if row is None:
                  assert not entries, (key, "passing control failed")
                  continue
              assert len(entries) == 1, (key, "expected exactly one CALL failure")
              failure = entries[0]
              message = failure.get("message", "")
              assert message.startswith(row["message_prefix"]), (key, message)
              if row["line"] == 215:
                  assert message.endswith(" is None"), (key, message)
              trace = failure.text or ""
              assert re.search(r"(?m)^>\s+" + re.escape(row["statement"]) + r"[ \t]*$", trace), (key, "wrong failing statement", trace)
              frame = f"{test_file}:{row['line']}: AssertionError"
              assert re.search(r"(?m)^" + re.escape(frame) + r"[ \t]*$", trace), (key, "missing intended failure frame", trace)
              failures += 1
          assert failures == 2 and len(cases) - failures == 2
          (artifacts / "oracle.txt").write_text(
              "PASS: exact 2 intended predecessor-completion AssertionErrors and 2 controls; zero errors/skips.\n"
              "Readiness completion only; no timeout is used as behavioral proof.\n"
          )
          print((artifacts / "oracle.txt").read_text(), end="")
          PY

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: managed-tx-predecessor-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
