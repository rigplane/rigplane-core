name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigctld-format-diff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatter-diff:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rigctld-format-diff'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    env:
      SOURCE_PIN: 01c521ed85a193f54f09ccc4271710a32d27d864
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 01c521ed85a193f54f09ccc4271710a32d27d864
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated formatter evidence
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-format-evidence.XXXXXX")
          uv_cache_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-format-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-format-venv.XXXXXX")
          pycache_dir=$(mktemp -d "${RUNNER_TEMP}/rigctld-format-pycache.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          printf '%s\n' "source=$SOURCE_PIN" "workflow=$GITHUB_SHA" "ref=$GITHUB_REF" \
            "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "runner=$RUNNER_NAME" \
            > "$artifact_dir/metadata.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install frozen formatter dependencies without building the project
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev --no-install-project \
            > "$ARTIFACT_DIR/install.stdout.log" 2> "$ARTIFACT_DIR/install.stderr.log"

      - name: Capture and validate the two-file formatter diff
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-pre-format.txt"
          test ! -s "$ARTIFACT_DIR/status-pre-format.txt"
          printf '%s\n' \
            'uv run --no-sync ruff format --diff src/rigplane/runtime/managed_tx_effect_lane.py tests/test_rigctld_client_backend.py' \
            > "$ARTIFACT_DIR/command.txt"
          set +e
          uv run --no-sync ruff format --diff \
            src/rigplane/runtime/managed_tx_effect_lane.py tests/test_rigctld_client_backend.py \
            > "$ARTIFACT_DIR/format.patch" 2> "$ARTIFACT_DIR/formatter.stderr.log"
          formatter_rc=$?
          set -e
          printf '%s\n' "$formatter_rc" > "$ARTIFACT_DIR/formatter-exit.txt"
          test "$formatter_rc" -eq 1
          test -s "$ARTIFACT_DIR/format.patch"
          printf '%s\n' 'src/rigplane/runtime/managed_tx_effect_lane.py' \
            'tests/test_rigctld_client_backend.py' > "$ARTIFACT_DIR/expected-files.txt"
          sed -n 's/^--- //p' "$ARTIFACT_DIR/format.patch" | sort > "$ARTIFACT_DIR/old-files.txt"
          sed -n 's/^+++ //p' "$ARTIFACT_DIR/format.patch" | sort > "$ARTIFACT_DIR/new-files.txt"
          diff -u "$ARTIFACT_DIR/expected-files.txt" "$ARTIFACT_DIR/old-files.txt"
          diff -u "$ARTIFACT_DIR/expected-files.txt" "$ARTIFACT_DIR/new-files.txt"

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff HEAD > "$ARTIFACT_DIR/source-after.diff"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload formatter diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: rigctld-format-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
