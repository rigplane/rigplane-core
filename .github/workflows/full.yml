name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-rigctld-ingress-red-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-ingress-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ptt-managed-ingress-red-v2'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: 31db5f682f31791f69f7ac1e600166f0d06520e3
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 31db5f682f31791f69f7ac1e600166f0d06520e3
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/managed-rigctld-ingress-red-v2.XXXXXX")
          pycache_dir=$(mktemp -d "$RUNNER_TEMP/managed-rigctld-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "$RUNNER_TEMP/managed-rigctld-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "$RUNNER_TEMP/managed-rigctld-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$artifact_dir/ruff-cache" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          printf '%s\n' "SOURCE_PIN=$SOURCE_PIN" "DIAG_SHA=$GITHUB_SHA" "REF=$GITHUB_REF" "RUN_ID=$GITHUB_RUN_ID" "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" > "$artifact_dir/run-metadata.txt"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head-before.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"
          git archive --format=tar "$SOURCE_PIN" -- src/rigplane/rigctld/server.py src/rigplane/rigctld/handler.py tests/test_rigctld_ingress_scheduling.py tests/test_rigctld_managed_ingress_scheduling.py > "$artifact_dir/source-files.tar"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install focused test dependencies
        id: install
        run: |
          printf '%s\n' 'uv python install 3.11' 'uv sync --frozen --extra dev' > "$ARTIFACT_DIR/dependency-commands.txt"
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Focused ingress pytest and exact CALL-failure oracle
        id: oracle
        run: |
          set +e
          uv run --no-sync python - > "$ARTIFACT_DIR/oracle.log" 2>&1 <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          (artifacts / "oracle.txt").write_text("NOT CONFIRMED: oracle has not completed.\n")
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONPYCACHEPREFIX", "PYTHONDONTWRITEBYTECODE",
              "UV_CACHE_DIR", "UV_PROJECT_ENVIRONMENT", "RUFF_CACHE_DIR",
          )}
          metadata["python"] = sys.version
          metadata["scope"] = (
              "Real socket/parser/handler/service ingress with three unmanaged compatibility "
              "controls and a real external-provider managed fixture. Active-owner RED "
              "stops at frequency entry, not OFF latency. Idle cleanup isolation is "
              "test-only, not a production cancellation fix, whole queue-join, or RF proof."
          )
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          raw = "test_rigctld_ingress_scheduling"
          managed = "test_rigctld_managed_ingress_scheduling"
          expected = {
              (raw, "test_frequency_provider_failure_is_not_an_enqueue_ack"): None,
              (raw, "test_sequential_frequency_then_off_preserves_call_and_reply_order"): None,
              (raw, "test_pipelined_on_does_not_overtake_held_frequency"): None,
              (managed, "test_partial_managed_configuration_is_rejected_before_bootstrap[present0]"): None,
              (managed, "test_partial_managed_configuration_is_rejected_before_bootstrap[present1]"): None,
              (managed, "test_partial_managed_configuration_is_rejected_before_bootstrap[present2]"): None,
              (managed, "test_partial_managed_configuration_is_rejected_before_bootstrap[present3]"): None,
              (managed, "test_partial_managed_configuration_is_rejected_before_bootstrap[present4]"): None,
              (managed, "test_partial_managed_configuration_is_rejected_before_bootstrap[present5]"): None,
              (managed, "test_managed_configuration_rejects_custom_handler"): None,
              (managed, "test_injected_references_and_per_call_leaf_preserve_shared_default"): None,
              (managed, "test_real_authority_fixture_uses_provider_ptt"): None,
              (managed, "test_active_owner_off_provider_error_retains_release_debt"): None,
              (managed, "test_active_owner_off_settles_while_frequency_is_pending[accepted]"): 375,
              (managed, "test_active_owner_off_settles_while_frequency_is_pending[uncertain]"): 375,
              (managed, "test_real_provider_poller_drains_injected_queue"): None,
              (managed, "test_frequency_provider_rejection_preserves_terminal_error"): None,
              (managed, "test_pending_on_is_revoked_by_pipelined_off[frequency-success]"): 447,
              (managed, "test_pending_on_is_revoked_by_pipelined_off[frequency-provider-error]"): 447,
              (managed, "test_disconnect_revokes_pending_on[eof]"): 470,
              (managed, "test_disconnect_revokes_pending_on[server-stop]"): 470,
              (managed, "test_sequential_frequency_then_ptt_preserves_wire_order"): None,
          }
          assert len(expected) == 22
          assert sum(line is not None for line in expected.values()) == 6
          checkpoints = {
              (managed, 375): ("await asyncio.wait_for(rig.radio.frequency_entered.wait(), 2)",),
              (managed, 447): ("await asyncio.wait_for(rig.fence.registered.wait(), 2)",),
              (managed, 470): ("await asyncio.wait_for(rig.fence.registered.wait(), 2)",),
          }
          for (module, line), statements in checkpoints.items():
              source_lines = Path(f"tests/{module}.py").read_text().splitlines()
              assert tuple(value.strip() for value in source_lines[line - 1:line - 1 + len(statements)]) == statements
          manifest = [
              {
                  "nodeid": f"tests/{module}.py::{name}",
                  "classname": f"tests.{module}",
                  "name": name,
                  "expected": "CALL TimeoutError" if line is not None else "PASS",
                  "file": f"tests/{module}.py" if line is not None else None,
                  "line": line,
                  "statements": checkpoints.get((module, line)),
              }
              for (module, name), line in expected.items()
          ]
          (artifacts / "expected-cases.json").write_text(json.dumps(manifest, indent=2))
          (artifacts / "expected-nodeids.txt").write_text(
              "\n".join(case["nodeid"] for case in manifest) + "\n"
          )
          command = [
              sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
              "-o", f"cache_dir={artifacts / 'pytest-cache'}",
              "--tb=long", "--color=no", "--timeout=30", "--timeout-method=thread",
              f"--junitxml={artifacts / 'junit.xml'}",
              f"tests/{raw}.py", f"tests/{managed}.py",
          ]
          (artifacts / "command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(
                      command, stdout=log, stderr=subprocess.STDOUT, timeout=180
                  )
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          finally:
              print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 1, f"Expected CALL failures, got pytest exit {result.returncode}"

          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          identities = {(f"tests.{module}", name) for module, name in expected}
          assert len(actual) == len(set(actual)) == 22, actual
          assert set(actual) == identities, {
              "missing": sorted(identities - set(actual)),
              "unexpected": sorted(set(actual) - identities),
          }
          assert not report.findall(".//error"), "Setup/teardown/collection errors are not intended RED"
          assert not report.findall(".//skipped"), "Skipped or xfailed cases are not evidence"
          assert len(report.findall(".//failure")) == 6
          failures = 0
          for case in cases:
              classname, name = case.get("classname"), case.get("name")
              module = classname.removeprefix("tests.")
              line = expected[(module, name)]
              entries = case.findall("failure")
              if line is None:
                  assert not entries, (classname, name, "passing control failed")
                  continue
              assert len(entries) == 1, (classname, name, "expected one CALL failure")
              failure = entries[0]
              assert failure.get("message", "").strip() in {"TimeoutError", "TimeoutError:"}, (
                  classname, name, failure.attrib
              )
              trace = failure.text or ""
              statements = checkpoints[(module, line)]
              statement_pattern = r"(?m)^>[ \t]+" + re.escape(statements[0]) + r"[ \t]*$"
              for statement in statements[1:]:
                  statement_pattern += r"\n[ \t]+" + re.escape(statement) + r"[ \t]*$"
              assert re.search(statement_pattern, trace), (classname, name, "wrong failing await", trace)
              frame_pattern = r"(?m)^" + re.escape(f"tests/{module}.py:{line}:")
              assert re.search(frame_pattern, trace), (classname, name, "wrong source frame", trace)
              terminal_errors = re.findall(r"(?m)^E[ \t]+(\S[^\n]*)$", trace)
              assert terminal_errors and terminal_errors[-1].strip() in {"TimeoutError", "TimeoutError:"}, (
                  classname, name, "wrong terminal exception", trace
              )
              failures += 1
          assert failures == 6 and len(cases) - failures == 16
          (artifacts / "oracle.txt").write_text(
              "ORACLE PASS: exact 6 intended CALL TimeoutErrors and 16 passing controls; zero errors/skips/duplicates.\n"
              "Active-owner RED proves the frequency-entry precondition only, not OFF latency. Idle cleanup isolation does not prove production cancellation or whole queue-join. Overall harness also requires Ruff and unchanged source.\n"
          )
          print((artifacts / "oracle.txt").read_text(), end="")
          PY
          oracle_rc=$?
          printf '%s\n' "$oracle_rc" > "$ARTIFACT_DIR/oracle-exit.txt"
          cat "$ARTIFACT_DIR/oracle.log"
          exit "$oracle_rc"

      - name: Ruff changed consumer files without mutation
        if: always() && steps.install.outcome == 'success'
        run: |
          files=(src/rigplane/rigctld/server.py src/rigplane/rigctld/handler.py tests/test_rigctld_ingress_scheduling.py tests/test_rigctld_managed_ingress_scheduling.py)
          printf '%s\n' "uv run --no-sync ruff check ${files[*]}" > "$ARTIFACT_DIR/ruff-check-command.txt"
          printf '%s\n' "uv run --no-sync ruff format --check ${files[*]}" > "$ARTIFACT_DIR/ruff-format-command.txt"
          printf '%s\n' "uv run --no-sync ruff format --diff ${files[*]}" > "$ARTIFACT_DIR/ruff-format-diff-command.txt"
          set +e
          uv run --no-sync ruff check "${files[@]}" > "$ARTIFACT_DIR/ruff-check.log" 2>&1
          check_rc=$?
          uv run --no-sync ruff format --check "${files[@]}" > "$ARTIFACT_DIR/ruff-format.log" 2>&1
          format_rc=$?
          uv run --no-sync ruff format --diff "${files[@]}" > "$ARTIFACT_DIR/ruff-format-diff.log" 2>&1
          diff_rc=$?
          printf '%s\n' "$check_rc" > "$ARTIFACT_DIR/ruff-check-exit.txt"
          printf '%s\n' "$format_rc" > "$ARTIFACT_DIR/ruff-format-exit.txt"
          printf '%s\n' "$diff_rc" > "$ARTIFACT_DIR/ruff-format-diff-exit.txt"
          cat "$ARTIFACT_DIR/ruff-check.log" "$ARTIFACT_DIR/ruff-format.log" "$ARTIFACT_DIR/ruff-format-diff.log"
          set -e
          test "$check_rc" -eq 0
          test "$format_rc" -eq 0
          test "$diff_rc" -eq 0

      - name: Record and require unchanged source
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git rev-parse HEAD > "$ARTIFACT_DIR/source-head-after.txt"
          git diff --stat HEAD > "$ARTIFACT_DIR/source-diff-stat.txt"
          git diff --binary HEAD > "$ARTIFACT_DIR/source-diff.patch"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: managed-rigctld-ingress-red-v2-31db5f68-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
