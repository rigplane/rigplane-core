name: Canonical level formatter diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter:
    runs-on: [self-hosted, linux, build]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1dff092f81df6e12268e40dca833dec921969b77

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Capture formatter diff
        run: |
          checked_head=$(git rev-parse HEAD)
          echo "checked_head=$checked_head"
          if [ "$checked_head" != "1dff092f81df6e12268e40dca833dec921969b77" ]; then
            echo "unexpected checkout: $checked_head" >&2
            exit 1
          fi
          uv run ruff --version
          set +e
          uv run ruff format --diff tests/test_canonical_receiver_levels.py > formatter.patch
          rc=$?
          set -e
          echo "ruff_exit=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "unexpected Ruff exit: $rc" >&2
            exit "$rc"
          fi
          if [ ! -s formatter.patch ]; then
            echo "formatter.patch is empty" >&2
            exit 1
          fi
          git diff --exit-code
          status=$(git status --porcelain)
          if [ "$status" != "?? formatter.patch" ]; then
            echo "unexpected checkout status: $status" >&2
            exit 1
          fi

      - name: Upload formatter patch
        uses: actions/upload-artifact@v7
        with:
          name: canonical-level-format-1dff092f
          path: formatter.patch
