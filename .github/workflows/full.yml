name: Managed TX mutation proof

on:
  workflow_dispatch:
    inputs:
      pytest_nodes:
        description: Exact whitespace-separated pytest node IDs
        required: true
        type: string

jobs:
  mutation-proof:
    runs-on: [self-hosted, linux, ARM64, build]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Accept only the designated Mini runners
        run: |
          case "$RUNNER_NAME" in
            mm-build-core-1|mm-build-core-2) ;;
            *) echo "Refusing unexpected runner: $RUNNER_NAME"; exit 97 ;;
          esac

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install focused-test dependencies
        run: uv sync --extra dev

      - name: Run exact mutation proof
        id: proof
        continue-on-error: true
        env:
          PYTEST_NODES: ${{ inputs.pytest_nodes }}
        run: |
          set +e
          read -r -a nodes <<< "$PYTEST_NODES"
          command_text="uv run pytest -q --tb=short --timeout=30 --timeout-method=thread ${PYTEST_NODES}"
          uv run pytest -q --tb=short --timeout=30 --timeout-method=thread "${nodes[@]}" > mutation-output.txt 2>&1
          rc=$?
          {
            echo "command=$command_text"
            echo "exit_code=$rc"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo
            cat mutation-output.txt
          } > mutation-proof.txt
          cat mutation-proof.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload immutable proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutation-proof.txt

      - name: Preserve pytest result as job result
        if: always()
        env:
          PROOF_EXIT_CODE: ${{ steps.proof.outputs.exit_code }}
        run: |
          test "$PROOF_EXIT_CODE" = "0"
