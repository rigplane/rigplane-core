name: Full validation

# MEASUREMENT BRANCH ONLY (MOR-4930, adviser 2026-11-27 19:38 EST).
# Loops the quick-python-tests shard 1 (the shard where
# test_tx_under_fault_matrix[ws-reboot-hold] failed in run 46077060678) on the
# same runner class and Python as CI, at v3.4.0rc1 and at v3.3.1, with the
# ptt_reboot_probe plugin: the reboot PTT-off budget raised to 90 s and one JSON
# line per reboot row (elapsed to PTT off, simulator PTT transitions, Core's
# session-loss / reconnect / release-attempt warnings with timestamps).

on:
  workflow_dispatch:
    inputs:
      runs:
        description: loop count per ref
        default: "20"

concurrency:
  group: measure-mor4930-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ptt-reboot-loop:
    runs-on: [self-hosted, Linux, build]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        ref: [v3.4.0rc1, v3.3.1]
    env:
      UV_PYTHON: "3.11"
      DBUS_SESSION_BUS_ADDRESS: 'disabled:'
      FC_FONTATIONS: '1'
      VK_ICD_FILENAMES: ''
    steps:
      - uses: actions/checkout@v6
        with:
          path: meas
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: core
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            core/pyproject.toml
            core/uv.lock
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        working-directory: core
        run: uv sync --all-extras
      - name: Loop shard 1 with the probe
        working-directory: core
        env:
          PYTHONPATH: ${{ github.workspace }}/core/.github/scripts:${{ github.workspace }}/meas
          PTTPROBE_OUT: ${{ runner.temp }}/pttprobe-${{ matrix.ref }}.jsonl
          RUNS: ${{ inputs.runs }}
        run: |
          set -u
          : > "$PTTPROBE_OUT"
          shards=$(grep -m1 -oE 'QUICK_PYTHON_SHARDS: *"?[0-9]+' .github/workflows/quick.yml | grep -oE '[0-9]+$' || echo 4)
          echo "ref ${{ matrix.ref }} head $(git rev-parse HEAD) shards $shards arch $(uname -m) nproc $(nproc)"
          for i in $(seq 1 "$RUNS"); do
            before=$(wc -l < "$PTTPROBE_OUT" 2>/dev/null || echo 0)
            uv run pytest tests/ -p pytest_shard --shard "1/$shards" -p ptt_reboot_probe \
              -n auto --maxprocesses 4 --tb=line -q --timeout=300 --timeout-method=thread \
              -p no:cacheprovider > out.txt 2>&1
            after=$(wc -l < "$PTTPROBE_OUT" 2>/dev/null || echo 0)
            echo "run $i: $(tail -1 out.txt) | probe rows $((after - before)) | load $(cut -d' ' -f1-3 /proc/loadavg)"
            grep -E "^FAILED|stayed" out.txt | head -5 || true
          done
          echo "== summary"
          grep -o '"waits": \[[^]]*\]' "$PTTPROBE_OUT" | sort | uniq -c | sort -rn | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pttprobe-${{ matrix.ref }}
          path: ${{ runner.temp }}/pttprobe-${{ matrix.ref }}.jsonl
          if-no-files-found: warn
