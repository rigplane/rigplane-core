name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigctld-socket-ingress-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  socket-ingress-red:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ptt-ingress-red-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: 72d2d8b44653925046fccee6588a3b53f2080b64
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 72d2d8b44653925046fccee6588a3b53f2080b64
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/rigctld-socket-red.XXXXXX")
          pycache_dir=$(mktemp -d "$RUNNER_TEMP/rigctld-socket-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "$RUNNER_TEMP/rigctld-socket-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "$RUNNER_TEMP/rigctld-socket-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install mock-test dependencies and package metadata
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Selected socket ingress RED and structural JUnit oracle
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONPYCACHEPREFIX", "PYTHONDONTWRITEBYTECODE",
              "UV_CACHE_DIR", "UV_PROJECT_ENVIRONMENT",
          )}
          metadata["python"] = sys.version
          metadata["scope"] = (
              "Unmanaged actual socket/parser/handler/CommandService ingress only; "
              "not managed-runtime, fence, provider-priority, or RF proof"
          )
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          module = "test_rigctld_ingress_scheduling"
          test_file = f"tests/{module}.py"
          function = "test_pipelined_off_reaches_provider_before_held_frequency_finishes"
          expected = {
              (f"tests.{module}", f"{function}[frequency-success]"): "TimeoutError",
              (f"tests.{module}", f"{function}[frequency-provider-error]"): "TimeoutError",
              (f"tests.{module}", "test_frequency_provider_failure_is_not_an_enqueue_ack"): None,
              (f"tests.{module}", "test_sequential_frequency_then_off_preserves_call_and_reply_order"): None,
              (f"tests.{module}", "test_pipelined_on_does_not_overtake_held_frequency"): None,
          }
          selected = [f"{test_file}::{name}" for _, name in expected]
          assert len(selected) == len(expected) == 5
          assert sum(message is not None for message in expected.values()) == 2

          expected_line = 113
          source_lines = Path(test_file).read_text().splitlines()
          assert source_lines[expected_line - 1].strip() == "await asyncio.wait_for("
          assert source_lines[expected_line].strip() == "radio.ptt_off_written.wait(), timeout=_WAIT_TIMEOUT"
          (artifacts / "expected-cases.json").write_text(json.dumps([
              {
                  "classname": key[0], "name": key[1], "failure_message": value,
                  "call_failure_file": test_file if value else None,
                  "call_failure_line": expected_line if value else None,
              }
              for key, value in expected.items()
          ], indent=2))
          (artifacts / "selected-nodeids.txt").write_text("\n".join(selected) + "\n")

          command = [
              sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
              "-o", f"cache_dir={artifacts / 'pytest-cache'}",
              "--tb=long", "--color=no", "--timeout=20", "--timeout-method=thread",
              f"--junitxml={artifacts / 'junit.xml'}", *selected,
          ]
          (artifacts / "command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(
                      command, stdout=log, stderr=subprocess.STDOUT, timeout=120
                  )
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          finally:
              print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 1, f"Expected pytest CALL failures, got exit {result.returncode}"

          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          assert len(actual) == len(set(actual)) == 5, actual
          assert set(actual) == set(expected), {
              "missing": sorted(set(expected) - set(actual)),
              "unexpected": sorted(set(actual) - set(expected)),
          }
          assert not report.findall(".//error"), "JUnit setup/teardown errors are not expected RED"
          assert not report.findall(".//skipped"), "Skipped cases are not evidence"
          intended_statement = re.compile(
              r"(?m)^>\s+await asyncio\.wait_for\(\n"
              r"[ \t]+radio\.ptt_off_written\.wait\(\), timeout=_WAIT_TIMEOUT\n"
              r"[ \t]+\)\n(?:[ \t]*\n)*"
              + re.escape(test_file) + rf":{expected_line}:"
          )
          source_frame = re.compile(
              r"(?m)^" + re.escape(test_file) + r":(\d+):"
          )
          failures = 0
          for case in cases:
              key = (case.get("classname"), case.get("name"))
              message = expected[key]
              entries = case.findall("failure")
              if message is None:
                  assert not entries, (key, "passing control failed")
                  continue
              assert len(entries) == 1, (key, "expected exactly one CALL failure")
              failure = entries[0]
              assert failure.get("message", "") == message, (key, failure.attrib)
              trace = failure.text or ""
              assert intended_statement.search(trace), (key, "wrong failing statement", trace)
              assert source_frame.findall(trace) == [str(expected_line)], (
                  key, "unexpected test/setup/cleanup frame", trace
              )
              assert re.search(r"(?m)^E\s+TimeoutError\s*$", trace), (
                  key, "missing terminal TimeoutError", trace
              )
              failures += 1
          assert failures == 2 and len(cases) - failures == 3
          (artifacts / "oracle.txt").write_text(
              "PASS: exact 2 intended socket-ingress CALL timeouts and 3 controls; zero errors/skips.\n"
              "Unmanaged socket/parser/handler/CommandService only; not managed/fence/provider-priority/RF proof.\n"
          )
          print((artifacts / "oracle.txt").read_text(), end="")
          PY

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: rigctld-socket-ingress-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
