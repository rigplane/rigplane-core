name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-tx-admission-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission-green:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ptt-admission-green-proof'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    env:
      SOURCE_PIN: d6ed456348ccaae8f1817181beef0fbe89fab33f
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d6ed456348ccaae8f1817181beef0fbe89fab33f
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated evidence and caches
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-green.XXXXXX")
          pycache_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-pycache.XXXXXX")
          uv_cache_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-uvcache.XXXXXX")
          venv_dir=$(mktemp -d "$RUNNER_TEMP/managed-tx-admission-venv.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$pycache_dir" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$venv_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          git rev-parse HEAD > "$artifact_dir/source-head.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install mock-test dependencies and package metadata
        run: |
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Runtime admission GREEN and structural JUnit oracle
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          assert sys.version_info[:2] == (3, 11), sys.version
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["SOURCE_PIN"]
          metadata = {key: os.environ.get(key) for key in (
              "SOURCE_PIN", "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "PYTHONPYCACHEPREFIX", "PYTHONDONTWRITEBYTECODE",
              "UV_CACHE_DIR", "UV_PROJECT_ENVIRONMENT",
          )}
          metadata["python"] = sys.version
          metadata["scope"] = "Managed TX admission/fence/authority/effect-lane GREEN; no consumer, provider, or RF proof."
          (artifacts / "metadata.json").write_text(json.dumps(metadata, indent=2))

          admission = "test_managed_tx_ingress_admission"
          fence = "test_managed_tx_fence"
          required = {
              (f"tests.{admission}", name)
              for name in (
                  "test_prestart_on_cancel_removes_registration_without_dispatch",
                  "test_scoped_up_revokes_old_down_before_contended_lock_not_new_down",
                  "test_off_cancel_before_execute_entry_drains_despite_repeated_cancel",
                  "test_on_cancel_does_not_cancel_readiness_predecessor",
                  "test_pending_only_disconnect_revokes_owner_while_rx_clean",
                  "test_provider_replacement_while_rx_clean_prevents_old_pending_on",
                  "test_scoped_up_membership_blocks_on_when_cancel_handle_does_nothing",
                  "test_cancel_after_on_admission_settles_without_implicit_up",
                  "test_idempotent_admission_returns_no_fabricated_settlement",
                  "test_public_owner_idempotency_and_tot_are_unchanged",
                  "test_public_owner_up_settles_release",
                  "test_non_builtin_owner_is_rejected_without_equality_or_registration",
              )
          }
          required.update({
              (f"tests.{admission}", f"test_failed_predecessor_prevents_on_and_removes_registration[{suffix}]")
              for suffix in ("cancel", "error")
          })
          required.update({
              (f"tests.{admission}", f"test_original_on_uncertainty_not_replaced_by_accepted_compensation[{suffix}]")
              for suffix in ("uncertain", "provider_error")
          })
          required.update({
              (f"tests.{fence}", name)
              for name in (
                  "test_token_is_current_only_for_its_fence_epoch",
                  "test_force_off_advances_before_every_registered_cancellation",
                  "test_force_off_collects_sync_and_async_failures_and_continues",
                  "test_registration_and_removal_are_token_specific_and_deterministic",
                  "test_fenced_work_is_cancelled_once_and_repeated_force_off_is_local_noop",
                  "test_late_old_token_completion_cannot_become_current",
                  "test_another_fence_cannot_accept_this_fences_token",
                  "test_force_off_invalidates_at_call_and_keeps_each_batch_epoch",
                  "test_held_cleanup_does_not_starve_other_cancellations",
                  "test_cancel_scope_revokes_equal_scope_before_cleanup_and_keeps_others",
                  "test_cancel_scope_cleanup_does_not_rescan_new_same_scope_registration",
                  "test_cancel_scope_rejects_non_builtin_str_without_equality_probe",
                  "test_cancel_scope_reports_cancellation_and_callback_failures",
                  "test_force_off_invalidates_scoped_and_unscoped_callbacks_before_cleanup",
              )
          })
          assert len(required) == 30
          modules = (
              admission,
              fence,
              "test_managed_tx_authority",
              "test_managed_tx_effect_lane",
          )
          selected = [f"tests/{module}.py" for module in modules]
          (artifacts / "expected-cases.json").write_text(json.dumps([
              {"classname": classname, "name": name}
              for classname, name in sorted(required)
          ], indent=2))
          (artifacts / "selected-files.txt").write_text("\n".join(selected) + "\n")
          command = [
              sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
              "-o", f"cache_dir={artifacts / 'pytest-cache'}",
              "--tb=long", "--color=no", "--timeout=20", "--timeout-method=thread",
              f"--junitxml={artifacts / 'junit.xml'}", *selected,
          ]
          (artifacts / "command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=300)
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          finally:
              print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 0, f"Expected pytest success, got exit {result.returncode}"

          report = ET.parse(artifacts / "junit.xml").getroot()
          cases = report.findall(".//testcase")
          actual = [(case.get("classname"), case.get("name")) for case in cases]
          assert len(actual) == len(set(actual)), actual
          assert not report.findall(".//failure"), "JUnit failures are not GREEN"
          assert not report.findall(".//error"), "JUnit errors are not GREEN"
          assert not report.findall(".//skipped"), "Skipped cases are not GREEN"
          actual_set = set(actual)
          assert required <= actual_set, {"missing": sorted(required - actual_set)}
          allowed_modules = {f"tests.{module}" for module in modules}
          assert set(classname for classname, _name in actual) == allowed_modules, actual
          regression_modules = {
              "tests.test_managed_tx_authority",
              "tests.test_managed_tx_effect_lane",
          }
          assert all(
              classname in regression_modules
              for classname, _name in actual_set - required
          ), {"unexpected_required_module_extra": sorted(actual_set - required)}
          (artifacts / "oracle.txt").write_text(
              f"PASS: observed {len(actual)} GREEN cases; all 30 required cases present; zero failures/errors/skips.\n"
              "Four fixed source modules only; extras are limited to authority/effect-lane regression modules.\n"
          )
          print((artifacts / "oracle.txt").read_text(), end="")
          PY

      - name: Ruff changed managed TX files
        run: |
          printf '%s\n' 'uv run --no-sync ruff check src/rigplane/runtime/managed_tx_authority.py src/rigplane/runtime/managed_tx_fence.py tests/test_managed_tx_ingress_admission.py tests/test_managed_tx_fence.py' > "$ARTIFACT_DIR/ruff-check-command.txt"
          printf '%s\n' 'uv run --no-sync ruff format --check src/rigplane/runtime/managed_tx_authority.py src/rigplane/runtime/managed_tx_fence.py tests/test_managed_tx_ingress_admission.py tests/test_managed_tx_fence.py' > "$ARTIFACT_DIR/ruff-format-command.txt"
          set +e
          uv run --no-sync ruff check src/rigplane/runtime/managed_tx_authority.py src/rigplane/runtime/managed_tx_fence.py tests/test_managed_tx_ingress_admission.py tests/test_managed_tx_fence.py > "$ARTIFACT_DIR/ruff-check.log" 2>&1
          check_rc=$?
          uv run --no-sync ruff format --check src/rigplane/runtime/managed_tx_authority.py src/rigplane/runtime/managed_tx_fence.py tests/test_managed_tx_ingress_admission.py tests/test_managed_tx_fence.py > "$ARTIFACT_DIR/ruff-format.log" 2>&1
          format_rc=$?
          printf '%s\n' "$check_rc" > "$ARTIFACT_DIR/ruff-check-exit.txt"
          printf '%s\n' "$format_rc" > "$ARTIFACT_DIR/ruff-format-exit.txt"
          cat "$ARTIFACT_DIR/ruff-check.log" "$ARTIFACT_DIR/ruff-format.log"
          test "$check_rc" -eq 0
          test "$format_rc" -eq 0

      - name: Record and require unchanged source
        if: always() && steps.prepare.outcome == 'success'
        run: |
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --stat > "$ARTIFACT_DIR/source-diff-stat.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic evidence
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: managed-tx-admission-green-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
