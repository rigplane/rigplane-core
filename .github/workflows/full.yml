name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigctld-context-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rigctld-context-diagnostics'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 25
    env:
      SOURCE_PIN: d29b46f470572df278b99438857d4523c286390f
      SOURCE_TREE: 115b891d11ee6a73862e635e9b05aa46c70a44d0
      CARRIER_BASE: fa689f8fc1234a2b7de596401c158f37f2a92c14
      UV_PYTHON: '3.11.16'
      PYTHONDONTWRITEBYTECODE: '1'
      HATCH_BUILD_NO_HOOKS: '1'
      RIGPLANE_DISABLE_DIAGNOSTIC_LOGGING: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          path: diagnostic
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d29b46f470572df278b99438857d4523c286390f
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated diagnostic evidence
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/rigctld-context-diagnostics.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "UV_CACHE_DIR=$artifact_dir/control-cache" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$artifact_dir/control-venv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$artifact_dir/python" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_PIN=$SOURCE_PIN" "SOURCE_TREE=$SOURCE_TREE" "CARRIER_SHA=$GITHUB_SHA" "CARRIER_BASE=$CARRIER_BASE" "REF=$GITHUB_REF" "RUN_ID=$GITHUB_RUN_ID" "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" 'SCOPE=17 existing cases, 11 phases, 187 executions; not full-suite or hardware acceptance.' > "$artifact_dir/metadata.txt"
          git rev-parse HEAD HEAD^{tree} HEAD^1 HEAD^2 > "$artifact_dir/source-before.txt"
          git status --porcelain=v1 --untracked-files=all --ignored > "$artifact_dir/source-status-before.txt"
          git ls-tree -rz HEAD > "$artifact_dir/source-git-manifest.bin"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -s "$artifact_dir/source-status-before.txt"
          git -C ../diagnostic rev-parse HEAD HEAD^{tree} HEAD^ > "$artifact_dir/carrier.txt"
          git -C ../diagnostic status --porcelain=v1 --untracked-files=all --ignored > "$artifact_dir/carrier-status.txt"
          git -C ../diagnostic diff --binary "$CARRIER_BASE" HEAD > "$artifact_dir/carrier.patch"
          test "$(git -C ../diagnostic rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../diagnostic rev-parse HEAD^)" = "$CARRIER_BASE"
          test ! -s "$artifact_dir/carrier-status.txt"
          test "$(git -C ../diagnostic diff --name-only "$CARRIER_BASE" HEAD)" = '.github/workflows/full.yml'
          git merge-base "$SOURCE_PIN" "$CARRIER_BASE" > "$artifact_dir/source-carrier-merge-base.txt"
          test "$(cat "$artifact_dir/source-carrier-merge-base.txt")" = b196d2624a3c0e747959a7bf0576c357a55a45a7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          version: '0.12.9'

      - name: Install isolated controller dependencies
        run: |
          printf '%s\n' 'uv python install 3.11.16' 'HATCH_BUILD_NO_HOOKS=1 uv sync --frozen --all-extras' > "$ARTIFACT_DIR/dependency-commands.txt"
          uv --version > "$ARTIFACT_DIR/uv-version.txt"
          uv python install 3.11.16 2>&1 | tee "$ARTIFACT_DIR/python-install.log"
          uv sync --frozen --all-extras 2>&1 | tee "$ARTIFACT_DIR/dependency-install.log"

      - name: Run frozen constructor fault and converse matrix
        run: |
          cat > "$ARTIFACT_DIR/context_proof.py" <<'PY'
          import ctypes
          import difflib
          import hashlib
          import importlib
          import json
          import os
          from pathlib import Path
          import shutil
          import signal
          import subprocess
          import sys
          import time
          import traceback
          from collections import Counter
          from types import SimpleNamespace
          import xml.etree.ElementTree as ET
          import pytest

          SERVER = 'src/rigplane/rigctld/server.py'
          HANDLER = 'src/rigplane/rigctld/handler.py'
          MFILE = 'tests/test_rigctld_managed_context.py'
          SFILE = 'tests/test_rigctld_server.py'
          TFILE = 'tests/test_rigctld_tx_interlock.py'
          M, S, T = MFILE + '::', SFILE + '::TestLifecycle::', TFILE + '::'
          PARTIAL = [M + f'test_partial_managed_context_is_rejected_before_bootstrap[present{i}]' for i in range(6)]
          H = M + 'test_managed_context_rejects_custom_handler'
          R = M + 'test_server_start_forwards_exact_managed_references'
          L = M + 'test_handler_leaf_preserves_shared_service_default'
          LIFECYCLE = [S + name for name in (
              'test_start_passes_state_model_capability_to_default_handler',
              'test_start_bootstraps_profiled_standalone_state_acquisition',
              'test_start_reuses_runtime_services_without_owning_freshness_task',
              'test_standalone_fallback_store_begin_and_detach_each_advance_once',
          )]
          TERMINAL = [T + f'test_unapplied_terminal_state_is_never_answered_with_rprt_0[{state}]' for state in ('failed--9', 'timed_out--5', 'superseded--9')]
          F = T + 'test_another_commands_terminal_state_does_not_fail_this_write'
          NODES = [*PARTIAL, H, R, L, *LIFECYCLE, *TERMINAL, F]
          REJECTION = '            raise ValueError(\n                "managed authority, queue and service must be supplied together"\n            )'
          TRIAD = '                managed_tx_authority=self._managed_tx_authority,\n                command_queue=self._command_queue,\n                command_service=self._command_service,\n'
          SELECT = '            if command_service is None\n            else command_service\n        )'

          def edit(path, old, new):
              return {'path': path, 'old': old, 'new': new, 'matches': 1}

          def site(node, line, statement, kind='assert'):
              return {'path': node.split('::')[0], 'line': line, 'statement': statement, 'kind': kind,
                      'message_predicate': "DID NOT RAISE <class 'ValueError'>" if kind == 'raises' else None}

          partial_site = site(PARTIAL[0], 91, 'with pytest.raises(ValueError, match="together"):', 'raises')
          PLAN = [
              ('B0', [], {}),
              ('M1', [edit(SERVER, REJECTION, '            return')], dict.fromkeys(PARTIAL, partial_site)),
              ('M2', [edit(HANDLER, REJECTION, '            return')], dict.fromkeys(PARTIAL, partial_site)),
              ('M3', [edit(SERVER, '            raise ValueError("managed references cannot be combined with _handler")', '            return')], {H: site(H, 96, 'with pytest.raises(ValueError, match="_handler"):', 'raises')}),
              ('M4', [edit(SERVER, TRIAD, '')], {R: site(R, 116, 'assert getattr(handler, "_" + name) is value'), **{node: site(node, line, 'handler_cls.assert_called_once_with(', 'mock') for node, line in zip(LIFECYCLE, (536, 578, 624, 897), strict=True)}}),
              ('M5', [edit(HANDLER, '                intent, executor=self._command_executor\n', '                intent\n')], {L: site(L, 131, 'assert context.radio.frequency_calls == [(14_075_000, 0)]')}),
              ('M6', [edit(HANDLER, SELECT, SELECT + '\n        self._command_service._executor = self._command_executor')], {L: site(L, 146, 'assert context.default.calls == [intent]')}),
              ('M7', [edit(HANDLER, '        state = _terminal_lifecycle_state(result, intent)', '        return result\n        state = _terminal_lifecycle_state(result, intent)')], {node: site(node, 592, 'assert response.error is expected') for node in TERMINAL}),
              ('M8', [edit(HANDLER, '        if event.command_id == intent.id:\n            return str(event.state)', '        return str(event.state)')], {F: site(F, 614, 'assert response.ok')}),
              ('C1', [edit(path, '        if any(supplied) and not all(supplied):', '        if sum(supplied) in (1, 2):') for path in (SERVER, HANDLER)], {}),
              ('B1', [], {}),
          ]
          HELPER_HASHES = {
              '_pytest.raises': 'f3a57e8686398586daebd9e9cab1fbaf891035bf108e8b986fc4b27462e68d57',
              '_pytest.outcomes': 'a9b8074421110d12bc5bc6407da9d07f80e9e3f5bbbcda1cdafbf7a66dc7b4aa',
              'unittest.mock': '2576119e5653ca21ab32dd5a1a5f5604deb2b1c7a240e315710ea927bc193749',
          }

          def save(path, value):
              path.write_text(json.dumps(value, indent=2) + '\n')

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def git(root, *args):
              return subprocess.check_output(['git', *args], cwd=root, timeout=30)

          def content(path):
              return os.readlink(path).encode() if path.is_symlink() else path.read_bytes()

          def fingerprint(root, names):
              actual = {str(path.relative_to(root)) for path in root.rglob('*') if '.git' not in path.relative_to(root).parts and (path.is_file() or path.is_symlink())}
              assert actual == set(names), ('INVALID: file inventory', actual ^ set(names))
              return {name: {'sha256': sha(content(root / name)), 'mode': (root / name).lstat().st_mode} for name in names}

          def supervised(command, cwd, env, evidence, seconds):
              evidence.mkdir()
              record = {'command': command, 'cwd': str(cwd), 'signals': [], 'safe_to_mutate': False}
              process = None
              def gone():
                  if process.poll() is not None:
                      while True:
                          try:
                              pid, _ = os.waitpid(-process.pid, os.WNOHANG)
                          except ChildProcessError:
                              break
                          if not pid:
                              break
                  try:
                      os.killpg(process.pid, 0)
                  except ProcessLookupError:
                      return process.poll() is not None
                  return False
              try:
                  with (evidence / 'stdout.log').open('w') as out, (evidence / 'stderr.log').open('w') as err:
                      process = subprocess.Popen(command, cwd=cwd, env=env, stdout=out, stderr=err, start_new_session=True)
                      record.update(pid=process.pid, pgid=process.pid)
                      save(evidence / 'process.json', record)
                      result = process.wait(timeout=seconds)
                      if not gone():
                          raise RuntimeError('INVALID: descendant outlived leader')
                      return result
              except BaseException as error:
                  record['error'] = repr(error)
                  raise
              finally:
                  if process is not None:
                      for action in (signal.SIGTERM, signal.SIGKILL):
                          if gone():
                              break
                          record['signals'].append(action.name)
                          try:
                              os.killpg(process.pid, action)
                          except ProcessLookupError:
                              pass
                          deadline = time.monotonic() + 3
                          while not gone() and time.monotonic() < deadline:
                              time.sleep(0.02)
                      record.update(returncode=process.poll(), safe_to_mutate=gone())
                  save(evidence / 'process.json', record)
                  assert record['safe_to_mutate'], 'INVALID: process death unconfirmed; no mutation/restoration'

          def imported(root, hashes, modules=None):
              records = {}
              test_modules = {Path(name).stem: name for name in hashes if Path(name).parent == Path('tests') and name.endswith('.py')}
              for name, module in sorted((sys.modules if modules is None else modules).items()):
                  value = getattr(module, '__file__', None)
                  if value is None:
                      continue
                  path = Path(value).resolve()
                  known = name == 'rigplane' or name.startswith('rigplane.') or name in test_modules
                  physical = path.is_relative_to(root / 'tests') or path.is_relative_to(root / 'src')
                  # Unknown identities outside specimen src/tests are not classified.
                  if not known and not physical:
                      continue
                  assert path.is_relative_to(root), ('INVALID: foreign import', name, str(path))
                  relative = str(path.relative_to(root))
                  assert name not in test_modules or relative == test_modules[name], ('INVALID: mapped test path', name, relative, test_modules.get(name))
                  assert relative in hashes, ('INVALID: untracked import', name, relative)
                  digest = sha(path.read_bytes())
                  assert digest == hashes[relative]['sha256'], ('INVALID: import hash', name, relative, digest, hashes[relative]['sha256'])
                  records[name] = {'path': str(path), 'sha256': digest}
              for name in ('rigplane.rigctld.server', 'rigplane.rigctld.handler', 'rigplane.core.command_service'):
                  assert name in records, ('INVALID: missing import', name)
              return records

          def calibrate_imports(root, hashes, evidence):
              rows = []
              save(evidence / 'calibration.json', {'status': 'INCOMPLETE', 'controls': rows})
              external_name = 'propcache._helpers'
              external = importlib.import_module(external_name)
              external_path = str(Path(external.__file__).resolve())
              assert not Path(external_path).is_relative_to(root), 'INVALID: external calibration path'
              required = ('rigplane.rigctld.server', 'rigplane.rigctld.handler', 'rigplane.core.command_service')
              base = {name: sys.modules[name] for name in required}
              helper_path, project = 'tests/_helpers.py', required[0]
              def at(path):
                  return SimpleNamespace(__file__=str(root / path))
              def wrong_hash(path):
                  return {**hashes, path: {**hashes[path], 'sha256': '0' * 64}}
              def hash_reason(name, path):
                  return ('INVALID: import hash', name, path, hashes[path]['sha256'], '0' * 64)
              test_alias, src_alias = 'calibration.unknown_test', 'calibration.unknown_source'
              controls = [
                  ('actual-project', dict(sys.modules), hashes, project, 'ADMITTED', None),
                  ('actual-external', {**base, external_name: external}, hashes, external_name, 'IGNORED', None),
                  ('mapped-helper', {**base, '_helpers': at(helper_path)}, hashes, '_helpers', 'ADMITTED', None),
                  ('project-foreign', {**base, project: SimpleNamespace(__file__=external_path)}, hashes, project, 'REJECTED', ('INVALID: foreign import', project, external_path)),
                  ('mapped-wrong-tracked-path', {**base, '_helpers': at(MFILE)}, hashes, '_helpers', 'REJECTED', ('INVALID: mapped test path', '_helpers', MFILE, helper_path)),
                  ('project-wrong-hash', base.copy(), wrong_hash(SERVER), project, 'REJECTED', hash_reason(project, SERVER)),
                  ('unknown-test', {**base, test_alias: at(MFILE)}, hashes, test_alias, 'ADMITTED', None),
                  ('unknown-test-wrong-hash', {**base, test_alias: at(MFILE)}, wrong_hash(MFILE), test_alias, 'REJECTED', hash_reason(test_alias, MFILE)),
                  ('unknown-source', {**base, src_alias: at(HANDLER)}, hashes, src_alias, 'ADMITTED', None),
                  ('unknown-source-wrong-hash', {**base, src_alias: at(HANDLER)}, wrong_hash(HANDLER), src_alias, 'REJECTED', hash_reason(src_alias, HANDLER)),
              ]
              assert len(controls) == 10
              for label, modules, expected_hashes, probe, outcome, reason in controls:
                  row = {'label': label, 'probe': probe, 'expected_outcome': outcome, 'expected_reason': reason, 'matched': False}
                  try:
                      try:
                          records = imported(root, expected_hashes, modules)
                      except AssertionError as error:
                          row.update(outcome='REJECTED', reason=error.args)
                          assert outcome == 'REJECTED' and error.args == (reason,), ('INVALID: calibration rejection', label, error.args)
                      else:
                          row.update(outcome='ADMITTED' if probe in records else 'IGNORED', record=records.get(probe))
                          assert row['outcome'] == outcome and reason is None, ('INVALID: calibration outcome', label, row)
                          for name in (*required, *([probe] if outcome == 'ADMITTED' else [])):
                              path = Path(modules[name].__file__).resolve()
                              assert records[name] == {'path': str(path), 'sha256': hashes[str(path.relative_to(root))]['sha256']}, ('INVALID: calibration admission', label, name)
                          if outcome == 'IGNORED':
                              assert probe == external_name and probe not in records and modules[probe] is external, 'INVALID: calibration ignore'
                      row['matched'] = True
                  except BaseException as error:
                      row['error'] = repr(error)
                      raise
                  finally:
                      rows.append(row)
                      save(evidence / 'calibration.json', {'status': 'EXPECTED' if len(rows) == 10 and all(item['matched'] for item in rows) else 'INCOMPLETE', 'classifier_calls': len(rows), 'controls': rows})

          class Reports:
              def pytest_collection_finish(self, session):
                  nodes = [item.nodeid for item in session.items]
                  save(evidence / 'collected.json', nodes)
                  assert nodes == NODES and len(set(nodes)) == 17, ('INVALID: collection', nodes)
                  for item in session.items:
                      assert Path(item.path).resolve() == root / item.nodeid.split('::')[0]
                      assert Path(item.module.__file__).resolve() == Path(item.path).resolve()
                      assert sys.modules[item.module.__name__] is item.module
                  save(evidence / 'imports-collected.json', imported(root, spec['fingerprint']))

              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_makereport(self, item, call):
                  report = (yield).get_result()
                  row = {'nodeid': item.nodeid, 'when': report.when, 'outcome': report.outcome, 'xfail': getattr(report, 'wasxfail', None)}
                  if call.excinfo is not None:
                      exc = call.excinfo
                      crash = getattr(report.longrepr, 'reprcrash', None)
                      row.update(exception=f'{exc.type.__module__}.{exc.type.__qualname__}', message=str(exc.value), is_pytest_failed=exc.type is pytest.fail.Exception,
                          frames=[{'path': str(Path(frame.filename).resolve()), 'line': frame.lineno, 'function': frame.name, 'statement': frame.line} for frame in traceback.extract_tb(exc.value.__traceback__)],
                          traceback=''.join(traceback.format_exception(exc.type, exc.value, exc.value.__traceback__)),
                          longrepr=report.longreprtext, crash=None if crash is None else {'path': str(crash.path), 'line': crash.lineno, 'message': crash.message})
                  with (evidence / 'reports.jsonl').open('a') as out:
                      out.write(json.dumps(row) + '\n')

          def validate(evidence, expected, rc, root):
              assert rc == (1 if expected else 0), ('INVALID: exit', rc)
              xml = ET.parse(evidence / 'junit.xml').getroot()
              cases = xml.findall('.//testcase')
              keys = {('.'.join([node.split('::')[0][:-3].replace('/', '.'), *node.split('::')[1:-1]]), node.split('::')[-1]): node for node in NODES}
              actual = [(case.get('classname'), case.get('name')) for case in cases]
              assert len(actual) == len(set(actual)) == 17 and set(actual) == set(keys), ('INVALID: JUnit inventory', actual)
              assert not xml.findall('.//error') and not xml.findall('.//skipped')
              for case, key in zip(cases, actual, strict=True):
                  assert len(case.findall('failure')) == int(keys[key] in expected), ('INVALID: JUnit outcome', key)
              helpers = json.loads((evidence / 'runtime.json').read_text())['helpers']
              rows = [json.loads(line) for line in (evidence / 'reports.jsonl').read_text().splitlines()]
              assert Counter((row['nodeid'], row['when']) for row in rows) == Counter((node, when) for node in NODES for when in ('setup', 'call', 'teardown'))
              for row in rows:
                  fault = expected.get(row['nodeid']) if row['when'] == 'call' else None
                  assert row['xfail'] is None, row
                  if fault is None:
                      assert row['outcome'] == 'passed' and 'exception' not in row, row
                      continue
                  assert row['outcome'] == 'failed' and row['traceback'] and row['longrepr'] and row['crash'], row
                  frames = row['frames']
                  selected = [frame for frame in frames if frame['path'] == str(root / fault['path'])]
                  assert len(selected) == 1 and selected[0]['line'] == fault['line'] and selected[0]['statement'] == fault['statement'], row
                  tail = [(frame['path'], frame['line'], frame['function']) for frame in frames[frames.index(selected[0]) + 1:]]
                  if fault['kind'] == 'raises':
                      assert row['exception'] == 'builtins.Failed' and row['is_pytest_failed'], row
                      assert row['message'] == fault['message_predicate'], row
                      assert tail == [(helpers['_pytest.raises']['path'], 710, '__exit__'), (helpers['_pytest.outcomes']['path'], 163, '__call__')], row
                  else:
                      assert row['exception'] == 'builtins.AssertionError' and not row['is_pytest_failed'], row
                      if fault['kind'] == 'mock':
                          assert tail == [(helpers['unittest.mock']['path'], 951, 'assert_called_once_with'), (helpers['unittest.mock']['path'], 939, 'assert_called_with')], row
                      else:
                          assert not tail, row
              save(evidence / 'oracle.json', {'status': 'EXPECTED', 'pass': 17 - len(expected), 'fail': len(expected), 'phase_reports': len(rows)})

          if len(sys.argv) == 2:
              root, evidence = Path.cwd().resolve(), Path(sys.argv[1]).resolve()
              spec = json.loads((evidence / 'expected.json').read_text())
              assert sys.version_info[:3] == (3, 11, 16) and pytest.__version__ == '9.0.2'
              helpers = {}
              for name, digest in HELPER_HASHES.items():
                  path = Path(importlib.import_module(name).__file__).resolve()
                  helpers[name] = {'path': str(path), 'sha256': sha(path.read_bytes())}
                  assert helpers[name]['sha256'] == digest, ('INVALID: helper source', name)
                  (evidence / (name + '.py')).write_bytes(path.read_bytes())
              save(evidence / 'runtime.json', {'python': sys.version, 'executable': sys.executable, 'pytest': pytest.__version__, 'helpers': helpers})
              for name in ('rigplane.rigctld.server', 'rigplane.rigctld.handler', 'rigplane.core.command_service'):
                  importlib.import_module(name)
              save(evidence / 'imports-initial.json', imported(root, spec['fingerprint']))
              if spec['label'] == 'B0':
                  calibrate_imports(root, spec['fingerprint'], evidence)
              args = ['-q', '-o', 'addopts=', '-o', f'cache_dir={evidence / "pytest-cache"}', '--tb=long', '--full-trace', '--color=no', '--timeout=30', '--timeout-method=thread', f'--junitxml={evidence / "junit.xml"}', *NODES]
              save(evidence / 'pytest-command.json', args)
              rc = pytest.main(args, plugins=[Reports()])
              save(evidence / 'imports-after.json', imported(root, spec['fingerprint']))
              sys.exit(rc)

          seed = Path.cwd().resolve()
          artifacts = Path(os.environ['ARTIFACT_DIR']).resolve()
          save(artifacts / 'verdict.json', {'status': 'INVALID', 'reason': 'matrix incomplete'})
          assert len(NODES) == len(set(NODES)) == 17 and len(PLAN) == 11
          save(artifacts / 'plan.json', PLAN)
          save(artifacts / 'expected-nodeids.json', NODES)
          assert sys.platform == 'linux' and ctypes.CDLL(None).prctl(36, 1, 0, 0, 0) == 0
          def interrupted(signum, frame):
              raise RuntimeError(f'INVALID: signal {signum}')
          signal.signal(signal.SIGTERM, interrupted)
          names = git(seed, 'ls-files', '-z').decode().split('\0')[:-1]
          original = fingerprint(seed, names)
          save(artifacts / 'source-fingerprint-before.json', original)
          for name in (SERVER, HANDLER, MFILE, SFILE, TFILE, 'uv.lock', 'pyproject.toml'):
              (artifacts / ('source-' + Path(name).name)).write_bytes((seed / name).read_bytes())
          completed = []
          for label, edits, expected in PLAN:
              evidence = artifacts / label
              evidence.mkdir()
              root = artifacts / f'specimen-{label}'
              shutil.copytree(seed, root, symlinks=True, ignore=shutil.ignore_patterns('.git'))
              assert fingerprint(root, names) == original
              env = os.environ.copy()
              env.update(UV_PROJECT_ENVIRONMENT=str(artifacts / f'venv-{label}'), UV_CACHE_DIR=str(artifacts / f'uv-cache-{label}'), PYTHONPYCACHEPREFIX=str(artifacts / f'pycache-{label}'), PYTHONPATH=f'{root / "src"}:{root / "tests"}', PYTEST_ADDOPTS='')
              save(evidence / 'isolation.json', {key: env[key] for key in ('UV_PROJECT_ENVIRONMENT', 'UV_CACHE_DIR', 'UV_PYTHON_INSTALL_DIR', 'PYTHONPYCACHEPREFIX', 'PYTHONPATH', 'HATCH_BUILD_NO_HOOKS')})
              command = ['uv', 'sync', '--frozen', '--all-extras']
              rc = supervised(command, root, env, evidence / 'install', 90)
              assert rc == 0, ('INVALID: dependencies', label, rc)
              assert fingerprint(root, names) == original
              patch = []
              for change in edits:
                  path = root / change['path']
                  before = path.read_text()
                  assert before.count(change['old']) == change['matches'], ('INVALID: patch matches', change)
                  after = before.replace(change['old'], change['new'])
                  path.write_text(after)
                  patch.extend(difflib.unified_diff(before.splitlines(True), after.splitlines(True), fromfile='a/' + change['path'], tofile='b/' + change['path']))
              (evidence / 'fault.patch').write_text(''.join(patch))
              current = fingerprint(root, names)
              changed = {name for name in names if current[name] != original[name]}
              assert changed == {change['path'] for change in edits}, ('INVALID: patch footprint', changed)
              assert bool(changed) == bool(edits) and (current != original) == bool(edits)
              save(evidence / 'hash-guard-before.json', {'changed': sorted(changed), 'detected': current != original})
              for fault in expected.values():
                  assert (root / fault['path']).read_text().splitlines()[fault['line'] - 1].strip() == fault['statement']
              save(evidence / 'expected.json', {'label': label, 'faults': expected, 'fingerprint': current})
              command = ['uv', 'run', '--no-sync', 'python', str(artifacts / 'context_proof.py'), str(evidence)]
              try:
                  rc = supervised(command, root, env, evidence / 'pytest', 90)
                  save(evidence / 'exit.json', rc)
                  assert fingerprint(root, names) == current, 'INVALID: specimen changed during test'
                  validate(evidence, expected, rc, root)
              finally:
                  record_path = evidence / 'pytest/process.json'
                  assert record_path.exists() and json.loads(record_path.read_text())['safe_to_mutate'], 'INVALID: restoration forbidden'
                  save(evidence / 'fingerprint-before-restoration.json', fingerprint(root, names))
                  for name in changed:
                      (root / name).write_bytes((seed / name).read_bytes())
                  restored = fingerprint(root, names)
                  save(evidence / 'fingerprint-restored.json', restored)
                  assert restored == original, 'INVALID: restoration mismatch'
              assert fingerprint(seed, names) == original, 'INVALID: pristine source changed'
              completed.append(label)
              save(artifacts / 'completed-phases.json', completed)
          assert len(completed) * len(NODES) == 187
          save(artifacts / 'source-fingerprint-after.json', fingerprint(seed, names))
          save(artifacts / 'verdict.json', {'status': 'EXPECTED', 'phases': completed, 'case_executions': 187, 'scope': 'constructor mutation controls only; no full-suite or hardware claim'})
          PY
          set +e
          timeout --signal=TERM --kill-after=10s 1200 uv run --no-sync python "$ARTIFACT_DIR/context_proof.py" > "$ARTIFACT_DIR/driver.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$ARTIFACT_DIR/driver-exit.txt"
          cat "$ARTIFACT_DIR/driver.log"
          exit "$rc"

      - name: Require unchanged pinned source
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        run: |
          git rev-parse HEAD HEAD^{tree} HEAD^1 HEAD^2 > "$ARTIFACT_DIR/source-after.txt"
          git status --porcelain=v1 --untracked-files=all --ignored > "$ARTIFACT_DIR/source-status-after.txt"
          git diff --binary HEAD > "$ARTIFACT_DIR/source-diff.patch"
          cmp "$ARTIFACT_DIR/source-before.txt" "$ARTIFACT_DIR/source-after.txt"
          test ! -s "$ARTIFACT_DIR/source-status-after.txt"
          test ! -s "$ARTIFACT_DIR/source-diff.patch"

      - name: Upload diagnostic capture
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: rigctld-context-diagnostics-d29b46f4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.artifacts_dir }}/metadata.txt
            ${{ steps.prepare.outputs.artifacts_dir }}/source-*
            ${{ steps.prepare.outputs.artifacts_dir }}/carrier*
            ${{ steps.prepare.outputs.artifacts_dir }}/*.json
            ${{ steps.prepare.outputs.artifacts_dir }}/*.txt
            ${{ steps.prepare.outputs.artifacts_dir }}/*.log
            ${{ steps.prepare.outputs.artifacts_dir }}/*.py
            ${{ steps.prepare.outputs.artifacts_dir }}/B0
            ${{ steps.prepare.outputs.artifacts_dir }}/M*
            ${{ steps.prepare.outputs.artifacts_dir }}/C1
            ${{ steps.prepare.outputs.artifacts_dir }}/B1
          if-no-files-found: error
