name: Tests (full matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rigctld-context-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/rigctld-context-diagnostics'
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    env:
      SOURCE_PIN: b196d2624a3c0e747959a7bf0576c357a55a45a7
      UV_PYTHON: '3.11'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source/tests
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b196d2624a3c0e747959a7bf0576c357a55a45a7
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare isolated diagnostic evidence
        id: prepare
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/rigctld-context-diagnostics.XXXXXX")
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "artifacts_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "UV_CACHE_DIR=$(mktemp -d "$RUNNER_TEMP/context-uv-cache.XXXXXX")" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$(mktemp -d "$RUNNER_TEMP/context-venv.XXXXXX")" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$(mktemp -d "$RUNNER_TEMP/context-pycache.XXXXXX")" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$artifact_dir/ruff-cache" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_PIN=$SOURCE_PIN" "DIAG_SHA=$GITHUB_SHA" "REF=$GITHUB_REF" "RUN_ID=$GITHUB_RUN_ID" "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" 'SCOPE=Diagnostic capture with a known format failure; not product GREEN or ingress proof.' > "$artifact_dir/metadata.txt"
          git rev-parse HEAD > "$artifact_dir/source-head-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$artifact_dir/status-before.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$artifact_dir/status-before.txt"
          git archive --format=tar "$SOURCE_PIN" -- src/rigplane/rigctld/server.py src/rigplane/rigctld/handler.py tests/test_rigctld_managed_context.py tests/test_rigctld_server.py > "$artifact_dir/source-files.tar"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install dependencies
        id: install
        run: |
          printf '%s\n' 'uv python install 3.11' 'uv sync --frozen --extra dev' > "$ARTIFACT_DIR/dependency-commands.txt"
          uv python install 3.11
          uv sync --frozen --extra dev

      - name: Require the ten focused tests
        run: |
          set +e
          uv run --no-sync python - > "$ARTIFACT_DIR/test-oracle.log" 2>&1 <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          assert sys.version_info[:2] == (3, 11), sys.version
          (artifacts / "python.txt").write_text(sys.version + "\n")
          module = "tests.test_rigctld_managed_context"
          expected = [(module, name) for name in (
              "test_partial_managed_context_is_rejected_before_bootstrap[present0]",
              "test_partial_managed_context_is_rejected_before_bootstrap[present1]",
              "test_partial_managed_context_is_rejected_before_bootstrap[present2]",
              "test_partial_managed_context_is_rejected_before_bootstrap[present3]",
              "test_partial_managed_context_is_rejected_before_bootstrap[present4]",
              "test_partial_managed_context_is_rejected_before_bootstrap[present5]",
              "test_managed_context_rejects_custom_handler",
              "test_server_start_forwards_exact_managed_references",
              "test_handler_leaf_preserves_shared_service_default",
          )] + [("tests.test_rigctld_server.TestLifecycle",
                 "test_start_does_not_bind_backend_state_cache_by_default")]
          nodeids = [
              f"tests/test_rigctld_managed_context.py::{name}"
              for _, name in expected[:-1]
          ] + ["tests/test_rigctld_server.py::TestLifecycle::test_start_does_not_bind_backend_state_cache_by_default"]
          assert len(expected) == len(set(expected)) == len(nodeids) == 10
          (artifacts / "expected-cases.json").write_text(json.dumps(expected, indent=2))
          (artifacts / "expected-nodeids.txt").write_text("\n".join(nodeids) + "\n")
          command = [
              sys.executable, "-m", "pytest", "-q", "-o", "addopts=",
              "-o", f"cache_dir={artifacts / 'pytest-cache'}",
              "--tb=long", "--color=no", "--timeout=30", "--timeout-method=thread",
              f"--junitxml={artifacts / 'junit.xml'}", *nodeids,
          ]
          (artifacts / "pytest-command.json").write_text(json.dumps(command, indent=2))
          try:
              with (artifacts / "pytest.log").open("w") as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=180)
          except subprocess.TimeoutExpired:
              (artifacts / "pytest-exit.txt").write_text("subprocess timeout\n")
              raise
          finally:
              print((artifacts / "pytest.log").read_text(), end="")
          (artifacts / "pytest-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 0, result.returncode
          report = ET.parse(artifacts / "junit.xml").getroot()
          actual = [(case.get("classname"), case.get("name")) for case in report.findall(".//testcase")]
          assert len(actual) == len(set(actual)) == 10 and set(actual) == set(expected), actual
          assert not any(report.findall(f".//{tag}") for tag in ("failure", "error", "skipped"))
          (artifacts / "test-oracle.txt").write_text("Exact 10 PASS; no failures/errors/skips/duplicates.\n")
          PY
          rc=$?
          printf '%s\n' "$rc" > "$ARTIFACT_DIR/test-oracle-exit.txt"
          cat "$ARTIFACT_DIR/test-oracle.log"
          exit "$rc"

      - name: Capture and require the known formatting failure
        if: always() && steps.install.outcome == 'success'
        run: |
          target=tests/test_rigctld_managed_context.py
          printf '%s\n' "uv run --no-sync ruff check $target" "uv run --no-sync ruff format --check $target" "uv run --no-sync ruff format --diff $target" > "$ARTIFACT_DIR/ruff-commands.txt"
          set +e
          uv run --no-sync ruff check "$target" > "$ARTIFACT_DIR/ruff-check.log" 2>&1
          printf '%s\n' "$?" > "$ARTIFACT_DIR/ruff-check-exit.txt"
          uv run --no-sync ruff format --check "$target" > "$ARTIFACT_DIR/ruff-format.log" 2>&1
          printf '%s\n' "$?" > "$ARTIFACT_DIR/ruff-format-exit.txt"
          uv run --no-sync ruff format --diff "$target" > "$ARTIFACT_DIR/ruff-format-diff.log" 2>&1
          printf '%s\n' "$?" > "$ARTIFACT_DIR/ruff-format-diff-exit.txt"
          set -e
          cat "$ARTIFACT_DIR/ruff-check.log" "$ARTIFACT_DIR/ruff-format.log" "$ARTIFACT_DIR/ruff-format-diff.log"
          set +e
          uv run --no-sync python - > "$ARTIFACT_DIR/format-oracle.log" 2>&1 <<'PY'
          import os
          from pathlib import Path
          artifacts = Path(os.environ["ARTIFACT_DIR"])
          for name, expected in (("ruff-check", "0"), ("ruff-format", "1"), ("ruff-format-diff", "1")):
              assert (artifacts / f"{name}-exit.txt").read_text().strip() == expected, name
          diff = (artifacts / "ruff-format-diff.log").read_text()
          headers = [line for line in diff.splitlines() if line.startswith(("--- ", "+++ "))]
          target = "tests/test_rigctld_managed_context.py"
          assert headers == [f"--- {target}", f"+++ {target}"], headers
          assert any(line.startswith("@@ ") for line in diff.splitlines()), "Missing format hunks"
          (artifacts / "format-oracle.txt").write_text("Known format failure captured only for the context test; not product GREEN.\n")
          PY
          rc=$?
          printf '%s\n' "$rc" > "$ARTIFACT_DIR/format-oracle-exit.txt"
          cat "$ARTIFACT_DIR/format-oracle.log"
          exit "$rc"

      - name: Capture isolated citation repair and canonical checks
        if: always() && steps.install.outcome == 'success'
        run: |
          set +e
          uv run --no-sync python - > "$ARTIFACT_DIR/citation-oracle.log" 2>&1 <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          artifacts = Path(os.environ["ARTIFACT_DIR"])
          pin = os.environ["SOURCE_PIN"]
          candidate = Path(tempfile.mkdtemp(prefix="context-citation-", dir=os.environ["RUNNER_TEMP"]))
          (artifacts / "candidate-path.txt").write_text(str(candidate) + "\n")
          command = ["git", "worktree", "add", "--detach", str(candidate), pin]
          (artifacts / "candidate-command.json").write_text(json.dumps(command))
          with (artifacts / "candidate-setup.log").open("w") as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=60)
          (artifacts / "candidate-setup-exit.txt").write_text(str(result.returncode) + "\n")
          assert result.returncode == 0, result.returncode
          doc = "docs/plans/2026-08-20-transmit-authority.md"
          baselines = (
              ".github/scripts/doc-citation-baseline.txt",
              ".github/scripts/doc-citation-dangling-baseline.txt",
          )
          allowed = {doc, *baselines}
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=candidate, text=True).strip() == pin
          assert not subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], cwd=candidate)
          original = (candidate / doc).read_bytes()
          needle = b" (`radio_poller.py:4024`)"
          assert original.count(needle) == 1
          assert original.splitlines()[949] == b"`connection_epoch_bootstrap` exemption (`radio_poller.py:4024`) exists"
          for path in sorted(allowed):
              (artifacts / ("before-" + Path(path).name)).write_bytes((candidate / path).read_bytes())
          steps = [
              ("citation-regenerate", ["--regenerate"]),
              ("dangling-regenerate", ["--check-dangling", "--regenerate"]),
              ("citation-check", []),
              ("link-check", ["--check-links"]),
              ("dangling-check", ["--check-dangling"]),
              ("citation-growth", ["--check-growth", pin]),
              ("link-growth", ["--check-links", "--check-growth", pin]),
              ("dangling-growth", ["--check-dangling", "--check-growth", pin]),
          ]
          try:
              (candidate / doc).write_bytes(original.replace(needle, b""))
              for name, args in steps:
                  command = [".github/scripts/check-doc-citations.sh", *args]
                  (artifacts / f"{name}-command.json").write_text(json.dumps(command))
                  try:
                      with (artifacts / f"{name}.log").open("w") as log:
                          result = subprocess.run(
                              command, cwd=candidate, stdout=log,
                              stderr=subprocess.STDOUT, timeout=120,
                          )
                  except subprocess.TimeoutExpired:
                      (artifacts / f"{name}-exit.txt").write_text("subprocess timeout\n")
                      raise
                  (artifacts / f"{name}-exit.txt").write_text(str(result.returncode) + "\n")
                  print((artifacts / f"{name}.log").read_text(), end="")
                  assert result.returncode == 0, (name, result.returncode)
          finally:
              for name, args in (
                  ("candidate-diff.patch", ["diff", "--binary", "HEAD"]),
                  ("candidate-changed-paths.txt", ["diff", "--name-only", "HEAD"]),
                  ("candidate-status.txt", ["status", "--porcelain=v1", "--untracked-files=all"]),
                  ("candidate-head.txt", ["rev-parse", "HEAD"]),
              ):
                  (artifacts / name).write_bytes(subprocess.check_output(["git", *args], cwd=candidate))
              for path in sorted(allowed):
                  (artifacts / ("after-" + Path(path).name)).write_bytes((candidate / path).read_bytes())
          changed = set((artifacts / "candidate-changed-paths.txt").read_text().splitlines())
          assert doc in changed and changed <= allowed, changed
          assert not subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], cwd=candidate)
          assert (candidate / doc).read_bytes() == original.replace(needle, b"")
          assert (artifacts / "candidate-head.txt").read_text().strip() == pin
          (artifacts / "citation-oracle.txt").write_text(
              "Candidate removes only the literal citation parenthesis; canonical regenerations and six checks passed. "
              "Changes are restricted to the document and two citation baselines; no baseline growth. Original source is checked separately.\n"
          )
          PY
          rc=$?
          printf '%s\n' "$rc" > "$ARTIFACT_DIR/citation-oracle-exit.txt"
          cat "$ARTIFACT_DIR/citation-oracle.log"
          exit "$rc"

      - name: Require unchanged pinned source
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        run: |
          git rev-parse HEAD > "$ARTIFACT_DIR/source-head-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$ARTIFACT_DIR/status-after.txt"
          git diff --binary HEAD > "$ARTIFACT_DIR/source-diff.patch"
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test ! -s "$ARTIFACT_DIR/status-after.txt"

      - name: Upload diagnostic capture
        if: always() && steps.prepare.outputs.artifacts_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: rigctld-context-diagnostics-b196d262-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifacts_dir }}
          if-no-files-found: error
