          def save(path, value):
              path.write_text(json.dumps(value, indent=2) + '\n')

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def git(root, *args):
              return subprocess.check_output(['git', *args], cwd=root, stderr=subprocess.STDOUT, timeout=60)

          def status(root):
              return git(root, 'status', '--porcelain=v1', '--untracked-files=all', '--ignored')

          def tracked_bytes(path):
              # Git tracks a symlink's target text, not the linked file bytes.
              return os.readlink(path).encode() if path.is_symlink() else path.read_bytes()

          def snapshot(root, names):
              return {name: sha(tracked_bytes(root / name)) for name in names}

          def supervised(args, cwd, env, evidence, process_state, timeout=180):
              # Linux-only diagnostic supervision, not a product lifecycle layer.
              # Group signals alone leave orphaned zombies: the driver is a
              # subreaper so it can reap grandchildren and prove group absence.
              process_state['safe_to_restore'] = False
              with (evidence / 'stdout.log').open('w') as out, (evidence / 'stderr.log').open('w') as err:
                  process = None
                  record = {'args': args, 'cwd': str(cwd), 'signals': []}

                  def gone():
                      if process.poll() is not None:
                          while True:
                              try:
                                  pid, _ = os.waitpid(-pgid, os.WNOHANG)
                              except ChildProcessError:
                                  break
                              if pid == 0:
                                  break
                      try:
                          os.killpg(pgid, 0)
                      except ProcessLookupError:
                          return process.poll() is not None
                      return False

                  try:
                      process = subprocess.Popen(args, cwd=cwd, env=env, stdout=out, stderr=err, start_new_session=True)
                      pgid = process.pid
                      record.update(pid=process.pid, pgid=pgid)
                      save(evidence / 'supervision.json', record)
                      result = process.wait(timeout=timeout)
                      if not gone():
                          raise RuntimeError('INVALID: descendant outlived group leader')
                      return result
                  except BaseException as error:
                      record['interruption'] = repr(error)
                      raise
                  finally:
                      if process is None:
                          save(evidence / 'supervision.json', {**record, 'safe_to_restore': False})
                          raise RuntimeError('INVALID: process launch unconfirmed; restoration forbidden')
                      pgid = process.pid
                      for action in (signal.SIGTERM, signal.SIGKILL):
                          if gone():
                              break
                          record['signals'].append(action.name)
                          try:
                              os.killpg(pgid, action)
                          except ProcessLookupError:
                              pass
                          deadline = time.monotonic() + 3
                          while not gone() and time.monotonic() < deadline:
                              time.sleep(0.02)
                      process_state['safe_to_restore'] = gone()
                      record.update(process_state, returncode=process.poll())
                      save(evidence / 'supervision.json', record)
                      if not process_state['safe_to_restore']:
                          raise RuntimeError('INVALID: group death unconfirmed; restoration forbidden')

          def calibrate_supervision(artifacts):
              evidence = artifacts / 'timeout-calibration'
              evidence.mkdir()
              marker = evidence / 'restoration-marker.txt'
              marker.write_text('pristine')
              original = sha(marker.read_bytes())
              marker.write_text('changed')
              assert sha(marker.read_bytes()) != original
              child_code = '''import os, signal, sys
          from pathlib import Path
          signal.signal(signal.SIGTERM, signal.SIG_IGN)
          Path(sys.argv[1]).write_text(str(os.getpid()))
          signal.pause()
          '''
              parent_code = '''import json, os, signal, subprocess, sys, time
          from pathlib import Path
          signal.signal(signal.SIGTERM, signal.SIG_IGN)
          ready = Path(sys.argv[1]) / 'child-ready.txt'
          child = subprocess.Popen([sys.executable, '-c', sys.argv[2], str(ready)])
          while not ready.exists():
              time.sleep(0.01)
          (ready.parent / 'pids.json').write_text(json.dumps([os.getpid(), child.pid]))
          signal.pause()
          '''
              state = {'safe_to_restore': False}
              try:
                  supervised([sys.executable, '-c', parent_code, str(evidence), child_code], evidence, os.environ.copy(), evidence, state, timeout=5)
              except subprocess.TimeoutExpired:
                  pass
              else:
                  raise RuntimeError('INVALID: timeout calibration did not time out')
              assert state['safe_to_restore'], 'INVALID: calibration group survived'
              pids = json.loads((evidence / 'pids.json').read_text())
              assert len(set(pids)) == 2 and all(not Path(f'/proc/{pid}').exists() for pid in pids)
              record = json.loads((evidence / 'supervision.json').read_text())
              assert record['signals'] == ['SIGTERM', 'SIGKILL']
              save(evidence / 'before-restoration.json', {'pids_absent': pids, 'group_absent': True})
              marker.write_text('pristine')
              assert sha(marker.read_bytes()) == original
              save(evidence / 'verdict.json', {'status': 'PASS', 'scope': 'instrument calibration only'})

          def imports(root, expected_hashes):
              records = {}
              for name, module in sorted(sys.modules.items()):
                  if not (name == 'rigplane' or name.startswith('rigplane.') or name.startswith('test_') or name == 'conftest'):
                      continue
                  value = getattr(module, '__file__', None)
                  if value is None:
                      continue
                  path = Path(value).resolve()
                  assert path.is_relative_to(root), ('foreign import', name, str(path))
                  relative = str(path.relative_to(root))
                  assert relative in expected_hashes and sha(path.read_bytes()) == expected_hashes[relative], (name, relative)
                  records[name] = {'path': str(path), 'sha256': expected_hashes[relative]}
              for name in ('rigplane.runtime._poller_types', 'rigplane.web.radio_poller', 'rigplane.core.command_dispatch'):
                  assert name in records, ('missing required import', name)
              return records

          class Oracle:
              def pytest_collection_finish(self, session):
                  actual = [item.nodeid for item in session.items]
                  save(evidence / 'collected.json', actual)
                  assert len(actual) == len(set(actual)) == len(expected) and set(actual) == set(expected), actual
                  for item in session.items:
                      file = item.nodeid.split('::')[0]
                      assert Path(item.path).resolve() == root / file
                      assert Path(item.module.__file__).resolve() == root / file
                  save(evidence / 'imports-before.json', imports(root, spec['hashes']))

              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_makereport(self, item, call):
                  report = (yield).get_result()
                  row = {'node': item.nodeid, 'phase': report.when, 'outcome': report.outcome, 'xfail': getattr(report, 'wasxfail', None)}
                  if call.excinfo is not None:
                      trace = call.excinfo.traceback
                      last = trace[-1]
                      row.update(exception=f'{call.excinfo.type.__module__}.{call.excinfo.type.__name__}', message=str(call.excinfo.value), path=str(Path(last.path).resolve()), line=last.lineno + 1)
                  with (evidence / 'phases.jsonl').open('a') as output:
                      output.write(json.dumps(row) + '\n')

          def validate(evidence, expected, rc, root):
              assert rc == (1 if any(expected.values()) else 0), ('unexpected exit', rc)
              xml = ET.parse(evidence / 'junit.xml').getroot()
              cases = xml.findall('.//testcase')
              wanted = {(node.split('::')[0][:-3].replace('/', '.'), node.split('::')[1]): site for node, site in expected.items()}
              keys = [(case.get('classname'), case.get('name')) for case in cases]
              assert len(keys) == len(set(keys)) == len(wanted) and set(keys) == set(wanted), keys
              assert not xml.findall('.//error') and not xml.findall('.//skipped')
              for case, key in zip(cases, keys):
                  assert len(case.findall('failure')) == int(wanted[key] is not None), key
              phases = [json.loads(line) for line in (evidence / 'phases.jsonl').read_text().splitlines()]
              assert Counter((row['node'], row['phase']) for row in phases) == Counter((node, phase) for node in expected for phase in ('setup', 'call', 'teardown'))
              for row in phases:
                  site = expected[row['node']] if row['phase'] == 'call' else None
                  assert row['xfail'] is None, row
                  if site is None:
                      assert row['outcome'] == 'passed' and 'exception' not in row, row
                  else:
                      assert row['outcome'] == 'failed' and row['exception'] == site['exception'], row
                      assert row['path'] == str(root / site['file']) and row['line'] == site['line'], row
                      assert site['message'] is None or row['message'] == site['message'], row

          if len(sys.argv) > 1:
              root, evidence = Path.cwd().resolve(), Path(sys.argv[1]).resolve()
              spec = json.loads((evidence / 'expected.json').read_text())
              expected = spec['expected']
              assert sys.version_info[:3] == (3, 11, 16) and git(root, 'rev-parse', 'HEAD').decode().strip() == SOURCE
              for name in ('rigplane.runtime._poller_types', 'rigplane.web.radio_poller', 'rigplane.core.command_dispatch'):
                  importlib.import_module(name)
              save(evidence / 'imports-initial.json', imports(root, spec['hashes']))
              args = ['-q', '-o', 'addopts=', '-o', f'cache_dir={evidence / "pytest-cache"}', '--tb=long', '--color=no', '--timeout=30', '--timeout-method=thread', f'--junitxml={evidence / "junit.xml"}', *expected]
              save(evidence / 'pytest-command.json', args)
              result = pytest.main(args, plugins=[Oracle()])
              save(evidence / 'imports-after.json', imports(root, spec['hashes']))
              sys.exit(result)

