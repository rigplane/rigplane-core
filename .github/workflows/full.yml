name: Icom observed PTT mutation proof (staged)

on:
  workflow_dispatch:

jobs:
  mutation-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/icom-observed-ptt-mutation-proof'
    runs-on: [self-hosted, linux, build]
    env:
      UV_PYTHON: '3.11'
      SOURCE_SHA: 04bb81d6255b8f7b0d89e7338852d07b3abed437
      SOURCE_TREE: 150c3865a35c984a2bcb9c1d9a83d7574bcedb78
      DIAG_BASE_SHA: 25d4c9608b01732ad1f4e881a23a07d7091ea375
      DIAG_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$DIAG_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse "$DIAG_SHA^")" = "$DIAG_BASE_SHA"

      - name: Prove mutation and restoration structurally
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SUPERVISOR_CODE: |
            import json
            import os
            from pathlib import Path
            import signal
            import subprocess
            import sys
            import time

            record_path = Path(os.environ["PROOF_SUPERVISION_RECORD"])
            marker = Path(str(record_path) + ".quiescent")
            if record_path.exists() or marker.exists():
                raise SystemExit("INVALID: supervision evidence path already exists")
            state = {"status": "UNKNOWN", "command": sys.argv[1:], "pid": None,
                     "group_absent": False, "leader_reaped": False, "signals": [],
                     "deadline_seconds": 180, "reap_seconds": 10, "group_wait_seconds": 5,
                     "phase": os.environ.get("PROOF_PHASE", "bootstrap"),
                     "supervisor_python": sys.executable, "supervisor_version": sys.version}

            def save():
                record_path.write_text(json.dumps(state, indent=2) + "\n")

            def interrupted(signum, _frame):
                state["signals"].append(signum)

            def group_exists(pgid):
                try:
                    os.killpg(pgid, 0)
                except ProcessLookupError:
                    return False
                return True

            signal.signal(signal.SIGINT, interrupted)
            signal.signal(signal.SIGTERM, interrupted)
            save()
            process = None
            returncode = 125
            try:
                deadline = time.monotonic() + 180
                process = subprocess.Popen(sys.argv[1:], start_new_session=True)
                state["pid"] = state["pgid"] = process.pid
                save()
                while True:
                    if state["signals"]:
                        raise RuntimeError("INVALID: catchable signal interrupted command")
                    remaining = deadline - time.monotonic()
                    if remaining <= 0:
                        raise subprocess.TimeoutExpired(sys.argv[1:], 180)
                    try:
                        returncode = process.wait(timeout=min(0.2, remaining))
                        break
                    except subprocess.TimeoutExpired:
                        continue
                state["status"] = "COMPLETED"
            except BaseException as error:
                state.update(status="INVALID", error=repr(error))
                returncode = 125
            finally:
                try:
                    if process is not None:
                        alive = group_exists(process.pid)
                        state["group_alive_after_wait"] = alive
                        if alive:
                            try:
                                os.killpg(process.pid, signal.SIGKILL)
                            except ProcessLookupError:
                                pass
                        process.wait(timeout=10)
                        state["leader_reaped"] = True
                        deadline = time.monotonic() + 5
                        while group_exists(process.pid) and time.monotonic() < deadline:
                            time.sleep(0.05)
                        state["returncode"] = process.returncode
                        state["group_absent"] = not group_exists(process.pid)
                        if alive or state["signals"]:
                            state["status"] = "INVALID"
                            returncode = 125
                        if not state["group_absent"]:
                            raise RuntimeError("INVALID: process group cleanup unconfirmed")
                        save()
                        marker.write_text(str(record_path) + "\n")
                    else:
                        state["status"] = "INVALID"
                        save()
                except BaseException as error:
                    state.update(status="INVALID", cleanup_error=repr(error))
                    returncode = 125
                    try:
                        save()
                    except OSError:
                        pass
            raise SystemExit(returncode)
        run: |
          set -eu
          proof_python=$(command -v python3)
          proof_containment=$(mktemp -d "$RUNNER_TEMP/icom-observed-ptt-containment.XXXXXX")
          export PROOF_CONTAINMENT_DIR="$proof_containment"
          printf 'PROOF_CONTAINMENT_DIR=%s\n' "$proof_containment" >> "$GITHUB_ENV"
          proof_quiescent=yes
          proof_interrupt=0
          proof_sequence=0
          trap 'proof_interrupt=130' INT
          trap 'proof_interrupt=143' TERM
          require_quiescent() {
            if [ "$proof_sequence" -eq 0 ]; then return 0; fi
            if [ "$proof_quiescent" != yes ] ||
               [ "$(cat "$PROOF_SUPERVISION_RECORD.quiescent" 2>/dev/null)" != "$PROOF_SUPERVISION_RECORD" ]; then
              printf 'UNKNOWN: current child cleanup unconfirmed; source write forbidden\n' > "$proof_containment/unconfirmed.txt"
              return 125
            fi
          }
          supervised() {
            require_quiescent || return 125
            if [ "$proof_interrupt" -ne 0 ]; then exit "$proof_interrupt"; fi
            proof_quiescent=no
            proof_sequence=$((proof_sequence + 1))
            export PROOF_SUPERVISION_RECORD="$proof_containment/$proof_sequence.json"
            "$proof_python" -c "$SUPERVISOR_CODE" "$@" <&0 &
            proof_supervisor_pid=$!
            while :; do
              if [ "$proof_interrupt" -ne 0 ]; then
                kill -TERM "$proof_supervisor_pid" 2>/dev/null || true
              fi
              wait "$proof_supervisor_pid" && proof_rc=0 || proof_rc=$?
              if ! kill -0 "$proof_supervisor_pid" 2>/dev/null; then break; fi
            done
            printf 'supervisor_pid=%s\nwait_exit=%s\n' "$proof_supervisor_pid" "$proof_rc" > "$PROOF_SUPERVISION_RECORD.shell.txt"
            if [ "$(cat "$PROOF_SUPERVISION_RECORD.quiescent" 2>/dev/null)" = "$PROOF_SUPERVISION_RECORD" ]; then
              proof_quiescent=yes
            fi
            require_quiescent || return 125
            if [ "$proof_interrupt" -ne 0 ]; then exit "$proof_interrupt"; fi
            return "$proof_rc"
          }
          source_file=src/rigplane/runtime/_civ_rx.py
          original_sha="$(git rev-parse HEAD)"
          record_manifest() {
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || return 125
            test "$(git hash-object tests/test_civ_rx_coverage.py)" = "$(git rev-parse "$SOURCE_SHA:tests/test_civ_rx_coverage.py")" || return 125
            {
              printf 'phase=%s\nsource_sha=%s\nsource_tree=%s\n' "$1" "$SOURCE_SHA" "$SOURCE_TREE"
              printf 'diag_sha=%s\ndiag_parent=%s\ndiag_tree=%s\n' "$DIAG_SHA" "$DIAG_BASE_SHA" "$(git rev-parse "$DIAG_SHA^{tree}")"
              printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
              printf 'original_source_blob=%s\ncurrent_source_blob=%s\n' "$(git rev-parse "$SOURCE_SHA:$source_file")" "$(git hash-object "$source_file")"
              printf 'test_blob=%s\n' "$(git hash-object tests/test_civ_rx_coverage.py)"
            } > "$1-manifest.txt"
          }
          restore_source() {
            label="$1"
            require_quiescent || return 125
            if [ "$proof_sequence" -eq 0 ]; then return 0; fi
            git restore --source="$SOURCE_SHA" --worktree -- "$source_file" || return 125
            test "$(git rev-parse HEAD)" = "$original_sha" || return 125
            test -z "$(git diff --name-only -- "$source_file")" || return 125
            {
              printf 'source_sha=%s\n' "$SOURCE_SHA"
              printf 'head_sha=%s\n' "$(git rev-parse HEAD)"
              printf 'source_diff=clean\n'
            } > "$label-restoration.txt" || return 125
            record_manifest "$label-restoration"
          }
          finish() {
            proof_exit=$?
            trap - EXIT
            trap '' INT TERM
            printf 'shell_exit=%s\ncatchable_signal_exit=%s\nquiescent=%s\n' "$proof_exit" "$proof_interrupt" "$proof_quiescent" > "$proof_containment/shell-exit.txt"
            require_quiescent || exit 125
            restore_source final || exit 125
            if [ "$proof_interrupt" -ne 0 ]; then exit "$proof_interrupt"; fi
            exit "$proof_exit"
          }
          trap finish EXIT

          mutation_cache="$(mktemp -d)"
          export UV_CACHE_DIR="$mutation_cache/uv"
          export PYTHONPYCACHEPREFIX="$mutation_cache/pycache"
          export PROOF_PHASE=bootstrap
          supervised uv sync --all-extras --frozen
          supervised uv run python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(os.environ["PROOF_CONTAINMENT_DIR"]).joinpath("project-python.json").write_text(
              json.dumps({"executable": sys.executable, "version": sys.version,
                          "version_info": list(sys.version_info), "requested": os.environ["UV_PYTHON"]}, indent=2) + "\n"
          )
          if sys.version_info[:2] != (3, 11):
              raise SystemExit("INVALID: project interpreter is not Python 3.11")
          PY

          run_selected() {
            label="$1"
            export PROOF_PHASE="$label"
            record_manifest "$label"
            proof_cache="$(mktemp -d)"
            export UV_CACHE_DIR="$proof_cache/uv"
            export PYTHONPYCACHEPREFIX="$proof_cache/pycache"
            supervised uv sync --all-extras --frozen
            export phases_file="$label-phases.json"
            set +e
            supervised uv run python - -q --junitxml="$label.xml" \
              tests/test_civ_rx_coverage.py::test_civ_ptt_readback_emits_canonical_observed_state \
              tests/test_civ_rx_coverage.py::test_unsolicited_civ_ptt_readback_has_unsolicited_provenance \
              tests/test_civ_rx_coverage.py::test_civ_ptt_producer_drops_non_ptt_foreign_and_echo_frames \
              tests/test_civ_rx_coverage.py::test_old_civ_epoch_ptt_readback_cannot_restore_observed_state \
              tests/test_civ_rx_coverage.py::test_old_store_generation_ptt_readback_cannot_restore_observed_state \
              tests/test_civ_rx_coverage.py::test_observed_ptt_expires_to_unknown_after_its_store_max_age \
              tests/test_civ_rx_coverage.py::test_malformed_ptt_payloads_preserve_legacy_behavior <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import pytest

          phases = []

          class PhaseRecorder:
              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_makereport(self, item, call):
                  result = yield
                  report = result.get_result()
                  phase = {"nodeid": report.nodeid, "when": report.when, "outcome": report.outcome}
                  if call.excinfo is not None:
                      error = call.excinfo.value
                      site = call.excinfo.traceback[-1]
                      phase.update(
                          exception_type=f"{type(error).__module__}.{type(error).__name__}",
                          message=str(error),
                          path=Path(site.path).resolve().relative_to(Path.cwd()).as_posix(),
                          line=site.lineno + 1,
                      )
                  phases.append(phase)

          result = pytest.main(sys.argv[1:], plugins=[PhaseRecorder()])
          Path(os.environ["phases_file"]).write_text(json.dumps(phases, indent=2) + "\n")
          raise SystemExit(result)
          PY
            pytest_rc=$?
            set -e
            export pytest_rc
            export junit_file="$label.xml"
          }

          assert_selected_green() {
          supervised uv run python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected_cases = {
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[off]"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[on]"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[empty]"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[two]"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[ff]"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[double-off]"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_readback_emits_canonical_observed_state[double-on]"),
              ("tests.test_civ_rx_coverage", "test_unsolicited_civ_ptt_readback_has_unsolicited_provenance"),
              ("tests.test_civ_rx_coverage", "test_civ_ptt_producer_drops_non_ptt_foreign_and_echo_frames"),
              ("tests.test_civ_rx_coverage", "test_old_civ_epoch_ptt_readback_cannot_restore_observed_state"),
              ("tests.test_civ_rx_coverage", "test_old_store_generation_ptt_readback_cannot_restore_observed_state"),
              ("tests.test_civ_rx_coverage", "test_observed_ptt_expires_to_unknown_after_its_store_max_age"),
              ("tests.test_civ_rx_coverage", "test_malformed_ptt_payloads_preserve_legacy_behavior[empty]"),
              ("tests.test_civ_rx_coverage", "test_malformed_ptt_payloads_preserve_legacy_behavior[two]"),
              ("tests.test_civ_rx_coverage", "test_malformed_ptt_payloads_preserve_legacy_behavior[ff]"),
              ("tests.test_civ_rx_coverage", "test_malformed_ptt_payloads_preserve_legacy_behavior[double-off]"),
              ("tests.test_civ_rx_coverage", "test_malformed_ptt_payloads_preserve_legacy_behavior[double-on]"),
          }
          root = ET.parse(os.environ["junit_file"]).getroot()
          cases = list(root.iter("testcase"))
          identities = {(case.attrib["classname"], case.attrib["name"]) for case in cases}
          failed = {case.attrib["name"] for case in cases if case.find("failure") is not None}
          errors = {case.attrib["name"] for case in cases if case.find("error") is not None}
          skipped = {case.attrib["name"] for case in cases if case.find("skipped") is not None}
          if os.environ.get("pytest_rc") != "0":
              raise SystemExit(f"expected pytest exit 0, got {os.environ.get('pytest_rc')}")
          if identities != expected_cases or len(cases) != 17:
              raise SystemExit(f"unexpected selected identities/count: {sorted(identities)!r} {len(cases)}")
          if failed or errors or skipped:
              raise SystemExit(
                  f"unexpected result: failures={sorted(failed)!r} "
                  f"errors={sorted(errors)!r} skips={sorted(skipped)!r}"
              )
          phases = json.loads(Path(os.environ["phases_file"]).read_text())
          expected_phases = {
              (f"tests/test_civ_rx_coverage.py::{name}", when)
              for _, name in expected_cases for when in ("setup", "call", "teardown")
          }
          if len(phases) != 51 or {(p["nodeid"], p["when"]) for p in phases} != expected_phases:
              raise SystemExit("unexpected green phase identities/count")
          if any(p["outcome"] != "passed" or "exception_type" in p for p in phases):
              raise SystemExit("unexpected non-passing green phase")
          PY
          }

          run_selected baseline
          assert_selected_green

          export PROOF_PHASE=negative-mutation
          supervised uv run python - <<'PY'
          from pathlib import Path

          path = Path("src/rigplane/runtime/_civ_rx.py")
          old = (
              '                    normalize_observed_ptt(\n'
              '                        False\n'
              '                        if frame.data == b"\\x00"\n'
              '                        else True\n'
              '                        if frame.data == b"\\x01"\n'
              '                        else None\n'
              '                    ),\n'
          )
          new = '                    normalize_observed_ptt(bool(frame.data and frame.data[0])),\n'
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f"negative mutation target count: {text.count(old)} (expected 1)")
          path.write_text(text.replace(old, new))
          PY
          git diff -- "$source_file" > negative.patch
          run_selected negative
          supervised uv run python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected_failed = {
              "test_civ_ptt_readback_emits_canonical_observed_state[empty]",
              "test_civ_ptt_readback_emits_canonical_observed_state[two]",
              "test_civ_ptt_readback_emits_canonical_observed_state[ff]",
              "test_civ_ptt_readback_emits_canonical_observed_state[double-off]",
              "test_civ_ptt_readback_emits_canonical_observed_state[double-on]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[empty]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[two]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[ff]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[double-off]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[double-on]",
          }
          expected_failure_values = {
              "test_civ_ptt_readback_emits_canonical_observed_state[empty]": "ObservedPtt.OFF",
              "test_civ_ptt_readback_emits_canonical_observed_state[two]": "ObservedPtt.ON",
              "test_civ_ptt_readback_emits_canonical_observed_state[ff]": "ObservedPtt.ON",
              "test_civ_ptt_readback_emits_canonical_observed_state[double-off]": "ObservedPtt.OFF",
              "test_civ_ptt_readback_emits_canonical_observed_state[double-on]": "ObservedPtt.ON",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[empty]": "ObservedPtt.OFF",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[two]": "ObservedPtt.ON",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[ff]": "ObservedPtt.ON",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[double-off]": "ObservedPtt.OFF",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[double-on]": "ObservedPtt.ON",
          }
          expected_names = {
              "test_civ_ptt_readback_emits_canonical_observed_state[off]",
              "test_civ_ptt_readback_emits_canonical_observed_state[on]",
              *expected_failed,
              "test_unsolicited_civ_ptt_readback_has_unsolicited_provenance",
              "test_civ_ptt_producer_drops_non_ptt_foreign_and_echo_frames",
              "test_old_civ_epoch_ptt_readback_cannot_restore_observed_state",
              "test_old_store_generation_ptt_readback_cannot_restore_observed_state",
              "test_observed_ptt_expires_to_unknown_after_its_store_max_age",
          }
          root = ET.parse(os.environ["junit_file"]).getroot()
          cases = list(root.iter("testcase"))
          failed = {case.attrib["name"] for case in cases if case.find("failure") is not None}
          errors = {case.attrib["name"] for case in cases if case.find("error") is not None}
          skipped = {case.attrib["name"] for case in cases if case.find("skipped") is not None}
          identities = {(case.attrib["classname"], case.attrib["name"]) for case in cases}
          if os.environ.get("pytest_rc") != "1":
              raise SystemExit(f"expected pytest exit 1, got {os.environ.get('pytest_rc')}")
          if failed != expected_failed:
              raise SystemExit(f"unexpected failed nodes: {sorted(failed)!r}")
          if identities != {("tests.test_civ_rx_coverage", name) for name in expected_names}:
              raise SystemExit(f"unexpected selected identities: {sorted(identities)!r}")
          if errors or skipped:
              raise SystemExit(f"unexpected errors/skips: {sorted(errors)!r} {sorted(skipped)!r}")
          if len(cases) != 17:
              raise SystemExit(f"expected 17 selected cases, got {len(cases)}")
          for case in cases:
              if case.attrib["name"] not in expected_failure_values:
                  continue
              message = case.find("failure").attrib.get("message", "")
              expected_value = expected_failure_values[case.attrib["name"]]
              if expected_value not in message or "ObservedPtt.UNKNOWN" not in message:
                  raise SystemExit(
                      f"unexpected failure message for {case.attrib['name']}: {message!r}"
                  )
          phases = json.loads(Path(os.environ["phases_file"]).read_text())
          expected_phases = {
              (f"tests/test_civ_rx_coverage.py::{name}", when)
              for name in expected_names for when in ("setup", "call", "teardown")
          }
          if len(phases) != 51 or {(p["nodeid"], p["when"]) for p in phases} != expected_phases:
              raise SystemExit("unexpected negative phase identities/count")
          for phase in phases:
              name = phase["nodeid"].split("::", 1)[1]
              if phase["when"] != "call" or name not in expected_failed:
                  if phase["outcome"] != "passed" or "exception_type" in phase:
                      raise SystemExit(f"unexpected control/setup/teardown failure: {phase!r}")
                  continue
              line = 1221 if name.startswith("test_civ_ptt_readback_") else 1375
              value = expected_failure_values[name]
              message = f"assert <{value}: '{value.rsplit('.', 1)[1].lower()}'> is <ObservedPtt.UNKNOWN: 'unknown'>"
              if (
                  phase["outcome"] != "failed"
                  or phase.get("exception_type") != "builtins.AssertionError"
                  or phase.get("path") != "tests/test_civ_rx_coverage.py"
                  or phase.get("line") != line
                  or phase.get("message", "").splitlines()[0:1] != [message]
              ):
                  raise SystemExit(f"unexpected negative CALL/type/site/message: {phase!r}")
          PY
          restore_source negative

          run_selected restored
          assert_selected_green

          export PROOF_PHASE=positive-mutation
          supervised uv run python - <<'PY'
          from pathlib import Path

          path = Path("src/rigplane/runtime/_civ_rx.py")
          old = (
              '                    normalize_observed_ptt(\n'
              '                        False\n'
              '                        if frame.data == b"\\x00"\n'
              '                        else True\n'
              '                        if frame.data == b"\\x01"\n'
              '                        else None\n'
              '                    ),\n'
          )
          new = (
              '                    normalize_observed_ptt(\n'
              '                        True\n'
              '                        if frame.data == b"\\x01"\n'
              '                        else False\n'
              '                        if frame.data == b"\\x00"\n'
              '                        else None\n'
              '                    ),\n'
          )
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f"positive mutation target count: {text.count(old)} (expected 1)")
          path.write_text(text.replace(old, new))
          PY
          git diff -- "$source_file" > positive.patch
          run_selected positive
          supervised uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["junit_file"]).getroot()
          cases = list(root.iter("testcase"))
          expected_names = {
              "test_civ_ptt_readback_emits_canonical_observed_state[off]",
              "test_civ_ptt_readback_emits_canonical_observed_state[on]",
              "test_civ_ptt_readback_emits_canonical_observed_state[empty]",
              "test_civ_ptt_readback_emits_canonical_observed_state[two]",
              "test_civ_ptt_readback_emits_canonical_observed_state[ff]",
              "test_civ_ptt_readback_emits_canonical_observed_state[double-off]",
              "test_civ_ptt_readback_emits_canonical_observed_state[double-on]",
              "test_unsolicited_civ_ptt_readback_has_unsolicited_provenance",
              "test_civ_ptt_producer_drops_non_ptt_foreign_and_echo_frames",
              "test_old_civ_epoch_ptt_readback_cannot_restore_observed_state",
              "test_old_store_generation_ptt_readback_cannot_restore_observed_state",
              "test_observed_ptt_expires_to_unknown_after_its_store_max_age",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[empty]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[two]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[ff]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[double-off]",
              "test_malformed_ptt_payloads_preserve_legacy_behavior[double-on]",
          }
          identities = {(case.attrib["classname"], case.attrib["name"]) for case in cases}
          failed = {case.attrib["name"] for case in cases if case.find("failure") is not None}
          errors = {case.attrib["name"] for case in cases if case.find("error") is not None}
          skipped = {case.attrib["name"] for case in cases if case.find("skipped") is not None}
          if os.environ.get("pytest_rc") != "0":
              raise SystemExit(f"expected pytest exit 0, got {os.environ.get('pytest_rc')}")
          if failed or errors or skipped:
              raise SystemExit(
                  f"unexpected result: failures={sorted(failed)!r} "
                  f"errors={sorted(errors)!r} skips={sorted(skipped)!r}"
              )
          if identities != {("tests.test_civ_rx_coverage", name) for name in expected_names}:
              raise SystemExit(f"unexpected selected identities: {sorted(identities)!r}")
          if len(cases) != 17:
              raise SystemExit(f"expected 17 selected cases, got {len(cases)}")
          PY
          assert_selected_green
          restore_source positive
          run_selected final-restored
          assert_selected_green

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icom-observed-ptt-mutation-proof
          path: |
            baseline.xml
            negative.xml
            positive.xml
            negative.patch
            positive.patch
            restored.xml
            final-restored.xml
            *-phases.json
            *-manifest.txt
            negative-restoration.txt
            positive-restoration.txt
            final-restoration.txt
            ${{ env.PROOF_CONTAINMENT_DIR }}
