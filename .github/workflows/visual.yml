name: Visual regression (pixel-diff)

# MOR-1090 — approved pixel-diff baselines for the v3 semantic surfaces,
# over the fixtures/ harness (MOR-1070/1085/1087/1088). Separate from
# quick.yml by design: path-filtered like quick.yml's frontend block, but
# isolated so a pixel-diff never blocks the Python lint/test gate quick.yml
# exists for.
#
# MOR-1396: browser system dependencies are installed explicitly and the
# approved baselines were re-pinned from real Linux runner output. This job
# is therefore a blocking visual regression gate.
#
# PR-ONLY GAP: this workflow triggers on `pull_request` only, not `push`, so
# it never runs on `main` — two individually-green PRs that each touch
# different baselines could jointly redden the approved set without either
# PR's own run catching it. Still accepted post-flip: unchanged by
# MOR-1386, tracked separately from the blocking-gate decision.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/visual.yml"

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Fails loud on its own: no `|| true` masking (same split rationale as
      # full.yml/quick.yml's capture-harness install step — MOR-1386). A
      # chromium download or `npm ci` failure red-flags THIS step — reads as
      # provisioning — and never reaches the pixel-diff step below.
      - name: Install deps + Playwright chromium
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Install Playwright Chromium system dependencies
        working-directory: frontend
        run: sudo -E env "PATH=$PATH" npx playwright install-deps chromium

      # Blocking after MOR-1396's explicit dependency provisioning and
      # Linux baseline re-pin.
      - name: Pixel-diff vs approved baselines
        id: visual
        run: cd frontend && npm run test:e2e:visual

      # Keep failure diagnostics available even though the pixel step is
      # blocking; a bare step condition would otherwise be skipped after it.
      - name: Upload diff report
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: frontend/test-results/
          retention-days: 14

      - name: Annotate failure
        if: always() && steps.visual.outcome == 'failure'
        run: echo "::error::Visual pixel-diff failed. See the visual-diff-report artifact."
