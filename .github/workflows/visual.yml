name: Visual regression (pixel-diff)

# MOR-1090 — approved pixel-diff baselines for the v3 semantic surfaces,
# over the fixtures/ harness (MOR-1070/1085/1087/1088). Separate from
# quick.yml by design: path-filtered like quick.yml's frontend block, but
# isolated so a pixel-diff never blocks the Python lint/test gate quick.yml
# exists for.
#
# MOR-1396: browser system dependencies are installed explicitly and the
# approved baselines were re-pinned from real Linux runner output.
#
# `push` to `main` runs the same pixel-diff under the
# same paths filter as `pull_request`, so two individually-green PRs that
# jointly redden the approved set are still caught on `main`. The
# concurrency group is keyed on the workflow, the event name and
# github.ref, so a push run on main and a workflow_dispatch run on main
# are in different groups. Push runs are informational: their failure
# annotation asks for a ticket, not a revert.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "frontend/**"
      - "!frontend/*.md"
      - "!frontend/*.mD"
      - "!frontend/*.Md"
      - "!frontend/*.MD"
      - "!frontend/*.rst"
      - "!frontend/*.rsT"
      - "!frontend/*.rSt"
      - "!frontend/*.rST"
      - "!frontend/*.RsT"
      - "!frontend/*.Rst"
      - "!frontend/*.RSt"
      - "!frontend/*.RST"
      - "!frontend/**/*.md"
      - "!frontend/**/*.mD"
      - "!frontend/**/*.Md"
      - "!frontend/**/*.MD"
      - "!frontend/**/*.rst"
      - "!frontend/**/*.rsT"
      - "!frontend/**/*.rSt"
      - "!frontend/**/*.rST"
      - "!frontend/**/*.RsT"
      - "!frontend/**/*.Rst"
      - "!frontend/**/*.RSt"
      - "!frontend/**/*.RST"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "!frontend/*.md"
      - "!frontend/*.mD"
      - "!frontend/*.Md"
      - "!frontend/*.MD"
      - "!frontend/*.rst"
      - "!frontend/*.rsT"
      - "!frontend/*.rSt"
      - "!frontend/*.rST"
      - "!frontend/*.RsT"
      - "!frontend/*.Rst"
      - "!frontend/*.RSt"
      - "!frontend/*.RST"
      - "!frontend/**/*.md"
      - "!frontend/**/*.mD"
      - "!frontend/**/*.Md"
      - "!frontend/**/*.MD"
      - "!frontend/**/*.rst"
      - "!frontend/**/*.rsT"
      - "!frontend/**/*.rSt"
      - "!frontend/**/*.rST"
      - "!frontend/**/*.RsT"
      - "!frontend/**/*.Rst"
      - "!frontend/**/*.RSt"
      - "!frontend/**/*.RST"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Re-pin baselines on the Linux runner, upload as artifact"
        type: boolean
        default: false

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.manual.outputs.frontend || steps.push.outputs.frontend }}
    steps:
      - name: Select product frontend changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
              - '!frontend/**/*.mD'
              - '!frontend/**/*.Md'
              - '!frontend/**/*.MD'
              - '!frontend/**/*.rst'
              - '!frontend/**/*.rsT'
              - '!frontend/**/*.rSt'
              - '!frontend/**/*.rST'
              - '!frontend/**/*.RsT'
              - '!frontend/**/*.Rst'
              - '!frontend/**/*.RSt'
              - '!frontend/**/*.RST'

      - name: Select manual visual run
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "frontend=true" >> "$GITHUB_OUTPUT"

      - name: Select push main run
        id: push
        # The push trigger's own paths filter already gated this run.
        if: github.event_name == 'push'
        run: echo "frontend=true" >> "$GITHUB_OUTPUT"

  visual:
    needs: changes
    # Draft pushes do not consume the shared self-hosted runner. ready_for_review
    # starts the visual run for the final candidate; manual regeneration is
    # still available through workflow_dispatch.
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.draft == false)
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    # MOR-3778: presetting the variables Chromium's browser process adds at
    # startup removed a headless_shell SIGSEGV in getenv in a minimal-environment
    # loop test. Nothing in this repo reads them.
    env:
      DBUS_SESSION_BUS_ADDRESS: 'disabled:'
      FC_FONTATIONS: '1'
      VK_ICD_FILENAMES: ''
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Fails loud on its own: no `|| true` masking (same split rationale as
      # full.yml/quick.yml's capture-harness install step — MOR-1386). A
      # chromium download or `npm ci` failure red-flags THIS step — reads as
      # provisioning — and never reaches the pixel-diff step below.
      - name: Install deps + Playwright chromium
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Install Playwright Chromium system dependencies
        working-directory: frontend
        run: sudo -E env "PATH=$PATH" npx playwright install-deps chromium

      - name: Pixel-diff vs approved baselines
        id: visual
        if: github.event.inputs.regenerate != 'true'
        run: cd frontend && npm run test:e2e:visual

      - name: Annotate failure
        if: always() && steps.visual.outcome == 'failure'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Visual pixel-diff failed on main. This push run is informational; open a ticket for the baseline drift instead of reverting the merge. See the Pixel-diff vs approved baselines step log."
          else
            echo "::error::Visual pixel-diff failed. See the Pixel-diff vs approved baselines step log."
          fi

      # MOR-2296 — manual re-pin route. A visual change small enough to stay
      # under the comparator floor (`COMPARATOR` in
      # playwright.visual.config.ts) leaves the pixel-diff step green. This
      # explicit route produces Linux-rendered PNGs for re-pinning and runs INSTEAD
      # of the pixel-diff step (their conditions are mutually exclusive),
      # writing into frontend/fixtures/approved-baselines/ via that config's
      # `snapshotPathTemplate`.
      #
      # `=all` is load-bearing: the bare `--update-snapshots` flag selects
      # mode `changed`, which is comparator-gated and so writes nothing for
      # exactly the sub-floor change this route exists to re-pin. Mode `all`
      # skips the comparator and rewrites every baseline whose raw bytes
      # differ from the freshly-rendered capture. That includes the
      # same-tree antialiasing noise fixtures/approved-baselines/README.md
      # records (3-123 differing pixels per capture), so the tradeoff is
      # accepted deliberately: each dispatch re-pins every capture rather
      # than only the ones that actually changed.
      - name: Regenerate approved baselines
        if: github.event.inputs.regenerate == 'true'
        run: cd frontend && npm run test:e2e:visual -- --update-snapshots=all

      # always(): upload whatever the step above wrote even if it exited
      # non-zero, so a partial re-pin is still downloadable.
      - name: Upload regenerated baselines
        if: always() && github.event.inputs.regenerate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-baselines
          path: frontend/fixtures/approved-baselines/
          retention-days: 3
