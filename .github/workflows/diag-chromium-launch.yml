name: 'Diag: Chromium launch (MOR-3778)'

on:
  pull_request:
    paths:
      - .github/workflows/diag-chromium-launch.yml
      - .github/scripts/diag_chromium_launch.mjs
      - .github/scripts/diag/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-chromium-launch
  cancel-in-progress: true

jobs:
  launch-loop:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Ensure Playwright chromium for capture
        run: |
          cd frontend
          npx playwright install chromium
      - name: Install Playwright Chromium system dependencies
        working-directory: frontend
        run: sudo -E env "PATH=$PATH" npx playwright install-deps chromium
      - name: Measure Chromium launches
        timeout-minutes: 38
        working-directory: frontend
        env:
          DIAG_LAUNCHES: '300'
          DIAG_WARM_LAUNCHES: '100'
          DIAG_PW_LAUNCHES: '150'
          DIAG_REAL_LAUNCHES: '150'
          DIAG_LOAD_WORKERS: '0'
          DIAG_SLOT: ${{ matrix.slot }}
        run: node ../.github/scripts/diag_chromium_launch.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chromium-launch-slot-${{ matrix.slot }}
          path: frontend/out
          retention-days: 5
          if-no-files-found: ignore
