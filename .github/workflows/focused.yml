name: Focused development checks

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character lowercase commit SHA to check
        required: true
        type: string
      pytest_targets:
        description: JSON array of tests/ files or pytest nodeids
        required: false
        default: "[]"
        type: string
      ruff_targets:
        description: JSON array of src/ or tests/ files/directories
        required: false
        default: "[]"
        type: string
      vitest_targets:
        description: JSON array of frontend/ Vitest file paths
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

concurrency:
  group: focused-${{ inputs.revision }}-${{ github.actor }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 15
    steps:
      - name: Check out trusted workflow controls
        uses: actions/checkout@v6
        with:
          ref: main
          path: control

      - name: Check out exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Validate and plan targets
        id: plan
        env:
          FOCUSED_REVISION: ${{ inputs.revision }}
          FOCUSED_PYTEST_TARGETS: ${{ inputs.pytest_targets }}
          FOCUSED_RUFF_TARGETS: ${{ inputs.ruff_targets }}
          FOCUSED_VITEST_TARGETS: ${{ inputs.vitest_targets }}
        run: >-
          python3 control/.github/scripts/run-focused-checks.py
          --repo target
          --plan "$RUNNER_TEMP/focused-plan.json"

      - name: Install uv
        if: steps.plan.outputs.has_python == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            target/pyproject.toml
            target/uv.lock

      - name: Set up Python 3.11
        if: steps.plan.outputs.has_python == 'true'
        working-directory: target
        run: uv python install 3.11

      - name: Install Python dependencies
        if: steps.plan.outputs.has_python == 'true'
        working-directory: target
        env:
          UV_PYTHON: "3.11"
        run: uv sync --all-extras

      - name: Set up Node.js
        if: steps.plan.outputs.has_frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: target/frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.plan.outputs.has_frontend == 'true'
        working-directory: target/frontend
        run: npm ci

      - name: Run focused checks
        env:
          FOCUSED_REVISION: ${{ inputs.revision }}
          FOCUSED_PYTEST_TARGETS: ${{ inputs.pytest_targets }}
          FOCUSED_RUFF_TARGETS: ${{ inputs.ruff_targets }}
          FOCUSED_VITEST_TARGETS: ${{ inputs.vitest_targets }}
          UV_PYTHON: "3.11"
        run: >-
          python3 control/.github/scripts/run-focused-checks.py
          --repo target
          --plan "$RUNNER_TEMP/focused-plan.json"
          --results "$RUNNER_TEMP/focused-results.json"
          --execute

      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.revision }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/focused-plan.json
            ${{ runner.temp }}/focused-results.json
          if-no-files-found: warn
          retention-days: 14
