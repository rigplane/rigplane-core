name: Private Core b14 artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-core-b14-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, build, X64]
    timeout-minutes: 25
    steps:
      - name: Check out reviewed workflow controls
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out frozen artifact source
        uses: actions/checkout@v6
        with:
          ref: 00b82396fb51617911273076dd8925058343e136
          path: target
          persist-credentials: false

      - name: Prepare owned build directory
        id: work
        shell: bash
        run: |
          set -euo pipefail
          artifact_root=$(mktemp -d "$RUNNER_TEMP/core-b14-artifact.XXXXXXXX")
          echo "root=$artifact_root" >> "$GITHUB_OUTPUT"
          {
            echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/.core-b14-dependencies/uv"
            echo "UV_PYTHON_INSTALL_DIR=$GITHUB_WORKSPACE/.core-b14-dependencies/python"
            echo "NPM_CONFIG_CACHE=$GITHUB_WORKSPACE/.core-b14-dependencies/npm"
          } >> "$GITHUB_ENV"

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-python: true
          cache-local-path: ${{ github.workspace }}/.core-b14-dependencies/uv
          cache-suffix: core-b14-${{ runner.os }}-${{ runner.arch }}
          cache-dependency-glob: |
            target/pyproject.toml
            target/uv.lock
          prune-cache: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: target/frontend/package-lock.json

      - name: Build and verify installed artifacts
        timeout-minutes: 20
        shell: bash
        env:
          CORE_ARTIFACT_ROOT: ${{ steps.work.outputs.root }}
        run: |
          set -euo pipefail
          bash control/.github/scripts/build-private-core-b14-artifact.sh \
            2>&1 | tee "$CORE_ARTIFACT_ROOT/build.log"

      - name: Exclude product package and record dependency caches
        env:
          CORE_ARTIFACT_ROOT: ${{ steps.work.outputs.root }}
          UV_CACHE_KEY: ${{ steps.uv.outputs.cache-key }}
          UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          PYTHON_CACHE_HIT: ${{ steps.uv.outputs.python-cache-hit }}
          NPM_CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: |
          set -euo pipefail
          uv cache clean rigplane
          {
            printf 'uv_cache_key=%s\n' "$UV_CACHE_KEY"
            printf 'uv_cache_hit=%s\n' "$UV_CACHE_HIT"
            printf 'python_cache_hit=%s\n' "$PYTHON_CACHE_HIT"
            printf 'npm_cache_hit=%s\n' "$NPM_CACHE_HIT"
            printf 'python_install_dir=%s\n' "$(uv python dir)"
            du -sk "$UV_CACHE_DIR" "$UV_PYTHON_INSTALL_DIR" "$NPM_CONFIG_CACHE"
          } > "$CORE_ARTIFACT_ROOT/dependency-cache.txt"

      - name: Finalize receipt after build log closes
        timeout-minutes: 2
        env:
          CORE_ARTIFACT_ROOT: ${{ steps.work.outputs.root }}
          PYTHONPATH: ''
          PYTHONNOUSERSITE: '1'
        run: >-
          "$CORE_ARTIFACT_ROOT/installed/bin/python"
          "$CORE_ARTIFACT_ROOT/inputs/artifact-receipt.py"
          "$CORE_ARTIFACT_ROOT"

      - name: Retain artifacts and acceptance evidence
        timeout-minutes: 3
        if: always() && steps.work.outputs.root != ''
        uses: actions/upload-artifact@v7
        with:
          name: core-b14-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.work.outputs.root }}/dist/*
            ${{ steps.work.outputs.root }}/*.json
            ${{ steps.work.outputs.root }}/*.txt
            ${{ steps.work.outputs.root }}/*.log
            ${{ steps.work.outputs.root }}/inputs/*
          if-no-files-found: warn
          retention-days: 14
