name: Docs-only quick status

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  publish-docs-only-quick-status:
    # Keep the protected `quick` context green for an exact docs-only review
    # head without allocating the self-hosted test runner or checking out code.
    # pull_request_target keeps the workflow and token policy base-controlled;
    # this job uses API metadata only and never executes pull-request contents.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish docs-only quick status
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const {data: initialPull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const headSha = initialPull.head.sha;
            const changedFiles = initialPull.changed_files;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            if (!Number.isSafeInteger(changedFiles) || changedFiles <= 0 || changedFiles >= 3000 || files.length !== changedFiles) {
              core.info('Documentation file enumeration is incomplete; no status was published.');
              return;
            }
            const baseSha = initialPull.base.sha;
            const {data: predicateFile} = await github.rest.repos.getContent({
              owner, repo, path: '.github/scripts/docs-only-paths.js', ref: baseSha,
            });
            if (Array.isArray(predicateFile) || predicateFile.type !== 'file' || predicateFile.encoding !== 'base64' || typeof predicateFile.content !== 'string') {
              throw new Error('Trusted docs-only predicate content is invalid.');
            }
            const predicateModule = {exports: {}};
            new Function('module', 'exports', Buffer.from(predicateFile.content, 'base64').toString('utf8'))(predicateModule, predicateModule.exports);
            if (typeof predicateModule.exports.allDocumentationFiles !== 'function') {
              throw new Error('Trusted docs-only predicate export is invalid.');
            }
            if (!predicateModule.exports.allDocumentationFiles(files)) {
              core.info('Not a documentation-only pull request; quick.yml owns the required context.');
              return;
            }
            const {data: currentPull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (currentPull.head.sha !== headSha || currentPull.base.sha !== baseSha) {
              core.info('Pull request head or base changed during docs-only classification; no status was published.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: 'success',
              context: 'quick',
              description: 'Documentation-only change; product checks are not selected.',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
