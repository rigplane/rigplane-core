name: Rebrand grep gate

# Wave 2 final gate: fail any PR that introduces an `icom-lan` /
# `icom_lan` / `IcomLanError` reference outside the preserved-by-design
# allow-list. See .github/scripts/check-rebrand-allowlist.sh for the
# rationale and the allow-list.
#
# Required check (proposal 2026-11-14): #4576 merged with a red grep-gate
# because the gate was informational. To be a required context on main it
# must report on every pull request and on every merge group:
# - pull_request has no path filter. A path-filtered required workflow that
#   does not start leaves the context missing and blocks the PR forever; the
#   gate is a sub-second git grep on a light runner, so running it on docs and
#   CI-only diffs costs one light job (and also catches a brand reference
#   added in docs, which the full-tree grep covers anyway).
# - merge_group: the queue waits for every required context on the queue
#   commit; without this trigger the queue would stall until its timeout.
# No push trigger: the merge group tested the exact tree that lands on main
# (MOR-3878).

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  # Also called by full.yml for the scheduled run on main (MOR-3878).
  workflow_call:

concurrency:
  group: rebrand-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grep-gate:
    # Sub-second git-grep + bash filter, no toolchain needed. It runs on the
    # light runners, off the build pool, so protected-branch merges are not
    # blocked when the self-hosted build runners are offline or occupied.
    runs-on: [self-hosted, Linux, ARM64, light]
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Wave 2 rebrand grep gate
        run: .github/scripts/check-rebrand-allowlist.sh
