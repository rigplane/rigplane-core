name: Rebrand grep gate

# Wave 2 final gate: fail any push or PR that introduces an `icom-lan` /
# `icom_lan` / `IcomLanError` reference outside the preserved-by-design
# allow-list. See .github/scripts/check-rebrand-allowlist.sh for the
# rationale and the allow-list.
#
# Documentation and CI-control-only diffs are reviewed independently and skip
# this repository-wide grep. Mixed product changes still run it because
# paths-ignore suppresses a workflow only when every changed path is ignored.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.rst"
      - "**/*.md"
      - "**/*.rst"
      - ".claude/**"
      - ".github/**"
      - "tests/test_ci_path_filters.py"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.rst"
      - "**/*.md"
      - "**/*.rst"
      - ".claude/**"
      - ".github/**"
      - "tests/test_ci_path_filters.py"

concurrency:
  group: rebrand-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grep-gate:
    # Sub-second git-grep + bash filter, no toolchain needed. Keep this on a
    # GitHub-hosted runner so protected-branch merges are not blocked when
    # self-hosted runners are offline or occupied.
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Wave 2 rebrand grep gate
        run: .github/scripts/check-rebrand-allowlist.sh
