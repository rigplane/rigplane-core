name: Certification status

# Reads the scheduled bench-nightly history from the Actions API (no artifacts)
# and reports whether every listed radio has enough consecutive PASS nights.
# Read-only: it never touches the bench. Rules: docs/internals/bench-nightly.md.

on:
  workflow_dispatch:
    inputs:
      radios:
        description: "Comma-separated radio labels (empty: every radio in the newest scheduled run)"
        required: false
        default: ""
        type: string
      nights:
        description: "Consecutive PASS nights required per radio"
        required: false
        default: "3"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Certification status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADIOS: ${{ inputs.radios }}
          NIGHTS: ${{ inputs.nights || '3' }}
        run: python3 .github/scripts/certification_status.py --radios "$RADIOS" --nights "$NIGHTS"
