name: Tests (quick)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - "**/*.md"
      - "**/*.mD"
      - "**/*.Md"
      - "**/*.MD"
      - "**/*.rst"
      - "**/*.rsT"
      - "**/*.rSt"
      - "**/*.rST"
      - "**/*.RsT"
      - "**/*.Rst"
      - "**/*.RSt"
      - "**/*.RST"
      - "mkdocs.yml"
      - ".github/scripts/doc-citation-baseline.txt"
      - ".github/scripts/doc-citation-dangling-baseline.txt"
      - ".github/scripts/doc-link-baseline.txt"
      - "AUTHORS"
      - "COPYING"
      - "LICENSE"
      - "LICENSE.txt"
      - "NOTICE"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  classify:
    # A pure-doc PR only needs this GitHub-hosted API classification. It does
    # not check out the repository, install dependencies, or run tests.
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.pr_paths.outputs.core || steps.push_paths.outputs.core }}
      frontend: ${{ steps.pr_paths.outputs.frontend || steps.push_paths.outputs.frontend }}
      ci: ${{ steps.pr_paths.outputs.ci || steps.push_paths.outputs.ci }}
      docs: ${{ steps.pr_paths.outputs.docs || steps.push_paths.outputs.docs }}
    steps:
      - name: Classify exact changed paths
        id: pr_paths
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const documentationExact = new Set([
              '.github/scripts/doc-citation-baseline.txt',
              '.github/scripts/doc-citation-dangling-baseline.txt',
              '.github/scripts/doc-link-baseline.txt',
              'AUTHORS', 'COPYING', 'LICENSE', 'LICENSE.txt', 'NOTICE', 'mkdocs.yml',
            ]);
            const documentation = (path) => {
              const parts = path.split('/');
              return parts[0] === 'docs' || parts[0] === '.claude' ||
                /\.(md|rst)$/i.test(path) || documentationExact.has(path);
            };
            const ci = (path) => path === 'tests/test_ci_path_filters.py' ||
              (path.startsWith('.github/') && !documentation(path));
            const frontend = (path) => !documentation(path) &&
              (path.startsWith('frontend/') || path.startsWith('src/rigplane/web/'));
            const productCore = (path) => !documentation(path) && !ci(path) &&
              (path.startsWith('src/') || path.startsWith('tests/') ||
                path.startsWith('rigs/') || path.startsWith('contracts/') ||
                ['pyproject.toml', 'uv.lock', '.importlinter'].includes(path));
            const paths = files.map(({filename}) => filename);
            if (paths.length === 0) {
              core.setFailed('Pull request has no changed paths to classify.');
              return;
            }
            core.setOutput('core', String(paths.some(productCore)));
            core.setOutput('frontend', String(paths.some(frontend)));
            core.setOutput('ci', String(paths.some(ci)));
            core.setOutput('docs', String(paths.every(documentation)));

      # Pushes that reach this workflow are not docs-only because the trigger
      # above excludes that class. Preserve the existing exact-diff classifier
      # for all product and CI pushes.
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - name: Classify exact changed paths on push
        id: push_paths
        if: github.event_name == 'push'
        env:
          QUICK_BASE_SHA: ${{ github.event.before }}
          QUICK_HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/classify-quick-paths.py
          --repo .
          --base "$QUICK_BASE_SHA"
          --head "$QUICK_HEAD_SHA"

  quick:
    needs: classify
    # Draft pushes are development checkpoints, not immutable review heads.
    # The ready_for_review event starts the one natural expensive run once the
    # candidate is ready. Docs-only diffs produce the required server-side
    # skipped `quick` context, with no runner allocation.
    if: >-
      always() &&
      needs.classify.outputs.docs != 'true' &&
      (github.event_name == 'push' ||
      github.event.pull_request.draft == false)
    # Self-hosted Mac mini build-tier runner. Python 3.11+/uv/Node 24/Rust
    # and the Tauri/audio system libs are pre-baked in the image, so this
    # job avoids the ubuntu-latest pickup + apt install passes. Operator
    # doc: rigplane-tower/docs/development/mac-mini-self-hosted-runners.md.
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    env:
      # Pin uv to the project's minimum Python. Without this, `uv run`
      # satisfies requires-python=">=3.11" with the newest interpreter on
      # the runner (3.13), so the "Python 3.11" job silently tested 3.13
      # (MOR-590).
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v6
        with:
          # Architecture debt guards compare HEAD with the reachable PR base.
          fetch-depth: 2

      - name: Install uv
        if: needs.classify.outputs.core == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        if: needs.classify.outputs.core == 'true'
        run: uv python install 3.11

      - name: Install dependencies
        if: needs.classify.outputs.core == 'true'
        # --all-extras (not --extra dev --extra bridge, MOR-1978): `dev`
        # already installed its packages (pytest, ruff, mypy, pydantic,
        # jsonschema, ...) and `bridge` is `[]` (pyproject.toml, a no-op
        # alias) — but neither flag named `scope` (Pillow), `dsp` (scipy), or
        # `webrtc` (aiortc), the extras that gate 62 tests in tests/. Those
        # tests ran skipped in CI while still showing green. `uv sync
        # --all-extras` installs every extra declared in pyproject.toml's
        # [project.optional-dependencies], so those tests run instead of
        # skipping.
        run: uv sync --all-extras

      - name: Agent Review Gate parser tests
        if: needs.classify.outputs.ci == 'true'
        run: node --test .github/scripts/agent-review-gate.test.js

      - name: Focused workflow contract tests
        if: needs.classify.outputs.ci == 'true'
        run: python3 .github/scripts/run-focused-checks.test.py

      - name: Quick path and event contract tests
        if: needs.classify.outputs.ci == 'true'
        run: python3 .github/scripts/quick-path-filters.test.py

      - name: Compile Python workflow controls
        if: needs.classify.outputs.ci == 'true'
        run: python3 -m py_compile .github/scripts/*.py

      - name: Ruff (lint + format check)
        if: needs.classify.outputs.core == 'true'
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Lint architecture (import-linter)
        if: needs.classify.outputs.core == 'true'
        run: uv run lint-imports

      - name: Validation dry-run golden gate (IC-7610)
        if: needs.classify.outputs.core == 'true'
        # Native dry-run matrix vs the committed golden artifact: a
        # registry/declaration regression fails CI (MOR-648). Dry-run only —
        # no hardware, sub-second. Regen after an intentional matrix change:
        #   uv run rigplane --model IC-7610 validate --dry-run \
        #     --regen-golden tests/golden/validation/ic7610.dry-run.json
        # (same for X6200 / FTX-1 below — MOR-636.)
        run: >-
          uv run rigplane --model IC-7610 validate --provider native --dry-run
          --gate tests/golden/validation/ic7610.dry-run.json

      - name: Validation dry-run golden gate (X6200)
        if: needs.classify.outputs.core == 'true'
        run: >-
          uv run rigplane --model X6200 validate --provider native --dry-run
          --gate tests/golden/validation/x6200.dry-run.json

      - name: Validation dry-run golden gate (FTX-1)
        if: needs.classify.outputs.core == 'true'
        run: >-
          uv run rigplane --model FTX-1 validate --provider native --dry-run
          --gate tests/golden/validation/ftx1.dry-run.json

      - name: Set up Node.js
        if: needs.classify.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install + check + tests + build
        if: needs.classify.outputs.frontend == 'true'
        run: |
          cd frontend
          npm ci
          npm run i18n:check
          npm run check
          npx vitest run
          npm run build
          rm -f ../src/rigplane/web/static
          mkdir -p ../src/rigplane/web/static
          cp -r dist/* ../src/rigplane/web/static/

      # Explicit, fail-loud browser provisioning ahead of both browser test
      # suites. A red install step reads as provisioning, not as a fixture
      # regression.
      - name: Ensure Playwright chromium for capture
        if: needs.classify.outputs.frontend == 'true'
        run: |
          cd frontend
          npx playwright install chromium

      - name: Install Playwright Chromium system dependencies
        if: needs.classify.outputs.frontend == 'true'
        working-directory: frontend
        run: sudo -E env "PATH=$PATH" npx playwright install-deps chromium

      - name: Frontend i18n visual smoke (RP-ML-006)
        id: i18n-visual
        if: needs.classify.outputs.frontend == 'true'
        run: npm run test:e2e:i18n
        working-directory: frontend

      # MOR-1400 Slice B: expected images are accepted only after an explicit
      # Linux re-pin. Keep actual/expected/diff output from an intentional
      # missing-baseline RED run (or a later regression) so review has the
      # authentic production evidence; CI never writes baseline files.
      - name: Upload production design-language visual diagnostics (PR)
        if: always() && needs.classify.outputs.frontend == 'true' && steps.i18n-visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mor-1400-production-visual-diagnostics
          path: |
            frontend/tests/e2e/i18n/.output/
            frontend/tests/e2e/i18n/__screenshots__/production-design-language/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Annotate production design-language visual result
        if: always() && needs.classify.outputs.frontend == 'true' && steps.i18n-visual.outcome == 'failure'
        run: echo "::error::Production design-language pixel gate failed. See the mor-1400-production-visual-diagnostics artifact."

      # MOR-1382 — wires the MOR-1070/1085/1087/1088 browser fixture-harness
      # capture (`frontend/fixtures/capture.mjs`) into the PR leg. Gated by
      # the SAME `needs.classify.outputs.frontend` path filter as the rest of
      # this frontend block (frontend/** or src/rigplane/web/**) —
      # minimum Actions minutes is a hard project policy (CLAUDE.md), so
      # this never runs on an unrelated push/PR.
      #
      # BLOCKING since MOR-1386 (v3 gate promotion, session-9): this step
      # used to run `continue-on-error: true` for one cycle (MOR-1382);
      # that cycle is closed — quick-leg green on PR #2286 run 31127603844,
      # full-leg green on dispatched run 31137987620 — so the owner flipped
      # it to blocking here. The browser and system-dependency provisioning
      # steps above fail loud on their own, so a red here means a fixture
      # regression only.
      - name: Frontend fixture-harness capture
        id: capture
        if: needs.classify.outputs.frontend == 'true'
        run: node frontend/fixtures/capture.mjs

      - name: Upload fixture-harness capture (PR)
        if: always() && needs.classify.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-harness-capture-pr
          path: frontend/fixtures-baselines/
          retention-days: 14

      - name: Annotate fixture-harness capture result
        if: always() && needs.classify.outputs.frontend == 'true'
        run: |
          if [ "${{ steps.capture.outcome }}" = "failure" ]; then
            echo "::error::Fixture-harness capture FAILED — blocking since MOR-1386 gate promotion. See the fixture-harness-capture-pr artifact."
          fi

      - name: Type-check web boundary
        if: needs.classify.outputs.core == 'true' && needs.classify.outputs.frontend == 'true'
        run: uv run mypy --strict src/rigplane/web

      - name: Run tests
        id: tests
        if: needs.classify.outputs.core == 'true'
        run: |
          # Without pipefail the pipe's exit status is tee's (always 0), so
          # pytest failures were swallowed and the step reported success.
          # Capture pytest's exit code via PIPESTATUS, extract the summary
          # (still needed for the badge, including on failure), then exit
          # with pytest's code so failing tests fail the step.
          uv run pytest tests/ -n auto --tb=short --timeout=300 --timeout-method=thread \
            | tee pytest-output.txt
          rc=${PIPESTATUS[0]}
          SUMMARY=$(tail -1 pytest-output.txt)
          PASSED=$(echo "$SUMMARY" | grep -oP '\d+ passed' | grep -oP '\d+' || echo "0")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Extract version
        if: github.ref == 'refs/heads/main' && needs.classify.outputs.core == 'true'
        id: version
        run: |
          VERSION=$(uv run python -c "from importlib.metadata import version; print(version('rigplane'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update tests badge
        if: github.ref == 'refs/heads/main' && needs.classify.outputs.core == 'true' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-tests.json
          label: tests
          message: "${{ steps.tests.outputs.passed }} passed"
          color: ${{ steps.tests.outcome == 'success' && 'brightgreen' || 'red' }}

      - name: Update version badge
        if: github.ref == 'refs/heads/main' && needs.classify.outputs.core == 'true' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-version.json
          label: version
          message: "v${{ steps.version.outputs.version }}"
          color: blue

      - name: Update mypy badge
        if: github.ref == 'refs/heads/main' && needs.classify.outputs.frontend == 'true' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-mypy.json
          label: mypy
          message: "0 errors"
          color: blue

      - name: Summarize quick-check selection
        if: always()
        run: |
          if [ "${{ needs.classify.result }}" != "success" ]; then
            echo "::error::Changed-path classification failed."
            exit 1
          fi
          echo "Core checks selected: ${{ needs.classify.outputs.core }}"
          echo "Frontend checks selected: ${{ needs.classify.outputs.frontend }}"
          echo "CI contract checks selected: ${{ needs.classify.outputs.ci }}"
          echo "Docs-only quick skipped: ${{ needs.classify.outputs.docs }}"
