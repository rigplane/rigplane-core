name: Tests (quick)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".importlinter"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".importlinter"
      - ".github/workflows/**"

concurrency:
  group: tests-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    # Self-hosted Mac mini build-tier runner. Python 3.11+/uv/Node 24/Rust
    # and the Tauri/audio system libs are pre-baked in the image, so this
    # job avoids the ubuntu-latest pickup + apt install passes. Operator
    # doc: rigplane-tower/docs/development/mac-mini-self-hosted-runners.md.
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 10
    env:
      # Pin uv to the project's minimum Python. Without this, `uv run`
      # satisfies requires-python=">=3.11" with the newest interpreter on
      # the runner (3.13), so the "Python 3.11" job silently tested 3.13
      # (MOR-590).
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v6

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'src/rigplane/web/**'
              - '.github/workflows/quick.yml'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra bridge

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Lint architecture (import-linter)
        run: uv run lint-imports

      - name: Validation dry-run golden gate (IC-7610)
        # Native dry-run matrix vs the committed golden artifact: a
        # registry/declaration regression fails CI (MOR-648). Dry-run only —
        # no hardware, sub-second. Regen after an intentional matrix change:
        #   uv run rigplane --model IC-7610 validate --dry-run \
        #     --regen-golden tests/golden/validation/ic7610.dry-run.json
        # (same for X6200 / FTX-1 below — MOR-636.)
        run: >-
          uv run rigplane --model IC-7610 validate --provider native --dry-run
          --gate tests/golden/validation/ic7610.dry-run.json

      - name: Validation dry-run golden gate (X6200)
        run: >-
          uv run rigplane --model X6200 validate --provider native --dry-run
          --gate tests/golden/validation/x6200.dry-run.json

      - name: Validation dry-run golden gate (FTX-1)
        run: >-
          uv run rigplane --model FTX-1 validate --provider native --dry-run
          --gate tests/golden/validation/ftx1.dry-run.json

      - name: Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install + check + tests + build
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd frontend
          npm ci
          npm run i18n:check
          npm run check
          npx vitest run
          npm run build
          rm -f ../src/rigplane/web/static
          mkdir -p ../src/rigplane/web/static
          cp -r dist/* ../src/rigplane/web/static/

      - name: Frontend i18n visual smoke (RP-ML-006)
        if: steps.filter.outputs.frontend == 'true'
        # Runs the localization screenshot pack against the freshly built
        # `frontend/dist/`. The self-hosted Mac mini Linux runner needs the
        # Playwright system deps (libnss3, libnspr4, etc.) installed at the
        # OS level via `npx playwright install --with-deps chromium` (one
        # time, by the runner operator) before this step can pass. Marked
        # continue-on-error until provisioning lands; the baseline tests
        # still run + the screenshots upload as artifacts for review.
        continue-on-error: true
        run: |
          cd frontend
          npx playwright install chromium >/dev/null 2>&1 || true
          npm run test:e2e:i18n

      # Explicit, fail-loud chromium provisioning check ahead of the capture
      # step below. The i18n smoke step above also installs chromium, but
      # that install is masked by `|| true` AND the whole step is
      # `continue-on-error: true` (RP-ML-006, untouched by MOR-1386) — a
      # chromium download failure there would surface silently and only
      # show up downstream as a missing-browser crash in the capture step,
      # indistinguishable from a fixture regression. `playwright install` is
      # idempotent (no-op if the browser is already cached), so this is
      # cheap when the i18n step's install already succeeded, and fails
      # loud on its own step — reading as "provisioning", not "fixtures" —
      # when it didn't.
      - name: Ensure Playwright chromium for capture
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd frontend
          npx playwright install chromium

      - name: Install Playwright Chromium system dependencies
        if: steps.filter.outputs.frontend == 'true'
        working-directory: frontend
        run: sudo -E env "PATH=$PATH" npx playwright install-deps chromium

      # MOR-1382 — wires the MOR-1070/1085/1087/1088 browser fixture-harness
      # capture (`frontend/fixtures/capture.mjs`) into the PR leg. Gated by
      # the SAME `steps.filter.outputs.frontend` path filter as the rest of
      # this frontend block (frontend/**, src/rigplane/web/**, or this
      # workflow changed) —
      # minimum Actions minutes is a hard project policy (CLAUDE.md), so
      # this never runs on an unrelated push/PR.
      #
      # BLOCKING since MOR-1386 (v3 gate promotion, session-9): this step
      # used to run `continue-on-error: true` for one cycle (MOR-1382);
      # that cycle is closed — quick-leg green on PR #2286 run 31127603844,
      # full-leg green on dispatched run 31137987620 — so the owner flipped
      # it to blocking here. The browser and system-dependency provisioning
      # steps above fail loud on their own, so a red here means a fixture
      # regression only.
      - name: Frontend fixture-harness capture
        id: capture
        if: steps.filter.outputs.frontend == 'true'
        run: node frontend/fixtures/capture.mjs

      - name: Upload fixture-harness capture (PR)
        if: always() && steps.filter.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-harness-capture-pr
          path: frontend/fixtures-baselines/
          retention-days: 14

      - name: Annotate fixture-harness capture result
        if: always() && steps.filter.outputs.frontend == 'true'
        run: '[ "${{ steps.capture.outcome }}" = "failure" ] && echo "::error::Fixture-harness capture FAILED — blocking since MOR-1386 gate promotion. See the fixture-harness-capture-pr artifact." || true'

      - name: Type-check web boundary
        if: steps.filter.outputs.frontend == 'true'
        run: uv run mypy --strict src/rigplane/web

      - name: Run tests
        id: tests
        run: |
          # Without pipefail the pipe's exit status is tee's (always 0), so
          # pytest failures were swallowed and the step reported success.
          # Capture pytest's exit code via PIPESTATUS, extract the summary
          # (still needed for the badge, including on failure), then exit
          # with pytest's code so failing tests fail the step.
          uv run pytest tests/ --ignore=tests/integration -n auto --tb=short --timeout=300 --timeout-method=thread \
            | tee pytest-output.txt
          rc=${PIPESTATUS[0]}
          SUMMARY=$(tail -1 pytest-output.txt)
          PASSED=$(echo "$SUMMARY" | grep -oP '\d+ passed' | grep -oP '\d+' || echo "0")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Extract version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(uv run python -c "from importlib.metadata import version; print(version('rigplane'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update tests badge
        if: github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-tests.json
          label: tests
          message: "${{ steps.tests.outputs.passed }} passed"
          color: ${{ steps.tests.outcome == 'success' && 'brightgreen' || 'red' }}

      - name: Update version badge
        if: github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-version.json
          label: version
          message: "v${{ steps.version.outputs.version }}"
          color: blue

      - name: Update mypy badge
        if: github.ref == 'refs/heads/main' && always()
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bce917f4007ac491e527e142564fbbae
          filename: rigplane-mypy.json
          label: mypy
          message: "0 errors"
          color: blue
