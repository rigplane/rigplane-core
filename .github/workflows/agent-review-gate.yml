name: Agent Review Gate

# Local-verdict gate (owner directive 2026-10-21, supersedes MOR-3616): the status
# is green when the strict exact-head `Agent Review: PASS <sha>` directive exists
# (posted by pro-gate.sh after a LOCAL review of that head: Codex CLI, or Spark
# when Codex built the change) and no BLOCKED directive is active. The GitHub
# Codex bot review and its open P0-P2 threads are advisory: they only appear in
# the status text, nobody waits for them. The `built-by-gpt` label no longer
# changes the verdict.
# Rules and logic: .github/scripts/codex-review-gate.js
# (shared verbatim with rigplane-pro), .github/scripts/agent-review-gate.js
# (the directive parser), AGENTS.md "Protected main and review gate".
on:
  pull_request:
    # labeled/unlabeled: the `built-by-gpt` label changes the verdict.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  # Resolving a review thread fires no workflow event and GitHub Actions has no
  # pull_request_review_thread trigger: re-evaluate on demand with
  # `gh workflow run agent-review-gate.yml -f pr_number=N`.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to re-evaluate
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  # The group carries the same verdict-relevance predicate as the job `if:`
  # below: a run skipped by that `if:` is still a workflow run in its group,
  # so without the predicate here a plain comment posted within seconds of a
  # directive would cancel the in-flight evaluation and publish nothing,
  # leaving a stale status. Qualifying runs share the per-PR 'eval' group;
  # every non-qualifying run lands in its own github.run_id group and cancels
  # nothing. cancel-in-progress stays true for qualifying runs because a
  # newer qualifying run re-lists and re-evaluates every PR comment, so the
  # superseded evaluation's verdict is recomputed from scratch. The predicate
  # also covers the events that carry Codex's verdict: a Codex PR review, any
  # comment by the Codex bot (its summary comment is edited in place on every
  # review, so `edited` matters), and the manual re-evaluation dispatch.
  # Per-run REST calls, counted from the steps below: 3 fixed calls
  # (pulls.get, repos.getCommit, repos.createCommitStatus), plus one
  # issues.listComments page per 100 comments, plus one pulls.listReviews page
  # per 100 reviews. The review threads come from GraphQL (one query page per
  # 100 threads), which is not a REST call.
  group: agent-review-gate-${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'Agent Review:') || contains(github.event.changes.body.from, 'Agent Review:'))) || (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')) && 'eval' || github.run_id }}
  cancel-in-progress: true

jobs:
  agent-review:
    name: Update Agent Review Gate status
    # Only events that can change the verdict run the job. Every directive
    # body contains the literal marker 'Agent Review:' (the parser requires
    # it on the first non-blank line; contains() is case-insensitive, a
    # superset). An edit that turns a directive into prose is caught through
    # the pre-edit body github.event.changes.body.from; a deletion carries
    # the deleted comment's body in github.event.comment.body. Codex's own
    # comments (summary, receipt) carry no directive, so they are matched by
    # author instead; its reviews arrive as pull_request_review events.
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'Agent Review:') || contains(github.event.changes.body.from, 'Agent Review:'))) || (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    # API-only workflow via actions/github-script -- no compile/test toolchain
    # needed. It stays off the build pool on the light runners so PR merges
    # are not blocked when self-hosted build runners are offline or occupied.
    runs-on: [self-hosted, linux, light]
    timeout-minutes: 5

    steps:
      - name: Resolve pull request number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number =
              context.payload.pull_request?.number ??
              context.payload.issue?.number ??
              Number(context.payload.inputs?.pr_number);
            const {owner, repo} = context.repo;
            const {data: pull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            core.setOutput('number', String(number));
            core.setOutput('head_sha', pull.head.sha);
            // Same name as GPT_BUILT_LABEL in codex-review-gate.js (pinned by a test). It is spelled
            // out here, not required from the module, because this step runs before the checkout:
            // the exact-head failure status below must not depend on the checkout succeeding.
            core.setOutput('gpt_built', String(pull.labels.some((label) => label.name === 'built-by-gpt')));
            const {data: commit} = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: pull.head.sha,
            });
            const committedAt =
              commit.commit.committer?.date ??
              commit.commit.author?.date ??
              pull.updated_at;
            core.setOutput('committed_at', committedAt);

      - name: Check out the workflow revision
        if: always() && steps.pr.outputs.head_sha != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Update required Agent Review Gate status
        if: always() && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number('${{ steps.pr.outputs.number }}');
            const head_sha = '${{ steps.pr.outputs.head_sha }}';
            const committed_at = new Date('${{ steps.pr.outputs.committed_at }}');
            const {owner, repo} = context.repo;
            let result = {state: 'failure', passCount: 0, blockedCount: 0, malformedBlockedCount: 0};
            let evaluationError = null;
            let codexParts = null;
            try {
              if (Number.isNaN(committed_at.valueOf())) {
                // The resolver step could not read the commit time. Codex's verdict does not
                // depend on it, so without this guard a Codex-reviewed head would go green
                // although the run is red; the directive path alone already denies in this case.
                throw new Error('the head commit time is unknown');
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const parserPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-review-gate.js`;
              const {evaluateReviewGate} = require(parserPath);
              result = evaluateReviewGate({
                comments,
                headSha: head_sha,
                committedAt: committed_at,
              });
              // Advisory Codex bot layer: the module is shared verbatim with rigplane-pro.
              const codexPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/codex-review-gate.js`;
              const {
                codexReviewedHead,
                readReviewThreads,
                unresolvedCodexFindings,
              } = require(codexPath);
              // Bot data is advisory: its unavailability must never change the verdict, so it is
              // read best-effort and the authoritative PASS/BLOCKED comments above decide alone.
              codexParts = {codex: {reviewed: false, via: null}, unresolved: []};
              let advisoryTimer;
              try {
                // Bounded, so a stalled advisory request cannot hold the status past the job timeout.
                await Promise.race([
                  (async () => {
                    const reviews = await github.paginate(github.rest.pulls.listReviews, {
                      owner,
                      repo,
                      pull_number,
                      per_page: 100,
                    });
                    const threads = await readReviewThreads({github, owner, repo, number: pull_number});
                    const codex = codexReviewedHead({reviews, comments, headSha: head_sha});
                    codexParts = {codex, unresolved: unresolvedCodexFindings(threads)};
                  })(),
                  new Promise((_, reject) => {
                    advisoryTimer = setTimeout(() => reject(new Error('timed out after 30 s')), 30000);
                  }),
                ]);
              } catch (advisoryError) {
                const advisoryMessage = advisoryError instanceof Error ? advisoryError.message : String(advisoryError);
                core.notice(`Codex bot data unavailable (advisory only): ${advisoryMessage}`);
              } finally {
                clearTimeout(advisoryTimer);
              }
            } catch (error) {
              evaluationError = error;
              const message = error instanceof Error ? error.message : String(error);
              core.error(`Agent Review Gate evaluation failed closed: ${message}`);
            }
            const target_url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let status;
            try {
              const parserPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-review-gate.js`;
              const {buildCommitStatus} = require(parserPath);
              status = buildCommitStatus({
                owner,
                repo,
                headSha: head_sha,
                targetUrl: target_url,
                result,
                evaluationFailed: evaluationError !== null,
              });
              // buildCommitStatus fails closed on an evaluation error or an invalid result (the
              // two cases share this description); only a trustworthy directive result is composed
              // with the Codex verdict.
              if (status.description !== 'Agent Review Gate evaluation failed closed.') {
                const {buildCodexVerdict} = require(
                  `${process.env.GITHUB_WORKSPACE}/.github/scripts/codex-review-gate.js`,
                );
                const verdict = buildCodexVerdict({
                  ...codexParts,
                  backup: {
                    pass: result.state === 'success',
                    blocked: result.blockedCount > 0 || result.malformedBlockedCount > 0,
                    description: status.description,
                  },
                  headSha: head_sha,
                  gptBuilt: '${{ steps.pr.outputs.gpt_built }}' === 'true',
                });
                status = {...status, state: verdict.state, description: verdict.description};
              }
            } catch (error) {
              evaluationError ??= error;
              status = {
                owner,
                repo,
                sha: head_sha,
                state: 'failure',
                context: 'Agent Review Gate',
                description: 'Agent Review Gate evaluation failed closed.',
                target_url,
              };
            }
            await github.rest.repos.createCommitStatus(status);
            if (status.state !== 'success') {
              core.notice(`Agent Review Gate denied: ${status.description} (${result.passCount} eligible PASS, ${result.blockedCount} binding BLOCKED, ${result.malformedBlockedCount} malformed BLOCKED).`);
            }
            if (evaluationError !== null) {
              core.setFailed('Agent Review Gate evaluation failed; a failure status was published.');
            }
