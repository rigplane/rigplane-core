name: Agent Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: agent-review-gate-${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    name: Update Agent Review Gate status
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    # API-only workflow via actions/github-script -- no compile/test toolchain
    # needed. Keep this on GitHub-hosted runners so PR merges are not blocked
    # when self-hosted build runners are offline or occupied.
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Resolve pull request number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const {owner, repo} = context.repo;
            const {data: pull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            core.setOutput('number', String(number));
            core.setOutput('head_sha', pull.head.sha);
            const {data: commit} = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: pull.head.sha,
            });
            const committedAt =
              commit.commit.committer?.date ??
              commit.commit.author?.date ??
              pull.updated_at;
            core.setOutput('committed_at', committedAt);

      - name: Update required Agent Review Gate status
        if: always() && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number('${{ steps.pr.outputs.number }}');
            const head_sha = '${{ steps.pr.outputs.head_sha }}';
            const committed_at = new Date('${{ steps.pr.outputs.committed_at }}');
            const {owner, repo} = context.repo;
            let result = {state: 'failure', passCount: 0, blockedCount: 0, malformedBlockedCount: 0};
            let evaluationError = null;
            let parser;
            try {
              const {data: parserFile} = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/scripts/agent-review-gate.js',
                // Evaluate the parser paired with this workflow run, rather
                // than untrusted PR-head contents.
                ref: '${{ github.workflow_sha }}',
              });
              if (
                Array.isArray(parserFile) ||
                parserFile.type !== 'file' ||
                parserFile.encoding !== 'base64' ||
                typeof parserFile.content !== 'string'
              ) {
                throw new Error('Trusted Agent Review Gate parser content is invalid.');
              }
              const parserModule = {exports: {}};
              new Function('module', 'exports', 'require', Buffer.from(parserFile.content, 'base64').toString('utf8'))(
                parserModule,
                parserModule.exports,
                require,
              );
              const {evaluateReviewGate, buildCommitStatus} = parserModule.exports;
              if (
                typeof evaluateReviewGate !== 'function' ||
                typeof buildCommitStatus !== 'function'
              ) {
                throw new Error('Trusted Agent Review Gate parser exports are invalid.');
              }
              parser = {evaluateReviewGate, buildCommitStatus};
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              result = parser.evaluateReviewGate({
                comments,
                headSha: head_sha,
                committedAt: committed_at,
              });
            } catch (error) {
              evaluationError = error;
              const message = error instanceof Error ? error.message : String(error);
              core.error(`Agent Review Gate evaluation failed closed: ${message}`);
            }
            let status;
            try {
              if (parser === undefined) {
                throw new Error('Trusted Agent Review Gate parser was not loaded.');
              }
              status = parser.buildCommitStatus({
                owner,
                repo,
                headSha: head_sha,
                targetUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                result,
                evaluationFailed: evaluationError !== null,
              });
            } catch (error) {
              evaluationError ??= error;
              status = {
                owner,
                repo,
                sha: head_sha,
                state: 'failure',
                context: 'Agent Review Gate',
                description: 'Agent Review Gate evaluation failed closed.',
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              };
            }
            await github.rest.repos.createCommitStatus(status);
            if (result.state !== 'success') {
              core.notice(`Agent Review Gate denied: ${result.passCount} eligible PASS, ${result.blockedCount} binding BLOCKED, ${result.malformedBlockedCount} malformed BLOCKED.`);
            }
            if (evaluationError !== null) {
              core.setFailed('Agent Review Gate evaluation failed; a failure status was published.');
            }
