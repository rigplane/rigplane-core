name: Agent Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  # The group carries the same verdict-relevance predicate as the job `if:`
  # below: a run skipped by that `if:` is still a workflow run in its group,
  # so without the predicate here a plain comment posted within seconds of a
  # directive would cancel the in-flight evaluation and publish nothing,
  # leaving a stale status. Qualifying runs share the per-PR 'eval' group;
  # every non-qualifying run lands in its own github.run_id group and cancels
  # nothing. cancel-in-progress stays true for qualifying runs because a
  # newer qualifying run re-lists and re-evaluates every PR comment, so the
  # superseded evaluation's verdict is recomputed from scratch.
  # Per-run REST calls, counted from the steps below: 3
  # fixed calls (pulls.get, repos.getCommit, repos.createCommitStatus) plus
  # one issues.listComments page per 100 comments.
  group: agent-review-gate-${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}-${{ (github.event_name == 'pull_request' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'Agent Review:') || contains(github.event.changes.body.from, 'Agent Review:')))) && 'eval' || github.run_id }}
  cancel-in-progress: true

jobs:
  agent-review:
    name: Update Agent Review Gate status
    # Only events that can change the verdict run the job. Every directive
    # body contains the literal marker 'Agent Review:' (the parser requires
    # it on the first non-blank line; contains() is case-insensitive, a
    # superset). An edit that turns a directive into prose is caught through
    # the pre-edit body github.event.changes.body.from; a deletion carries
    # the deleted comment's body in github.event.comment.body.
    if: github.event_name == 'pull_request' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'Agent Review:') || contains(github.event.changes.body.from, 'Agent Review:')))
    # API-only workflow via actions/github-script -- no compile/test toolchain
    # needed. Keep this on GitHub-hosted runners so PR merges are not blocked
    # when self-hosted build runners are offline or occupied.
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Resolve pull request number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const {owner, repo} = context.repo;
            const {data: pull} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            core.setOutput('number', String(number));
            core.setOutput('head_sha', pull.head.sha);
            const {data: commit} = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: pull.head.sha,
            });
            const committedAt =
              commit.commit.committer?.date ??
              commit.commit.author?.date ??
              pull.updated_at;
            core.setOutput('committed_at', committedAt);

      - name: Check out the workflow revision
        if: always() && steps.pr.outputs.head_sha != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Update required Agent Review Gate status
        if: always() && steps.pr.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number('${{ steps.pr.outputs.number }}');
            const head_sha = '${{ steps.pr.outputs.head_sha }}';
            const committed_at = new Date('${{ steps.pr.outputs.committed_at }}');
            const {owner, repo} = context.repo;
            let result = {state: 'failure', passCount: 0, blockedCount: 0, malformedBlockedCount: 0};
            let evaluationError = null;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const parserPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-review-gate.js`;
              const {evaluateReviewGate} = require(parserPath);
              result = evaluateReviewGate({
                comments,
                headSha: head_sha,
                committedAt: committed_at,
              });
            } catch (error) {
              evaluationError = error;
              const message = error instanceof Error ? error.message : String(error);
              core.error(`Agent Review Gate evaluation failed closed: ${message}`);
            }
            let status;
            try {
              const parserPath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-review-gate.js`;
              const {buildCommitStatus} = require(parserPath);
              status = buildCommitStatus({
                owner,
                repo,
                headSha: head_sha,
                targetUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                result,
                evaluationFailed: evaluationError !== null,
              });
            } catch (error) {
              evaluationError ??= error;
              status = {
                owner,
                repo,
                sha: head_sha,
                state: 'failure',
                context: 'Agent Review Gate',
                description: 'Agent Review Gate evaluation failed closed.',
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              };
            }
            await github.rest.repos.createCommitStatus(status);
            if (result.state !== 'success') {
              core.notice(`Agent Review Gate denied: ${result.passCount} eligible PASS, ${result.blockedCount} binding BLOCKED, ${result.malformedBlockedCount} malformed BLOCKED.`);
            }
            if (evaluationError !== null) {
              core.setFailed('Agent Review Gate evaluation failed; a failure status was published.');
            }
