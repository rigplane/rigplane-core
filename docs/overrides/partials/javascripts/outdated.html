{#-
  Material's own partial calls new URL("{{ base_url }}") with no base, which
  throws: MkDocs gives templates a relative base_url. Resolve it against the
  page location, as Material's partials/javascripts/base.html does for
  __md_scope.
-#}
<script>var el=document.querySelector("[data-md-component=outdated]"),base=new URL("{{ base_url }}",location),outdated=__md_get("__outdated",sessionStorage,base);!0===outdated&&el&&(el.hidden=!1)</script>
