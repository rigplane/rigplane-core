# The boundary is structural and finite. Paths below are capabilities/owners,
# not claims of whole-program JavaScript provenance. New owner paths fail the
# reachable-base monotonic comparison.

[authority_boundaries]
state_store_module = "frontend/src/lib/stores/radio.svelte.ts"
ws_writer_owner = "frontend/src/lib/transport/ws-client.ts"
read_only_seams = [
  "frontend/src/lib/runtime/adapters",
  "frontend/src/lib/runtime/props",
  "frontend/src/semantic/radio-view-model.ts",
]
intent_facades = [
  "frontend/src/components-v2/wiring/command-bus.ts",
  "frontend/src/lib/runtime/commands",
]
persistence_owner_roots = [
  "frontend/src/presentation/workspace",
  "frontend/src/lib/i18n",
  "frontend/src/lib/stores",
  "frontend/src/lib/radio",
]
