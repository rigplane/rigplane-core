  "frontend/src/components/spectrum",
  "frontend/src/lib/audio",
  "frontend/src/lib/runtime/adapters/scope-adapter.ts",
]
python_acquisition_owners = [
  "src/rigplane/cli/__init__.py",
  "src/rigplane/rigctld/handler.py",
  "src/rigplane/rigctld/poller.py",
  "src/rigplane/runtime/_civ_rx.py",
