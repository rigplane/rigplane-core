intents = ["set_vfo", "select_vfo", "vfo_swap", "vfo_equalize", "set_split", "get_dual_watch", "set_dual_watch", "set_main_sub_tracking", "quick_dualwatch", "quick_split", "get_quick_split", "set_quick_split", "get_quick_dual_watch", "set_quick_dual_watch"]
command_route = "existing CommandService -> serialized provider command -> ACK/readback"
observation_route = "existing provider active-slot/receiver/split observation or acquisition; MOR-1404 owns one-byte Icom command-07 A/B promotion"
