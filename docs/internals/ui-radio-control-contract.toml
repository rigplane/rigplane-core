contract_version = 1
issue = "MOR-1406"
parent_issue = "MOR-1405"
github_issue = 2314
authority = "StateStore"
ws_message = "state_update"
intent_lifecycle = "ephemeral-only"

# These are delivery metadata or container objects rather than UI radio facts.
# Every other generated public field must be owned by exactly one family below.
public_metadata_fields = [
  "server.revision", "server.stateRevision", "server.freshnessRevision",
  "server.observationSeq", "server.healthRevision", "server.updatedAt",
  "server.main", "server.sub", "server.scopeControls",
  "server.connection", "server.radioDetail", "server.radioHealth",
  "server.wsClients", "server.fieldStatus", "server.publicStateSeq",
]

# Explicit payload-plane exceptions. Values that label, gate, route, or map these
# streams are still owned by the StateStore families below.
data_plane_exceptions = [
  "audio PCM/Opus samples and FFT bins",
  "spectrum/waterfall pixel payloads",
  "transport correlation and delivery counters",
]

[[profiles]]
path = "rigs/ftx1.toml"
provider = "yaesu_cat"
required_proof = "MOR-1410 real FTX-1"

[[profiles]]
path = "rigs/ic705.toml"
provider = "icom_civ"
required_proof = "generic fixture plus profile conformance"

