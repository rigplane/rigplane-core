ws_property = "state_update data/changed: active, split, dualWatch, mainSubTracking, main/sub.activeSlot"
selector = "radio-view-model-adapter VFO topology selector"
pending = "selection/swap/equalize lifecycle only; never slot truth"
surfaces = ["frontend/src/semantic/VfoSurface.svelte", "frontend/src/components-v2/panels/vfo/DualVfoDisplay.svelte", "frontend/src/components-v2/panels/lcd/AmberIndStrip.svelte"]
automated_proof = "provider active-slot observation -> StateStore -> public WS; command emits exactly once"
hardware_proof = "MOR-1404 A/B zero-send ingress and MOR-1410 both radios"
gap_owner = "MOR-1404,MOR-1407,MOR-1408,MOR-1409"

