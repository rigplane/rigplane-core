# Rig Configuration — Xiegu G7250
#
# Xiegu G7250 HF/50 MHz transceiver, USB CI-V (subset of standard Icom
# CI-V, same family personality as the X6200).
#
# Sources of truth, per entry:
#   1. "LIVE G7250 2026-11-09 (MOR-4352)" — the read-only bench audit of a
#      real G7250 on its USB CH340 serial port at 115200 baud. Every GET
#      marked LIVE was answered on the air; every NAK/no-reply marked LIVE
#      was sent and refused/silent in the same session.
#   2. "inherited from X6200, not probed on G7250" — copied unchanged from
#      rigs/x6200.toml (Radioddity "Xiegu X6200 CI-V implementation
#      V1.0.6" and that profile's own live captures). NOT G7250 evidence.
#
# The audit never keyed the radio: no SET opcode, no PTT, no TX fact below
# is bench-proven. History: MOR-4352.

[radio]
id = "xiegu_g7250"
model = "G7250"
# LIVE G7250 2026-11-09 (MOR-4352): the radio answers ANY CI-V address and
# echoes the address it was asked as its own (probed at 00, A4, 88, 70, 72,
# E0; 0x88 answered the full read set in the same audit). 0x88, not the
# Xiegu family default 0xA4: this file loads before ic705.toml/x6200.toml,
# and the profiles' address-only table (profiles/__init__.py
# _by_civ_addr) would otherwise resolve 0xA4 lookups to the G7250,
# stealing the IC-705's address-only resolution. No shipped profile uses
# 0x88, so 0xA4 (IC-705) and 0x70 (X6100) keep resolving as before, and
# unicast sessions still work: the radio answers whatever address it is
# asked. Discovery names this radio through 0x1D 0x19 at 0x00, never
# through the address table.
civ_addr = 0x88
receiver_count = 1
# The G7250 "LAN" port is a proprietary IQ stream, not Icom LAN control
# (MOR-4352); has_wifi has no bench evidence either way and stays false —
# flip only with evidence.
has_lan = false
has_wifi = false
# LIVE G7250 2026-11-09 (MOR-4352): answers 115200, silent at 19200.
default_baud = 115200
# LIVE G7250 2026-11-09 (MOR-4352): 0x1D 0x19 answered model id 72 50.
# Discovery maps these reply bytes back to this profile (data-driven,
# backends/discovery.py: resolve_civ_radio_identity).
xiegu_model_id = 0x7250
# No hamlib_model_id: no Hamlib rig_model integer is pinned for the G7250
# (unverified whether upstream Hamlib lists one); the rigctld Yaesu
# dump_state path that consumes this field is not used by this CI-V
# profile.

[protocol]
type = "civ"
address = 0x88

[iq_lan]
protocol = "xiegu_udp"
radio_port = 50002
receive_port = 50001
sample_rate_hz = 48000
samples_per_datagram = 192
center_offset_hz = 8000
usable_bandwidth_hz = 40000
tune_min_hz = 100000
tune_max_hz = 54000000

[audio]
# LIVE G7250 2026-11-09 (MOR-4352): the radio's USB hub enumerates a
# C-Media "USB Audio Device" next to the CH340 serial port. The mono
# capture preference is inherited from X6200 (MOR-236, same C-Media CODEC
# family); the G7250's channel count was not probed.
codec_preference = ["PCM_1CH_16BIT", "ULAW_1CH"]

[capabilities]
# LIVE-marked entries were read back on the bench; the rest is inherited
# from X6200, not probed on G7250. Deliberately absent vs the X6200 list:
#   - no ``rit``/``xit``: 0x21 0x00/0x01/0x02 reads got NO reply (LIVE
#     G7250 2026-11-09) — unlike the X6200, whose write-only 0x21 SET is
#     live-confirmed, nothing on the G7250's 0x21 path was ever seen to
#     work, so no RIT/XIT control is exposed.
#   - no ``pbt``: 0x14 0x07/0x08 reads answer 01 28 (LIVE) but the setter
#     was never exercised and no Xiegu document covers it — the control is
#     not exposed pending a live SET round-trip.
#   - no ``vox``: 0x16 0x46 answers 0x02 (LIVE) with an unconfirmed
#     meaning; no value domain is declared from a boolean-looking read.
#   - no ``notch``/``compressor``/``dial_lock``: their reads answer 0x02,
#     not 00/01 (LIVE G7250 2026-11-09: 0x16 0x41 auto notch / DNF,
#     0x16 0x44 compressor, 0x16 0x50 dial lock) — the meaning of 0x02 on
#     this radio is unconfirmed, so no toggle state is declared from them.
#   - no ``break_in``: 0x16 0x47 NAKs (LIVE).
#   - no ``tuner``: 0x1C 0x01 NAKed pre-1.0.1 (LIVE) — but the Xiegu G7250
#     CI-V Reference Rev 1.2 (2026-11-06), Table 1-9 / page 9 documents
#     1C 01 as a [Real] shared ATU (00 OFF / 01 ON / 02 tune, tune starts
#     TX). Markers stay absent on the bench evidence; activating them needs
#     the TX-gated follow-up (audit section B, out of scope here).
#   - no ``data_mode``: 0x1A 0x06 NAKs (LIVE).
#   - no ``scope``: 0x27 0x10/0x11/0x14/0x15 got NO reply (LIVE) — no
#     CI-V scope.
#   - no tone family: 0x16 0x42/0x43 NAK (LIVE).
#   - no memory channels: 0x1A 0x00 NAKs (LIVE) — but that opcode is only
#     the *contents* register, unimplemented per the Xiegu G7250 CI-V
#     Reference Rev 1.2 (2026-11-06), Table 4-2 / page 13. Memory itself is
#     real via 08/09/0A/0B, slots 0001-0099 (Table 1-3 / page 3). Markers
#     stay absent on the bench evidence; wiring them is audit section B,
#     out of scope here.
# No ``scan``: 0x0E scan is unimplemented (silent) and the 08 01 00 / 01 01
# P1/P2 scan edges answer FA — Xiegu G7250 CI-V Reference Rev 1.2
# (2026-11-06), Table 4-2 / page 13 and Table 1-3 / page 3.
features = [
    "audio",
    "af_level",
    "rf_gain",
    "squelch",
    "attenuator",
    "preamp",
    "nb",
    "nr",
    "tx",
    "split",
    "cw",
    "meters",
    "agc",
    "power_control",
]

[state_acquisition]
# inherited from X6200, not probed on G7250 (provider shape); every polled
# GET below answered LIVE on the bench. The X6200's tuner_status poll is
# dropped: 0x1C 0x01 NAKs on the G7250 (LIVE).
provider = "xiegu_civ"
default_cadence_seconds = 2.0
default_freshness_ttl_seconds = 8.0
default_reconciliation_priority = "poll"
adaptive_decay = true
adaptive_decay_idle_multiplier = 4.0
adaptive_decay_max_cadence_seconds = 30.0
external_cat_pause = "pause_polling"
meter_coalescing_window_seconds = 0.25

[state_acquisition.capabilities]
polling_only = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.operator_controls.att",
    "receiver.main.operator_controls.af_level",
    "receiver.main.operator_controls.rf_gain",
    "receiver.main.operator_controls.squelch",
    "receiver.main.operator_controls.preamp",
    "receiver.main.operator_controls.agc",
    "receiver.main.operator_toggles.nb",
    "global.operator_controls.power_level",
    "global.operator_controls.mic_gain",
    "global.operator_controls.monitor_gain",
    "global.tx_state.ptt",
]
stream_like_meters = [
    "receiver.main.meters.s_meter",
    "global.meters.power",
]
command_response_observable = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.active.freq_mode.filter_width",
    "global.operator_controls.cw_pitch",
    "global.operator_controls.key_speed",
]
supported_controls = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
# 0x15 0x12 (SWR) and 0x15 0x13 (ALC) answer 00 00 at idle (LIVE G7250
# 2026-11-09) — the getters exist but the scale is unconfirmed, so they
# stay unknown, not polled.
unsupported = ["global.tx_state.power_on"]
unknown = ["global.meters.swr", "global.meters.alc"]

[state_acquisition.field_policies."receiver.main.active.freq_mode.mode"]
cadence_seconds = 1.0
freshness_ttl_seconds = 4.0
reconciliation_priority = "command_response"
external_cat_pause = "pause_polling"

# Same event-driven-only shape as x6200.toml's filter_width entry — without
# this, prime_unobserved() never reaches this path (it only iterates
# field_policies). inherited from X6200, not probed on G7250 (shape); the
# GET itself is LIVE (0x1A 0x03 answers).
[state_acquisition.field_policies."receiver.main.active.freq_mode.filter_width"]
cadence_seconds = 25.0
freshness_ttl_seconds = "never"
reconciliation_priority = "command_response"
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.cw_pitch"]
reason = "on-demand, not polled: prime_unobserved (MOR-1490) reads only field_policies paths, and the never TTL keeps the value from expiring"
cadence_seconds = 25.0
freshness_ttl_seconds = "never"
reconciliation_priority = "command_response"
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.key_speed"]
reason = "on-demand, not polled: prime_unobserved (MOR-1490) reads only field_policies paths, and the never TTL keeps the value from expiring"
cadence_seconds = 25.0
freshness_ttl_seconds = "never"
reconciliation_priority = "command_response"
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.meters.s_meter"]
cadence_seconds = 0.25
freshness_ttl_seconds = 1.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.25

[state_acquisition.field_policies."global.meters.power"]
cadence_seconds = 0.25
freshness_ttl_seconds = 1.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.25

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 2-1 / page 2:
# LSB/USB/AM/CW/FM are [Real]. RTTY (04), CW-R (07) and RTTY-R (08) are
# [Compat]: the written value is stored only, the actual native mode is
# unchanged — so they are not selectable modes here. WFM has no CI-V mode
# code. The vendor wfview G7250.rig lists CW-R, but the reference decides.
# No DIGI in the list: not observed on the G7250 (read-only audit
# 2026-11-09), and IcomRadio._coerce_mode cannot express it (MOR-1487).
[modes]
list = ["USB", "LSB", "CW", "AM", "FM"]
families = { cw = ["CW"] }

[filters]
list = ["FIL1", "FIL2", "FIL3"]
# LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x03 returns one packed-BCD index
# byte (0x33 -> 33), NOT the X6200's raw-byte formula. All nine measured
# rows below match the IC-7300's segments exactly: SSB/CW
# {50..500 step 50, index 0} and {600..3600 step 100, index 10}; AM
# {200..10000 step 200, index 0}. Owner-read display values, byte logged:
#   LSB FIL1 0x33=2900  FIL2 0x28=2400  FIL3 0x22=1800
#   CW  FIL1 0x09=500   FIL2 0x05=300   FIL3 0x02=150
#   AM  FIL1 0x44=9000  FIL2 0x29=6000  FIL3 0x14=3000
# FM width was NOT measured: do not invent it. FM is fixed — marked here
# as not measured, pending a live read. RTTY/CW-R/RTTY-R have no width
# table: per Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 2-3 /
# page 7 their widths are mode shadows (legal index limit 31), stored raw
# with native filters untouched. DIGI has no entry at all: not observed on
# the G7250 (read-only audit 2026-11-09).
encoding = "segmented_bcd_index"
width_min_hz = 50
width_max_hz = 9999

[filters.width.SSB]
# LSB rows measured LIVE (above); USB shares the SSB table (not measured
# separately — same family posture as every shipped Icom profile).
min_hz = 50
max_hz = 3600
defaults = [2900, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.CW]
min_hz = 50
max_hz = 3600
defaults = [500, 300, 150]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.AM]
min_hz = 200
max_hz = 10000
step_hz = 200
defaults = [9000, 6000, 3000]
segments = [
    { hz_min = 200, hz_max = 10000, step_hz = 200, index_min = 0 },
]

# FM width NOT measured (inherited fixed posture from X6200).
[filters.width.FM]
fixed = true

[vfo]
scheme = "ab"

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-3 / page 3:
# selected-VFO ATT read 11 A, write only A=00 OFF or 20 ON; any other
# non-zero value is FA, not a toggle. Same [0, 20] shape as
# rigs/ic7300.toml (which likewise declares no labels); the pre-1.0.1
# X6200-inherited [0, 1] would FA on a write of 01.
# LIVE G7250 2026-11-09 (MOR-4352): 0x11 read back 00 (off).
[attenuator]
values = [0, 20]

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-6 / page 6:
# 0x16 0x02 [Real] preamp 00 OFF, 01 PRE1, 02 PRE2, selected VFO.
# LIVE G7250 2026-11-09 (MOR-4352): read back 00 (off).
[preamp]
values = [0, 1, 2]

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-6 / page 6:
# 0x16 0x12 [Real] 00 OFF, 01 FAST, 03 SLOW; 02 MID is [Compat] (stored per
# A/B, never drives hardware). Native AGC AUTO has no direct protocol code.
# The radio panel also shows MEDIUM and AUTO natively, but they are not
# commandable over CI-V in V1.0.1 — so a later firmware is a data edit here.
# LIVE G7250 2026-11-09 (MOR-4352): read back 02 (a MID shadow, pre-1.0.1).
[agc]
modes = [0, 1, 3]
labels = { "0" = "OFF", "1" = "FAST", "3" = "SLOW" }

[controls.attenuator]
style = "toggle"

# Level control ranges — inherited from X6200, not probed on G7250. The
# G7250's level GETs reply TWO BCD data bytes (LIVE 2026-11-09, e.g.
# rf gain 02 49, mic gain 01 95), the same 0-255 domain the X6200 PDF
# documents for its one-byte reads.
[controls.af_level]
raw_min = 0
raw_max = 255

[controls.rf_gain]
raw_min = 0
raw_max = 255

[controls.squelch]
raw_min = 0
raw_max = 255

[controls.nr_level]
raw_min = 0
raw_max = 255

[controls.nb_level]
raw_min = 0
raw_max = 255

# RF power output range, both ends read on the bench (the Pro TX smoke
# tool's profile band: it requires raw_max == 255 and drives the radio to
# raw_min/255 through the HTTP command path before it keys).
[controls.rf_power]
raw_min = 12   # LIVE 2026-11-10: lowest setting, display 5 W, 14 0A reads 00 12
raw_max = 255  # LIVE 2026-11-09: full setting, 14 0A reads 02 55 (100 W rated)
# LIVE 2026-11-10 (MOR-4352): the radio stores power in WHOLE WATTS.
# Measured: a write of 14 0A 00 12 (the readback's own minimum byte) landed
# on 4 W — the radio then read raw 10, never returning to the requested 12.
# Model: W = floor(raw * 100 / 255) on write, raw = floor(W * 255 / 100) on
# read (5 W -> 12/13, 4 W -> 10/12, 100 W -> 255). With the quantum declared
# the encoder writes the SMALLEST raw whose stored watt reads back as the
# target (5 W -> 13), so the exact-readback contract holds.
write_quantum_w = 1

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-5 / page 5 and
# Table 2-2 / page 4: CW pitch native 400-1200 Hz in 10 Hz steps; the full
# protocol range is scaled, x=400+10*round(N*80/255), read N=round(255(x-400)/800).
# decode_quantum = 10 reproduces that lattice exactly (half-step ties are
# impossible here: 160*raw is even, 255*(2k+1) is odd). encode is
# nearest_half_down, not ceil: for display 410 Hz the reference inverts to
# raw 3 (ceil would give 4, whose read-back is still 3); it differs from the
# reference round-half-up only on exact ties (e.g. 480 Hz -> 25, ref 26).
[controls.cw_pitch]
raw_min = 0
raw_max = 255
display_min = 400
display_max = 1200
display_unit = "Hz"
decode_quantum = 10
encode_rounding = "nearest_half_down"

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-4 / page 4 and
# Table 2-2 / page 4: native 5-50 WPM, write 5+floor(N*45/255), read
# floor((x-5)*255/45). The legacy band cannot express floor (decode always
# rounds half-even, encode is ceil or nearest_half_down): raw 3 reads 5 WPM
# on the radio but decodes to 6 here — the closest available domain, same
# rule family as the IC-7300/X6200 key-speed control.
[controls.key_speed]
raw_min = 0
raw_max = 255
display_min = 5
display_max = 50
display_unit = "WPM"
decode_quantum = 1
encode_rounding = "nearest_half_down"

# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-4 / page 4 and
# Table 2-2 / page 4: MIC gain native 0-30, write floor(N*30/255), read
# floor(x*255/30). Same legacy-band caveat as key_speed above: raw 200 is
# native 23 but decodes to 24 here — the closest available domain. Display
# key names mirror the other display-scaled levels ([controls.cw_pitch] /
# [controls.key_speed]); no other shipped profile declares a display band
# on mic_gain.
[controls.mic_gain]
raw_min = 0
raw_max = 255
display_min = 0
display_max = 30
decode_quantum = 1
encode_rounding = "nearest_half_down"

# LIVE G7250 2026-11-09 (MOR-4352): the 0x02 band-edge read answered RX
# 0.5 .. 54 MHz — the HF envelope is live; it bounds the receiver at
# 54 MHz, so the X6200's WFM (88-108) and Air (108-136) ranges are NOT
# carried over. The named ham bands inside HF are inherited from X6200,
# not probed on G7250.
[[freq_ranges.ranges]]
label = "HF"
start_hz = 500000
end_hz = 54000000

[[freq_ranges.ranges.bands]]
name = "160m"
start_hz = 1800000
end_hz = 2000000
default_hz = 1825000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "80m"
start_hz = 3500000
end_hz = 3800000
default_hz = 3600000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "40m"
start_hz = 7000000
end_hz = 7200000
default_hz = 7100000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "30m"
start_hz = 10100000
end_hz = 10150000
default_hz = 10125000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "20m"
start_hz = 14000000
end_hz = 14350000
default_hz = 14200000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "17m"
start_hz = 18068000
end_hz = 18168000
default_hz = 18100000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "15m"
start_hz = 21000000
end_hz = 21450000
default_hz = 21200000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "12m"
start_hz = 24890000
end_hz = 24990000
default_hz = 24940000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "10m"
start_hz = 28000000
end_hz = 29700000
default_hz = 28500000
max_power_w = 100  # preliminary vendor spec

[[freq_ranges.ranges.bands]]
name = "6m"
start_hz = 50000000
end_hz = 54000000
default_hz = 51000000
max_power_w = 90  # preliminary vendor spec: 90 W ±1 dB on 50 MHz

# Rated TX power: preliminary vendor spec (Radioddity / PileupDX / WIMO
# product pages, 2026-11): 100 W ±1 dB on HF, 90 W ±1 dB on 50 MHz. NOT a
# bench fact — the read-only audit never keyed the radio, and the CI-V
# TX-band table never answered (0x1E no reply, LIVE 2026-11-09). Display
# data for the power slider's scale and label only (per-band rows above);
# nothing on the write path clamps or rescales by it.
[power]
max_watts = 100

# ── Meter calibration — piecewise-linear lookup, same [meters.<key>] +
# [[meters.<key>.calibration]] keys as rigs/ic7300.toml ──────────────
# Anchors: Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-8 and
# Table 2-4 / page 8. Every table below interpolates linearly between the
# reference anchors, exactly the reference's own piecewise formula.
#
# Reader coverage: get_s_meter, get_power_meter, get_swr and get_vd_meter
# are declared above, so s_meter/power/swr/vd calibrate live. get_alc has
# no profile key and get_id_meter is declared absent below — the alc/id
# tables have no reader today (decision for the coordinator: flip/add the
# reader or leave the tables dormant). The loader accepts calibration
# without a reader; nothing polls what nothing reads.

# S-meter: raw 0/120/241 = -129/-75/-15 dBm. Stored in the dB-relative-S9
# unit this key expects (ic7300 convention), with S9 = -73 dBm: -56.0 /
# -2.0 / +58.0. The -75 dBm anchor is NOT S9 (it is S9-2 dB) — stored
# faithfully as -2.0, not snapped to 0.
[meters.s_meter]
redline_raw = 120

[[meters.s_meter.calibration]]
raw = 0
actual = -56.0
label = "-129 dBm"

[[meters.s_meter.calibration]]
raw = 120
actual = -2.0
label = "-75 dBm"

[[meters.s_meter.calibration]]
raw = 241
actual = 58.0
label = "-15 dBm"

# PO: raw 0/143/213 = 0/50/100 W. No 255 clamp: the reference caps input at
# 100 W (213 is the top of the calibrated scale); do not copy IC-7300's
# 120 W table.
[[meters.power.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.power.calibration]]
raw = 143
actual = 50.0
label = "50"

[[meters.power.calibration]]
raw = 213
actual = 100.0
label = "100"

# SWR: raw 0/48/80/120/255 = 1/1.5/2/3/25.5.
[meters.swr]
redline_raw = 120

[[meters.swr.calibration]]
raw = 0
actual = 1.0
label = "1.0"

[[meters.swr.calibration]]
raw = 48
actual = 1.5
label = "1.5"

[[meters.swr.calibration]]
raw = 80
actual = 2.0
label = "2.0"

[[meters.swr.calibration]]
raw = 120
actual = 3.0
label = "3.0"

[[meters.swr.calibration]]
raw = 255
actual = 25.5
label = "25.5"

# ALC: raw 0..120 = 0..100 %. Percent convention (matches rigs/ic7610.toml's
# own [meters.alc] table); _civ_rx divides the interpolated value by 100.
# No reader today (no get_alc key) — see the header note.
[[meters.alc.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.alc.calibration]]
raw = 120
actual = 100.0
label = "100"

# Vd: raw 0/13/241 = 0/10/16 V.
[[meters.vd.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.vd.calibration]]
raw = 13
actual = 10.0
label = "10"

[[meters.vd.calibration]]
raw = 241
actual = 16.0
label = "16"

# Id: raw 0/97/146/241 = 0/10/15/25 A. No reader today (get_id_meter is
