# ── CI-V Commands ────────────────────────────────────────────────
# Every GET marked LIVE was answered on the bench (read-only audit — no
# SET was exercised). SET opcodes and every entry without a LIVE mark are
# inherited from X6200, not probed on G7250.
#
# power_on/power_off are INTENTIONALLY OMITTED, as on the X6200: no 0x18
# row is known for this family and the X6200 wedge history (MOR-170) makes
# an unconfirmed 0x18 a transmit-chain risk. Do NOT add a 0x18 mapping
# without hardware validation.
[commands]

# Frequency / mode
get_freq         = [0x03]  # LIVE G7250 2026-11-09 (MOR-4352): answered 7.138000 MHz; SET inherited from X6200, not probed
set_freq         = [0x05]  # inherited from X6200, not probed on G7250 (read-only audit)
get_mode         = [0x04]  # LIVE G7250 2026-11-09: answered LSB FIL1; SET inherited
set_mode         = [0x06]  # inherited from X6200, not probed on G7250 (read-only audit)

# Get receiver frequency range
# LIVE G7250 2026-11-09: answered RX 0.5 .. 54 MHz.
get_band_edge_freq = [0x02]

# VFO selection / swap (0x07). There is no get_vfo key on purpose: bare 07
# is NOT a read — it is "leave memory mode and restore A/B" (a SET), per
# Xiegu G7250 CI-V Reference Rev 1.2 (2026-11-06), Table 1-3 / page 3
# (LIVE G7250 2026-11-09: the radio ACKs it with FB, which is the SET
# acknowledgement, not a read reply). Nothing reads VFO selection through
# this key: rigctld works from the state store, and the selected-VFO reads
# are 25 00 / 26 00 below. Never poll bare 07.
set_vfo          = [0x07]  # 07 00/01/A0/B0 are real sets; inherited from X6200, not probed on G7250

# Split. LIVE G7250 2026-11-09: 0x0F read answered 00 (split off); SET
# inherited.
set_split        = [0x0F]

# Attenuator / preamp (reads LIVE: 11 00, 16 02 00)
get_attenuator   = [0x11]
set_attenuator   = [0x11]  # inherited from X6200, not probed on G7250
get_preamp       = [0x16, 0x02]
set_preamp       = [0x16, 0x02]  # inherited from X6200, not probed on G7250

# Levels (all GETs LIVE G7250 2026-11-09 — two BCD data bytes each; SETs
# inherited from X6200, not probed on G7250)
get_af_level     = [0x14, 0x01]
set_af_level     = [0x14, 0x01]
get_rf_gain      = [0x14, 0x02]
set_rf_gain      = [0x14, 0x02]
get_squelch      = [0x14, 0x03]
set_squelch      = [0x14, 0x03]
get_nr_level     = [0x14, 0x06]
set_nr_level     = [0x14, 0x06]
get_cw_pitch     = [0x14, 0x09]
set_cw_pitch     = [0x14, 0x09]
# No CI-V CW keying: the managed full-force release logged stop_cw
# undeclared (the D1 warning) and the radio has no keyer form on the
# wire. Both directions are formally absent so the name is never a
# "neither declared nor declared absent" state-3 gap.
send_cw          = { absent = "LIVE 2026-11-10 (MOR-4352): no CI-V CW keying; managed release logged stop_cw undeclared" }
stop_cw          = { absent = "LIVE 2026-11-10 (MOR-4352): no CI-V CW keying; managed release logged stop_cw undeclared" }
get_rf_power     = [0x14, 0x0A]
set_rf_power     = [0x14, 0x0A]
get_mic_gain     = [0x14, 0x0B]
set_mic_gain     = [0x14, 0x0B]
get_key_speed    = [0x14, 0x0C]
set_key_speed    = [0x14, 0x0C]
get_nb_level     = [0x14, 0x12]
set_nb_level     = [0x14, 0x12]
get_monitor_gain = [0x14, 0x15]
set_monitor_gain = [0x14, 0x15]

# Meters (all GETs LIVE G7250 2026-11-09; idle read 00 00 except S-meter
# 00 63 and Vd 01 55 — scales unconfirmed beyond the shared BCD 0-255)
get_s_meter      = [0x15, 0x02]
get_power_meter  = [0x15, 0x11]
get_swr          = [0x15, 0x12]
get_vd_meter     = [0x15, 0x15]

# Functions (0x16 family; reads LIVE G7250 2026-11-09: 16 12 (AGC) read
# 02, 16 22 (NB) and 16 40 (NR) read 00 — off is consistent with the
# 00/01 toggle encoding, so NB/NR stay. SETs inherited from X6200, not
# probed on G7250. The toggles whose reads answered 0x02 with no 00/01
# evidence (16 41, 16 44, 16 50) are formally absent below.)
get_agc          = [0x16, 0x12]
set_agc          = [0x16, 0x12]
get_nb           = [0x16, 0x22]
set_nb           = [0x16, 0x22]
get_nr           = [0x16, 0x40]
set_nr           = [0x16, 0x40]

# Identification. LIVE G7250 2026-11-09: 0x19 0x00 answers the ECHOED
# asked address byte (asked at 88 -> payload 88; asked at the broadcast
# 00 -> payload 00), so the payload is not a model token on this radio —
# the address echo is why discovery falls through to the 0x1D 0x19 probe.
get_transceiver_id = [0x19, 0x00]

# Filter width. LIVE G7250 2026-11-09: BCD index, IC-7300 segments — see
# [filters] above for the nine measured (byte, Hz) rows.
get_filter_width          = [0x1A, 0x03]

# PTT / status. LIVE G7250 2026-11-09: 0x1C 0x00 read answered 00 (idle);
# the PTT SET bytes are inherited from X6200, not probed (read-only audit).
ptt_on           = [0x1C, 0x00, 0x01]
ptt_off          = [0x1C, 0x00, 0x00]
get_transceiver_status = [0x1C, 0x00]
set_transceiver_status = [0x1C, 0x00]  # inherited from X6200, not probed on G7250

# Xiegu model ID. LIVE G7250 2026-11-09: answers 72 50 (asked at A4 and at
# the echoed broadcast 00). The positive disambiguator vs Icom CI-V at the
# same address and the data key discovery resolves this profile by.
get_xiegu_model_id = [0x1D, 0x19]

# Selected / unselected VFO (0x25 / 0x26). All four GETs LIVE G7250
# 2026-11-09 (7.138000 / 7.050000 MHz; 26 00 00 00 01 / 26 01 00 00 01);
# SETs inherited from X6200, not probed on G7250.
get_selected_freq    = [0x25, 0x00]
set_selected_freq    = [0x25, 0x00]
get_unselected_freq  = [0x25, 0x01]
set_unselected_freq  = [0x25, 0x01]
get_selected_mode    = [0x26, 0x00]
set_selected_mode    = [0x26, 0x00]
get_unselected_mode  = [0x26, 0x01]
set_unselected_mode  = [0x26, 0x01]

# Protocol ack/nak echoes (inherited from X6200, not probed on G7250; the
# radio did send FB to the bare 0x07 read, LIVE).
get_command_error_fa = [0xFA]
get_command_ok_fb    = [0xFB]

# ── Live-confirmed absences (read sent, 0xFA NAK answered; LIVE G7250
# 2026-11-09, MOR-4352) ─────────────────────────────────────────────
get_band_spectrum_display = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x01 NAKed on the bench — no CI-V band spectrum display" }
get_tuner_status          = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1C 0x01 NAKed on the bench pre-1.0.1 — the reference (Rev 1.2 Table 1-9 / p9) documents 1C 01 as a [Real] shared ATU; activation needs the TX-gated follow-up" }
set_tuner_status          = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1C 0x01 NAKed on the bench pre-1.0.1 — the reference (Rev 1.2 Table 1-9 / p9) documents 1C 01 as a [Real] shared ATU; activation needs the TX-gated follow-up" }
get_data_mode             = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x06 NAKed on the bench — no CI-V data-mode register" }
set_data_mode             = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x06 NAKed on the bench — no CI-V data-mode register" }
get_memory_contents       = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x00 NAKed on the bench — no CI-V memory *contents* register (reference Rev 1.2 Table 4-2 / p13 unimplemented); memory itself is real via 08/09/0A/0B (Table 1-3 / p3), wiring is a follow-up" }
set_memory_contents       = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x00 NAKed on the bench — no CI-V memory *contents* register (reference Rev 1.2 Table 4-2 / p13 unimplemented); memory itself is real via 08/09/0A/0B (Table 1-3 / p3), wiring is a follow-up" }
get_break_in              = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x47 NAKed on the bench" }
set_break_in              = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x47 NAKed on the bench" }
get_manual_notch          = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x48 NAKed on the bench — no manual notch; the DNF read at 0x16 0x41 answers 0x02, meaning unconfirmed, and is absent above" }
set_manual_notch          = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x48 NAKed on the bench — no manual notch; the DNF read at 0x16 0x41 answers 0x02, meaning unconfirmed, and is absent above" }
get_repeater_tone         = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x42 NAKed on the bench — no tone family" }
set_repeater_tone         = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x42 NAKed on the bench — no tone family" }
get_repeater_tsql         = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x43 NAKed on the bench — no tone family" }
set_repeater_tsql         = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x43 NAKed on the bench — no tone family" }
get_twin_peak_filter      = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x4F NAKed on the bench" }
set_twin_peak_filter      = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x16 0x4F NAKed on the bench" }
get_comp_meter            = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x15 0x14 NAKed on the bench" }
get_id_meter              = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x15 0x16 NAKed on the bench" }
# 0x1E 0x00 got NO reply (LIVE G7250 2026-11-09) — no CI-V TX-band table,
# so no TX power/band facts are declared for this radio.
get_tx_band_count         = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1E 0x00 sent on the bench, no reply — no TX-band table" }
get_tx_band_edge          = { absent = "LIVE G7250 2026-11-09 (MOR-4352): same 0x1E family as get_tx_band_count — no reply, no TX-band table (edge row not separately probed)" }
# Band stacking: the whole 0x1A 0x01 register NAKs (see
# get_band_spectrum_display), so Icom's 9-byte band-stacking record cannot
# exist under this opcode either.
get_bsr                   = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x01 NAKed on the bench — no band-stacking register" }
set_bsr                   = { absent = "LIVE G7250 2026-11-09 (MOR-4352): 0x1A 0x01 NAKed on the bench — no band-stacking register" }
# Memory opcodes 0x08-0x0B were not probed on the G7250; the 0x1A 0x00 NAK
# (above) closes only the contents register, not this family — the reference
# (Rev 1.2 Table 1-3 / p3) documents 08/09/0A/0B as [Real], slots 0001-0099.
# Markers stay absent on the bench evidence; wiring them is audit section B,
# out of scope here.
get_memory_mode           = { absent = "inherited from X6200, not probed on G7250 — the X6200 V1.0.6 table documents no 0x08 row; the G7250's 0x1A 0x00 memory NAK (LIVE) closes the family" }
set_memory_mode           = { absent = "inherited from X6200, not probed on G7250 — the X6200 V1.0.6 table documents no 0x08 row; the G7250's 0x1A 0x00 memory NAK (LIVE) closes the family" }
memory_write              = { absent = "inherited from X6200, not probed on G7250 — the X6200 V1.0.6 table documents no 0x09 row; the G7250's 0x1A 0x00 memory NAK (LIVE) closes the family" }
memory_to_vfo             = { absent = "inherited from X6200, not probed on G7250 — the X6200 V1.0.6 table documents no 0x0A row; the G7250's 0x1A 0x00 memory NAK (LIVE) closes the family" }
memory_clear              = { absent = "inherited from X6200, not probed on G7250 — the X6200 V1.0.6 table documents no 0x0B row; the G7250's 0x1A 0x00 memory NAK (LIVE) closes the family" }

