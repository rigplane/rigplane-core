get_auto_notch   = { absent = "LIVE G7250 2026-11-09: read 0x02, meaning unconfirmed" }
set_auto_notch   = { absent = "LIVE G7250 2026-11-09: read 0x02, meaning unconfirmed" }
get_compressor   = { absent = "LIVE G7250 2026-11-09: read 0x02, meaning unconfirmed" }
set_compressor   = { absent = "LIVE G7250 2026-11-09: read 0x02, meaning unconfirmed" }
get_dial_lock    = { absent = "LIVE G7250 2026-11-09: read 0x02, meaning unconfirmed" }
set_dial_lock    = { absent = "LIVE G7250 2026-11-09: read 0x02, meaning unconfirmed" }

# Reads that ANSWER but declare nothing here (recorded so nobody mistakes
# silence for an oversight — LIVE G7250 2026-11-09, MOR-4352):
#   - 0x14 0x07 / 0x14 0x08 (PBT inner/outer) answer 01 28 (centre); no
#     pbt keys — the SET side was never exercised, no capability declared.
#   - 0x14 0x0D (notch position) answers 00 00; no key — nothing routes a
#     G7250 notch-position control yet.
#   - 0x14 0x0E (comp level) answers 00 00; no key — the 0x16 0x44
#     compressor read answers 0x02 with an unconfirmed meaning and is
#     formally absent above.
#   - 0x14 0x0F (QSK delay) answers 00 00; no key — same posture as X6200.
#   - 0x15 0x01 (squelch status) answers 00 00; no key — dcd was removed
#     from every shipped profile.
#   - 0x15 0x13 (ALC meter) answers 00 00; see acquisition unknown above.
#   - 0x16 0x46 (VOX) answers 02; no key — meaning unconfirmed, no
#     capability declared.
#   - 0x1A 0x04 (AGC time constant) answers 00; no key.
# No reply at all (LIVE): 0x21 0x00/0x01/0x02 (RIT/XIT), 0x27 0x10/0x11/
# 0x14/0x15 (scope), 0x12 (antenna) — no keys, no capabilities.

[commands.overrides]

[tx_policy]
# Inherited from X6200, not measured on the G7250 (MOR-1947 posture): the
# factory routes G7250 onto XieguSerialRadio, which shares the IC-705
# CI-V personality, and this profile declares the same 0x1C/0x00 PTT
# command. The transmit-state read (0x1C 0x00) is LIVE-confirmed on this
# radio (answered 00, idle). The TX decode is shared
# (runtime/radio.py 0x00/0x01 allowlist), so the ruling is the same
# ruling, written here rather than left absent because an absent section
# and an empty one load identically — only a written section records that
# this was decided. No CI-V TX-band table exists for the G7250 (0x1E no
# reply, LIVE): TX band edges are unknown, and the watts figures under
# [power]/max_power_w are preliminary vendor spec, never wire facts —
# nothing on this radio's path reads this map today; empty means "nothing
# measured", not "nothing refuses".
refused_during_tx = []
# Positive-RX rule (§3.7): the receiving byte only. This wire carries no
# keying attribution, so nothing else is mapped and the transmitting byte
# is not-receiving without an invented source.
tx_state_map = { "0" = "rx" }
