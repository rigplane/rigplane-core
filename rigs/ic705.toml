# ── CI-V Commands ────────────────────────────────────────────────
# Every opcode from wfview IC-705.rig Commands\1–124 (excluding TRX placeholders 0x00/0x01).
# NOTE lines: IC-7300.rig has the feature but IC-705.rig does not (or uses different bytes).

# PROVENANCE OPEN (D2, MOR-2008 batch 4): left deliberately undeclared
# rather than guessed. House pattern: rigs/ic9700.toml "PROVENANCE OPEN
# (D2, MOR-2015)".
# - get_memory_mode [0x08]: this guide's own 0x08 row reads "Select the
#   Memory mode" (imperative), not "Send/read" like the table's other
#   bidirectional rows -- no live-bench probe has settled whether it
#   answers a bare read.
[commands]

# ── Frequency / Mode ──
get_band_edge_freq = [0x02]
get_freq = [0x03]
get_mode = [0x04]
set_freq = [0x05]
set_mode = [0x06]

# ── VFO ──
get_vfo = [0x07]
set_vfo = [0x07]
# Single receiver: no dual_watch, no main/sub band select (D2, MOR-2016)
get_dual_watch = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3: cmd 0x07 table is 00/01/A0/B0 only" }
# set_dual_watch_off/set_dual_watch_on (not the bare set_dual_watch the
# pre-migration fallback resolved -- MOR-2007 ruling 1 split the setter key)
set_dual_watch = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3: cmd 0x07 table is 00/01/A0/B0 only" }
set_dual_watch_off = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3: cmd 0x07 table is 00/01/A0/B0 only" }
set_dual_watch_on = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3: cmd 0x07 table is 00/01/A0/B0 only" }
get_main_sub_band = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3: cmd 0x07 table has no D0/D1/D2" }
# quick_dual_watch (bare key, no get_/set_ prefix) lives here in the base
# [commands] section, matching the bare-key precedent (scan_start,
# power_on, etc.) rather than [commands.overrides] with its get_/set_
# siblings, which stay grouped with the other 1A 05 submenu addresses.
quick_dual_watch = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.5: no Main/Sub receiver on this radio; control 0032 on IC-705 is 'Home CH Beep', not quick dual-watch" }

# ── Memory (wfview MemStart=0, Max=99; Memory Contents Max=101) ──
# get_memory_mode -- PROVENANCE OPEN above, left undeclared (this guide's
# own 0x08 row reads "Select the Memory mode", imperative, not "Send/read"
# like the table's other bidirectional rows -- no live-bench probe has
# settled whether it answers a bare read)
set_memory_mode = [0x08]                  # source: IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3
set_memory_group = [0x08, 0xA0]
# memory_write/memory_to_vfo/memory_clear: single wire form, bare
# canonical key (owner ruling, MOR-2008 batch 4) -- collapses the
# redundant get_X/set_X pair this file used to declare for each (neither
# half carried a source; the single surviving row below does).
memory_write = [0x09]                     # source: IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3
memory_to_vfo = [0x0A]                     # source: IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3 -- payload MOR-2055, see commands/memory.py: build_memory_to_vfo
memory_clear = [0x0B]                      # source: IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3 -- payload MOR-2055, see commands/memory.py: build_memory_clear

# ── Offset / Scan / Split ──
get_freq_offset = [0x0D]
set_freq_offset = [0x0D]
get_scan = [0x0E]
set_scan = [0x0E]
get_split = [0x0F]  # source: IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.3
set_split = [0x0F]

# ── Tuning ──
get_tuning_step = [0x10]
set_tuning_step = [0x10]

# ── RF front end ──
get_attenuator = [0x11]
set_attenuator = [0x11]
# NOTE: IC-7300.rig has no DIGI-SEL Shift; IC-705 has 0x14 0x13.
get_digisel_shift = [0x14, 0x13]
set_digisel_shift = [0x14, 0x13]
get_digisel = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.4: 0x16 family has no 0x4E" }
set_digisel = { absent = "IC-705 CI-V Reference Guide (A7560-8EX-1, Jul.2020) p.4: 0x16 family has no 0x4E" }
get_speech = [0x13]
set_speech = [0x13]

# ── Levels ──
get_af_level = [0x14, 0x01]
set_af_level = [0x14, 0x01]
