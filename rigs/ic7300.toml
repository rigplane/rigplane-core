# ── Parameterized Capabilities ───────────────────────────────────

[attenuator]
# CI-V 0x11: binary toggle only
# 0x00=OFF, 0x20=20dB ON
values = [0, 20]

[preamp]
# CI-V 0x16 0x02: 0=OFF, 1=P.AMP1, 2=P.AMP2
values = [0, 1, 2]

[agc]
# CI-V 0x16 0x12: 1=FAST, 2=MID, 3=SLOW (wfview IC-7300.rig lists Min/Max 0-2 for UI)
modes = [1, 2, 3]
labels = { "1" = "FAST", "2" = "MID", "3" = "SLOW" }

[scan_types]
# CI-V 0x0E family: source IC-7300 Advanced Manual (11a) p.19-3 + live
# bench 2026-08-30 (0E 13 ACKed). 0x13 = fine dF scan, absent from the old
# code-level VALID_SCAN_TYPES frozenset this domain replaces (MOR-2007
# ruling 4).
values = [0x01, 0x02, 0x03, 0x12, 0x13, 0x22, 0x23]

[scan_resume]
# CI-V 0x0E family: source IC-7300 Advanced Manual (11a) p.19-3, per the
# owner's cross-check that all four documented CI-V guides list only
# these two states -- not the 0xD1/0xD2 5s/10s the old code-level
# VALID_SCAN_RESUME frozenset accepted on every radio (MOR-2007 ruling 4).
values = [0xD0, 0xD3]

[antenna]
tx_count = 1
has_rx_ant = false

[notch]
# CI-V 0x16 0x57: Manual notch width
# 0=WIDE, 1=MID, 2=NAR (same as IC-7610)
width_values = [0, 1, 2]
width_labels = { "0" = "WIDE", "1" = "MID", "2" = "NAR" }

[ssb_tx_bw]
# CI-V 0x16 0x58: SSB TX bandwidth
# 0=WIDE, 1=MID, 2=NAR
values = [0, 1, 2]
labels = { "0" = "WIDE", "1" = "MID", "2" = "NAR" }

[filter_shape]
# CI-V 0x16 0x56: DSP IF filter type (docs/validation/cat-audits/ic7300.md
# "16 56 DSP filter type" — presence-confirmed; SHARP/SOFT values come from
# the shared IC-7610/IC-7300-family command table, same basis as the
# [commands] get/set_filter_shape entry below) (MOR-1534).
values = [0, 1]
labels = { "0" = "SHARP", "1" = "SOFT" }

[break_in]
# CI-V 0x16 0x47: 0=OFF, 1=Semi, 2=Full (wfview rig lists Max=1; CI-V supports three levels)
values = [0, 1, 2]
labels = { "0" = "OFF", "1" = "SEMI", "2" = "FULL" }

[rit]
# CI-V 0x21 0x00. NOT the operator-facing domain: [controls.rit] is the
# authority and declares ±9999 Hz in 1 Hz steps (MOR-1883), matching the
# shared builder commands/system.py::set_rit_frequency and a live 4701 Hz
# bench write. This wfview-sourced ±999 is kept only as the historical
# note it always was; nothing in the codebase reads range_hz.
range_hz = 999

[cw]
# CI-V 0x14 0x09: CW pitch 300-900 Hz
# CI-V 0x14 0x0C: Key speed 6-48 WPM
pitch_min_hz = 300
pitch_max_hz = 900
speed_min_wpm = 6
speed_max_wpm = 48
# dash_ratio: control 0161, IC-7300 Advanced Manual (11a) command table
# p.19-6, range 28..45; confirmed on the wire by live bench 2026-08-30 (read
# of 1A 05 01 61 answered 30). Refutes the earlier "no dash_ratio" note --
# see get_dash_ratio / set_dash_ratio in [commands.overrides] (D2, MOR-2014).

[nb]
# CI-V 0x1A 0x05 0x01 0x89: NB depth 1-10, NB width 0-255 (wfview NB Depth Min/Max)
depth_min = 1
depth_max = 10
width_min = 0
width_max = 255

[power]
max_watts = 100

[modes]
list = ["USB", "LSB", "CW", "CW-R", "AM", "FM", "RTTY", "RTTY-R"]

[data_mode]
# CI-V 0x1A 0x06: DATA sub-mode (0=OFF, 1=DATA1)
# IC-7300 has only 1 DATA mode
count = 1
labels = { "0" = "OFF", "1" = "DATA" }

# Modulation input sources
# CI-V 0x1A 0x05 0x00 0x66-0x67: get/set mod input per DATA mode
inputs = [
    { value = 0, name = "MIC" },
    { value = 1, name = "ACC" },
    { value = 2, name = "MIC+ACC" },
    { value = 3, name = "USB" },
    { value = 4, name = "MIC+USB" },
]

[filters]
list = ["FIL1", "FIL2", "FIL3"]
# CI-V 0x1A 0x03: width is a BCD-encoded index, not raw Hz (CI-V Reference p.19).
encoding = "segmented_bcd_index"
width_min_hz = 50
width_max_hz = 9999

[filters.width.USB]
min_hz = 50
max_hz = 3600
defaults = [3000, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.LSB]
min_hz = 50
max_hz = 3600
defaults = [3000, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.CW]
min_hz = 50
max_hz = 3600
defaults = [1200, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.RTTY]
min_hz = 50
max_hz = 2700
defaults = [2400, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 2700, step_hz = 100, index_min = 10 },
]

[filters.width.AM]
min_hz = 200
max_hz = 10000
step_hz = 200
defaults = [9000, 6000, 3000]
segments = [
    { hz_min = 200, hz_max = 10000, step_hz = 200, index_min = 0 },
]

[filters.width.FM]
fixed = true
defaults = [15000, 10000, 7000]

[vfo]
scheme = "ab"
readback = "selected_unselected"
main_select = [0x00]  # VFO A
sub_select = [0x01]   # VFO B
swap_ab = [0xB0]
equal_ab = [0xA0]

