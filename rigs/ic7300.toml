# Rig Configuration — IC-7300
# This file defines the IC-7300 radio profile in TOML format.
# See _schema.md for field documentation.
#
# Source: IC-7300 Full Manual (English) v6, §19 CONTROL COMMAND
#         (original IC-7300, CI-V addr 0x94 — NOT the IC-7300MK2, which has a
#         different command set)
#         wfview IC-7300.rig
#         Hardware testing

[radio]
id = "icom_ic7300"
model = "IC-7300"
civ_addr = 0x94
default_baud = 115200  # Required for scope data over serial CI-V
receiver_count = 1
has_lan = false
has_wifi = false

[spectrum]
seq_max = 11
amp_max = 160
data_len_max = 475

# Pin mono-first codec (#797). The global default is stereo-first, but single-RX
# firmware has not been hardware-validated to accept stereo rx_codec at conninfo;
# negotiating stereo risks immediate session rejection (error=0xFFFFFFFF).
# ``_control_phase`` also retries with mono on rejection, so this is a secondary
# safety belt plus an explicit intent marker.
[audio]
codec_preference = ["PCM_1CH_16BIT", "ULAW_1CH"]

# ── Capabilities ─────────────────────────────────────────────────
# Feature tags determine which UI panels and controls are rendered.
# Grouped by functional area.

[capabilities]
features = [
    # Receiver
    "audio",
    "af_level",
    "rf_gain",
    "squelch",
    # RF front end
    "attenuator",
    "preamp",
    "ip_plus",
    # NOTE: no digisel on IC-7300
    # Antenna
    "antenna",
    # NOTE: no rx_antenna on IC-7300 (single antenna)
    # DSP / Noise
    "nb",
    "nr",
    "notch",
    "twin_peak",
    # Filter
    "pbt",
    "filter_width",
    "filter_shape",
    # TX
    "tx",
    "split",
    "vox",
    "compressor",
    "monitor",
    # NOTE: no drive_gain on IC-7300
    "ssb_tx_bw",
    # CW
    "cw",
    "break_in",
    # RIT / XIT
    "rit",
    "xit",
    # Tuner
    "tuner",
    # Metering
    "meters",
    # Scope
    "scope",
    # Tone
    "repeater_tone",
    "tsql",
    # Data
    "data_mode",
    # System
    "power_control",
    "dial_lock",
    "scan",
    "speech",
    "bsr",
    # AGC
    "agc",
    "tuning_step",
    "band_edge",
    "xfc",
    # System
    "system_settings",
]
# MOR-1447 leg 2: the IC-7300 front panel wires RF gain and squelch as one
# physical concentric knob (hard left = RF min/SQL min, center = RF max/SQL
# min, hard right = SQL max/RF max) — the live gate radio for this control
# model. Other Icom-family profiles (IC-7610, IC-705, IC-9700) stay on the
# "separate" default: no CAT audit/manual excerpt in this repo documents
# their physical RF/SQL layout, so declaring "combined" for them would be a
# guess rather than a data-driven fact.
rf_sql_control_model = "combined"

# Per-check_id validation classification (MOR-2105 part 2), a check_id-grained
# sibling to a future [validation].write_only_controls list (IC-7300 does not
# need one today). scope_dual.set (27 13, p.19-7) is documented and the radio
# answers it, but IC-7300 has only one scope, so 00 (Single only) is the only
# legal value it can ever hold -- the RMVR read-modify-verify-restore harness
# would flip to a value the radio can never report back, not because
# anything is broken. The source is the manual page and data-column fact
# establishing that.
#
# scope_receiver.set (27 12, same page, live bench 2026-08-30: 27 12 00, see
# get_scope_main_sub below) is fixed-value for the SAME reason -- one
# receiver -- but is deliberately NOT declared here: receiver_count above
# already states that fact, and validation/hardware.py derives
# scope_receiver.set's fixed-value status from it instead of restating it as
# a second, independently-editable source of truth (MOR-2105 part 2, F1).
[validation.fixed_value]
"scope_dual.set" = "IC-7300 Advanced Manual (11a) command table p.19-7: 27 13 data column = 00 (Single only)"

[state_acquisition]
provider = "icom_civ"
default_cadence_seconds = 1.5
default_freshness_ttl_seconds = 3.0
default_reconciliation_priority = "poll"
adaptive_decay = false
external_cat_pause = "pause_polling"
meter_coalescing_window_seconds = 0.2

[state_acquisition.capabilities]
unsolicited_push = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
polling_only = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.unselected.freq_mode.freq_hz",
    "receiver.main.unselected.freq_mode.mode",
    "receiver.main.operator_controls.af_level",
    "receiver.main.operator_controls.rf_gain",
    "receiver.main.operator_controls.squelch",
    "receiver.main.operator_controls.att",
    "receiver.main.operator_controls.preamp",
    "receiver.main.operator_controls.agc",
    "receiver.main.operator_toggles.nb",
    "receiver.main.operator_toggles.nr",
    "global.operator_controls.power_level",
    "global.tx_state.compressor_on",
    "global.operator_controls.compressor_level",
    "global.tx_state.ptt",
    "global.operator_controls.tuner_status",
    "global.tx_state.split",
    # MOR-1452: documented-readable §19 0x14 sub-commands (0x0B/0x15/0x16/0x17,
    # see docs/validation/cat-audits/ic7300.md) that the poller never queried —
    # the TX-aux panel showed them as an honest but permanent "?".
    # The active profile declares getters for these 4 controls. The acquisition
    # scheduler resolves their canonical getter names through the profile-bound
    # resolver and this profile's CommandMap, not a hardcoded scheduler table;
    # slow field_policies below, not the freq/mode/keep-alive fast tier.
    "global.operator_controls.mic_gain",
    "global.operator_controls.monitor_gain",
    "global.operator_controls.vox_gain",
    "global.operator_controls.anti_vox_gain",
    # MOR-1485: TX/PA meters (0x15 0x11-0x16). ``[commands]`` already declares
    # get_power_meter/get_swr/get_alc/get_comp_meter/get_vd_meter/get_id_meter
    # below. The acquisition scheduler resolves those canonical getter names
    # through the profile-bound resolver and this active profile's CommandMap,
    # not a hardcoded scheduler table. The gap was purely acquisition
    # membership: no field_policies entry meant due_requests() never touched
    # these paths, so rigctld's own one-shot reads (proven healthy —
    # ``_OBSERVABLE_CMD15_FIELDS``, ``_civ_rx.py``) were the only thing that
    # ever populated them, and the always-polling web panel never saw a live
    # value. Not stream_like_meters (that class is pinned to <=0.25s/<=2.0s
    # by test_known_profiles_stream_like_meters_use_fast_non_decaying_policies
    # for every profile including this one) — plain polling_only instead,
    # with cadence chosen for THIS profile's serial budget below.
    "global.meters.power",
    "global.meters.swr",
    "global.meters.alc",
    "global.meters.comp",
    "global.meters.vd",
    "global.meters.id",
]
stream_like_meters = [
    "receiver.main.meters.s_meter",
]
command_response_observable = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.operator_controls.af_level",
    "receiver.main.operator_controls.rf_gain",
    "receiver.main.operator_controls.squelch",
    "receiver.main.operator_controls.att",
    "receiver.main.operator_controls.preamp",
    "receiver.main.operator_controls.agc",
    "receiver.main.operator_toggles.nb",
    "receiver.main.operator_toggles.nr",
    "global.operator_controls.power_level",
    "global.tx_state.compressor_on",
    "global.operator_controls.compressor_level",
    "global.tx_state.ptt",
    "global.operator_controls.tuner_status",
    "global.tx_state.split",
    # MOR-1483 (field-policy membership wave, leg 1): VOX/MON toggles.
    # Non-polling (command_response only) — riding the MOR-1490
    # prime_unobserved mechanism rather than a poll cadence; see the
    # field_policies comment below.
    "global.tx_state.vox_on",
    "global.tx_state.monitor_on",
    # MOR-1483 (leg 2): voxDelay (1A-05 ctl-mem 01-91, this radio's control
    # number — see docs/validation/cat-audits/ic7300.md) is now addable as
    # sub=0x05 with data=01 91. The ingress decode already matches this
    # prefix too. Non-polling, same prime_unobserved mechanism as the toggles
    # above.
    "global.operator_controls.vox_delay",
    # MOR-1491 (field-policy membership wave, leg 2): filter/PBT facts.
    "receiver.main.active.freq_mode.filter_width",
    # MOR-1546: filter-select (filter_num) and DATA-mode carry the #2452
    # armed affordance but had NO acquisition capability declared at all --
    # ``_availability_for`` (acquisition_scheduler.py) rejects any
    # ``ensure_fresh`` request for a path with no declared capability
    # (UNKNOWN availability), so their armed confirm could not even reach
    # the post-write-readback table added here (``_POST_WRITE_READBACK_FIELDS``
    # in radio_poller.py) without this. Same event-driven-only shape as
    # ``filter_width`` above -- no periodic cadence, so this adds nothing to
    # the standing serial budget accounted at the bottom of this file.
    "receiver.main.active.freq_mode.filter_num",
    "receiver.main.active.freq_mode.data_mode",
    "receiver.main.operator_controls.filter_shape",
    "receiver.main.operator_controls.pbt_inner",
    "receiver.main.operator_controls.pbt_outer",
    # MOR-1492 (field-policy membership wave, leg 3): DSP level facts.
    "receiver.main.operator_controls.nr_level",
    "receiver.main.operator_controls.nb_level",
    "receiver.main.operator_toggles.auto_notch",
    "receiver.main.operator_toggles.manual_notch",
    # notch_filter reclassified receiver-scoped under MOR-1548, matching
    # ic7610.toml's per-receiver cmd29 route rationale for 0x14 0x0D; this
    # single-RX profile only ever resolves to "main".
    "receiver.main.operator_controls.notch_filter",
    "receiver.main.operator_controls.manual_notch_width",
    "receiver.main.operator_controls.agc_time_constant",
    # MOR-1493 (field-policy membership wave, leg 4): RIT/XIT and CW keyer
    # facts.
    "global.operator_controls.rit_freq",
    "global.tx_state.rit_on",
    "global.tx_state.rit_tx",
    "global.operator_controls.break_in",
    "global.operator_controls.break_in_delay",
    "global.operator_controls.key_speed",
    "global.operator_controls.cw_pitch",
    "receiver.main.operator_toggles.twin_peak_filter",
]
supported_controls = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.operator_controls.af_level",
    "receiver.main.operator_controls.rf_gain",
    "receiver.main.operator_controls.squelch",
    "receiver.main.operator_controls.att",
    "receiver.main.operator_controls.preamp",
    "receiver.main.operator_controls.agc",
    "receiver.main.operator_toggles.nb",
    "receiver.main.operator_toggles.nr",
    "global.operator_controls.power_level",
    "global.tx_state.compressor_on",
    "global.operator_controls.compressor_level",
    "global.tx_state.ptt",
    "global.operator_controls.tuner_status",
    "global.tx_state.split",
]

[state_acquisition.field_policies."receiver.main.meters.s_meter"]
cadence_seconds = 0.2
freshness_ttl_seconds = 2.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.2

# A bare 0x1C/0x00 read observes the front-panel TX state and carries no data
# byte, so it cannot key the radio. Keep the existing PTT safety lane unchanged.
[state_acquisition.field_policies."global.tx_state.ptt"]
cadence_seconds = 0.3
freshness_ttl_seconds = 1.0
adaptive_decay = false

# MOR-1484: bench-measured cadence tightening for the ACTIVE-VFO freq/mode
# pair and the RF-gain/squelch sliders -- the fields the ticket's live IC-7300
# probe (serial @115200) found trailing the operator most (medians 1.30s/
# 2.16s/1.33s/2.22s, worst case up to 2.92s).
#
# Mechanism (MOR-1484 review R1 correction): AcquisitionScheduler groups
# pollable fields by (scope, family, receiver_id, slot, policy) --
# ``_AcquisitionRequestKey`` / ``_poll_cadence_groups`` in
# acquisition_scheduler.py -- and each group gets its OWN independent cadence
# clock; there is no single flat round-robin across every default-tier field.
# freq_hz(active)/mode(active) (family ``freq_mode``) were ALREADY their own
# isolated 2-field group before this PR, sharing a clock with nothing else,
# so their gain here is purely the 1.5s -> 1.0s cadence-ratio speedup (a
# ~33% shorter worst-case gap between polls of that pair), not a change in
# how many fields they share a clock with. rf_gain/squelch (family
# ``operator_controls``, same scope/receiver/slot) DID share a larger group
# pre-PR -- {af_level, rf_gain, squelch, att, preamp, agc}, 6 fields, one
# clock -- so pulling them into their own 2-field group has a genuine but
# SECOND-ORDER extra benefit on top of the cadence-ratio gain: when that
# clock fires, the executor no longer has to clear up to 4 other same-tick
# siblings' frames through the ~20 q/s serial rate limiter
# (_SERIAL_DEFAULT_CIV_MIN_INTERVAL_MS, 50ms/frame) before rf_gain/squelch's
# own frames go out -- worth roughly 100-200ms off the worst case, not
# several seconds.
#
# Deliberately NOT 0.5-0.8s: MOR-1484's post-write readback mechanism
# (``RadioPoller._request_post_write_readback``, USER priority) already
# gives the operator's OWN write an immediate confirmed readback -- this
# tier only has to catch up a front-panel/other-CAT-client change or the
# very first poll after connect, so 1.0s is a modest, budget-conservative
# choice (see the serial-budget accounting at the bottom of this file), not
# an attempt to match the post-write path's latency. unselectedVfo (measured
# 1.18s/2.54s) and af_level are deliberately left on the default 1.5s tier --
# the ticket's operator-felt symptoms (pending-frequency echo, slider trail)
# are about the ACTIVE vfo and rf_gain/squelch specifically; widening this
# tier further would eat into the budget freed below for no measured gain.
[state_acquisition.field_policies."receiver.main.active.freq_mode.freq_hz"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.active.freq_mode.mode"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.operator_controls.rf_gain"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.operator_controls.squelch"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false

# MOR-1484: this profile's ~20 q/s serial floor (see the accounting at the
# bottom of this file) has essentially no free headroom for the 1.0s tier
# above without giving something back. These six fields are settings an
# operator changes rarely mid-QSO (tuner match, RF power level, compressor
# on/level, attenuator, preamp) rather than continuously-live readouts like
# freq/mode/rf_gain/squelch/s_meter/ptt, and none of them appear in the
# ticket's measured or operator-felt symptom list -- 3.0s/6.0s trades a cheap,
# low-stakes cadence give-back on these for real headroom to spend on the
# fields that were actually measured trailing the operator.
[state_acquisition.field_policies."global.operator_controls.tuner_status"]
cadence_seconds = 3.0
freshness_ttl_seconds = 6.0
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.power_level"]
cadence_seconds = 3.0
freshness_ttl_seconds = 6.0
adaptive_decay = false

[state_acquisition.field_policies."global.tx_state.compressor_on"]
cadence_seconds = 3.0
freshness_ttl_seconds = 6.0
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.compressor_level"]
cadence_seconds = 3.0
freshness_ttl_seconds = 6.0
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.operator_controls.att"]
cadence_seconds = 3.0
freshness_ttl_seconds = 6.0
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.operator_controls.preamp"]
cadence_seconds = 3.0
freshness_ttl_seconds = 6.0
adaptive_decay = false

# MOR-1452 (review fix): mic/monitor/VOX/anti-VOX gain. IC-7610 polls these
# same 4 fields at 3.0s/5.0s (rigs/ic7610.toml), but IC-7610 is LAN — IC-7300
# is SERIAL, sharing one ~20 transactions/s software floor
# (_SERIAL_DEFAULT_CIV_MIN_INTERVAL_MS, 50ms/frame) across every poll,
# operator command, AND the keep-alive on this same lane. Copying 3.0s
# verbatim would add 4 fields / 3.0s = 1.333 q/s on top of this profile's
# pre-existing ~19.667 q/s demand (freq/mode/keep-alive/af/rf/squelch/
# att/preamp/agc/nb/nr/power/compressor/ptt/tuner/split, each 1/cadence) —
# 21.0 q/s, structurally over the 20 q/s ceiling, degrading cadence on EVERY
# polled field including PTT (0.3s) and freq/mode (1.5s). 15.0s/25.0s was
# chosen instead to leave real headroom rather than sitting exactly on the
# boundary.
#
# MOR-1484 (bench-measured follow-up): the ticket's live probe measured
# mic_gain populate (slow front-panel knob rotation, not a rigplane write —
# nothing this profile owns can accelerate that with a post-write readback)
# at 10.73s median / 16.25s worst case against this 15.0s-cadence tier's
# "<=15s populate" intent — these 4 fields share ONE cadence clock/group
# (same scope/family/receiver/policy, see the mechanism note above the
# freq/mode/rf_gain/squelch tier) and fire together each time it is due, but
# the resulting frames still have to clear the ~20 q/s whole-lane serial rate
# limiter alongside every OTHER group's traffic due around the same moment —
# that contention, not anything internal to this group, is why the observed
# worst case exceeds the nominal cadence. 10.0s/15.0s tightens the cadence
# with margin (a fresh value is now due within 10s, not 15s, cutting the
# plausible worst case well clear of the 15s target) at a modest added cost: 4 fields /
# 10.0s = 0.4 q/s vs the previous 4/15.0 = 0.267 q/s, +0.133 q/s. The budget
# accounting comment above the freq/mode/rf_gain/squelch tier (this file,
# above) shows where that -- and the freq/mode/rf_gain/squelch tightening's
# larger cost -- comes from.
[state_acquisition.field_policies."global.operator_controls.mic_gain"]
cadence_seconds = 10.0
freshness_ttl_seconds = 15.0
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.monitor_gain"]
cadence_seconds = 10.0
freshness_ttl_seconds = 15.0
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.vox_gain"]
cadence_seconds = 10.0
freshness_ttl_seconds = 15.0
adaptive_decay = false

[state_acquisition.field_policies."global.operator_controls.anti_vox_gain"]
cadence_seconds = 10.0
freshness_ttl_seconds = 15.0
adaptive_decay = false

# MOR-1485 (TX/PA meters dead on serial): owner ruling splits the six 0x15
# meters into two gating shapes.
#
# Po/SWR/ALC/COMP are meaningful only while transmitting (`tx_only = true`),
# so AcquisitionScheduler.due_requests skips their cadence group entirely
# while PTT reads false -- ZERO steady-state (RX) serial cost. 1.0s cadence
# is chosen for TX-window responsiveness, matching this profile's own
# 1.5s-or-faster tier for everything else that matters live; it only ever
# fires during a TX segment, transiently adding 4 fields / 1.0s = 4.0 q/s on
# top of this profile's RX-state demand (see vd/id below; 19.967 q/s when
# this was written, 19.433 q/s after the MOR-1484 cadence tightening above)
# for as long as the key is down -- an accepted, TX-scoped tradeoff, not a
# steady-state regression of the MOR-1484 serial medians.
[state_acquisition.field_policies."global.meters.power"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false
tx_only = true

[state_acquisition.field_policies."global.meters.swr"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false
tx_only = true

[state_acquisition.field_policies."global.meters.alc"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false
tx_only = true

[state_acquisition.field_policies."global.meters.comp"]
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false
tx_only = true

# Vd/Id are supply telemetry, not TX readings -- the radio answers them in RX
# too (proven: rigctld's ``_OBSERVABLE_CMD15_FIELDS`` one-shots already flip
# these to observed outside TX), so they poll unconditionally (``tx_only``
# defaults false). The pre-existing RX-state demand (19.933 q/s) already
# sits only 0.067 q/s below the 20 q/s serial ceiling (see the serial-budget
# assertion in tests/test_state_acquisition_policy.py) -- there is no room
# for anything faster than a very slow cadence here without regressing every
# OTHER field's actual throughput, which is exactly what MOR-1485 must not do
# to the MOR-1484 medians. 60.0s spends under half of that remaining headroom
# (2 fields / 60.0s = 0.033 q/s, 19.933 -> 19.967 q/s) while still refreshing
# a slowly-varying supply rail/current reading roughly once a minute --
# "live", just not fast. (These 19.933/19.967 figures predate the MOR-1484
# cadence tightening above/below this block -- see that block's comment for
# the current total, 19.433 q/s.)
[state_acquisition.field_policies."global.meters.vd"]
cadence_seconds = 60.0
freshness_ttl_seconds = 90.0
adaptive_decay = false

[state_acquisition.field_policies."global.meters.id"]
cadence_seconds = 60.0
freshness_ttl_seconds = 90.0
adaptive_decay = false

# MOR-1483/1491/1492/1493 (field-policy membership wave): non-polling
# (command_response) membership riding the MOR-1490 priming mechanism
# (AcquisitionScheduler.prime_unobserved). These fields are deliberately
# NOT in [state_acquisition.capabilities].polling_only above, so
# due_requests() never touches them; instead prime_unobserved() queues a
# BACKGROUND read for each once it's never-observed, re-deriving the
# never-observed set every ~30s
# (StateFreshnessService.PRIME_REDERIVE_INTERVAL_SECONDS) until each field
# lands its first observation — worst case a few re-derive windows if the
# scheduler's 5-path-per-call burst cap (prime_unobserved's
# _PRIME_UNOBSERVED_BURST_LIMIT) paces this whole group across multiple
# calls. cadence_seconds is pinned equal to freshness_ttl_seconds purely so
# diagnostics don't show a misleadingly fast number — it is otherwise inert
# here because these capabilities carry polling=False.
[state_acquisition.field_policies."global.tx_state.vox_on"]
cadence_seconds = 25.0
freshness_ttl_seconds = 25.0
reconciliation_priority = "command_response"
adaptive_decay = false

[state_acquisition.field_policies."global.tx_state.monitor_on"]
cadence_seconds = 25.0
freshness_ttl_seconds = 25.0
reconciliation_priority = "command_response"
adaptive_decay = false

# MOR-1483 (leg 2): voxDelay joins the same non-polling membership as the
# VOX/MON toggles above.
[state_acquisition.field_policies."global.operator_controls.vox_delay"]
cadence_seconds = 25.0
freshness_ttl_seconds = 25.0
reconciliation_priority = "command_response"
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.active.freq_mode.filter_width"]
cadence_seconds = 25.0
freshness_ttl_seconds = 25.0
reconciliation_priority = "command_response"
adaptive_decay = false

[state_acquisition.field_policies."receiver.main.operator_controls.filter_shape"]
cadence_seconds = 25.0
freshness_ttl_seconds = 25.0
