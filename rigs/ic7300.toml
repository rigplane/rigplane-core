# SWR meter calibration — piecewise-linear lookup from raw 0–255 to SWR ratio.
# First four points are firmware-anchored per the IC-7300 CI-V Reference (00=1.0,
# 48=1.5, 80=2.0, 120=3.0). Fifth point (240, 6.0) follows wfview IC-7300.rig
# (with the upstream `RigVal=2410` typo corrected to 240; matches IC-705/IC-9700
# sibling models). See P3-01 (issue #1173) and the R1 research note.
[meters.swr]
redline_raw = 120

[[meters.swr.calibration]]
raw = 0
actual = 1.0
label = "1.0"

[[meters.swr.calibration]]
raw = 48
actual = 1.5
label = "1.5"

[[meters.swr.calibration]]
raw = 80
actual = 2.0
label = "2.0"

[[meters.swr.calibration]]
raw = 120
actual = 3.0
label = "3.0"

[[meters.swr.calibration]]
raw = 240
actual = 6.0
label = "6.0+"

# S-meter calibration — piecewise-linear lookup from raw 0-255 to dB-rel-S9.
# Anchors verified against the official Icom CI-V Reference Guide's command
# 15 02 ("Read S-meter level") table: "00 00=S0 ~ 01 20=S9 ~ 02 41=S9+60 dB".
# Confirmed identically worded in BOTH the IC-7300MK2 CI-V Reference Guide
# (icomuk.co.uk/files/icom/PDF/productAdditionalFile/
# IC-7300MK2_ENG_CI-V_0.pdf) — the same source this repo's own CAT audit
# (docs/validation/cat-audits/ic7300.md) already cites as standing in for
# the original IC-7300's identically-numbered command table — and the
# IC-7610 CI-V Reference Guide (radiomanual.info mirror), so this is the
# documented Icom convention, not IC-7300-specific guesswork (MOR-1451;
# live evidence: main.sMeter raw 53 rendered as "S9+40" with no curve
# declared here before this table existed). Only the S0/S9/S9+60 anchors
# are published; intermediate S-units interpolate linearly between them.
#
# NOTE for a future ticket, out of MOR-1451's scope: rigs/ic7610.toml's own
# [meters.s_meter] table declares S9 at raw 130 (not 120) and its top
# anchor at S9+40 (raw 240, not S9+60/241) — inconsistent with the IC-7610
# CI-V Reference Guide's own S-meter table quoted above. IC-7610 is retired
# from the live bench (2026-08-04) so this was not corrected here.
[meters.s_meter]
redline_raw = 120

[[meters.s_meter.calibration]]
raw = 0
actual = -54.0
label = "S0"

[[meters.s_meter.calibration]]
raw = 120
actual = 0.0
label = "S9"

[[meters.s_meter.calibration]]
raw = 241
actual = 60.0
label = "S9+60"

# PA/TX telemetry meter calibration (MOR-1527) -- power / ALC / COMP / Vd / Id.
# Before this table existed these five meters had no [[meters.<key>.
# calibration]] block on this profile, so the backend published the raw
# CI-V byte (`_civ_rx.py`'s `_calibrated_meter_value` -> `interpolate_meter`
# returns `(raw, False)` with no table) and the frontend rendered it as a
# naked device-scale number with no unit -- the live finding behind this
# ticket: the Vd tile read "158" with nothing to say it wasn't volts.
#
# Source: hamlib's own IC-7300 driver (rigs/icom/ic7300.c,
# IC7300_RFPOWER_METER_CAL / IC7300_ALC_CAL / IC7300_COMP_METER_CAL /
# IC7300_VD_METER_CAL / IC7300_ID_METER_CAL), verified against commit
# cfaf1573deabe962452a42b58402e4f158554676 (2026-06-19):
# https://github.com/Hamlib/Hamlib/blob/cfaf1573deabe962452a42b58402e4f158554676/rigs/icom/ic7300.c#L93-L131
# The existing [meters.swr] table above (raw 0/48/80/120/240 -> 1.0/1.5/
# 2.0/3.0/6.0) is the SAME source and matches exactly, which is why hamlib
# is trusted here as a documented-Icom-convention proxy the same way it
# already stood in for wfview's SWR table.
#
# Provenance is honest, not uniform: hamlib-sourced but NOT independently
# live-validated on this bench for power/ALC/COMP/Id. Vd is the exception --
# live-corroborated: interpolating this table at raw 158 (13/10.0 ..
# 241/16.0) gives 13.82 V, which reproduces the operator's own live IC-7300
# bench reading ("~13.8 V" at that same raw byte, the finding that opened
# this ticket) to within rounding. Bench validation of the remaining four
# curves against a real load/meter is tracked as a MOR-1410 follow-up, not
# claimed here.
#
# ALC's `actual` column is stored in this repo's percent convention (0-100,
# matching rigs/ic7610.toml's own [meters.alc] table: raw 0/120 ->
# actual 0.0/100.0) rather than hamlib's normalized 0.0-1.0 scale --
# `_civ_rx.py`'s `_calibrated_meter_value` divides the interpolated ALC
# value by 100 back to the 0-1 domain before publishing, so this profile
# must speak the 0-100 wire format the loader expects, not hamlib's own
# units verbatim.
[[meters.power.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.power.calibration]]
raw = 21
actual = 5.0
label = "5"

[[meters.power.calibration]]
