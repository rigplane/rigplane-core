[agc]
# GT (AGC FUNCTION, PDF p.10): set P2 0 OFF, 1 FAST, 2 MID, 3 SLOW, 4 AUTO;
# read P3 0 OFF, 1 FAST, 2 MID, 3 SLOW, 4 AUTO-FAST, 5 AUTO-MID, 6
# AUTO-SLOW. Same shape as the FTX-1 block.
modes = [0, 1, 2, 3, 4]
readback_modes = [0, 1, 2, 3, 4, 5, 6]
auto_mode = 4
auto_speed_labels = { "4" = "FAST", "5" = "MID", "6" = "SLOW" }

[agc.labels]
"0" = "OFF"
"1" = "FAST"
"2" = "MID"
"3" = "SLOW"
"4" = "AUTO"

[break_in]
# CAT `BI` (PDF p.5): P1 0 = OFF, 1 = ON. SEMI/FULL is the menu item CW
# SETTING 15 (CW BK-IN TYPE), not a BI value.
values = [0, 1]
labels = { "0" = "OFF", "1" = "ON" }

[commands]
# Single receiver: P1 is 0 (MAIN) fixed on every P1-carrying verb and there
# are no SUB (P1=1) forms, no VS/FR/ST, and no memory verbs. What is
# deliberately absent, and why:
# - get/set_vfo_select, get_vfo_slot, set_vfo_slot: no VS verb (PDF p.3-4
#   command list); slot reads/selections raise NotImplementedError.
# - get/set_rx_func: no FR verb; the single transceiver has no RX
#   function. get/set_tx_func ARE declared (FT read/set, PDF p.10).
# - get_if_status: the IF answer layout (PDF p.11) uses a 3-character
#   channel where the shared parser's {chan} placeholder is 5 characters
#   (FTX-1 shape); declaring it would misparse. UNVERIFIED: real IF length
#   (28 bytes per manual vs 41 on some FT-991 firmware per Hamlib).
# - Memory (MC/MR/MT/AM/MA/MW/VM): memory_read is out of v1; the MR layout
#   (PDF p.13) is UNVERIFIED against the shared MR parser.
# - PS power-on: the PS1 sequence needs a dummy byte plus 1-2 s timing
#   (PDF p.15); out of v1.
# - ML monitor, RT/XT/RU/RD/RC clarifier, PR speech-processor on/off:
#   shapes the shared backend cannot drive -- ML methods raise
#   unconditionally, clarifier is CF000/CF001-shaped, PR P2 is 1/2 while the
#   backend writes 0/1 (inverted). See [capabilities] notes.
# - NB/NR toggles and levels (NB0/NR0, NL0/RL0): independent switches need
#   a shared switch-read mechanism (v1 omission, see [capabilities]).
# - get/set_squelch (SQ0): the 000-100 range needs a domain-driven level
#   mechanism shared by rigctld, web and command-service (v1 omission,
#   see [capabilities]).
# - AC tuner: P3 2 = start/stop differs from the shared tuner code's
#   FTX-1 mapping; needs typed native-state data (v1 omission).
# - MD1 sub-receiver mode forms: the MD selector is fixed at 0 (PDF p.12).
# - VD/VG (VOX delay/gain), KR (keyer on/off), KY/KM (keyer memories),
#   MX (MOX), TS (TXW), SC/CH/QS and the panel verbs: no backend caller.
# ── Frequency / Mode ──
get_freq       = { cat = { read = "FA;", parse = "FA{freq:09d};" } }
set_freq       = { cat = { write = "FA{freq:09d};" } }
get_freq_sub   = { cat = { read = "FB;", parse = "FB{freq:09d};" } }
set_freq_sub   = { cat = { write = "FB{freq:09d};" } }
get_mode       = { cat = { read = "MD0;", parse = "MD0{mode};" } }
set_mode       = { cat = { write = "MD0{mode};" } }
# NOTE: no MD1 forms in v1. The MD selector is fixed at 0 (PDF p.12);
# get_mode(receiver=1) refuses through the absent-command convention.

# ── VFO ──
# SV; SWAP VFO, AB; VFO-A to VFO-B, BA; VFO-B to VFO-A (PDF p.5, set-only).
# Equalize (A=B) is the A->B copy, admitted through the declared vfo_a_to_b
# primitive (MOR-4433 follow-up A); no separate vfo_equalize verb exists.
vfo_a_to_b     = { cat = { write = "AB;" } }
vfo_b_to_a     = { cat = { write = "BA;" } }
vfo_swap       = { cat = { write = "SV;" } }
# BS: write-only band select (PDF p.6); P1P1 is the band code directly (no
# RX digit, unlike the FTX-1 BS0 form). Codes match [freq_ranges] bsr_code.
set_band       = { cat = { write = "BS{band:02d};" } }
band_up        = { cat = { write = "BU0;" } }
band_down      = { cat = { write = "BD0;" } }

# ── Split (no ST verb) ──
# FT (FUNCTION TX, PDF p.10): set P1 2 = VFO-A TX (split off), 3 = VFO-B TX
# (split on); read answers FT0/FT1. Values come from [vfo.split].
get_split      = { cat = { read = "FT;", parse = "FT{state};" } }
set_split      = { cat = { write = "FT{state};" } }

# ── TX function (same FT verb, TX-VFO direction) ──
# Read P2 0 = VFO-A TX, 1 = VFO-B TX; set P1 2/3 (PDF p.10). Answer
# meanings come from [vfo.tx_func].
get_tx_func    = { cat = { read = "FT;", parse = "FT{vfo};" } }
set_tx_func    = { cat = { write = "FT{vfo};" } }

# ── PTT / TX ──
get_ptt        = { cat = { read = "TX;", parse = "TX{state};" } }
set_ptt        = { cat = { write = "TX{state};" } }

# ── Meters ──
get_s_meter    = { cat = { read = "SM0;", parse = "SM0{raw:03d};" } }
# RM (PDF p.16): single 3-digit value (P1 selects the meter). The shared
# backend also accepts a MAIN+SUB pair (FTX-1 shape); with one value the SUB
# read falls back to MAIN in radio._read_meter (MOR-4433).
get_meter      = { cat = { read = "RM{type};", parse = "RM{type}{main:03d};" } }

# ── Audio / RF Controls ──
get_af_level       = { cat = { read = "AG0;", parse = "AG0{level:03d};" } }
set_af_level       = { cat = { write = "AG0{level:03d};" } }
get_rf_gain        = { cat = { read = "RG0;", parse = "RG0{level:03d};" } }
set_rf_gain        = { cat = { write = "RG0{level:03d};" } }
# Omitted in v1: get/set_squelch (SQ0 P2 000-100) -- see the
# [capabilities] note.

# ── RF Front End ──
get_attenuator = { cat = { read = "RA0;", parse = "RA0{state};" } }
set_attenuator = { cat = { write = "RA0{state};" } }
# PA (PDF p.13): P1 0 fixed, P2 0 IPO / 1 AMP1 / 2 AMP2. P1 is fixed at
# the template level: the backend still passes band, but only {value}
# reaches the wire, so set_preamp(1, band=1) writes PA01;, not PA11;.
get_preamp     = { cat = { read = "PA0;", parse = "PA0{value};" } }
set_preamp     = { cat = { write = "PA0{value};" } }

# ── DSP / Noise ──
# omitted from v1: NB/NR on/off are independent switches (NB0/NR0) with
# separate levels; needs a shared switch-read mechanism (follow-up).
get_auto_notch = { cat = { read = "BC0;", parse = "BC0{state};" } }
set_auto_notch = { cat = { write = "BC0{state};" } }
get_manual_notch = { cat = { read = "BP00;", parse = "BP00{state:03d};" } }
set_manual_notch = { cat = { write = "BP00{state:03d};" } }
get_manual_notch_freq = { cat = { read = "BP01;", parse = "BP01{freq:03d};" } }
set_manual_notch_freq = { cat = { write = "BP01{freq:03d};" } }

# ── AGC ──
get_agc        = { cat = { read = "GT0;", parse = "GT0{mode};" } }
set_agc        = { cat = { write = "GT0{mode};" } }

# ── Filter / IF ──
# SH0 reads the MAIN width, NA0 the narrow state (PDF p.14, p.17).
# SH carries P1 (fixed 0) plus a TWO-digit width code (PDF p.17:
# SSB wide 2400 Hz is code 14 -> SH014;); IS carries P1 (fixed 0),
# the sign and four offset digits (PDF p.11: IS0+0200;).
get_filter_width = { cat = { read = "SH0;", parse = "SH0{code:02d};" } }
set_filter_width = { cat = { write = "SH0{code:02d};" } }
get_if_shift   = { cat = { read = "IS0;", parse = "IS0{sign}{offset:04d};" } }
set_if_shift   = { cat = { write = "IS0{sign}{offset:04d};" } }
get_narrow     = { cat = { read = "NA0;", parse = "NA0{state};" } }
set_narrow     = { cat = { write = "NA0{state};" } }

# ── TX / Power ──
# PC (PDF p.15): P1 005-100 with no head digit (unlike the FTX-1
# PC{head}{watts} form). The backend returns head 0 for a headless PC
# (MOR-4433); only watts is consumed downstream.
get_power      = { cat = { read = "PC;", parse = "PC{watts:03d};" } }
set_power      = { cat = { write = "PC{watts:03d};" } }
get_mic_gain   = { cat = { read = "MG;", parse = "MG{level:03d};" } }
set_mic_gain   = { cat = { write = "MG{level:03d};" } }
# NOTE: no PL (processor level) and no PR (processor on/off): the level is
# only reachable through the "compressor" capability, which stays out (see
# above), so declaring them would leave them unwired.
# ── CW ──
get_keyer_speed = { cat = { read = "KS;", parse = "KS{wpm:03d};" } }
set_keyer_speed = { cat = { write = "KS{wpm:03d};" } }
get_key_pitch  = { cat = { read = "KP;", parse = "KP{idx:02d};" } }
set_key_pitch  = { cat = { write = "KP{idx:02d};" } }
get_break_in   = { cat = { read = "BI;", parse = "BI{state};" } }
set_break_in   = { cat = { write = "BI{state};" } }
get_cw_spot    = { cat = { read = "CS;", parse = "CS{state};" } }
set_cw_spot    = { cat = { write = "CS{state};" } }
get_break_in_delay = { cat = { read = "SD;", parse = "SD{delay:04d};" } }
set_break_in_delay = { cat = { write = "SD{delay:04d};" } }

# ── Tone / CTCSS ──
# CT (PDF p.6): P1 0 fixed, single-digit P2 (0 OFF, 1 ENC/DEC, 2 ENC,
# 3 DCS ENC/DEC, 4 DCS ENC). `receiver` names the manual P1 selector.
get_sql_type   = { cat = { read = "CT{receiver};", parse = "CT{receiver}{type};" } }
set_sql_type   = { cat = { write = "CT{receiver}{type};" } }
# CN (PDF p.5): P1 0 fixed, P2 0 CTCSS, P3 the 50-tone chart index.
get_ctcss_tone = { cat = { read = "CN{receiver}0;", parse = "CN{receiver}0{code:03d};" } }
set_ctcss_tone = { cat = { write = "CN{receiver}0{code:03d};" } }

# ── Repeater Shift ──
# OS (PDF p.13): P1 0 fixed, P2 0 Simplex / 1 Plus / 2 Minus. FM only per
# the manual footnote. `receiver` names the P1 selector.
get_repeater_shift = { cat = { read = "OS{receiver};", parse = "OS{receiver}{shift};" } }
set_repeater_shift = { cat = { write = "OS{receiver}{shift};" } }

# ── System ──
get_id         = { cat = { read = "ID;", parse = "ID{model:04d};" } }
get_auto_info  = { cat = { read = "AI;", parse = "AI{state};" } }
set_auto_info  = { cat = { write = "AI{state};" } }
get_vox        = { cat = { read = "VX;", parse = "VX{state};" } }
set_vox        = { cat = { write = "VX{state};" } }
get_lock       = { cat = { read = "LK;", parse = "LK{state};" } }
set_lock       = { cat = { write = "LK{state};" } }
# omitted from v1: AC P3 encoding differs (2 = start/stop) from the
# FTX-1 mapping in the shared tuner code; needs typed native-state data.
# CO (PDF p.6): P1 0 fixed; P2 0 contour on/off, 1 contour freq, 2 APF
# on/off, 3 APF freq; P3 the 4-digit value.
# Omitted in v1: get/set_contour (P2 0) -- see the [capabilities] note.
get_apf        = { cat = { read = "CO02;", parse = "CO02{val:04d};" } }
set_apf        = { cat = { write = "CO02{val:04d};" } }
get_apf_freq   = { cat = { read = "CO03;", parse = "CO03{val:04d};" } }
set_apf_freq   = { cat = { write = "CO03{val:04d};" } }

[tx_policy]
# UNVERIFIED on this radio: refused_during_tx is the FTX-1 bench measurement
# (MOR-1912); the manual documents no write-during-transmit behaviour.
# tx_state_map IS the manual (TX, PDF p.18): 0 RX, 1 CAT-keyed TX, 2
# self-keyed TX.
refused_during_tx = ["mode", "vfo-topology"]
tx_state_map = { "0" = "rx", "1" = "tx_cat", "2" = "tx_other" }
