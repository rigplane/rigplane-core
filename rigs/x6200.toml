# Rig Configuration — Xiegu X6200
#
# Xiegu X6200 ultra-portable HF/50MHz transceiver.
# Protocol: CI-V (subset of standard Icom CI-V, similar to X6100 family).
#
# Sources of truth (cross-referenced):
#   1. Radioddity "Xiegu X6200 CI-V implementation V1.0.6" (firmware V1.0.6).
#      All commands below come from the documented Table 1 (parts 1-5),
#      pages 5-9 of that PDF.
#   2. Hamlib master ``rigs/icom/xiegu.c`` — ``x6200_caps`` reuses the same
#      ``x6100_priv_caps`` struct (line ~690), confirming X6100 and X6200
#      share the same CI-V personality at the protocol level even though
#      they're separate Hamlib ``RIG_MODEL_*`` entries.
#
# History: MOR-170. Filed after the IC-705 profile (which X6200 was
# misidentified as by default — both default to CI-V address 0xA4) drove
# the radio's display into a flicker → wedge state on real hardware.
# The X6200 documented CI-V envelope is narrower than IC-705's, and
# crucially does NOT include the CI-V power command 0x18; this profile
# therefore omits ``power_on`` / ``power_off`` entirely so the runtime
# cannot send 0x18 on behalf of an X6200.

[radio]
id = "xiegu_x6200"
model = "X6200"
civ_addr = 0xA4
# Hamlib RIG_MODEL_X6200 (rigs_list.h) — used by validate --provider hamlib.
hamlib_model_id = 3091
receiver_count = 1
has_lan = false
has_wifi = true
# PDF page 4: "For CAT control, a speed of 19.200 bps on the SERIAL-B port
# is used." SERIAL-A at up to 115200 is the terminal port, not CAT.
default_baud = 19200

[protocol]
type = "civ"
address = 0xA4

[audio]
# The Xiegu X6200 exposes a standard mono USB Audio Class CODEC (C-Media
# based), exactly like the IC-705 / IC-7300 SERIAL-audio path. Its capture
# device advertises a single input channel, so RX audio must be opened as
# 1-channel PCM. Without this section the profile fell back to the global
# default codec (``PCM_2CH_16BIT``, stereo), and ``UsbAudioDriver.start_rx``
# asked PortAudio for a 2-channel InputStream — which the mono device
# rejects with ``Invalid number of channels`` (PaErrorCode -9998). The
# AudioBus then logged ``failed to start RX`` and the browser received zero
# RX frames (MOR-236). Mirror the IC-705 / IC-7300 mono preference.
codec_preference = ["PCM_1CH_16BIT", "ULAW_1CH"]

[capabilities]
# Aligned to Hamlib's ``X108G_LEVELS`` / ``X108G_FUNCS`` envelope
# (xiegu.c lines 52, 54) intersected with what the Radioddity X6200 PDF
# explicitly documents as supported by firmware V1.0.6. Intentionally
# narrower than the IC-705 envelope:
#   - no ``power_control`` (no documented CI-V 0x18)
#   - no ``scope`` (no documented 0x27 family)
#   - no tone family (``repeater_tone`` / ``tsql``): the backend would send
#     ``0x16 0x42/0x43`` + ``0x1B 0x00``, none of which the X6200 firmware
#     answers. A live X6200 capture (CI-V 0xA4) confirmed all four tone
#     RMVR checks (repeater_tone/tone_freq/tsql/tsql_freq) time out, so the
#     caps are dropped — the checks now resolve UNSUPPORTED, not FAIL
#     (MOR-683, supersedes the audit's gap-list D tone row).
#   - no ``pbt`` (twin passband tuning): the front panel HAS PBT, but a live
#     X6200 probe (CI-V 0xA4) showed ``get_pbt_inner`` (0x14 0x07) and
#     ``get_pbt_outer`` (0x14 0x08) both TIME OUT in BOTH AM and USB modes —
#     the firmware does not expose PBT over CI-V. Hamlib xiegu.c over-declares
#     it without a round-trip, so the cap is dropped → the pbt.presence check
#     now resolves UNSUPPORTED, not a spurious presence-pass (MOR-699).
#   - no ``filter_width`` SET: a live X6200 capture (CI-V 0xA4) showed
#     ``0x1A 0x03`` cannot be round-tripped by the harness — ``get`` reads
#     back a passband index (live: 27) while the USB setter guards
#     50-9999 Hz, so the nudge produces an out-of-range write (units
#     mismatch), and Hamlib marks ``x1ax03_supported = 0``. The cap stays
#     UNDECLARED pending a setter units fix + a clean live round-trip
#     (MOR-683 defers; tracked as a filter_width follow-up).
#   - ``break_in`` KEEPS the capability tag but intentionally declares NO
#     ``[break_in]`` domain (MOR-1534). docs/validation/cat-audits/x6200.md
#     (§ "D. MISMATCH / WRONG", break-in row; § "Documentation quality note")
#     found the backend's ``get/set_break_in`` opcode
#     (``0x16 0x47``, IC-7610's CW BK-IN mode register) is NOT in the X6200's
#     documented CI-V table at all — the X6200 PDF only documents QSK hang
#     time (``0x14 0x0F``), not a BK-IN-mode register. This profile declares
#     no ``break_in_delay`` key, control or feature either (unlike its four
#     IC-7300/7610/9700/705 siblings, which all do). ``0x14 0x0F`` on X6200
#     is reached today by exactly ONE path: the unconditional poll in
#     ``runtime/_state_queries.py: build_state_queries``'s
#     ``_COMMON_FEATURE_QUERIES`` list, which every CI-V radio built
#     through this query builder sends regardless of declared capability
#     or this profile's ``[commands]`` table — the same undeclared-hardcode
#     class this bullet warns about, not an exception to it.
#     ``CoreRadio.get_break_in_delay`` / ``CoreRadio.set_break_in_delay``
#     (``commands/levels.py: get_break_in_delay`` / ``set_break_in_delay``)
#     do NOT reach it: both route through the bound command map
#     (``commands/bound.py: BoundCommands``, MOR-2006) and this profile
#     declares neither key present nor declared-absent, so both refuse
#     with ``CommandError`` (the undeclared-command policy, D1, MOR-2005)
#     instead of sending anything — confirmed by calling both against this
#     profile's own ``CommandMap`` directly (correction, #2834/#2836
#     review: an earlier draft of this comment first claimed the opposite
#     of undeclared-hardcode, then a follow-up undercounted by naming only
#     ``get_break_in_delay``'s hardcode — a hardcode the bound-command-map
#     migration had already replaced with this refusal by the time that
#     follow-up was written). There is no trustworthy in-repo source for
#     an OFF/SEMI/FULL value domain on this radio, so
#     ``CoreRadio.set_break_in`` refuses (fails loud) rather than validate
#     against a guessed table.
#   - ``notch`` likewise KEEPS the capability tag but intentionally declares
#     NO ``[notch] width_values`` domain (MOR-1551). docs/validation/
#     cat-audits/x6200.md (§ "C. MISSING BACKEND"; § "D. MISMATCH / WRONG",
#     manual notch row) found the ``notch`` cap
#     currently routes to ``set_manual_notch`` (``0x16 0x48``, Icom
#     manual-notch on/off) which is ALSO not in the X6200's documented CI-V
#     table — the X6200's real notch mechanism is the digital notch filter
#     (DNF) toggle at ``0x16 0x41`` plus its center frequency at
#     ``0x14 0x0D`` (confirmed-correct opcode, 100-3000 Hz). Neither the PDF
#     Table 1 nor Hamlib's ``x6100_priv_caps`` document a WIDE/MID/NAR-style
#     width register for this radio at all, so there is no trustworthy
#     in-repo source for a width domain — ``CoreRadio.set_manual_notch_width``
#     stays unvalidated (permissive, mirrors ``set_agc``/``set_preamp``)
#     rather than fabricate one. Closing evidence: a live X6200 CI-V capture
#     of ``0x16 0x57`` GET/SET (NAK vs. ACK), or discovery of an actual DNF
#     width register via a wfview/hamlib update or firmware doc revision.
features = [
    "audio",
    "af_level",
    "rf_gain",
    "squelch",
    "attenuator",
    "preamp",
    "nb",
    "nr",
    "notch",
    "tx",
    "split",
    "vox",
    "compressor",
    "cw",
    "break_in",
    "rit",
    "xit",
    "tuner",
    "meters",
    "data_mode",
    "scan",
    "dial_lock",
    "agc",
]

[state_acquisition]
provider = "xiegu_civ"
default_cadence_seconds = 2.0
default_freshness_ttl_seconds = 8.0
default_reconciliation_priority = "poll"
adaptive_decay = true
adaptive_decay_idle_multiplier = 4.0
adaptive_decay_max_cadence_seconds = 30.0
external_cat_pause = "pause_polling"
meter_coalescing_window_seconds = 0.25

[state_acquisition.capabilities]
polling_only = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
stream_like_meters = [
    "receiver.main.meters.s_meter",
    "global.meters.power",
]
command_response_observable = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.active.freq_mode.filter_width",
]
supported_controls = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
unsupported = ["global.tx_state.power_on"]
unknown = ["global.meters.swr", "global.meters.alc"]

[state_acquisition.field_policies."receiver.main.active.freq_mode.mode"]
cadence_seconds = 1.0
freshness_ttl_seconds = 4.0
reconciliation_priority = "command_response"
external_cat_pause = "pause_polling"

[state_acquisition.field_policies."receiver.main.meters.s_meter"]
cadence_seconds = 0.25
freshness_ttl_seconds = 1.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.25

[state_acquisition.field_policies."global.meters.power"]
cadence_seconds = 0.25
freshness_ttl_seconds = 1.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.25

# PDF page 10 (Table 3 — Mode, Data & filter bandwidth) documents:
# LSB, LSB-D, USB, USB-D, AM, CW, NFM, CWR. The ``-D`` variants are the
# data-mode flavours selected via byte 2 of mode commands 0x26 0x00/0x01.
[modes]
list = ["USB", "LSB", "CW", "CW-R", "AM", "FM", "RTTY", "DIGI"]

[filters]
list = ["FIL1", "FIL2", "FIL3"]
# MOR-706 live USB CI-V 0xA4 evidence: 0x1A/0x03 returns one raw byte for the
# active selected FIL slot width, not packed BCD. Examples: 0x1c -> 1800 Hz,
# 0x22 -> 2400 Hz, 0x27 -> 2900 Hz. The observed formula is:
#   byte <= 21: Hz = byte * 50 + 50
#   byte >= 22: Hz = (byte - 10) * 100
# Keep max_hz at 3600 to match the established Icom SSB/CW/RTTY profile bound;
# higher X6200 values are not proven by current live evidence.
encoding = "raw_byte_index"
width_min_hz = 50
width_max_hz = 3600

[filters.width.SSB]
min_hz = 50
max_hz = 3600
defaults = [2900, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 1100, step_hz = 50, index_min = 0 },
    { hz_min = 1200, hz_max = 3600, step_hz = 100, index_min = 22 },
]

[filters.width.CW]
min_hz = 50
max_hz = 3600
defaults = [2900, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 1100, step_hz = 50, index_min = 0 },
    { hz_min = 1200, hz_max = 3600, step_hz = 100, index_min = 22 },
]

[filters.width.RTTY]
min_hz = 50
max_hz = 3600
defaults = [2900, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 1100, step_hz = 50, index_min = 0 },
    { hz_min = 1200, hz_max = 3600, step_hz = 100, index_min = 22 },
]

[filters.width.DIGI]
min_hz = 50
max_hz = 3600
defaults = [2900, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 1100, step_hz = 50, index_min = 0 },
    { hz_min = 1200, hz_max = 3600, step_hz = 100, index_min = 22 },
]

[filters.width.AM]
fixed = true

[filters.width.FM]
fixed = true

[vfo]
scheme = "ab"

# PDF page 5: ``0x11 0x00`` (off) / ``0x11 0x01`` (on) — binary toggle.
[attenuator]
values = [0, 1]

# PDF page 8: ``0x16 0x02 0x00`` / ``0x16 0x02 0x01`` — binary toggle.
[preamp]
values = [0, 1]

# PDF page 8: ``0x16 0x12 0x00..0x03`` — off / fast / slow / auto.
[agc]
modes = [0, 1, 2, 3]
labels = { "0" = "OFF", "1" = "FAST", "2" = "SLOW", "3" = "AUTO" }

# Per-radio validation classification (MOR-208). Controls whose capability
# names appear here route through the validate set-and-observe engine path
# (no read-first), so SET-but-no-GET controls report honest PASS instead of a
# read-first-timeout FAIL. Each entry must be a declared [capabilities] feature.
[validation]
write_only_controls = ["rit", "xit", "notch"]  # SET accepted but GET times out / no echo (MOR-179 rit/xit, MOR-207 notch; raw-CIV confirmed)

[controls.attenuator]
style = "toggle"

# Level control ranges — CI-V compatible (Xiegu X6200).
# Every "raw_min/raw_max" pair below is documented in the PDF as
# "BCD format 0-255" (pages 6-7).
[controls.af_level]
raw_min = 0
raw_max = 255

[controls.rf_gain]
raw_min = 0
raw_max = 255

[controls.squelch]
raw_min = 0
raw_max = 255

[controls.nr_level]
raw_min = 0
raw_max = 255

[controls.nb_level]
raw_min = 0
raw_max = 255

[controls.compressor_level]
raw_min = 0
raw_max = 255

# PDF page 6: "0=400Hz, 255=1200Hz" for CW sidetone.
[controls.cw_pitch]
raw_min = 0
raw_max = 255
display_min = 400
display_max = 1200
display_unit = "Hz"

[controls.rit]
# MOR-1883: exact-form translation of the previously declared range;
# step 1 from the shared CI-V builder (+/-9999 Hz, 1 Hz BCD).
mapping = "identity"
raw_min = -9999
raw_max = 9999
raw_step = 1
raw_origin = 0
display_min = -9999
display_max = 9999
display_step = 1
display_origin = 0
display_unit = "Hz"
quantization = "reject"
restoration = "exact"

# Same HF coverage envelope as X6100 (Xiegu HF/50MHz portables).
[[freq_ranges.ranges]]
label = "HF"
start_hz = 100000
end_hz = 54000000

[[freq_ranges.ranges.bands]]
name = "160m"
start_hz = 1800000
end_hz = 2000000
default_hz = 1825000

[[freq_ranges.ranges.bands]]
name = "80m"
start_hz = 3500000
end_hz = 3800000
default_hz = 3600000

[[freq_ranges.ranges.bands]]
name = "40m"
start_hz = 7000000
end_hz = 7200000
default_hz = 7100000

[[freq_ranges.ranges.bands]]
name = "30m"
start_hz = 10100000
end_hz = 10150000
default_hz = 10125000

[[freq_ranges.ranges.bands]]
name = "20m"
start_hz = 14000000
end_hz = 14350000
default_hz = 14200000

[[freq_ranges.ranges.bands]]
name = "17m"
start_hz = 18068000
end_hz = 18168000
default_hz = 18100000

[[freq_ranges.ranges.bands]]
name = "15m"
start_hz = 21000000
end_hz = 21450000
default_hz = 21200000

[[freq_ranges.ranges.bands]]
name = "12m"
start_hz = 24890000
end_hz = 24990000
default_hz = 24940000

[[freq_ranges.ranges.bands]]
name = "10m"
start_hz = 28000000
end_hz = 29700000
default_hz = 28500000

[[freq_ranges.ranges.bands]]
name = "6m"
start_hz = 50000000
end_hz = 54000000
default_hz = 51000000

[[freq_ranges.ranges]]
label = "WFM"
start_hz = 88000000
end_hz = 108000000

[[freq_ranges.ranges]]
label = "Air"
start_hz = 108000000
end_hz = 136000000

# ── CI-V Commands ────────────────────────────────────────────────
# Only opcodes documented in Radioddity X6200 CI-V V1.0.6.
# NOTE: ``power_on`` / ``power_off`` are INTENTIONALLY OMITTED — CI-V
# 0x18 is not in the X6200 documented command set, and sending it from
# the IC-705 profile is the suspected wedge trigger that motivated this
# file. Do NOT add a 0x18 mapping here without re-validating on hardware.
[commands]

# PROVENANCE OPEN (D2, MOR-2019): the following have no live X6200 capture
# to close them, and none is possible now -- the unit was destroyed
# 2026-08-11. Where an entry below already has a [commands] key, its byte
# value is unchanged by this note; the note only records why it stays
# open. House pattern: rigs/ic9700.toml "PROVENANCE OPEN (D2, MOR-2015)".
#
# - get_freq [0x03]: Radioddity X6200 CI-V V1.0.6 p.4 documents it only
#   inside a worked CAT-control narrative example (GET active VFO
#   frequency), not in the opcode table itself (narrative-only per
#   docs/validation/cat-audits/x6200.md's per-opcode matrix).
# - set_freq [0x05]: absent from the V1.0.6 document entirely, not just
#   from the table -- the p.4 narrative example shows the GET direction
#   only, and grepping the extract for "0x05" as a command turns up
#   nothing else: its three hits are the unrelated 0x1A 0x05 LOCK GET row
#   and LOCK SET row (both p.8) plus a Table 3 mode-data row for NFM
#   (correction: an earlier draft of this entry grouped set_freq with
#   get_freq under the same narrative citation, which overstated
#   set_freq's sourcing).
# - get_mode / set_mode [0x04] / [0x06]: this entry's own comment used to
#   group get_mode/set_mode with get_freq/set_freq under one "PDF page 4
#   example" citation. docs/validation/cat-audits/x6200.md's per-opcode
#   matrix is more granular and disagrees for mode: 0x04 is absent from
#   the V1.0.6 table entirely (no narrative mention either) -- the prior
#   comment overstated the sourcing; corrected here (D2, MOR-2019).
# - vox -> formally { absent = ... } below (MOR-2008 batch 3, promoted
#   from this comment-only note): CoreRadio's dsp.py: get_vox/set_vox
#   built [0x16, 0x46] via a hardcoded fallback with no [commands] key at
#   all -- the V1.0.6 table has no CI-V VOX row of any kind, so the
#   fallback was sending an unconfirmed opcode on every call. The bound-
#   command-map migration (MOR-2006) deletes that fallback; without a
#   formal absent row this would land in D1 state 3 (unknown, refuse AND
#   warn) rather than state 2 (confirmed absent, refuse silently) for a
#   fact this comment already recorded.
# - notch -> get_manual_notch/set_manual_notch formally { absent = ... }
#   below (MOR-2008 batch 3, same promotion): the "notch" capability's
#   registry check (validation/registry/_dsp.py: notch.set) routes
#   through get_manual_notch/set_manual_notch, which built the Icom
#   manual-notch opcode [0x16, 0x48] via a hardcoded fallback -- not a
#   V1.0.6-documented register at all. The table's real notch mechanism
#   is the digital notch filter (DNF) toggle at [0x16, 0x41] (MOR-1551,
#   docs/validation/cat-audits/x6200.md § "C. MISSING BACKEND" /
#   § "D. MISMATCH / WRONG", manual notch row) -- that DNF register is
#   what `dsp.py: get_auto_notch`/`set_auto_notch` (a separate, uncapped
#   builder pair, not routed through the "notch" capability at all) build,
#   and is declared present below as `get_auto_notch`/`set_auto_notch`,
#   correcting the cat-audit's own "no method binds it" line (§ "C.
#   MISSING BACKEND", DNF row), which predates those two builders.
# - break_in -> get_break_in/set_break_in formally { absent = ... } below
#   (MOR-2008 batch 3, same promotion): built the Icom CW BK-IN opcode
#   [0x16, 0x47] via a hardcoded fallback with no [commands] key -- the
#   V1.0.6 table documents only QSK hang time at [0x14, 0x0F], not a
#   BK-IN-mode register (MOR-1534, docs/validation/cat-audits/x6200.md
#   § "D. MISMATCH / WRONG", break-in row). This profile declares no
#   break_in_delay key either (unlike its four IC-7300/7610/9700/705
#   siblings). [0x14, 0x0F] is reached today by exactly one path: the
#   unconditional poll in runtime/_state_queries.py: build_state_queries's
#   _COMMON_FEATURE_QUERIES list, sent regardless of declared capability
#   or this profile's [commands] table -- a separate undeclared-hardcode
#   path, not one this bullet's promotion touches. CoreRadio.
#   get_break_in_delay / CoreRadio.set_break_in_delay (commands/levels.py)
#   do NOT reach it either: both route through the bound command map
#   (commands/bound.py: BoundCommands, MOR-2006), and since this profile
#   declares neither key present nor declared-absent, both refuse with
#   CommandError instead (the undeclared-command policy, D1, MOR-2005) --
#   confirmed by calling both against this profile's own CommandMap
#   (correction, #2834/#2836 review: an earlier fix here undercounted by
#   naming only get_break_in_delay's hardcode, which the bound-command-map
#   migration had already replaced with this refusal).
# - nr / compressor / auto_notch -> declared present below (MOR-2008
#   batch 3, a correctness fix, not a promotion): dsp.py: get_nr/set_nr
#   ([0x16, 0x40]), get_compressor/set_compressor ([0x16, 0x44]), and
#   get_auto_notch/set_auto_notch ([0x16, 0x41], see the notch bullet
#   above) already built the V1.0.6-documented, cat-audit-confirmed-
#   correct opcode for each (docs/validation/cat-audits/x6200.md §
#   "Correctly handled" for NR; § "A. UNDER-DECLARED" for NR/compressor;
#   § "C. MISSING BACKEND" for the DNF/auto_notch opcode) via their
#   hardcoded fallback, with no [commands] key at all. Left undeclared,
#   the bound-command-map migration (MOR-2006) would have turned three
#   already-working controls into a refusal -- a regression, not a
#   correction, caught before it shipped by cross-checking every gap this
#   migration would newly enforce against this profile's own cat-audit
#   rather than assuming every gap is a genuine absence.
# - rit / xit -> hardcoded [0x21] in the RIT/XIT command builders
#   (commands/_frame.py: _CMD_RIT, consumed by commands/system.py), no
#   [commands] key: [0x21] itself is absent from the V1.0.6 table, but
#   the write-only *behavior* (SET accepted, GET times out) is
#   live-confirmed on this X6200 unit itself, not inferred from another
#   Icom model -- MOR-208/179 (commit 5a493d70) and MOR-207 (commit
#   b1df1e71). See [validation] write_only_controls above.
#
# One more V1.0.6-documented register (p.8) has no capability and no
# [commands] key at all, named here so nobody assumes an existing entry
# already covers it:
# - front-panel LOCK, [0x1A, 0x05, 0x00, 0x62] -- distinct from
#   get_dial_lock/set_dial_lock [0x16, 0x50] below.
#
# D2, MOR-2008 batch 4: this note used to also claim the band-stacking
# WRITE side of [0x1A, 0x01] was undeclared. That was false against the
# source it cited: p.8 of the same V1.0.6 PDF documents a SET row too
# ("Set Band stacking register D1-Band Number(01-0C), D2 irrelevant"),
# three lines under the GET row get_band_spectrum_display already cites
# below -- established by the MOR-2008 batch 4 D2 audit report (§6.2),
# which re-derived the page against the local PDF with pdftotext rather
# than trusting the prior claim. The SET row is real but is not the same
# command as Icom's own set_bsr (2-byte payload vs. set_bsr's 9-byte
# band+register+frequency+mode+filter record) -- see get_bsr/set_bsr's
# own { absent = ... } rows below for the narrower, correct claim.

# Frequency / mode (compatible Icom CI-V subset — see PROVENANCE OPEN above)
get_freq         = [0x03]  # source: Radioddity X6200 CI-V V1.0.6 p.4, narrative example only (via docs/validation/cat-audits/x6200.md) -- PROVENANCE OPEN above
set_freq         = [0x05]  # source: none in V1.0.6 -- absent from both the opcode table and the p.4 narrative (which shows GET only) -- PROVENANCE OPEN above
