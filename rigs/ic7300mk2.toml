# Field-policy shapes are carried from the IC-7300 profile; none are
# hardware-validated on the MK2. `reason` states the policy, not a measurement.

[state_acquisition.field_policies."receiver.main.meters.s_meter"]
reason = "stream-like meter keeps the coalescing window; 0.4 s cadence per the IC-7300 profile policy (MOR-2425), carried pending MK2 hardware validation"
cadence_seconds = 0.4
freshness_ttl_seconds = 2.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.2

# Po/SWR/ALC/COMP/Id are meaningful only while transmitting; the available_when
# clause discards the last TX reading on dekey (policy shape from the IC-7300
# profile, not an MK2 bench observation).
[state_acquisition.field_policies."global.meters.power"]
reason = "tx_only with available_when: absent while PTT reads false, so the last TX reading is discarded on dekey (IC-7300 profile policy carried)"
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false
tx_only = true
available_when = [
    { field = "global.tx_state.ptt", equals = true },
]

[state_acquisition.field_policies."global.meters.swr"]
reason = "tx_only with available_when: absent while PTT reads false, so the last TX reading is discarded on dekey (IC-7300 profile policy carried)"
cadence_seconds = 1.0
freshness_ttl_seconds = 2.0
adaptive_decay = false
tx_only = true
available_when = [
    { field = "global.tx_state.ptt", equals = true },
]

