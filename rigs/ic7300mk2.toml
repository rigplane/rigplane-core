get_transceiver_id = [0x19, 0x00]
set_speech = [0x13]                       # 13 00/01/02 announce requests
get_dial_lock = [0x16, 0x50]
set_dial_lock = [0x16, 0x50]

# ── Band Stacking Register ──
get_bsr = [0x1A, 0x01]                    # band codes 01-10 + 11 GENE, guide p.19
set_bsr = [0x1A, 0x01]

# ── Memory ──
# get_memory_mode -- PROVENANCE OPEN above, left undeclared
set_memory_mode = [0x08]
memory_write = [0x09]
memory_to_vfo = [0x0A]                    # payload per commands/memory.py builder
memory_clear = [0x0B]                     # payload per commands/memory.py builder
get_memory_contents = [0x1A, 0x00]
set_memory_contents = [0x1A, 0x00]

