scan_set_df_span = [0x0E]                 # 0x0E Ax (x=0-7: +/-5 kHz .. +/-1 MHz), guide p.16
scan_set_resume = [0x0E]                  # domain resolved in [scan_resume]

# ── System / Power ──
power_on = [0x18]
power_off = [0x18]
