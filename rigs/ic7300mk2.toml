# 20; 1C is center type, 1D is VBW, 20 is marker position).
get_scope_rbw = { absent = "IC-7300MK2 CI-V Reference Guide 0x27 command table: runs 00, 10-13, 14-1E, 20 with no RBW sub-command (1C is center type, 1D is VBW)" }

# ── Scan ──
scan_start = [0x0E]
scan_stop = [0x0E]
