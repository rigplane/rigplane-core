# ── Parameterized Capabilities ───────────────────────────────────

[attenuator]
# CI-V 0x11: binary toggle only (00=OFF, 20=20dB ON)
values = [0, 20]

[preamp]
# CI-V 0x16 0x02: 0=OFF, 1=P.AMP1, 2=P.AMP2
values = [0, 1, 2]

[agc]
# CI-V 0x16 0x12: 1=FAST, 2=MID, 3=SLOW
modes = [1, 2, 3]
labels = { "1" = "FAST", "2" = "MID", "3" = "SLOW" }

[scan_types]
# CI-V 0x0E family, MK2 guide p.4: 01/02/03 programmed & dF, 12/13 fine
# variants, 22 memory scan, 23 select-memory scan.
values = [0x01, 0x02, 0x03, 0x12, 0x13, 0x22, 0x23]

[scan_resume]
# MK2 guide p.4: D0 = Scan Resume OFF, D3 = Close&Delay ON -- only these two.
values = [0xD0, 0xD3]

[antenna]
# Spec p.70: SO-239 x1 (HF/50/70 MHz TX) + SMA x2 (RX-ANT IN/OUT, RX only).
tx_count = 1
has_rx_ant = true

[apf]
# CI-V 0x16 0x32 (MK2 guide p.6): 00=OFF, 01=WIDE (320 Hz), 02=MID (160 Hz),
# 03=NAR (80 Hz) -- widths apply when the APF type is SHARP. Single subcommand;
# 16 33/16 34 do not exist on the MK2.
values = [0, 1, 2, 3]
labels = { "0" = "OFF", "1" = "WIDE", "2" = "MID", "3" = "NAR" }

[notch]
# CI-V 0x16 0x57: 0=WIDE, 1=MID, 2=NAR
width_values = [0, 1, 2]
width_labels = { "0" = "WIDE", "1" = "MID", "2" = "NAR" }

[ssb_tx_bw]
# CI-V 0x16 0x58: 0=WIDE, 1=MID, 2=NAR
values = [0, 1, 2]
labels = { "0" = "WIDE", "1" = "MID", "2" = "NAR" }

[filter_shape]
# CI-V 0x16 0x56: 0=SHARP, 1=SOFT (MK2 guide p.6)
values = [0, 1]
labels = { "0" = "SHARP", "1" = "SOFT" }

[break_in]
# CI-V 0x16 0x47: 0=OFF, 1=Semi, 2=Full
values = [0, 1, 2]
labels = { "0" = "OFF", "1" = "SEMI", "2" = "FULL" }

[rit]
# Spec p.71: RIT variable range +/-9.999 kHz. The operator-facing domain is
# [controls.rit]; nothing in the codebase reads range_hz.
range_hz = 9999

[cw]
# CI-V 0x14 0x09: CW pitch 300-900 Hz (5 Hz steps)
# CI-V 0x14 0x0C: Key speed 6-48 WPM
# CI-V 0x1A 0x05 0x02 0x21: Dot/Dash ratio 28-45 (0.1 steps), MK2 guide p.13
pitch_min_hz = 300
pitch_max_hz = 900
speed_min_wpm = 6
speed_max_wpm = 48
dash_ratio_min = 28
dash_ratio_max = 45

[nb]
# CI-V 0x1A 0x05 0x02 0x65: DEPTH 00-09 (display 1-10), MK2 guide p.14
# CI-V 0x1A 0x05 0x02 0x66: WIDTH 00 00-02 55
depth_min = 0
depth_max = 9
width_min = 0
width_max = 255

[power]
max_watts = 100  # HF/50 MHz SSB/CW/RTTY/FM 0.6-100 W (spec p.70)

[ctcss]
table = "standard_50"

[modes]
list = ["USB", "LSB", "CW", "CW-R", "AM", "FM", "RTTY", "RTTY-R"]

[data_mode]
# CI-V 0x1A 0x06: DATA mode + filter (00=OFF/00 fixed, 01=ON/01-03 filter)
count = 1
labels = { "0" = "OFF", "1" = "DATA" }

# Modulation input sources, MK2 value map (1A 05 0084 DATA OFF / 0085 DATA,
# guide p.9): 00=MIC, 01=USB, 02=ACC, 03=MIC+USB, 04=MIC+ACC, 05=LAN.
inputs = [
    { value = 0, name = "MIC" },
    { value = 1, name = "USB" },
    { value = 2, name = "ACC" },
    { value = 3, name = "MIC+USB" },
    { value = 4, name = "MIC+ACC" },
    { value = 5, name = "LAN" },
]

[filters]
list = ["FIL1", "FIL2", "FIL3"]
# CI-V 0x1A 0x03: width is a BCD-encoded index, not raw Hz (guide p.19).
encoding = "segmented_bcd_index"
width_min_hz = 50
width_max_hz = 9999

# Twin PBT step, per mode. MK2 Basic p.32: "The PBT is adjustable in 50 Hz
# steps in the SSB, CW, and RTTY modes, and 200 Hz in the AM mode." FM is
# absent from that list and declares no pbt_step_hz. The -D and -R variants
# take the base-mode figure by inference.

[filters.width.USB]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [3000, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.LSB]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [3000, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.CW]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [1200, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.RTTY]
pbt_step_hz = 50
min_hz = 50
max_hz = 2700
defaults = [2400, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
