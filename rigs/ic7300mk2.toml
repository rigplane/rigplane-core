# MOD Input levels (guide p.9): USB 0081, ACC 0082, LAN 0083 -- the old
# IC-7300 slots 0064/0065 are screen-capture/keyboard settings on the MK2.
get_usb_mod_level = [0x1A, 0x05, 0x00, 0x81]
set_usb_mod_level = [0x1A, 0x05, 0x00, 0x81]
get_acc1_mod_level = [0x1A, 0x05, 0x00, 0x82]
set_acc1_mod_level = [0x1A, 0x05, 0x00, 0x82]
get_lan_mod_level = [0x1A, 0x05, 0x00, 0x83]
set_lan_mod_level = [0x1A, 0x05, 0x00, 0x83]
# DATA OFF MOD 0084 / DATA MOD 0085, data 00-05 (00=MIC, 01=USB, 02=ACC,
# 03=MIC+USB, 04=MIC+ACC, 05=LAN). One DATA mode only.
get_data_off_mod_input = [0x1A, 0x05, 0x00, 0x84]
set_data_off_mod_input = [0x1A, 0x05, 0x00, 0x84]
get_data1_mod_input = [0x1A, 0x05, 0x00, 0x85]
set_data1_mod_input = [0x1A, 0x05, 0x00, 0x85]
get_data2_mod_input = { absent = "IC-7300MK2 CI-V Reference Guide p.9: MOD Input has only 0084 (DATA OFF MOD) and 0085 (DATA MOD); no DATA2 row (0093 there is CI-V USB (B) Echo Back)" }
get_data3_mod_input = { absent = "IC-7300MK2 CI-V Reference Guide p.9: MOD Input has only 0084 (DATA OFF MOD) and 0085 (DATA MOD); no DATA3 row (0094 there is USB (B) Function)" }
# CI-V block (guide p.9): Transceive 0089 (old 0071 is a USB AF setting on
# MK2), CI-V Output (for ANT) 0091 (old 0073 is a LAN setting on MK2). The
# direct 1C 04 route also exists but is left unused by this profile.
get_civ_transceive = [0x1A, 0x05, 0x00, 0x89]
set_civ_transceive = [0x1A, 0x05, 0x00, 0x89]
get_civ_output_ant = [0x1A, 0x05, 0x00, 0x91]
set_civ_output_ant = [0x1A, 0x05, 0x00, 0x91]
# Quick SPLIT is 0033 on the MK2 (guide p.7); on the MK2, 0030/0031 are the
# TX Delay settings and 0036 is SPLIT LOCK -- the IC-7300's 0030 slot moved.
get_quick_split = [0x1A, 0x05, 0x00, 0x33]
set_quick_split = [0x1A, 0x05, 0x00, 0x33]
# Clock block (guide p.11): Date 0132, Time 0133, NTP 0134/0135, UTC offset
# 0136 (format p.22: offset 00 00-14 00, direction 00=+/01=-). The old 7300
# slots 0094-0096 are USB (B) Function / SEND relay / USB SEND on the MK2.
get_system_date = [0x1A, 0x05, 0x01, 0x32]
set_system_date = [0x1A, 0x05, 0x01, 0x32]
get_system_time = [0x1A, 0x05, 0x01, 0x33]
set_system_time = [0x1A, 0x05, 0x01, 0x33]
get_utc_offset = [0x1A, 0x05, 0x01, 0x36]
set_utc_offset = [0x1A, 0x05, 0x01, 0x36]
# Dot/Dash ratio is 0221 on the MK2 (guide p.13); the IC-7300's 0161 slot is
# a scope fixed edge on the MK2.
get_dash_ratio = [0x1A, 0x05, 0x02, 0x21]
set_dash_ratio = [0x1A, 0x05, 0x02, 0x21]
# NB DEPTH 0265 / WIDTH 0266 and VOX Delay 0267 (guide p.14, FUNCTION > NB and
# VOX touch-for-1-second blocks); the IC-7300's 0189/0190/0191 slots are scope
# fixed edges on the MK2 -- do not send the old opcodes.
get_nb_depth = [0x1A, 0x05, 0x02, 0x65]
set_nb_depth = [0x1A, 0x05, 0x02, 0x65]
get_nb_width = [0x1A, 0x05, 0x02, 0x66]
set_nb_width = [0x1A, 0x05, 0x02, 0x66]
get_vox_delay = [0x1A, 0x05, 0x02, 0x67]  # 0-20 (0.0-2.0 sec, 0.1 sec steps)
set_vox_delay = [0x1A, 0x05, 0x02, 0x67]

[protocol]
type = "civ"

[controls.attenuator]
style = "toggle"

[controls.nb]
style = "toggle_and_level"

[controls.nr]
style = "toggle_and_level"

# Level control ranges — raw CI-V values and display mapping
# IC-7300MK2: single receiver, no cmd29, VFO A/B scheme

[controls.pbt_inner]
raw_min = 0
raw_max = 255
raw_center = 128
display_min = -1200
display_max = 1200
display_unit = "Hz"

[controls.pbt_outer]
raw_min = 0
raw_max = 255
raw_center = 128
display_min = -1200
display_max = 1200
display_unit = "Hz"

[controls.af_level]
raw_min = 0
raw_max = 255

[controls.rf_gain]
raw_min = 0
raw_max = 255

[controls.squelch]
raw_min = 0
raw_max = 255

[controls.nr_level]
raw_min = 0
raw_max = 255

[controls.nb_level]
raw_min = 0
raw_max = 255

# NB depth: MK2 wire 0-9 (1A 05 02 65), front panel 1-10.
[controls.nb_depth]
raw_min = 0
raw_max = 9
display_min = 1
display_max = 10

[controls.mic_gain]
raw_min = 0
raw_max = 255

[controls.rf_power]
raw_min = 0
raw_max = 255

[controls.monitor_gain]
raw_min = 0
raw_max = 255

[controls.compressor_level]
raw_min = 0
raw_max = 255

[controls.cw_pitch]
raw_min = 0
raw_max = 255
display_min = 300
display_max = 900
display_unit = "Hz"
decode_quantum = 5  # MK2 anchors 00 00=300 Hz / 01 28=600 Hz / 02 55=900 Hz match this decode
encode_rounding = "ceil"

[controls.key_speed]
raw_min = 0
raw_max = 255
display_min = 6
display_max = 48
display_unit = "WPM"
decode_quantum = 1
encode_rounding = "nearest_half_down"

[controls.rit]
# MK2 spec p.71: "RIT variable range: ±9.999 kHz". Exact-form domain per the
# shared CI-V builder (±9999 Hz, 1 Hz BCD steps); MK2 UI shows 10 Hz display
# steps except in Fine Tuning, where 4 digits (1 Hz) are shown (Basic p.29).
mapping = "identity"
raw_min = -9999
raw_max = 9999
raw_step = 1
raw_origin = 0
display_min = -9999
display_max = 9999
display_step = 1
display_origin = 0
display_unit = "Hz"
quantization = "reject"
restoration = "exact"

# Meter calibrations use ONLY the anchors printed in the MK2 CI-V guide's
# 0x15 command table (pp.5-6); intermediate points interpolate linearly. No
# hamlib/wfview cross-source and no bench measurement is claimed.

[meters.swr]
redline_raw = 120

[[meters.swr.calibration]]
raw = 0
actual = 1.0
label = "1.0"

[[meters.swr.calibration]]
raw = 48
actual = 1.5
label = "1.5"

[[meters.swr.calibration]]
raw = 80
actual = 2.0
label = "2.0"

[[meters.swr.calibration]]
raw = 120
actual = 3.0
label = "3.0"

# 15 02: "00 00=S0 ~ 01 20=S9 ~ 02 41=S9+60 dB" — the documented Icom
# convention, printed identically for the MK2.
[meters.s_meter]
redline_raw = 120

[[meters.s_meter.calibration]]
raw = 0
actual = -54.0
label = "S0"

[[meters.s_meter.calibration]]
raw = 120
actual = 0.0
label = "S9"

[[meters.s_meter.calibration]]
raw = 241
actual = 60.0
label = "S9+60"

# 15 11: "00 00=0% ~ 01 43=50% ~ 02 13=100%". The MK2 Po meter reads percent
# of rated output; at 100 W rated (spec p.70) the watt and percent figures
# coincide.
[[meters.power.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.power.calibration]]
raw = 143
actual = 50.0
label = "50"

[[meters.power.calibration]]
raw = 213
actual = 100.0
label = "100"

# 15 13: "00 00=Minimum ~ 01 20=Maximum"; stored in the repo's percent
# convention (0-100), as on the other Icom profiles.
[[meters.alc.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.alc.calibration]]
raw = 120
actual = 100.0
label = "100"

# 15 14: "00 00=0 dB ~ 01 30=15 dB ~ 02 10=30 dB" — note the MK2's 30 dB
# anchor is raw 210, not the 241 the IC-7300 table carried.
[[meters.comp.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.comp.calibration]]
raw = 130
actual = 15.0
label = "15"

[[meters.comp.calibration]]
raw = 210
actual = 30.0
label = "30"

# 15 15: "00 00=0 V, 00 13=10 V, 02 41=16 V"
[[meters.vd.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.vd.calibration]]
raw = 13
actual = 10.0
label = "10"

[[meters.vd.calibration]]
raw = 241
actual = 16.0
label = "16"

# 15 16: "00 00=0, 00 97=10, 01 46=15, 02 41=25"
[[meters.id.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.id.calibration]]
raw = 97
actual = 10.0
label = "10"

[[meters.id.calibration]]
raw = 146
actual = 15.0
label = "15"

[[meters.id.calibration]]
raw = 241
actual = 25.0
label = "25"

[tx_policy]
# Not measured on the IC-7300MK2 — no write-during-transmit battery has been
# run, so no radio-side refusal is claimed. Empty means "nothing measured",
# not "nothing refuses".
refused_during_tx = []
# 1C 00 is a plain RX/TX byte with no keying-source attribution. Positive-RX
# rule: only the receiving byte is listed; the transmitting byte (and anything
# unrecognised) is correctly not-receiving without inventing an attribution.
tx_state_map = { "0" = "rx" }
