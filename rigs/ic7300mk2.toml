# ── CI-V Commands ────────────────────────────────────────────────
# Grouped by capability area. Wire bytes as integer arrays.
# Source: IC-7300MK2 CI-V Reference Guide (Oct. 2025).
# Single receiver: no Command29 support.
#
# PROVENANCE OPEN (kept undeclared rather than guessed, house pattern):
# - get_memory_mode [0x08]: the MK2 guide phrases 08 as "Switches to the
#   Memory mode" (imperative); no probe has settled whether it answers a bare
#   read.
# - set_selected_mode [0x26, 0x00]: the GET direction is declared below, but
#   no MK2 bench check has confirmed the SET payload convention; both frozen
#   Icom profiles likewise leave it undeclared.

[commands]

# ── Frequency / Mode ──
get_freq = [0x03]
set_freq = [0x05]
get_mode = [0x04]
set_mode = [0x06]
get_band_edge_freq = [0x02]
get_selected_freq = [0x25, 0x00]          # Selected/Unselected VFO frequency, guide p.23
set_selected_freq = [0x25, 0x00]
set_unselected_freq = [0x25, 0x01]
get_unselected_freq = [0x25, 0x01]
get_selected_mode = [0x26, 0x00]          # guide p.23 (mode/data/filter)
get_unselected_mode = [0x26, 0x01]
# set_selected_mode -- PROVENANCE OPEN above, left undeclared

# ── TX Band Edge ──
get_tx_band_count = [0x1E, 0x00]
get_tx_band_edge = [0x1E, 0x01]

# ── VFO ──
set_vfo = [0x07]
get_split = [0x0F]
set_split = [0x0F]

# ── Tuning ──
get_tuning_step = [0x10]
set_tuning_step = [0x10]

# ── RF Front End (Attenuator / Preamp / IP+) ──
get_attenuator = [0x11]
set_attenuator = [0x11]
get_preamp = [0x16, 0x02]
set_preamp = [0x16, 0x02]
get_ip_plus = [0x16, 0x65]
set_ip_plus = [0x16, 0x65]
# RX ANT IN/OUT toggle: 12 00, data 00=OFF/01=ON (guide p.4)
get_rx_antenna = [0x12, 0x00]
set_rx_antenna = [0x12, 0x00]
# Shared ANT1 builders append selector 00 and the RX-ANT boolean themselves.
get_antenna = [0x12]
set_antenna = [0x12]
get_antenna_2 = { absent = "IC-7300MK2 CI-V Reference Guide p.4: only 12 00 RX-ANT boolean; no ANT2/12 01 selection" }
set_antenna_2 = { absent = "IC-7300MK2 CI-V Reference Guide p.4: only 12 00 RX-ANT boolean; no ANT2/12 01 selection" }
get_rx_antenna_ant2 = { absent = "IC-7300MK2 CI-V Reference Guide p.4: only 12 00 RX-ANT boolean; no ANT2/12 01 selection" }
set_rx_antenna_ant2 = { absent = "IC-7300MK2 CI-V Reference Guide p.4: only 12 00 RX-ANT boolean; no ANT2/12 01 selection" }

# ── Audio / AF ──
get_af_level = [0x14, 0x01]
set_af_level = [0x14, 0x01]
get_rf_gain = [0x14, 0x02]
set_rf_gain = [0x14, 0x02]
get_squelch = [0x14, 0x03]
set_squelch = [0x14, 0x03]

# ── DSP / Noise (NB, NR, Notch, APF, Twin Peak) ──
get_nb = [0x16, 0x22]
set_nb = [0x16, 0x22]
get_nb_level = [0x14, 0x12]
set_nb_level = [0x14, 0x12]
get_nr = [0x16, 0x40]
set_nr = [0x16, 0x40]
get_nr_level = [0x14, 0x06]
set_nr_level = [0x14, 0x06]
get_auto_notch = [0x16, 0x41]
set_auto_notch = [0x16, 0x41]
get_manual_notch = [0x16, 0x48]
set_manual_notch = [0x16, 0x48]
get_notch_filter = [0x14, 0x0D]           # Notch position
set_notch_filter = [0x14, 0x0D]
get_manual_notch_width = [0x16, 0x57]     # 0=WIDE, 1=MID, 2=NAR
set_manual_notch_width = [0x16, 0x57]
# APF: 16 32 is the OFF/WIDE/MID/NAR domain; 14 05 is the separately
# documented APF peak frequency (10 Hz steps, guide p.5). No APF gain wire
# field is declared -- the AF LEVEL setting (1A 05 02 70) has no profile key.
get_audio_peak_filter = [0x16, 0x32]      # 0=OFF, 1=WIDE, 2=MID, 3=NAR
set_audio_peak_filter = [0x16, 0x32]
get_apf_type_level = [0x14, 0x05]         # APF peak frequency, raw 0-255
set_apf_type_level = [0x14, 0x05]
get_twin_peak_filter = [0x16, 0x4F]       # RTTY mark 2125/shift 170 only (guide note)
set_twin_peak_filter = [0x16, 0x4F]

# ── Filter (PBT, IF width, shape) ──
get_pbt_inner = [0x14, 0x07]
set_pbt_inner = [0x14, 0x07]
get_pbt_outer = [0x14, 0x08]
set_pbt_outer = [0x14, 0x08]
get_filter_width = [0x1A, 0x03]
set_filter_width = [0x1A, 0x03]
get_filter_shape = [0x16, 0x56]
set_filter_shape = [0x16, 0x56]
get_agc = [0x16, 0x12]
set_agc = [0x16, 0x12]
get_agc_time_constant = [0x1A, 0x04]
set_agc_time_constant = [0x1A, 0x04]

# ── TX Controls (Power, Mic, Compressor, Monitor, VOX) ──
ptt_on = [0x1C, 0x00, 0x01]
ptt_off = [0x1C, 0x00, 0x00]
get_transceiver_status = [0x1C, 0x00]     # 00=RX, 01=TX
get_rf_power = [0x14, 0x0A]
set_rf_power = [0x14, 0x0A]
get_mic_gain = [0x14, 0x0B]
set_mic_gain = [0x14, 0x0B]
get_compressor = [0x16, 0x44]
set_compressor = [0x16, 0x44]
get_compressor_level = [0x14, 0x0E]
set_compressor_level = [0x14, 0x0E]
get_monitor = [0x16, 0x45]
set_monitor = [0x16, 0x45]
get_monitor_gain = [0x14, 0x15]
set_monitor_gain = [0x14, 0x15]
get_vox = [0x16, 0x46]
set_vox = [0x16, 0x46]
get_vox_gain = [0x14, 0x16]
set_vox_gain = [0x14, 0x16]
get_anti_vox_gain = [0x14, 0x17]
set_anti_vox_gain = [0x14, 0x17]
get_ssb_tx_bandwidth = [0x16, 0x58]
set_ssb_tx_bandwidth = [0x16, 0x58]

# ── Split ──
get_xfc_status = [0x1C, 0x02]
set_xfc_status = [0x1C, 0x02]

# ── CW ──
send_cw = [0x17]
stop_cw = [0x17]
get_cw_pitch = [0x14, 0x09]
set_cw_pitch = [0x14, 0x09]
get_key_speed = [0x14, 0x0C]
set_key_speed = [0x14, 0x0C]
get_break_in = [0x16, 0x47]
set_break_in = [0x16, 0x47]
get_break_in_delay = [0x14, 0x0F]
set_break_in_delay = [0x14, 0x0F]

# ── RIT / ∂TX (XIT) ──
get_rit_frequency = [0x21, 0x00]
set_rit_frequency = [0x21, 0x00]
get_rit_status = [0x21, 0x01]
set_rit_status = [0x21, 0x01]
get_rit_tx_status = [0x21, 0x02]
set_rit_tx_status = [0x21, 0x02]

# ── Tuner / ATU ──
# MK2 extends the domain: 00=OFF, 01=ON, 02=Tune (guide p.14)
get_tuner_status = [0x1C, 0x01]
set_tuner_status = [0x1C, 0x01]

# ── Meters ──
get_s_meter = [0x15, 0x02]
get_s_meter_sql_status = [0x15, 0x01]
get_various_squelch = [0x15, 0x05]
get_overflow_status = [0x15, 0x07]
get_power_meter = [0x15, 0x11]
get_swr = [0x15, 0x12]
get_alc = [0x15, 0x13]
get_comp_meter = [0x15, 0x14]
get_vd_meter = [0x15, 0x15]
get_id_meter = [0x15, 0x16]

# ── Tone / TSQL ──
get_repeater_tone = [0x16, 0x42]
set_repeater_tone = [0x16, 0x42]
get_repeater_tsql = [0x16, 0x43]
set_repeater_tsql = [0x16, 0x43]
get_tone_freq = [0x1B, 0x00]
set_tone_freq = [0x1B, 0x00]
get_tsql_freq = [0x1B, 0x01]
set_tsql_freq = [0x1B, 0x01]

# ── Data Mode ──
get_data_mode = [0x1A, 0x06]
set_data_mode = { bytes = [0x1A, 0x06], value_variants = { "0" = [0x1A, 0x06, 0x00, 0x00], "1" = [0x1A, 0x06, 0x01, 0x01] } }

# ── Scope ──
get_scope_wave = [0x27, 0x00]
scope_on = [0x27, 0x10]
scope_off = [0x27, 0x10]
scope_data_output = [0x27, 0x11]          # valid only via [USB]/[LAN] port (guide note)
get_scope_main_sub = [0x27, 0x12]         # data column 00 = Main only (single receiver)
get_scope_single_dual = [0x27, 0x13]      # data column 00 = Single only
get_scope_mode = [0x27, 0x14]
get_scope_span = [0x27, 0x15]
get_scope_edge = [0x27, 0x16]
get_scope_hold = [0x27, 0x17]
get_scope_ref = [0x27, 0x19]
get_scope_speed = [0x27, 0x1A]
get_scope_during_tx = [0x27, 0x1B]
get_scope_center_type = [0x27, 0x1C]
get_scope_vbw = [0x27, 0x1D]
get_scope_fixed_edge = [0x27, 0x1E]
