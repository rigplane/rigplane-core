# Rig Configuration — IC-7300MK2 (PROTOTYPE, MOR3091)
# See _schema.md for field documentation.
#
# Source: IC-7300MK2 CI-V Reference Guide (A7841-8EX, Oct. 2025)
#         IC-7300MK2 Basic Manual (Nov. 2025 print run)
#         IC-7300MK2 Advanced Manual
# Structural baseline: rigs/ic7300.toml (frozen); shared LAN/audio and APF
# capability patterns from rigs/ic7610.toml;
# no IC-7300MK2 hardware validation is claimed anywhere in this file.

[identity]
# The MK2 guide lists 19 00 "Reads the transceiver ID" but never documents the
# reply bytes -- unverified pending native reply. No model token is invented
# (not B6, 94, or 98); the existing identity gate honestly yields UNVERIFIED
# while expected_ids is empty.
expected_ids = []

[radio]
id = "icom_ic7300mk2"
model = "IC-7300MK2"
civ_addr = 0xB6  # MK2 default CI-V address (Basic p.58); configurable state, not identity
default_baud = 115200  # USB Type-C virtual COM is baud-agnostic (Basic p.77); house convention for scope data
receiver_count = 1
has_lan = true
has_wifi = false

[spectrum]
# 27 00: waveform data range 00~A0 (0~160), data length 475, USB transfer in
# 11 segments. LAN framing differs (1 division, 490 bytes) and is transport
# detail, not loader fields (CI-V guide p.24).
seq_max = 11
amp_max = 160
data_len_max = 475

[audio]
# No MK2 LAN codec is certified by the manuals. Mono-first is carried from the
# IC-7300 profile as a tentative conservative policy, NOT a documented MK2
# requirement; measured LAN codec behavior is UNKNOWN.
codec_preference = ["PCM_1CH_16BIT", "ULAW_1CH"]

[scope]
span_presets_hz = [2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000]
# 27 19: adjustable range -20.0 ~ +20.0 dB in 0.5 dB steps (CI-V guide p.25).
ref_min_db = -20.0
ref_max_db = 20.0
ref_step_db = 0.5

# ── Capabilities ─────────────────────────────────────────────────
# Feature tags determine which UI panels and controls are rendered.
# Baseline: IC-7300 single-receiver set. MK2 adds APF (CI-V p.6, Basic p.39),
# RX-ANT switching (Basic p.28, CI-V 12 00), and mod input routing with LAN.
# No digisel and no antenna-select on the MK2 (single [ANT] SO-239, spec p.70).

[capabilities]
features = [
    # Receiver
    "audio",
    "af_level",
    "rf_gain",
    "squelch",
    # RF front end
    "attenuator",
    "preamp",
    "ip_plus",
    # RX ANT IN/OUT toggle (12 00); no ANT1/ANT2 selection on this radio
    "rx_antenna",
    # DSP / Noise
    "nb",
    "nr",
    "notch",
    "apf",
    "twin_peak",
    # Filter
    "pbt",
    "filter_width",
    "filter_shape",
    # TX
    "tx",
    "split",
    "vox",
    "compressor",
    "monitor",
    "ssb_tx_bw",
    # CW
    "cw",
    "break_in",
    # RIT / XIT
    "rit",
    "xit",
    # Tuner
    "tuner",
    # Metering
    "meters",
    # Scope
    "scope",
    # Tone
    "repeater_tone",
    "tsql",
    # Data; MK2 DATA OFF/DATA MOD sources include LAN (1A 05 0084/0085)
    "data_mode",
    "mod_input_routing",
    # System
    "power_control",
    "dial_lock",
    "scan",
    "speech",
    "bsr",
    # AGC
    "agc",
    "tuning_step",
    "band_edge",
    "xfc",
    # System
    "system_settings",
]
# MK2 front panel wires RF gain and squelch as one physical concentric control
# (AF RF/SQL outer, Basic p.26); SET > Function > RF/SQL Control (1A 05 0026:
# Auto/SQL/RF+SQL) confirms the combined control model.
rf_sql_control_model = "combined"

# 27 13 is documented "Single only" (one scope); the RMVR harness would flip a
# value the radio can never report back. scope_receiver.set (27 12, "Main
# only") stays derived from receiver_count, as on the IC-7300 profile.
[validation.fixed_value]
"scope_dual.set" = "IC-7300MK2 CI-V Reference Guide command table: 27 13 data column = 00 (Single only)"

[state_acquisition]
provider = "icom_civ"
default_cadence_seconds = 1.5
default_freshness_ttl_seconds = 3.0
default_reconciliation_priority = "poll"
adaptive_decay = false
external_cat_pause = "pause_polling"
meter_coalescing_window_seconds = 0.2

[state_acquisition.capabilities]
unsolicited_push = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
polling_only = [
