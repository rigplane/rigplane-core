defaults = [15000, 10000, 7000]

[vfo]
# MK2 keeps the single-receiver A/B scheme: 07 00 selects VFO A, 07 01 VFO B,
# A0 equalizes, B0 exchanges (guide p.4); 25/26 address Selected/Unselected
# VFO (guide p.23). No cmd29/main-sub routing exists on this radio.
scheme = "ab"
readback = "selected_unselected"
main_select = [0x00]  # VFO A
sub_select = [0x01]   # VFO B
swap_ab = [0xB0]
equal_ab = [0xA0]

