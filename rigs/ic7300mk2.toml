# On-demand (command_response) membership: prime_unobserved reads these once;
# the never TTL keeps each value from expiring (IC-7300 profile mechanism).
[state_acquisition.field_policies."global.tx_state.vox_on"]
reason = "on-demand, not polled: prime_unobserved reads only field_policies paths, and the never TTL keeps the value from expiring"
cadence_seconds = 25.0
freshness_ttl_seconds = "never"
