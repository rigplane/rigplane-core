# Rig Configuration — IC-905 (144/430/1200/2400/5600 MHz)
# See _schema.md for field documentation.
#
# Source of truth: IC-905 CI-V Reference Guide (A7711-9EX-2, May 2024), printed page numbers
# (command table pp.3-15, formats pp.16-29); IC-905 Basic manual 1c
# (Specifications, section 11). Hamlib rigs/icom/ic905.c is a cross-check
# only: its tuning-step and scope-edge tables disagree with the guide.
# Structural baseline: rigs/ic705.toml (single receiver, VFO A/B).
#
# Tier: documented. No IC-905 hardware has been on the bench, so nothing in
# this file is a hardware claim. IC-705 rows that rest on a bench probe (the FM
# NAKs of MOR-3630) are deliberately not carried over.
#
# Out of scope (MOR-3984): the 10 GHz band (CX-10G option; its 6-byte
# frequency format needs one shared codec first, MOR-3983) and the DD/ATV
# modes (shared gap with the IC-9700, no band-aware mode admission yet).
# Memory channels (1A 00) are left undeclared: the IC-905 record carries one
# channel block (no split TX copy) and 1.2-5.9 GHz frequencies, which the
# shared memory reader (two blocks, GHz digit fixed 0) does not handle.

[identity]
# The guide lists 19 00 (p.5) but never documents the reply bytes: no model
# token is invented, so the identity gate stays UNVERIFIED until a native reply
# is recorded.
expected_ids = []

[radio]
id = "icom_ic905"
model = "IC-905"
civ_addr = 0xAC  # guide p.2: transceiver default address AC
default_baud = 115200  # house convention for scope data over serial CI-V
receiver_count = 1
# LAN (Basic manual, SET > Network > Remote Settings): Network Control ON (valid
# after restart), UDP control/serial/audio ports 50001/50002/50003, up to two
# network users (ID + password). Nothing here is verified: the same manual
# still says the Icom RS-BA1 remote software "will be compatible with the
# IC-905 in the near future", so whether the radio's network control answers a
# third-party client is unknown without the radio.
has_lan = true
has_wifi = false

[spectrum]
# 27 00 (p.28): data range 00-A0 (0-160), data length 475. The USB serial port
# sends it in 11 divisions, the LAN port sends all data together (division
# number maximum 01 on LAN, 11 on USB); the receiver reads the division count
# from each frame, so one declaration serves both transports. The scope is
# fixed to Main/Single (27 12, 27 13: 00 only).
seq_max = 11
amp_max = 160
data_len_max = 475

# Mono-first codec as the IC-705/IC-9700 profiles: no IC-905 LAN codec has
# been measured, so this is conservative inherited policy, not a documented
# requirement. The manual only says the LAN output is AF or a 12 kHz IF signal
# (1A 05 01 22, default AF) with an optional squelch gate (01 23, default ON).
[audio]
codec_preference = ["PCM_1CH_16BIT", "ULAW_1CH"]
tx_codec = "PCM_1CH_16BIT"
browser_rx_transport = "auto"
browser_rx_transcode_to_opus = true

# No [usb] section: USB VID:PID entries come only from our own recordings
# (_schema.md) and none exists for this model. The guide (p.2) names the two
# virtual COM ports "IC-905 Serial Port A (CI-V)" and "IC-905 Serial Port B".

[scope]
# 27 15 span table (p.28), Hz: 2.5 kHz ... 25 MHz.
span_presets_hz = [
    2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000,
    1000000, 2500000, 5000000, 10000000, 25000000,
]
# 27 19 (p.28): adjustable range -20.0 ~ +20.0 dB in 0.5 dB steps.
ref_min_db = -20.0
ref_max_db = 20.0
ref_step_db = 0.5

# ── Capabilities ─────────────────────────────────────────────────

[capabilities]
features = [
    # Receiver
    "audio",
    "af_level",
    "rf_gain",
    "squelch",
    # RF front end
    "attenuator",
    "preamp",
    # No tuner (no 1C 01 row, p.14), DIGI-SEL, antenna select (no 12 row),
    # RX antenna, APF, IP+ or drive gain: none of those rows is in the guide
    # (see the `{ absent = ... }` rows in [commands]).
    # DSP / Noise
    "nb",
    "nr",
    "notch",
    "twin_peak",
    # Filter
    "pbt",
    "filter_width",
    "filter_shape",
    # TX
    "tx",
    "split",
    "vox",
    "compressor",
    "monitor",
    "ssb_tx_bw",
    # CW
    "cw",
    "break_in",
    # RIT / XIT
    "rit",
    "xit",
    # Metering
    "meters",
    # Scope
    "scope",
    # Tone / FM
    "repeater_tone",
    "tsql",
    # 0F 10/11/12 (p.3): simplex / DUP- / DUP+; no ARS code on 0F.
    "repeater_shift",
    "dtcs",
    "csql",
    "speech",
    # Data
    "data_mode",
    # System
    "power_control",
    "dial_lock",
    "scan",
    "bsr",
    # AGC
    "agc",
    "tuning_step",
    "band_edge",
    "xfc",
    # System
    "system_settings",
]

# 27 13 is documented "Single (fixed)" (p.15): the validation harness would flip
# a value the radio can never report back. 27 12 (Main fixed) stays derived from
# receiver_count, as on the IC-7300MK2 profile.
[validation.fixed_value]
"scope_dual.set" = "IC-905 CI-V guide p.15: 27 13 data column = 00 (Single (fixed))"

# MOR-1983: initial and legacy periodic state acquisition is declared here,
# using getters already sourced to the IC-905 CI-V Reference Guide below.
# The runtime resolves these semantic paths through this profile's CommandMap;
# no model-specific query list exists in code.
[state_acquisition]
provider = "icom_civ"
default_cadence_seconds = 2.0
default_freshness_ttl_seconds = 8.0
default_reconciliation_priority = "poll"
adaptive_decay = true
adaptive_decay_idle_multiplier = 4.0
adaptive_decay_max_cadence_seconds = 30.0
external_cat_pause = "pause_polling"
meter_coalescing_window_seconds = 0.2

[state_acquisition.capabilities]
polling_only = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.unselected.freq_mode.freq_hz",
    "receiver.main.unselected.freq_mode.mode",
    "receiver.main.operator_controls.af_level",
    "receiver.main.operator_controls.rf_gain",
    "receiver.main.operator_controls.squelch",
    "receiver.main.operator_controls.att",
    "receiver.main.operator_controls.preamp",
    "receiver.main.operator_controls.agc",
    "receiver.main.operator_toggles.nb",
    "receiver.main.operator_toggles.nr",
    # MOR-3630: squelch-open (RX-busy) for the BUSY lamp — the 0x15 0x01
    # single-byte SQL-status read, same cadence class as the sibling toggles.
    "receiver.main.operator_toggles.dcd",
    "receiver.main.operator_toggles.repeater_tone",
    "receiver.main.operator_toggles.repeater_tsql",
    # MOR-2131: read by the same 16 5D query as the two booleans above.
    "receiver.main.operator_controls.tone_squelch_type",
    "global.operator_controls.power_level",
    "global.tx_state.compressor_on",
    "global.operator_controls.compressor_level",
    "global.tx_state.ptt",
    "global.tx_state.split",
    # MOR-2930: read by the same 0F query as split.
    "receiver.main.operator_controls.repeater_shift",
    # MOR-2915: the TX-aux levels and panel knobs rigs/ic7300.toml polls
    # (MOR-1452, MOR-2425); v3 reads only a declared field
    # (core/acquisition_scheduler.py: AcquisitionScheduler._availability_for).
    # Getters: IC-905 CI-V guide pp.3-5 and p.14.
    "global.operator_controls.mic_gain",
    "global.operator_controls.monitor_gain",
    "global.operator_controls.vox_gain",
    "global.operator_controls.anti_vox_gain",
    "receiver.main.active.freq_mode.filter_width",
    "receiver.main.operator_controls.pbt_inner",
    "receiver.main.operator_controls.pbt_outer",
    "receiver.main.operator_controls.nr_level",
    "receiver.main.operator_controls.nb_level",
    "receiver.main.operator_controls.notch_filter",
    "receiver.main.operator_controls.manual_notch_width",
    "receiver.main.operator_toggles.auto_notch",
    "receiver.main.operator_toggles.manual_notch",
    "global.operator_controls.rit_freq",
    "scope_controls.global.display.receiver",
    "scope_controls.global.display.dual",
    "scope_controls.global.display.mode",
    "scope_controls.global.display.span",
    "scope_controls.global.display.edge",
    "scope_controls.global.display.hold",
    "scope_controls.global.display.ref_db",
    "scope_controls.global.display.speed",
    "scope_controls.global.display.during_tx",
    "scope_controls.global.display.center_type",
    "scope_controls.global.display.vbw_narrow",
    "scope_controls.global.display.fixed_edge",
]
stream_like_meters = [
    "receiver.main.meters.s_meter",
    "global.meters.power",
    "global.meters.swr",
    "global.meters.alc",
    "global.meters.comp",
    "global.meters.vd",
    "global.meters.id",
]
# MOR-2915: the membership rigs/ic7300.toml declares, less
# receiver.main.operator_controls.agc_time_constant: declaring it shows the
# AGC-T control, and its seconds come from a frontend table that does not
# match this radio's 1A 04 table (guide p.19; MOR-2921). The menu settings
# after "split" are read on demand through their field_policies below.
command_response_observable = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "receiver.main.operator_controls.af_level",
    "receiver.main.operator_controls.rf_gain",
    "receiver.main.operator_controls.squelch",
    "receiver.main.operator_controls.att",
    "receiver.main.operator_controls.preamp",
    "receiver.main.operator_controls.agc",
    "receiver.main.operator_toggles.nb",
    "receiver.main.operator_toggles.nr",
    "global.operator_controls.power_level",
    "global.tx_state.compressor_on",
    "global.operator_controls.compressor_level",
    "global.tx_state.ptt",
    "receiver.main.operator_controls.repeater_shift",
    "global.tx_state.split",
    "global.tx_state.vox_on",
    "global.tx_state.monitor_on",
    "global.operator_controls.vox_delay",
    "receiver.main.active.freq_mode.filter_width",
    "receiver.main.active.freq_mode.filter_num",
    "receiver.main.active.freq_mode.data_mode",
    "receiver.main.operator_controls.filter_shape",
    "receiver.main.operator_controls.pbt_inner",
    "receiver.main.operator_controls.pbt_outer",
    "receiver.main.operator_controls.nr_level",
    "receiver.main.operator_controls.nb_level",
    "receiver.main.operator_toggles.auto_notch",
    "receiver.main.operator_toggles.manual_notch",
    "receiver.main.operator_controls.notch_filter",
    "receiver.main.operator_controls.manual_notch_width",
    "global.operator_controls.rit_freq",
    "global.tx_state.rit_on",
    "global.tx_state.rit_tx",
    "global.operator_controls.break_in",
    "global.operator_controls.break_in_delay",
    "global.operator_controls.key_speed",
    "global.operator_controls.cw_pitch",
    "receiver.main.operator_toggles.twin_peak_filter",
    "receiver.main.operator_controls.tone_freq",
    "receiver.main.operator_controls.tsql_freq",
]
supported_controls = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
    "global.tx_state.ptt",
]

# MOR-2540: Po/SWR/ALC/COMP are TX-only 0x15 meters, gated exactly as
# rigs/ic7610.toml (same Icom LAN/WiFi link family) and rigs/ic7300.toml's
# MOR-1485 block: `tx_only = true` keeps AcquisitionScheduler from polling
# them while PTT reads false (before this entry they inherited the 2.0s/8.0s
# default and were polled during RX), and the `available_when` clause lets
# StateFreshnessService.tick discard the last TX values on dekey. They keep
# their stream_like_meters membership and coalescing window, so the stream
# meter cadence class (tests/test_state_acquisition_policy.py) binds them to
# <=0.4s: 0.25s/2.0s only ever fires while the key is down. The S-meter
# stays the unconditional RX meter.
# MOR-2915: 0.25 s, the IC-7610's cadence since MOR-2590 and the TX meter
# class's nominal; at 0.2 s the four took 20 of the 30 q/s the scheduler
# fits into a USB serial link, and the added panel reads no longer fit in
# transmit (tests/test_acquisition_budget_fit.py).
[state_acquisition.field_policies."global.meters.power"]
cadence_seconds = 0.25
freshness_ttl_seconds = 2.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.2
tx_only = true
available_when = [
    { field = "global.tx_state.ptt", equals = true },
]

[state_acquisition.field_policies."global.meters.swr"]
cadence_seconds = 0.25
freshness_ttl_seconds = 2.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.2
tx_only = true
available_when = [
    { field = "global.tx_state.ptt", equals = true },
]

[state_acquisition.field_policies."global.meters.alc"]
cadence_seconds = 0.25
freshness_ttl_seconds = 2.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.2
tx_only = true
available_when = [
    { field = "global.tx_state.ptt", equals = true },
]

[state_acquisition.field_policies."global.meters.comp"]
cadence_seconds = 0.25
freshness_ttl_seconds = 2.0
adaptive_decay = false
meter_coalescing_window_seconds = 0.2
tx_only = true
available_when = [
    { field = "global.tx_state.ptt", equals = true },
]

# MOR-2915: the menu settings rigs/ic7300.toml reads on demand (MOR-1483,
# MOR-1491..1493, MOR-2234). prime_unobserved reads only field_policies
# paths, so each needs an entry; the "never" TTL keeps a read value until
# the next observation.
[state_acquisition.field_policies."global.tx_state.vox_on"]
