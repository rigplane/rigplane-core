# ── Parameterized Capabilities ───────────────────────────────────

[attenuator]
# CI-V 0x11 (p.3): 00 = OFF, 10 = 10 dB. Available on 144/430/1200 MHz only.
values = [0, 10]

[preamp]
# CI-V 0x16 0x02 (p.4): 00 = OFF, 01 = ON.
values = [0, 1]

[agc]
# CI-V 0x16 0x12 (p.4): 01 = FAST, 02 = MID, 03 = SLOW.
modes = [1, 2, 3]
labels = { "1" = "FAST", "2" = "MID", "3" = "SLOW" }

[scan_types]
# CI-V 0x0E (p.3): 01 programmed/memory, 02 programmed, 03 dF, 12 fine
# programmed, 13 fine dF, 22 memory, 23 select memory, 24 mode select.
values = [0x01, 0x02, 0x03, 0x12, 0x13, 0x22, 0x23, 0x24]

[scan_resume]
# CI-V 0x0E (p.3): D0 = resume OFF, D3 = resume ON (close & delay).
values = [0xD0, 0xD3]

[antenna]
# No 0x12 antenna-select or 0x16 0x53 RX-antenna row in the guide.
tx_count = 1
has_rx_ant = false

[notch]
# Manual Notch Width 0x16 0x57 (p.4): 00 = WIDE, 01 = MID, 02 = NAR.
width_values = [0, 1, 2]
width_labels = { "0" = "WIDE", "1" = "MID", "2" = "NAR" }

[ssb_tx_bw]
# 0x16 0x58 (p.4): 00 = WIDE, 01 = MID, 02 = NAR.
values = [0, 1, 2]
labels = { "0" = "WIDE", "1" = "MID", "2" = "NAR" }

[filter_shape]
# CI-V 0x16 0x56 (p.4): 00 = SHARP, 01 = SOFT.
values = [0, 1]
labels = { "0" = "SHARP", "1" = "SOFT" }

[break_in]
# CI-V 0x16 0x47 (p.4): 00 = OFF, 01 = semi, 02 = full.
values = [0, 1, 2]
labels = { "0" = "OFF", "1" = "SEMI", "2" = "FULL" }

[rit]
range_hz = 9999  # Basic manual, Specifications: RIT +-9.999 kHz

[cw]
pitch_min_hz = 300  # 14 09 (p.4): 0000 = 300 Hz ... 0255 = 900 Hz
pitch_max_hz = 900
speed_min_wpm = 6  # 14 0C (p.4): 0000 = 6 WPM ... 0255 = 48 WPM
speed_max_wpm = 48
dash_ratio_min = 28  # 1A 05 02 36 (p.11): 28 = 1:1:2.8 ... 45 = 1:1:4.5
dash_ratio_max = 45

[nb]
# NB level 0x14 0x12 (p.4); depth 1A 05 03 37 (00 = 1 ... 09 = 10) and width
# 1A 05 03 38 (0000 = 1 ... 0255 = 100), p.14.
depth_min = 0
depth_max = 9
width_min = 0
width_max = 255

[power]
# Per-band ratings are on the bands below (Basic manual, Specifications:
# 10 W on 144/430/1200 MHz, 2 W on 2400/5600 MHz, SSB/CW/FM/RTTY/DV).
max_watts = 10

# Memory channels (1A 00) are intentionally not declared: see the header.

[ctcss]
table = "standard_50"

# What each 16 5D tone squelch selector code means (p.4): 00=OFF, 01=TONE,
# 02=TSQL, 03=DTCS, 06=DTCS (T), 07=TONE (T)/DTCS (R), 08=DTCS (T)/TSQL (R),
# 09=TONE (T)/TSQL (R); no 04 or 05.
[tone_squelch_types]
0 = "off"
1 = "tone"
2 = "tsql"
3 = "dtcs"
6 = "dtcs_t"
7 = "tone_t_dtcs_r"
8 = "dtcs_t_tsql_r"
9 = "tone_t_tsql_r"

[modes]
# Operating mode codes (p.16): LSB USB AM CW RTTY FM CW-R RTTY-R DV; DD (22)
# and ATV (23) are out of scope.
list = ["USB", "LSB", "CW", "CW-R", "AM", "FM", "RTTY", "RTTY-R", "DV"]
families = { cw = ["CW", "CW-R"] }

[data_mode]
# CI-V 0x1A 0x06 (p.14, format p.23): 00 = OFF, 01 = ON, filter 01-03.
count = 1
labels = { "0" = "OFF", "1" = "DATA" }

# MOD Input sources (1A 05 01 26 DATA OFF MOD / 01 27 DATA MOD, p.8):
# 00 = MIC, 01 = USB, 02 = MIC,USB, 03 = LAN.
inputs = [
    { value = 0, name = "MIC" },
    { value = 1, name = "USB" },
    { value = 2, name = "MIC,USB" },
    { value = 3, name = "LAN" },
]

[filters]
list = ["FIL1", "FIL2", "FIL3"]
# CI-V 0x1A 0x03 (p.20), "IF filter width settings": a 1-byte BCD index.
#   SSB/CW/RTTY 00..09 -> 50..500 Hz step 50
#   SSB/CW 10..40 -> 600..3600 Hz step 100; RTTY 10..31 -> 600..2700 Hz
#   AM 00..49 -> 200..10000 Hz step 200
# Defaults per mode: Basic manual, "Selecting the IF filter" (FM, FM-D and DV
# share one row: 15 / 10 / 7 kHz).
encoding = "segmented_bcd_index"
width_min_hz = 50
width_max_hz = 10000

# Twin PBT step per mode: inference carried over from the IC-7300 manual (50 Hz
# in SSB/CW/RTTY, 200 Hz in AM), the same as the IC-705 profile; nothing has
# confirmed the IC-905 values. step_hz in the same tables quantises the WIDTH.
[filters.width.USB]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [3000, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.LSB]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [3000, 2400, 1800]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.CW]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [1200, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.CW-R]
pbt_step_hz = 50
min_hz = 50
max_hz = 3600
defaults = [1200, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 3600, step_hz = 100, index_min = 10 },
]

[filters.width.RTTY]
pbt_step_hz = 50
min_hz = 50
max_hz = 2700
defaults = [2400, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 2700, step_hz = 100, index_min = 10 },
]

[filters.width.RTTY-R]
pbt_step_hz = 50
min_hz = 50
max_hz = 2700
defaults = [2400, 500, 250]
segments = [
    { hz_min = 50, hz_max = 500, step_hz = 50, index_min = 0 },
    { hz_min = 600, hz_max = 2700, step_hz = 100, index_min = 10 },
]

[filters.width.AM]
pbt_step_hz = 200
min_hz = 200
max_hz = 10000
step_hz = 200
defaults = [9000, 6000, 3000]
segments = [
    { hz_min = 200, hz_max = 10000, step_hz = 200, index_min = 0 },
]

[filters.width.FM]
fixed = true
defaults = [15000, 10000, 7000]

[filters.width.DV]
fixed = true
defaults = [15000, 10000, 7000]

[vfo]
# Single receiver, VFO A/B: 07 00/01 select, A0 equalize, B0 exchange (p.3).
# 27 12 and 27 13 are fixed Main/Single (p.15).
scheme = "ab"
readback = "selected_unselected"
main_select = [0x00]
sub_select = [0x01]
swap_ab = [0xB0]
equal_ab = [0xA0]

# ── Frequency Ranges ─────────────────────────────────────────────
# Ranges are the band-stacking-register ranges of the guide (p.19: 01 144,
# 02 430, 03 1200, 04 2400, 05 5600; 06 = 10G is out of scope), i.e. the USA
# version; the EUR version is narrower (Basic manual, Specifications:
# 144-146, 430-440, 1240-1300, 2300-2450, 5650-5850 MHz) and the USA 2400 MHz
# band excludes 2310-2390 MHz. Check local rules.
# default_hz: the manuals state no per-band tuning frequency, and _schema.md
# makes the key required, so each band carries a BSR-recall fallback inside
# every version's range. 2m/70cm mirror the national FM simplex calling
# frequencies the IC-705/IC-9700 profiles use; the SHF ones are in-band
# placeholders, not recommendations.
# max_power_w (MOR-3634): rated TX power, Basic manual Specifications
# (SSB/CW/FM/RTTY/DV; AM is 2.5 W / 0.5 W). Not hardware-verified. The IC-905
# level is a percentage of the current band's maximum.
# repeater: DUP-/DUP+ (0F, p.3) and the duplex offset (0C/0D, p.17; the 10 MHz
# digit settable on 1200 MHz and above) are not band-limited in the guide.

[[freq_ranges.ranges]]
label = "2m"
start_hz = 144_000_000
end_hz = 148_000_000
repeater = true

[[freq_ranges.ranges.bands]]
name = "2m"
start_hz = 144_000_000
end_hz = 148_000_000
default_hz = 145_000_000
bsr_code = 0x01
default_mode = "FM"
max_power_w = 10

[[freq_ranges.ranges]]
label = "70cm"
start_hz = 430_000_000
end_hz = 450_000_000
repeater = true

[[freq_ranges.ranges.bands]]
name = "70cm"
start_hz = 430_000_000
end_hz = 450_000_000
default_hz = 433_500_000
bsr_code = 0x02
default_mode = "FM"
max_power_w = 10

[[freq_ranges.ranges]]
# The guide names this band "1200".
label = "23cm"
start_hz = 1_240_000_000
end_hz = 1_300_000_000
repeater = true

[[freq_ranges.ranges.bands]]
name = "23cm"
start_hz = 1_240_000_000
end_hz = 1_300_000_000
default_hz = 1_296_500_000
bsr_code = 0x03
default_mode = "FM"
max_power_w = 10

[[freq_ranges.ranges]]
label = "13cm"
start_hz = 2_300_000_000
end_hz = 2_450_000_000
repeater = true

[[freq_ranges.ranges.bands]]
name = "13cm"
start_hz = 2_300_000_000
end_hz = 2_450_000_000
default_hz = 2_400_500_000
bsr_code = 0x04
default_mode = "FM"
max_power_w = 2

[[freq_ranges.ranges]]
label = "5cm"
start_hz = 5_650_000_000
end_hz = 5_925_000_000
repeater = true

[[freq_ranges.ranges.bands]]
name = "5cm"
start_hz = 5_650_000_000
end_hz = 5_925_000_000
default_hz = 5_760_000_000
bsr_code = 0x05
default_mode = "FM"
max_power_w = 2

# ── CI-V Commands ────────────────────────────────────────────────
# Every row cites the guide (printed pages). `{ absent = ... }` rows are the
# commands other Icom profiles declare that this guide has no row for.
#
# PROVENANCE OPEN, left undeclared rather than guessed:
# - get_memory_mode [0x08]: the guide's 08 row reads "Select the Memory mode"
#   (send only, p.3).
# - get_memory_contents / set_memory_contents [0x1A, 0x00] and the 1a00_ff
#   clear: see the header (memory reader limits).
# - get_powerstat: 18 has only the OFF/ON set rows (p.5).
[commands]

# ── Frequency / Mode ──
get_band_edge_freq = [0x02]  # p.3 (format p.16)
get_freq = [0x03]
get_mode = [0x04]
set_freq = [0x05]
set_mode = [0x06]

# ── VFO ──
get_vfo = [0x07]
set_vfo = [0x07]
# Single receiver: the 07 table is 00/01/A0/B0 only (p.3).
get_dual_watch = { absent = "IC-905 CI-V guide p.3: cmd 0x07 table is 00/01/A0/B0 only" }
set_dual_watch = { absent = "IC-905 CI-V guide p.3: cmd 0x07 table is 00/01/A0/B0 only" }
set_dual_watch_off = { absent = "IC-905 CI-V guide p.3: cmd 0x07 table is 00/01/A0/B0 only" }
set_dual_watch_on = { absent = "IC-905 CI-V guide p.3: cmd 0x07 table is 00/01/A0/B0 only" }
get_main_sub_band = { absent = "IC-905 CI-V guide p.3: cmd 0x07 table has no D0/D1/D2" }
quick_dual_watch = { absent = "IC-905 CI-V guide pp.6-8: no Main/Sub receiver, so no quick dual-watch row" }

# ── Memory (select / write / copy; the 1A 00 contents are undeclared) ──
set_memory_mode = [0x08]  # p.3: 08 00 00 ~ 00 99 channel, 00 00 ~ 00 11 call channels
set_memory_group = [0x08, 0xA0]  # p.3: 08 A0 00 00 ~ 01 00
memory_write = [0x09]  # p.3
memory_to_vfo = [0x0A]  # p.3 -- payload MOR-2055, see commands/memory.py: build_memory_to_vfo

# ── Offset / Scan / Split ──
get_freq_offset = [0x0C]  # p.3 (format p.17)
set_freq_offset = [0x0D]  # p.3 (format p.17)
get_scan = [0x0E]
set_scan = [0x0E]
get_split = [0x0F]  # p.3
set_split = [0x0F]
# The repeater shift direction rides 0F: read 11 = DUP-, 12 = DUP+; set 10 =
# simplex, 11 = DUP-, 12 = DUP+ (p.3). 13 (RPS) is DD-only and not mapped.
get_repeater_shift = [0x0F]  # p.3
set_repeater_shift = [0x0F]  # p.3

# ── Tuning ──
# 10 (p.3): 00 = OFF (10 Hz or 1 Hz), 01 = 100 Hz, 02 = 500 Hz, 03 = 1 kHz,
# 04 = 5 kHz, 05 = 6.25 kHz, 06 = 10 kHz, 07 = 12.5 kHz, 08 = 20 kHz,
# 09 = 25 kHz, 10 = 50 kHz, 11 = 100 kHz, 12 = 250 kHz (the value is a CI-V
# index, not Hz).
get_tuning_step = [0x10]
set_tuning_step = [0x10]

# ── RF front end ──
get_attenuator = [0x11]  # p.3
