restoration = "exact"


# SWR meter calibration (15 12, p.4): 0000 = SWR 1.0, 0048 = 1.5, 0080 = 2.0,
# 0120 = 3.0; the guide prints no point above 3.0.
[meters.swr]
redline_raw = 120

[[meters.swr.calibration]]
raw = 0
actual = 1.0
label = "1.0"

[[meters.swr.calibration]]
raw = 48
actual = 1.5
label = "1.5"

[[meters.swr.calibration]]
raw = 80
actual = 2.0
label = "2.0"

[[meters.swr.calibration]]
raw = 120
actual = 3.0
label = "3.0"

# Meter scales below are the rows of the command table, p.4.
# 15 02 S-meter: 0000 = S0, 0120 = S9, 0241 = S9+60 dB, stated in dB relative
# to S9 as in rigs/ic7300.toml (S0 = -54).
[meters.s_meter]
redline_raw = 120

[[meters.s_meter.calibration]]
raw = 0
actual = -54.0
label = "S0"

[[meters.s_meter.calibration]]
raw = 120
actual = 0.0
label = "S9"

[[meters.s_meter.calibration]]
raw = 241
actual = 60.0
label = "S9+60"

# 15 11 Po (0000 = 0%, 0143 = 50%, 0213 = 100%) is a percentage of the current
# band's rating (10 W or 2 W), so no watts scale is declared (as the IC-9700).

# 15 13 ALC: 0000 = Minimum, 0120 = Maximum, in the 0-100 convention of
# rigs/ic7300.toml's [meters.alc].
[[meters.alc.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.alc.calibration]]
raw = 120
actual = 100.0
label = "100"

# 15 14 COMP: 0000 = 0 dB, 0130 = 15 dB, 0210 = 25.5 dB.
[[meters.comp.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.comp.calibration]]
raw = 130
actual = 15.0
label = "15"

[[meters.comp.calibration]]
raw = 210
actual = 25.5
label = "25.5"

# 15 15 Vd: 0000 = 0 V, 0040 = 5 V, 0241 = 30 V (differs from the IC-705). In
# the 10 GHz band it reads only while transmitting (note *8, p.4).
[[meters.vd.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.vd.calibration]]
raw = 40
actual = 5.0
label = "5"

[[meters.vd.calibration]]
raw = 241
actual = 30.0
label = "30"

# 15 16 Id: 0000 = 0 A, 0121 = 2 A, 0241 = 4 A.
[[meters.id.calibration]]
raw = 0
actual = 0.0
label = "0"

[[meters.id.calibration]]
raw = 121
actual = 2.0
label = "2"

[[meters.id.calibration]]
raw = 241
actual = 4.0
label = "4"

[tx_policy]
# Not bench-measured -- inherited (MOR-1947). The factory routes the IC-905 onto
# Ic705SerialRadio, the same Icom transmit-state read as the measured IC-7300
# (solicited CI-V 1C 00, decoded through the 00/01 allowlist in
# runtime/_civ_rx.py). The section records the profile ruling even though the
# current Icom read path does not consult it. No write-during-transmit battery
# was run on this radio, so no radio-side refusal is claimed. Empty means
# "nothing measured", not "nothing refuses".
refused_during_tx = []
# Positive-RX rule (3.7): the receiving byte only.
tx_state_map = { "0" = "rx" }
