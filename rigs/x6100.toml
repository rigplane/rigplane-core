# Rig Configuration — Xiegu X6100
#
# Xiegu X6100 QRP transceiver. CIV address: 0x70 (NOT 0xA4 -- no address
# collision with IC-705/X6200, so the 0x1D 0x19 Xiegu-vs-Icom disambiguator
# in backends/discovery.py, which is hardcoded to 0xA4, does not apply here).
#
# Sources of truth (MOR-2488/MOR-2489 re-sourcing of the D2 MOR-2018
# sibling-copy basis):
#   1. "Radioddity Extended manual for Xiegu X6100" v1.1.8 (2024-09-09),
#      archived as Xiegu_X6100_Extended_Manual_V1.1.8.pdf, §15 Table 1
#      (parts 1-5, pp. 117-121): an X6100-specific CI-V command table.
#      The D2 premise that no X6100 CI-V documentation exists was false;
#      commands the table covers are cited to it below (its rows carry a
#      Rigs column -- X6100 and G90 -- so coverage is X6100-specific, not
#      inherited). A second official source, "XIEGU RADIO CI-V REFERENCE
#      v1.0" (xiegu.eu, X6100 + G90), carries the same table.
#   2. No X6100 unit has ever been available to probe (unlike the X6200,
#      destroyed 2026-08-11 -- an X6100 was simply never acquired; live
#      bench today is IC-7300 + FTX-1 only): nothing here is live-confirmed.
#   3. Where the X6100 table does NOT cover a command, the entry stays
#      sourced from rigs/x6200.toml (D2 MOR-2018 sibling copy, itself
#      filled at D2 MOR-2019) and says so -- an entry inherited from a
#      sibling model reads differently from one the X6100 manual lists.
#   4. Hamlib master ``rigs/icom/xiegu.c`` builds BOTH ``x6100_caps`` and
#      ``x6200_caps`` from the same ``x6100_priv_caps`` struct, which is
#      the shared-firmware premise the remaining X6200 inferences (and
#      MOR-634's capability drops below) rely on.
#
# Reachability: unlike X6200 (routed through Ic705SerialRadio),
# ``backends/factory.py`` has NO branch for X6100 at all -- it is not in
# ``_YAESU_MODELS``, does not start with "FT", and is not one of the four
# supported serial models, so ``create_radio`` hits the explicit
# "Unsupported serial model" refusal. The only path to this radio today is
# the rigctld client (see [tx_policy] below), which never builds a CI-V
# frame. So every byte in [commands] below -- old and new -- is data
# nothing in production reads, except through the residual, non-standard
# path of constructing a CI-V radio object directly against this profile's
# civ_addr 0x70 (plan evidence doc, §C5).

[radio]
id = "xiegu_x6100"
model = "X6100"
civ_addr = 0x70
receiver_count = 1
has_lan = false
has_wifi = true
default_baud = 115200

[protocol]
type = "civ"
address = 0x70

[capabilities]
# Xiegu X6100 declares a narrower feature envelope than a full Icom CI-V
# radio. Every drop below leans on the shared-firmware inference from
# rigs/x6200.toml (Hamlib ``x6100_priv_caps``, see header above) because no
# X6100 unit has ever existed in this repo to probe directly -- see
# PROVENANCE OPEN in [commands] for the parallel note on undeclared opcodes.
#   - ``power_control`` IS declared (MOR-2488/MOR-2489): the X6100 manual's
#     own §15 Table 1 lists ``0x14 0x0A`` "Get Tx power" / "Set Tx power"
#     with Rigs: X6100, G90 -- the [commands] entries below already
#     carried the opcode while the capability was withheld, so
#     ``IcomRadio.set_rf_power`` refused on a command the radio's own
#     manual documents. The declaration covers the 0x14 0x0A level pair
#     only: CI-V ``0x18`` (power on/off) appears nowhere in §15 Table 1
#     -- not listed in any official command table, which is an absence of
#     a row, not a vendor statement that it is unsupported -- so
#     ``power_on``/``power_off`` stay undeclared and ``set_powerstat``
#     still refuses at the bound command map (0x18 never reaches the
#     wire).
#   - no ``filter_width``: the unified CI-V 0x1A 0x03 handler in
#     ``radio.py`` requires per-mode segment tables (``[filters.width.<MODE>]
#     segments``) decoded with wfview's ``funcFilterWidth`` formula
#     (``icomcommander.cpp:1131``). X6100's filter-width encoding is
#     undocumented in wfview and unverified on hardware, so the capability
#     stays disabled to avoid silently sending wrong indices (CI-V SET is
#     fire-and-forget) -- issue #1159. (D2, MOR-2018: ``get_filter_width``
#     [0x1A, 0x03] is now declared in [commands] below, inherited from
#     X6200's LIVE-sourced opcode -- but X6200's raw-byte formula and
#     ``[filters.width.*]`` segments are NOT copied here: they were derived
#     from a live X6200 capture and are unconfirmed on X6100 hardware. The
#     capability stays undeclared until that changes.)
#   - no tone family (``repeater_tone`` / ``tsql``) and no ``pbt``:
#     dropped by X6100/X6200 shared-firmware inference (MOR-634), PENDING
#     direct X6100 hardware confirmation. A live X6200 capture (CI-V 0xA4)
#     disproved these caps on real hardware: the tone family's
#     ``0x16 0x42/0x43`` + ``0x1B`` time out (dropped in MOR-683 / PR
#     #1833), and ``pbt``'s ``0x14 0x07/0x08`` time out in both AM and USB
#     (dropped in MOR-699). By the shared-firmware inference X6100 almost
#     certainly behaves the same way, so advertising caps that cannot be
#     validated here is exactly the over-declaration the validation
#     harness exists to catch. Dropped BY INFERENCE, not by a direct X6100
#     capture -- do NOT relabel "live confirmed" for X6100 until a real
#     unit is probed.
#   - ``break_in`` KEEPS the capability tag but declares NO ``[break_in]``
#     domain (MOR-1534). The shared-firmware inference that justifies
#     dropping tone/pbt doesn't extend to a value domain here: X6200's own
#     audit found its break-in opcode isn't in the X6200 CI-V table
#     either, so inferring an X6100 domain from X6200 data would compound
#     one unconfirmed guess on another. No trustworthy in-repo source
#     exists for an OFF/SEMI/FULL domain on this radio, so
#     ``CoreRadio.set_break_in`` refuses (fails loud) rather than validate
#     against a guessed table. See [commands] PROVENANCE OPEN below for
#     the opcode-reachability correction (0x14 0x0F).
#   - ``notch`` likewise KEEPS the capability tag but declares NO
#     ``[notch] width_values`` domain (MOR-1551), for the same
#     no-X6100-hardware reason. X6200's own audit found its manual-notch
#     opcode (``0x16 0x48``) isn't in the X6200 CI-V table either -- its
#     actual notch mechanism is a DNF on/off toggle (``0x16 0x41``) plus a
#     center-frequency register (``0x14 0x0D``), with no WIDE/MID/NAR
#     width register documented anywhere. Inferring an X6100 width domain
#     from X6200 data would compound one unconfirmed guess on another, so
#     ``CoreRadio.set_manual_notch_width`` stays unvalidated (permissive,
#     mirrors ``set_agc``/``set_preamp``) rather than fabricate a table.
#     Closing evidence: a live X6100 CI-V capture (no hardware currently
#     available) or a firmware/wfview doc update documenting an
#     X6100/X6200 notch-width register.
#   - ``agc`` is deliberately NOT decided here even though X6200 declares
#     it and Hamlib gives both models the same AGC family -- see
#     [commands] PROVENANCE OPEN below (D2, MOR-2018): recorded as an open
#     question for a future ticket, not silently added.
#   - MOR-2008 batch 3: this file's [commands] table below now formally
#     declares ``get_/set_vox``, ``get_/set_break_in`` and
#     ``get_/set_manual_notch`` absent (promoted from the bare capability-
#     tag notes above, inherited from rigs/x6200.toml's own promotion),
#     and declares ``get_/set_nr``, ``get_/set_compressor`` and
#     ``get_/set_auto_notch`` present at their cat-audit-confirmed-correct
#     opcodes -- both changes exist so the bound-command-map migration
#     (MOR-2006) enforces the same facts this comment block already
#     stated, rather than leaving three working controls to regress into
#     a refusal purely because nobody had transcribed their opcode into
#     [commands] yet. See the [commands] table entries themselves for the
#     full citations.
features = [
    "audio",
    "af_level",
    "rf_gain",
    "squelch",
    "attenuator",
    "preamp",
    "nb",
    "nr",
    "notch",
    "tx",
    "split",
    "vox",
    "compressor",
    "cw",
    "break_in",
    "rit",
    "xit",
    "tuner",
    "meters",
    "data_mode",
    "scan",
    "dial_lock",
    "power_control",
]

# MOR-1983: mirror the conservative X6200 acquisition envelope. This inherits
# the same shared-firmware rationale as the command declarations below; it does
# not claim direct X6100 hardware evidence. Every polled path resolves through
# this profile's own explicitly declared getter.
[state_acquisition]
provider = "xiegu_civ"
default_cadence_seconds = 2.0
default_freshness_ttl_seconds = 8.0
default_reconciliation_priority = "poll"
adaptive_decay = true
adaptive_decay_idle_multiplier = 4.0
adaptive_decay_max_cadence_seconds = 30.0
external_cat_pause = "pause_polling"
meter_coalescing_window_seconds = 0.25

[state_acquisition.capabilities]
polling_only = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
stream_like_meters = [
    "receiver.main.meters.s_meter",
    "global.meters.power",
]
command_response_observable = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
supported_controls = [
    "receiver.main.active.freq_mode.freq_hz",
    "receiver.main.active.freq_mode.mode",
]
unsupported = ["global.tx_state.power_on"]

[modes]
list = ["USB", "LSB", "CW", "CW-R", "AM", "FM", "RTTY", "DIGI"]

[filters]
list = ["FIL1", "FIL2", "FIL3"]

[vfo]
scheme = "ab"

[attenuator]
values = [0, 1]

[preamp]
values = [0, 1]

[controls.attenuator]
style = "toggle"

# Level control ranges — CI-V compatible (Xiegu X6100)
[controls.af_level]
raw_min = 0
raw_max = 255

[controls.rf_gain]
raw_min = 0
raw_max = 255

[controls.squelch]
raw_min = 0
raw_max = 255

[controls.nr_level]
raw_min = 0
raw_max = 255

[controls.nb_level]
raw_min = 0
raw_max = 255

[controls.compressor_level]
raw_min = 0
raw_max = 255

# PRE-EXISTING DIVERGENCE, flagged not fixed (D2, MOR-2018; re-arbitrated
# MOR-2488/MOR-2489, still not changed): the X6100 manual's front-panel
# menu chapter documents a 400-1200 Hz side-tone range, while this
# [controls.cw_pitch] display range is 300-900 Hz over the same
# raw_min/raw_max 0-255 domain and the same [commands] get/set opcode
# ([0x14, 0x09], which §15 Table 1 lists for X6100 -- "Get/Set CW sidetone
# frequency", Rigs: X6100, G90 -- but with NO Hz scale in the CI-V table).
# Widening the display range here is deliberately NOT done: the shared
# CI-V encoder and the validation registry's cw_pitch check both still
# enforce 300-900, so a wider profile range would let the UI offer values
# the radio never receives. The range pair and the encoder limit move
# together under a separate ticket; recorded here so it is not mistaken
# for an oversight.
[controls.cw_pitch]
raw_min = 0
raw_max = 255
display_min = 300
display_max = 900
display_unit = "Hz"
decode_quantum = 5  # reproduces the pre-existing shared CI-V CW-pitch decode; the manual's menu step is 10 Hz (Radioddity Extended manual for Xiegu X6100 v1.1.8 section 10.3.4) and the CI-V table states no Hz scale

[controls.key_speed]
raw_min = 0
raw_max = 255
display_min = 6
display_max = 48
display_unit = "WPM"
decode_quantum = 1  # band not documented for this radio: it reproduces the pre-existing shared CI-V key-speed decode; the manual's menu range is 5-50 WPM (Radioddity Extended manual for Xiegu X6100 v1.1.8 section 10.3.2) and states no CI-V scale

[controls.rit]
# MOR-1883: exact-form translation of the previously declared range;
# step 1 from the shared CI-V builder (+/-9999 Hz, 1 Hz BCD).
mapping = "identity"
raw_min = -9999
raw_max = 9999
raw_step = 1
raw_origin = 0
display_min = -9999
display_max = 9999
display_step = 1
display_origin = 0
display_unit = "Hz"
quantization = "reject"
restoration = "exact"

