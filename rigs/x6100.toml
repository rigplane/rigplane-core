[commands]

# PROVENANCE OPEN (D2, MOR-2018; narrowed MOR-2488/MOR-2489): every entry
# below not confirmed on an actual X6100 unit -- which is all of them,
# since no X6100 unit has ever been probed. What the X6100 manual's §15
# Table 1 lists closes the DOCUMENTARY question (the row exists); only a
# live capture could close the behavioral one. House pattern:
# rigs/ic9700.toml "PROVENANCE OPEN (D2, MOR-2015)"; rigs/x6200.toml
# "PROVENANCE OPEN (D2, MOR-2019)" is this file's former copy source and
# stays open on its own items for its own reasons.
#
# - get_freq [0x03] / set_freq [0x05] / get_mode [0x04] / set_mode [0x06]
#   / get_band_edge_freq [0x02]: CLOSED DOCUMENTarily by the X6100
#   manual -- §15 Table 1 carries real rows for set/get active VFO
#   frequency and mode and for the 0x02 frequency-edge read (the entries
#   below cite it). On rigs/x6200.toml itself these stay PROVENANCE OPEN
#   (its V1.0.6 PDF documents get_freq only in a p.4 narrative, and
#   0x04/0x05/0x06 not at all); that no longer matters for THIS profile,
#   which now has its own rows. The former note "none of the three can
#   ever be closed for X6100 -- there is no manual to re-check" was
#   wrong: the manual exists (see file header).
# - get_xiegu_model_id [0x1D, 0x19] is DELIBERATELY OMITTED, not copied.
#   X6200 declares it as a positive Xiegu-vs-Icom disambiguator at the
#   shared CI-V address 0xA4 (MOR-170/MOR-226). The X6100 manual's §15
#   Table 1 does list ``0x1d 0x19`` ("Get XIEGU radio ID, See Table
#   2-7"), so the opcode is documented for this radio -- but
#   ``backends/discovery.py: probe_xiegu_model_id`` hardcodes that probe to
#   address 0xA4 and never reads civ_addr from a profile at all. X6100
#   lives at 0x70, where no Icom model in ``CIV_PROFILE_MAP`` collides, so
#   there is no disambiguation problem for this opcode to solve here.
#   Declaring it would be an orphan: unreachable by the one piece of code
#   that consumes this command name today.
# - set_split [0x0F]: the opcode is copied from X6200 (same register), but
#   NOT the X6200 wording. Hamlib master ``rigs/icom/xiegu.c`` contains a
#   comment stating the X6100 ITSELF -- not by inference -- rejects
#   ``0x0f 0x01`` (split ON); this is direct X6100-specific evidence, the
#   strongest class in this file, stronger than every other entry's
#   sibling-copy. See the entry's own comment below.
# - vox (MOR-2488/MOR-2489 re-sourcing): the X6100 manual's §15 Table 1
#   DOES document CI-V VOX rows for this radio -- ``0x16 0x46`` "Get VOX
#   switch" (Rigs: X6100; data rows 0x00 VOX OFF / 0x01 VOX ON), plus
#   ``0x14 0x16`` VOX gain and ``0x14 0x17`` ANTI-VOX gain. The former
#   claim that "neither the (nonexistent) X6100 manual nor the X6200
#   V1.0.6 table documents a CI-V VOX row of any kind" was false for
#   X6100. Consequences below: ``get_vox`` is declared PRESENT at
#   [0x16, 0x46] off the manual's GET row; ``set_vox`` stays formally
#   absent (the table lists the GET half only -- no SET row -- an
#   exhaustiveness inference, not a vendor statement); the VOX/ANTI-VOX
#   gain levels (get_/set_vox_gain, get_/set_anti_vox_gain keys) remain
#   undeclared here -- their manual rows are on record but declaring new
#   present commands is beyond this ticket's scope. X6200's own
#   get_/set_vox absent rows are untouched: its V1.0.6 table is its own
#   source and the X6100 manual's Rigs column does not cover X6200.
# - notch -> hardcoded [0x16, 0x48] (Icom manual-notch) in CoreRadio's
#   notch path, no [commands] key here or on X6200: X6200's real notch
#   mechanism is the digital notch filter (DNF) toggle at [0x16, 0x41], a
#   different register (MOR-1551) -- inference chain, not independently
#   confirmed for X6100.
# - break_in -> hardcoded [0x16, 0x47] in CoreRadio's break-in path, no
#   [commands] key here or on X6200. CORRECTION (D2, MOR-2019 review
#   follow-up; reworded again here, #2838, to match the verified
#   rigs/x6200.toml wording): the "THREE separate paths" claim previously
#   recorded here was itself stale by the time it was written. Verified
#   directly against HEAD (calling both builders against this profile's
#   own CommandMap): ``CoreRadio.get_break_in_delay`` and
#   ``CoreRadio.set_break_in_delay`` (both via ``commands/levels.py:
#   get_break_in_delay`` / ``set_break_in_delay``) were migrated onto the
#   bound command map (``commands/bound.py: BoundCommands``, MOR-2006) in
#   a PR that had already landed by the time the three-path wording was
#   written, and this profile declares neither key present nor
#   declared-absent -- so both now refuse with ``CommandError`` (the
#   undeclared-command policy, D1, MOR-2005) instead of reaching the wire.
#   MOR-1983 removed the former unconditional [0x14, 0x0F] state poll;
#   profile-derived acquisition now suppresses it because this profile
#   declares neither a pollable path nor a getter.
# - rit / xit -> hardcoded [0x21] in the RIT/XIT command builders
#   (commands/_frame.py: _CMD_RIT, consumed by commands/system.py), no
#   [commands] key here or on X6200. MOR-2488/MOR-2489 note: the X6100
#   manual's §15 Table 1 lists the 0x21 family with SUBcommands --
#   0x21 0x00 "Set/Get RIT frequency", 0x21 0x01 "Set/Get RIT setting",
#   0x21 0x02 "Set/Get XIT setting" (Rigs: X6100, G90) -- a different
#   wire shape from the builder's bare [0x21] frame. Flagged, not fixed:
#   changing the builder is a src/ change outside this ticket, and the
#   bare-[0x21] SET is live-confirmed write-only on the X6200 sibling.
#   X6200's write-only *behavior* (SET accepted, GET times out) is
#   LIVE-confirmed on the X6200 unit itself (MOR-208/179, MOR-207) and
#   recorded in its own [validation] write_only_controls. That
#   classification is NOT inherited here: no X6100 probe exists, so this
#   profile declares no [validation] section at all. A future
#   ``validate`` run against a real X6100 would false-FAIL rit/xit/notch
#   SET-then-GET round-trips exactly as X6200 did before MOR-207/208
#   confirmed the write-only behavior there -- this is the correct
#   conservative default, not an oversight.
# - agc: X6200 declares "agc" in [capabilities] features and a full
#   [agc] modes/labels domain; this profile declares neither, even though
#   ``get_agc``/``set_agc`` [0x16, 0x12] are copied into [commands] below.
#   Hamlib master ``rigs/icom/xiegu.c`` builds X6100 and X6200 from the
#   same ``x6100_priv_caps`` struct (see file header), which is evidence
#   they share the same AGC family -- but adding the feature + [agc]
#   domain would be a behavior change, not a documentary one, and is
#   outside D2 scope. Left as an open question for a future ticket: the
#   opcode is now on record, the capability decision is not.
#   MOR-2488/MOR-2489 addendum for that future ticket: the X6100 manual's
#   own §15 Table 1 0x16 0x12 data labels are 0x00 OFF, 0x01 Fast,
#   0x02 middle, 0x03 slow -- NO AUTO. X6200's V1.0.6-derived
#   labels = { 3 = "AUTO" } are that document's row and must not be
#   copied onto an X6100 [agc] domain when that ticket lands.

# Frequency / mode -- re-sourced MOR-2488/MOR-2489: §15 Table 1 of the
# X6100 manual lists these as real rows (set/get active VFO frequency
# and mode), closing the former X6200-inherited PROVENANCE OPEN on the
# documentary question (see PROVENANCE OPEN above).
get_freq   = [0x03]  # source: Radioddity Extended manual for Xiegu X6100 v1.1.8 §15 Table 1 -- set/get active VFO frequency/mode rows
set_freq   = [0x05]  # source: Radioddity Extended manual for Xiegu X6100 v1.1.8 §15 Table 1 -- same row family as get_freq
get_mode   = [0x04]  # source: Radioddity Extended manual for Xiegu X6100 v1.1.8 §15 Table 1 -- same row family as get_freq
set_mode   = [0x06]  # source: Radioddity Extended manual for Xiegu X6100 v1.1.8 §15 Table 1 -- same row family as get_freq

# Get receiver frequency range
get_band_edge_freq = [0x02]  # source: Radioddity Extended manual for Xiegu X6100 v1.1.8 §15 Table 1 -- 0x02 get frequency edge row

# VFO selection / swap (0x07 family)
get_vfo    = [0x07]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.5 (0x07 family)
set_vfo    = [0x07]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- same as get_vfo there

# Split -- NOT a sibling copy for its wording: see PROVENANCE OPEN above.
set_split  = [0x0F]  # source: Hamlib master rigs/icom/xiegu.c -- DIRECT X6100-specific evidence (not X6200-inherited): a comment there states the X6100 itself REJECTS 0x0f 0x01 (split ON). The opcode [0x0F] is unchanged from X6200's set_split; only the payload behavior differs. If a runtime wedge ever appears tied to set_split on this radio, this is why.

ptt_on     = [0x1C, 0x00, 0x01]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.9; byte-identical to this profile's pre-existing entry
ptt_off    = [0x1C, 0x00, 0x00]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- same as ptt_on there; byte-identical to this profile's pre-existing entry

# Attenuator / preamp
