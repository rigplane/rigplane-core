[commands]

# PROVENANCE OPEN (D2, MOR-2018): every entry below not confirmed on an
# actual X6100 -- which is all of them, since no X6100 unit has ever been
# probed. House pattern: rigs/ic9700.toml "PROVENANCE OPEN (D2, MOR-2015)";
# rigs/x6200.toml "PROVENANCE OPEN (D2, MOR-2019)" is this file's direct
# copy source and stays open on the same items for the same reasons.
#
# - get_freq [0x03]: PROVENANCE OPEN on rigs/x6200.toml itself, inherited
#   unchanged. X6200's Radioddity CI-V V1.0.6 p.4 documents it only
#   inside a worked CAT-control narrative example (GET direction only),
#   not in the opcode table.
# - set_freq [0x05]: PROVENANCE OPEN on rigs/x6200.toml itself, inherited
#   unchanged -- but there it is absent from the V1.0.6 document
#   entirely, unlike get_freq above: not in the opcode table, and not in
#   the p.4 narrative either, which shows the GET direction only.
# - get_mode / set_mode [0x04] / [0x06]: PROVENANCE OPEN on
#   rigs/x6200.toml itself, inherited unchanged -- absent from that table
#   entirely, with no narrative mention either.
# None of the three can ever be closed for X6100 -- there is no manual to
# re-check and no unit to probe.
# - get_xiegu_model_id [0x1D, 0x19] is DELIBERATELY OMITTED, not copied.
#   X6200 declares it as a positive Xiegu-vs-Icom disambiguator at the
#   shared CI-V address 0xA4 (MOR-170/MOR-226) -- but
#   ``backends/discovery.py: probe_xiegu_model_id`` hardcodes that probe to
#   address 0xA4 and never reads civ_addr from a profile at all. X6100
#   lives at 0x70, where no Icom model in ``CIV_PROFILE_MAP`` collides, so
#   there is no disambiguation problem for this opcode to solve, and no
#   X6100-specific evidence (manual or live) that the opcode even answers
#   at 0x70. Declaring it here would be an orphan: unreachable by the one
#   piece of code that consumes this command name today, and unconfirmed
#   besides.
# - set_split [0x0F]: the opcode is copied from X6200 (same register), but
#   NOT the X6200 wording. Hamlib master ``rigs/icom/xiegu.c`` contains a
#   comment stating the X6100 ITSELF -- not by inference -- rejects
#   ``0x0f 0x01`` (split ON); this is direct X6100-specific evidence, the
#   strongest class in this file, stronger than every other entry's
#   sibling-copy. See the entry's own comment below.
# - vox -> hardcoded [0x16, 0x46] in CoreRadio's vox path, no [commands]
#   key here or on X6200: neither the (nonexistent) X6100 manual nor the
#   X6200 V1.0.6 table documents a CI-V VOX row of any kind.
# - notch -> hardcoded [0x16, 0x48] (Icom manual-notch) in CoreRadio's
#   notch path, no [commands] key here or on X6200: X6200's real notch
#   mechanism is the digital notch filter (DNF) toggle at [0x16, 0x41], a
#   different register (MOR-1551) -- inference chain, not independently
#   confirmed for X6100.
# - break_in -> hardcoded [0x16, 0x47] in CoreRadio's break-in path, no
#   [commands] key here or on X6200. CORRECTION (D2, MOR-2019 review
#   follow-up; reworded again here, #2838, to match the verified
#   rigs/x6200.toml wording): the "THREE separate paths" claim previously
#   recorded here was itself stale by the time it was written. Verified
#   directly against HEAD (calling both builders against this profile's
#   own CommandMap): ``CoreRadio.get_break_in_delay`` and
#   ``CoreRadio.set_break_in_delay`` (both via ``commands/levels.py:
#   get_break_in_delay`` / ``set_break_in_delay``) were migrated onto the
#   bound command map (``commands/bound.py: BoundCommands``, MOR-2006) in
#   a PR that had already landed by the time the three-path wording was
#   written, and this profile declares neither key present nor
#   declared-absent -- so both now refuse with ``CommandError`` (the
#   undeclared-command policy, D1, MOR-2005) instead of reaching the wire.
#   MOR-1983 removed the former unconditional [0x14, 0x0F] state poll;
#   profile-derived acquisition now suppresses it because this profile
#   declares neither a pollable path nor a getter.
# - rit / xit -> hardcoded [0x21] in the RIT/XIT command builders
#   (commands/_frame.py: _CMD_RIT, consumed by commands/system.py), no
#   [commands] key here or on X6200. X6200's write-only *behavior* (SET
#   accepted, GET times out) is LIVE-confirmed on the X6200 unit itself
#   (MOR-208/179, MOR-207) and recorded in its own [validation]
#   write_only_controls. That classification is NOT inherited here: no
#   X6100 probe exists, so this profile declares no [validation] section
#   at all. A future ``validate`` run against a real X6100 would
#   false-FAIL rit/xit/notch SET-then-GET round-trips exactly as X6200 did
#   before MOR-207/208 confirmed the write-only behavior there -- this is
#   the correct conservative default, not an oversight.
# - agc: X6200 declares "agc" in [capabilities] features and a full
#   [agc] modes/labels domain; this profile declares neither, even though
#   ``get_agc``/``set_agc`` [0x16, 0x12] are copied into [commands] below.
#   Hamlib master ``rigs/icom/xiegu.c`` builds X6100 and X6200 from the
#   same ``x6100_priv_caps`` struct (see file header), which is evidence
#   they share the same AGC family -- but adding the feature + [agc]
#   domain would be a behavior change, not a documentary one, and is
#   outside D2 scope. Left as an open question for a future ticket: the
#   opcode is now on record, the capability decision is not.

# Frequency / mode (compatible Icom CI-V subset — see PROVENANCE OPEN above)
get_freq   = [0x03]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- PROVENANCE OPEN even on X6200 (narrative-only PDF p.4 example, not in the opcode table)
set_freq   = [0x05]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- absent from V1.0.6 entirely, unlike get_freq's narrative mention there
get_mode   = [0x04]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- PROVENANCE OPEN even on X6200 (0x04 absent from the V1.0.6 table entirely)
set_mode   = [0x06]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- same PROVENANCE OPEN status as get_mode there

# Get receiver frequency range
get_band_edge_freq = [0x02]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.5

# VFO selection / swap (0x07 family)
get_vfo    = [0x07]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.5 (0x07 family)
set_vfo    = [0x07]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- same as get_vfo there

# Split -- NOT a sibling copy for its wording: see PROVENANCE OPEN above.
set_split  = [0x0F]  # source: Hamlib master rigs/icom/xiegu.c -- DIRECT X6100-specific evidence (not X6200-inherited): a comment there states the X6100 itself REJECTS 0x0f 0x01 (split ON). The opcode [0x0F] is unchanged from X6200's set_split; only the payload behavior differs. If a runtime wedge ever appears tied to set_split on this radio, this is why.

ptt_on     = [0x1C, 0x00, 0x01]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.9; byte-identical to this profile's pre-existing entry
ptt_off    = [0x1C, 0x00, 0x00]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- same as ptt_on there; byte-identical to this profile's pre-existing entry

# Attenuator / preamp
get_attenuator = [0x11]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.5
set_attenuator = [0x11]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- same as get_attenuator there
get_preamp = [0x16, 0x02]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7 (GET; SET is p.8)
set_preamp = [0x16, 0x02]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.8 (SET; GET is p.7)

# Levels (gets and sets — same opcode pair for both directions).
get_af_level = [0x14, 0x01]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6; byte-identical to this profile's pre-existing entry
set_af_level = [0x14, 0x01]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7; byte-identical to this profile's pre-existing entry
get_rf_gain  = [0x14, 0x02]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6; byte-identical to this profile's pre-existing entry
set_rf_gain  = [0x14, 0x02]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7; byte-identical to this profile's pre-existing entry
get_squelch  = [0x14, 0x03]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6; byte-identical to this profile's pre-existing entry
set_squelch  = [0x14, 0x03]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7; byte-identical to this profile's pre-existing entry
get_nr_level = [0x14, 0x06]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6
set_nr_level = [0x14, 0x06]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7
get_cw_pitch = [0x14, 0x09]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6; see [controls.cw_pitch] above for a flagged, unfixed display-range divergence
set_cw_pitch = [0x14, 0x09]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7
get_rf_power = [0x14, 0x0A]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6
set_rf_power = [0x14, 0x0A]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7
get_mic_gain = [0x14, 0x0B]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6
set_mic_gain = [0x14, 0x0B]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.7
get_key_speed = [0x14, 0x0C]  # source: rigs/x6200.toml (sibling model, D2 MOR-2018) -- there: Radioddity X6200 CI-V V1.0.6 p.6
