# FT-991A simulation profile (USB CAT, fidelity C). Wire facts stay in
# rigs/ft991a.toml; identity comes from its [identity].expected_ids, so
# transport.yaesu_cat carries no identity key.
# Fidelity C: no hardware recording exists. Every answer below is derived
# from the FT-991A CAT Operation Reference Manual tables (PDF page numbers
# in rigs/ft991a.toml), not from a captured radio. Split (FT2/FT3 set,
# FT0/FT1 answer), swap (SV;), directional copy (AB;/BA;), narrow state
# (NA) and the raw SH code store ride the shared single-receiver
# direct-VFO-slot model; the radio under test computes Hz from the loader
# tables, the sim only echoes raw codes.

schema = "rigplane-sim-profile/1"

[sim]
id = "ft991a-usb"
radio = "FT-991A"
fidelity = "C"
gaps = [
    "no hardware recording: all answers follow the FT-991A CAT manual tables (PDF pages cited in rigs/ft991a.toml), none a captured radio",
    "IF bulk status is not modelled: the manual's 3-character channel layout has no shared parser shape and the real answer length is unverified (28 bytes per manual vs 41 on some FT-991 firmware per Hamlib)",
    "RM and PC answers are not simulated: the sim has no RM/PC handler and answers ?; to both; meter scaling is uncalibrated (capture list)",
    "writes are accepted for the natively served SET verbs only; every other SET verb answers ?; until its handler and evidence exist",
    "squelch is not served: the Core FT-991A v1 profile declares no squelch command, so SQ reads and writes answer ?;",
    "no scope or hardware spectrum",
    "firmware V02-07 is the customer's report, not readable over CAT",
]

[transport.yaesu_cat]
baud = 38400

[initial]
frequency_hz = 14_074_000
mode = "USB"
